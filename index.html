<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Medição de Válvulas do Scania-550</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    margin:0;

    padding:20px;

    line-height:1.5;

    background:#f2f2f2;

    color:#111;

}

h1{

    font-size:24px;

    text-align:center;

    border-bottom:3px solid #257500;

    padding:12px;

    color:#fff;

    background:#257500;

    border-radius:8px;

    margin:0 0 20px 0;

}

h2,h3{

    margin-top:15px;

    margin-bottom:10px;

}

.info-table{

    width:100%;

    margin-bottom:20px;

    background:#fff;

    padding:10px;

    border-radius:10px;

}

.info-table td{

    padding:7px;

    text-align:left;

}

input[type="text"],
input[type="date"],
textarea{

    padding:9px;

    text-align:center;

    font-size:16px;

    border:2px solid #FF8C00;

    border-radius:6px;

    background:#fff;

}

textarea{

    width:100%;

    height:100px;

    padding:10px;

    text-align:left;

    resize:vertical;

}

.warning{

    background:#257500;

    padding:12px;

    border-left:6px solid #1b5200;

    margin:15px 0;

    text-align:center;

    color:white;

    font-weight:bold;

    border-radius:6px;

}

/* ============================= */
/* NAVEGAÇÃO DOS CILINDROS */
/* ============================= */

.navegacao{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin:20px 0;

    background:#fff;

    padding:15px;

    border-radius:10px;

    box-shadow:0 3px 10px rgba(0,0,0,.12);

}

.navegacao button{

    flex:1;

    max-width:220px;

}

.cilindro-atual{

    font-size:22px;

    font-weight:bold;

    color:#257500;

    text-align:center;

}

/* ============================= */
/* BLOCO DO CILINDRO */
/* ============================= */

.cilindro-container{

    width:100%;

    max-width:900px;

    margin:0 auto 25px auto;

}

.cilindro-section{

    border:3px solid #257500;

    padding:18px;

    background:#fff;

    border-radius:12px;

    box-shadow:0 5px 15px rgba(0,0,0,.12);

}

.cilindro-label{

    text-align:center;

    font-weight:bold;

    color:white;

    background:#257500;

    border-radius:8px;

    padding:10px;

    margin-bottom:15px;

    font-size:22px;

}

/* ============================= */
/* GRID 2 X 2 */
/* ============================= */

.valve-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

}

.valve-box{

    border:2px solid #257500;

    border-radius:10px;

    padding:12px;

    background:#fafafa;

    text-align:center;

}

.valve-title{

    background:#257500;

    color:white;

    font-weight:bold;

    font-size:17px;

    padding:8px;

    border-radius:7px;

    margin-bottom:10px;

}

.measurement{

    margin:10px 0;

}

.measurement input{

    width:150px;

    padding:10px;

    text-align:center;

    font-size:20px;

    font-weight:bold;

    border:2px solid #FF8C00;

    border-radius:6px;

}

.photo-box{

    width:100%;

    max-width:250px;

    height:220px;

    border:2px dashed #FF8C00;

    margin:10px auto;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    font-size:13px;

    color:#666;

    position:relative;

    background-size:cover;

    background-position:center;

    overflow:hidden;

    border-radius:10px;

    background-color:#fff;

}

.photo-box input[type="file"]{

    position:absolute;

    width:100%;

    height:100%;

    opacity:0;

    cursor:pointer;

    left:0;

    top:0;

}

.photo-label{

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    text-align:center;

    background:#257500;

    color:white;

    font-weight:bold;

    font-size:13px;

    padding:5px;

}

.remove-photo{

    background:#FF4500;

    color:white;

    border:none;

    padding:6px 10px;

    font-size:12px;

    cursor:pointer;

    border-radius:5px;

    font-weight:bold;

}

/* ============================= */
/* BOTÕES */
/* ============================= */

.button-container{

    margin-top:20px;

    text-align:center;

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:10px;

}

button{

    background:#257500;

    color:white;

    border:none;

    padding:11px 20px;

    font-size:16px;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;

    transition:.2s;

}

button:hover{

    background:#FF4500;

}

.clear-btn{

    background:#FF4500;

}

.btn-jpg{

    display:block;

    width:100%;

    max-width:350px;

    margin:20px auto 5px auto;

    background:#257500;

}

/* ============================= */
/* OBSERVAÇÕES */
/* ============================= */

.obs{

    margin-top:25px;

    font-style:italic;

    background:#FFFACD;

    padding:15px;

    border-radius:8px;

    border:1px solid #FF8C00;

}

/* ============================= */
/* ASSINATURA */
/* ============================= */

.signature{

    margin:50px auto 20px auto;

    border-top:2px solid #FF8C00;

    width:320px;

    padding-top:5px;

    text-align:center;

    font-weight:bold;

    font-size:16px;

    position:relative;

}

#assinatura{

    position:absolute;

    top:-40px;

    left:0;

    width:320px;

    border:none;

    font-size:28px;

    text-align:center;

    background:transparent;

    outline:none;

    font-family:'Brush Script MT',cursive,Arial,sans-serif;

    color:#257500;

}

#assinatura::placeholder{

    color:#999;

}

/* ============================= */
/* CILINDRO OCULTO */
/* ============================= */

.cilindro{

    display:none;

}

.cilindro.ativo{

    display:block;

}

/* ============================= */
/* MOBILE */
/* ============================= */

@media(max-width:700px){

    body{

        padding:10px;

    }

    h1{

        font-size:20px;

    }

    .info-table,
    .info-table tbody,
    .info-table tr,
    .info-table td{

        display:block;

        width:100%;

    }

    .info-table td{

        padding:5px 0;

    }

    .valve-grid{

        grid-template-columns:1fr;

    }

    .navegacao{

        flex-direction:column;

    }

    .navegacao button{

        max-width:none;

        width:100%;

    }

    .cilindro-atual{

        order:-1;

    }

}

/* ============================= */
/* DESTAQUE MEDIÇÃO */
/* ============================= */

.medicao-alerta{

    color:red !important;

    font-weight:bold !important;

}

/* ============================= */
/* PRINT */
/* ============================= */

@media print{

    body{

        background:white;

        padding:0;

    }

    .navegacao,
    .button-container,
    .remove-photo,
    .btn-jpg{

        display:none !important;

    }

    .cilindro{

        display:none !important;

    }

    .cilindro.ativo{

        display:block !important;

    }

    .cilindro-section{

        box-shadow:none;

    }

}

</style>

</head>

<div class="warning">

<h3>
MEDIÇÕES ACEITÁVEIS:
64,00mm a

<!-- ============================= -->
<!-- NAVEGAÇÃO -->
<!-- ============================= -->

<div class="navegacao">

<button
onclick="cilindroAnterior()"
>
← CILINDRO ANTERIOR
</button>

<div
class="cilindro-atual"
id="cilindroAtualTexto"
>
CILINDRO 1 / 6
</div>

<button
onclick="proximoCilindro()"
>
PRÓXIMO CILINDRO →
</button>

<!-- ============================= -->
<!-- CILINDROS -->
<!-- ============================= -->

<div
class="cilindro-container"
id="cilindros"
></div>

<!-- ============================= -->
<!-- OBSERVAÇÕES -->
<!-- ============================= -->

<p>
<strong>OBSERVAÇÕES:</strong>
</p>

<textarea
id="observacoes"
></textarea>

<!-- ============================= -->
<!-- BOTÕES -->
<!-- ============================= -->

<div class="button-container">

id="generatePdf"
>
Gerar PDF

id="clearBtn"

>
Limpar

<!-- ASSINATURA -->
<!-- ============================= -->

ASSINATURA DO MECÂNICO:

<input
type="text"
id="assinatura"
placeholder="Digite seu nome aqui"
/>

</div>

<script>

const {jsPDF} = window.jspdf;

let cilindroAtual = 1;

const totalCilindros = 6;

/* ================================= */
/* CRIAR OS 6 CILINDROS */
/* ================================= */

const container =
document.getElementById("cilindros");

for(
    let i = 1;
    i <= totalCilindros;
    i++
){

    const cilindro =
    document.createElement("div");

    cilindro.className =
    "cilindro" +
    (i === 1 ? " ativo" : "");

    cilindro.id =
    "cilindro" + i;

    cilindro.innerHTML = `

        <div class="cilindro-section">

            <div class="cilindro-label">

                CILINDRO ${i}

            </div>

            <div class="valve-grid">

                ${criarValvula(
                    "exaustao",
                    i,
                    2,
                    "EXAUSTÃO 2"
                )}

                ${criarValvula(
                    "admissao",
                    i,
                    2,
                    "ADMISSÃO 2"
                )}

                ${criarValvula(
                    "exaustao",
                    i,
                    1,
                    "EXAUSTÃO 1"
                )}

                ${criarValvula(
                    "admissao",
                    i,
                    1,
                    "ADMISSÃO 1"
                )}

            </div>

            <button
                class="btn-jpg"
                onclick="gerarJpgCilindro(${i})"
            >

                📷 GERAR JPG CILINDRO ${i}

            </button>

        </div>

    `;

    container.appendChild(cilindro);

}

/* ================================= */
/* CRIAR CADA VÁLVULA */
/* ================================= */

function criarValvula(
    tipo,
    cilindro,
    numero,
    nome
){

    const id =
    `${tipo}${cilindro}_${numero}`;

    const foto =
    `photo${id}`;

    return `

        <div class="valve-box">

            <div class="valve-title">

                ${nome}

            </div>

            <div class="photo-box" id="${foto}">

                Clique para adicionar foto

                <div class="photo-label">

                    ${nome}

                </div>

                <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="loadPhoto(event,'${id}')"
                >

            </div>

            <button
                class="remove-photo"
                onclick="removePhoto('${id}')"
            >

                REMOVER FOTO

            </button>

            <div class="measurement">

                <input
                    type="text"
                    id="${id}"
                    placeholder="Medição mm"
                >

            </div>

        </div>

    `;

}

/* ================================= */
/* NAVEGAÇÃO */
/* ================================= */

function atualizarCilindro(){

    document
    .querySelectorAll(".cilindro")
    .forEach(
        elemento => {

            elemento.classList.remove(
                "ativo"
            );

        }
    );

    document
    .getElementById(
        "cilindro" + cilindroAtual
    )
    .classList.add(
        "ativo"
    );

    document
    .getElementById(
        "cilindroAtualTexto"
    )
    .innerText =
        `CILINDRO ${cilindroAtual} / ${totalCilindros}`;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function proximoCilindro(){

    if(
        cilindroAtual <
        totalCilindros
    ){

        cilindroAtual++;

        atualizarCilindro();

    }

}

function cilindroAnterior(){

    if(
        cilindroAtual >
        1
    ){

        cilindroAtual--;

        atualizarCilindro();

    }

}

/* ================================= */
/* FOTO */
/* ================================= */

function loadPhoto(
    event,
    id
){

    const box =
    document.getElementById(
        "photo" + id
    );

    const file =
    event.target.files[0];

    if(!file)
        return;

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        box.style.backgroundImage =
        `url("${e.target.result}")`;

        box.style.color =
        "transparent";

    };

    reader.readAsDataURL(file);

}

/* ================================= */
/* REMOVER FOTO */
/* ================================= */

function removePhoto(id){

    const box =
    document.getElementById(
        "photo" + id
    );

    box.style.backgroundImage =
    "";

    box.style.color =
    "#666";

    const oldInput =
    box.querySelector(
        'input[type="file"]'
    );

    if(oldInput)
        oldInput.remove();

    const newInput =
    document.createElement(
        "input"
    );

    newInput.type =
    "file";

    newInput.accept =
    "image/*";

    newInput.capture =
    "environment";

    newInput.onchange =
    function(event){

        loadPhoto(
            event,
            id
        );

    };

    box.appendChild(
        newInput
    );

}

/* ================================= */
/* DESTAQUE AUTOMÁTICO */
/* ================================= */

function atualizarDestaque(
    input
){

    const valor =
    parseFloat(
        input.value.replace(
            ",",
            "."
        )
    );

    if(
        !isNaN(valor) &&
        valor >= 67.50
    ){

        input.classList.add(
            "medicao-alerta"
        );

    }
    else{

        input.classList.remove(
            "medicao-alerta"
        );

    }

}

document
.querySelectorAll(
    'input[type="text"]'
)
.forEach(
    input => {

        input.addEventListener(
            "input",
            function(){

                atualizarDestaque(
                    this
                );

            }
        );

    }
);

/* ================================= */
/* RETÂNGULO ARREDONDADO */
/* ================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    if(
        typeof radius ===
        "undefined"
    )
        radius = 5;

    if(
        typeof radius ===
        "number"
    ){

        radius = {

            tl:radius,
            tr:radius,
            br:radius,
            bl:radius

        };

    }

    ctx.beginPath();

    ctx.moveTo(
        x + radius.tl,
        y
    );

    ctx.lineTo(
        x + width - radius.tr,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius.tr
    );

    ctx.lineTo(
        x + width,
        y + height - radius.br
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius.br,
        y + height
    );

    ctx.lineTo(
        x + radius.bl,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius.bl
    );

    ctx.lineTo(
        x,
        y + radius.tl
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius.tl,
        y
    );

    ctx.closePath();

    if(fill)
        ctx.fill();

    if(stroke)
        ctx.stroke();

}

/* ================================= */
/* GERAR JPG DO CILINDRO */
/* ================================= */

async function gerarJpgCilindro(i){

    const imgSize =
    1280;

    const imgHeight =
    1900;

    const canvas =
    document.createElement(
        "canvas"
    );

    canvas.width =
    imgSize;

    canvas.height =
    imgHeight;

    const ctx =
    canvas.getContext("2d");

    ctx.fillStyle =
    "#fff";

    ctx.fillRect(
        0,
        0,
        imgSize,
        imgHeight
    );

    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];

    const legendas = [

        "EXAUSTÃO 2",
        "ADMISSÃO 2",
        "EXAUSTÃO 1",
        "ADMISSÃO 1"

    ];

    const pos = [

        [0,0],
        [imgSize/2,0],
        [0,imgHeight/2],
        [imgSize/2,imgHeight/2]

    ];

    for(
        let j=0;
        j<4;
        j++
    ){

        const box =
        document.getElementById(
            fotos[j]
        );

        if(
            !box ||
            !box.style.backgroundImage
        ){

            continue;

        }

        let imgUrl =
        box.style.backgroundImage
        .replace(
            /^url\(["']?/,
            ""
        )
        .replace(
            /["']?\)$/,
            ""
        );

        const imgEl =
        new Image();

        imgEl.src =
        imgUrl;

        await new Promise(
            resolve =>
            imgEl.onload =
            resolve
        );

        ctx.drawImage(
            imgEl,
            pos[j][0],
            pos[j][1],
            imgSize/2,
            imgHeight/2
        );

        const rectWidth =
        imgSize/2;

        const rectHeight =
        45;

        const rectX =
        pos[j][0];

        const rectY =
        pos[j][1] +
        imgHeight/2 -
        rectHeight;

        ctx.fillStyle =
        "white";

        ctx.strokeStyle =
        "black";

        ctx.lineWidth =
        2;

        roundRect(
            ctx,
            rectX,
            rectY,
            rectWidth,
            rectHeight,
            10,
            true,
            true
        );

        ctx.fillStyle =
        "black";

        ctx.font =
        "bold 30px Arial";

        ctx.textAlign =
        "center";

        ctx.textBaseline =
        "middle";

        ctx.fillText(
            legendas[j],
            rectX + rectWidth/2,
            rectY + rectHeight/2
        );

        const inputId =
        fotos[j].replace(
            "photo",
            ""
        );

        const input =
        document.getElementById(
            inputId
        );

        const valor =
        input
        ? parseFloat(
            input.value.replace(
                ",",
                "."
            )
        )
        : null;

        if(
            valor !== null &&
            !isNaN(valor) &&
            valor >= 67.50
        ){

            const desc =
            `AFUNDAMENTO (${valor.toFixed(2).replace(".",",")}mm)`;

            ctx.font =
            "bold 26px Arial";

            const metrics =
            ctx.measureText(
                desc
            );

            const padding =
            15;

            const txtWidth =
            metrics.width +
            padding * 2;

            const txtHeight =
            45;

            const txtX =
            pos[j][0] +
            (
                imgSize/2 -
                txtWidth
            ) / 2;

            const txtY =
            rectY -
            txtHeight -
            10;

            ctx.fillStyle =
            "white";

            ctx.strokeStyle =
            "black";

            roundRect(
                ctx,
                txtX,
                txtY,
                txtWidth,
                txtHeight,
                10,
                true,
                true
            );

            ctx.fillStyle =
            "red";

            ctx.fillText(
                desc,
                txtX + txtWidth/2,
                txtY + txtHeight/2
            );

        }

    }

    const numText =
    `CILINDRO ${i}`;

    ctx.font =
    "bold 50px Arial";

    const numWidth =
    ctx.measureText(
        numText
    ).width;

    const numPadding =
    20;

    const rectHeight =
    65;

    const rectX =
    (
        imgSize -
        numWidth
    ) / 2 -
    numPadding;

    const rectY =
    5;

    ctx.fillStyle =
    "white";

    ctx.strokeStyle =
    "black";

    ctx.lineWidth =
    2;

    roundRect(
        ctx,
        rectX,
        rectY,
        numWidth +
        numPadding * 2,
        rectHeight,
        15,
        true,
        true
    );

    ctx.fillStyle =
    "black";

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";

    ctx.fillText(
        numText,
        imgSize/2,
        rectY +
        rectHeight/2
    );

    const link =
    document.createElement(
        "a"
    );

    link.download =
    `CILINDRO${i}.jpg`;

    link.href =
    canvas.toDataURL(
        "image/jpeg",
        0.95
    );

    link.click();

}

/* ================================= */
/* GERAR PDF */
/* ================================= */

document
.getElementById(
    "generatePdf"
)
.addEventListener(
    "click",
    async function(){

        const pdf =
        new jsPDF({
            unit:"mm",
            format:"a4"
        });

        const img =
        new Image();

        img.crossOrigin =
        "anonymous";

        img.src =
        "https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg";

        await new Promise(
            resolve =>
            img.onload =
            resolve
        );

        const canvas =
        document.createElement(
            "canvas"
        );

        canvas.width =
        img.width;

        canvas.height =
        img.height;

        const ctx =
        canvas.getContext("2d");

        ctx.drawImage(
            img,
            0,
            0
        );

        ctx.font =
        "bold 18px Arial";

        ctx.fillStyle =
        "black";

        ctx.fillText(
            document.getElementById(
                "mecanico"
            ).value || "",
            208,
            176
        );

        ctx.fillText(
            document.getElementById(
                "usina"
            ).value || "",
            165,
            204
        );

        ctx.fillText(
            document.getElementById(
                "serie"
            ).value || "",
            165,
            231
        );

        ctx.fillText(
            "UGD- " +
            (
                document.getElementById(
                    "ugd"
                ).value || ""
            ),
            590,
            262
        );

        ctx.fillText(
            document.getElementById(
                "os"
            ).value || "",
            292,
            262
        );

        const dataVal =
        document.getElementById(
            "data"
        ).value;

        if(dataVal){

            ctx.fillText(
                new Date(
                    dataVal
                ).toLocaleDateString(
                    "pt-BR"
                ),
                888,
                204
            );

        }

        ctx.fillText(
            document.getElementById(
                "horimetro"
            ).value || "",
            798,
            231
        );

        const limiteMaximo =
        67.50;

        const campos = [

            ['exaustao1_1',105,616],
            ['exaustao1_2',105,576],
            ['admissao1_1',345,628],
            ['admissao1_2',345,589],

            ['exaustao2_1',450,1064],
            ['exaustao2_2',450,1024],
            ['admissao2_1',689,1075],
            ['admissao2_2',689,1038],

            ['exaustao3_1',792,617],
            ['exaustao3_2',792,576],
            ['admissao3_1',1032,628],
            ['admissao3_2',1032,589],

            ['exaustao4_1',793,1064],
            ['exaustao4_2',793,1024],
            ['admissao4_1',1033,1075],
            ['admissao4_2',1033,1038],

            ['exaustao5_1',450,617],
            ['exaustao5_2',450,576],
            ['admissao5_1',689,628],
            ['admissao5_2',689,589],

            ['exaustao6_1',105,1064],
            ['exaustao6_2',105,1024],
            ['admissao6_1',345,1075],
            ['admissao6_2',345,1038]

        ];

        campos.forEach(
            ([id,x,y]) => {

                const valRaw =
                document.getElementById(
                    id
                )?.value || "";

                const valNum =
                parseFloat(
                    valRaw.replace(
                        ",",
                        "."
                    )
                );

                ctx.fillStyle =
                (
                    !isNaN(valNum) &&
                    valNum >= limiteMaximo
                )
                ? "red"
                : "black";

                ctx.font =
                (
                    !isNaN(valNum) &&
                    valNum >= limiteMaximo
                )
                ? "bold 18px Arial"
                : "18px Arial";

                ctx.fillText(
                    valRaw,
                    x,
                    y
                );

            }
        );

        const obs =
        document.getElementById(
            "observacoes"
        ).value;

        const maxWidth =
        950;

        const lineHeight =
        26;

        const words =
        obs.split(" ");

        let line =
        "";

        let y =
        1237;

        words.forEach(
            word => {

                const testLine =
                line +
                word +
                " ";

                const metrics =
                ctx.measureText(
                    testLine
                );

                if(
                    metrics.width >
                    maxWidth
                ){

                    ctx.fillText(
                        line,
                        183,
                        y
                    );

                    line =
                    word +
                    " ";

                    y +=
                    lineHeight;

                }
                else{

                    line =
                    testLine;

                }

            }
        );

        ctx.fillText(
            line,
            183,
            y
        );

        ctx.font =
        '40px "Brush Script MT", cursive';

        ctx.fillText(
            document.getElementById(
                "assinatura"
            ).value || "",
            760,
            1538
        );

        const imgData =
        canvas.toDataURL(
            "image/jpeg",
            1.0
        );

        pdf.addImage(
            imgData,
            "JPEG",
            0,
            0,
            pdf.internal.pageSize.getWidth(),
            pdf.internal.pageSize.getHeight()
        );

        pdf.save(
            "MEDICAO_VALVULAS.pdf"
        );

    }
);

/* ================================= */
/* LIMPAR */
/* ================================= */

document
.getElementById(
    "clearBtn"
)
.addEventListener(
    "click",
    function(){

        if(
            !confirm(
                "Deseja realmente limpar todos os dados?"
            )
        ){

            return;

        }

        document
        .querySelectorAll(
            'input[type="text"], input[type="date"], textarea'
        )
        .forEach(
            input => {

                input.value =
                "";

                input.classList.remove(
                    "medicao-alerta"
                );

            }
        );

        document
        .querySelectorAll(
            ".photo-box"
        )
        .forEach(
            box => {

                box.style.backgroundImage =
                "";

                box.style.color =
                "#666";

                const input =
                box.querySelector(
                    'input[type="file"]'
                );

                if(input){

                    input.value =
                    "";

                }

            }
        );

        cilindroAtual =
        1;

        atualizarCilindro();

    }
);

</script>
