<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Medição de Válvulas • Scania 550</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:#050708;
    scroll-behavior:smooth;
}

body{

    margin:0;
    padding:6px;

    min-height:100vh;

    color:#edf3f0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:

        radial-gradient(
            circle at 50% -15%,
            rgba(35,61,65,.9) 0%,
            rgba(18,27,29,.95) 27%,
            #080c0d 67%,
            #030505 100%
        );

}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root{

    --green:#00b957;
    --green2:#12e875;
    --green-dark:#035a2c;

    --metal1:#414c4f;
    --metal2:#252e30;
    --metal3:#111719;

    --panel:#182022;
    --panel2:#202a2c;

    --border:#435154;
    --border-light:#59676a;

    --white:#f2f7f5;
    --muted:#879490;

    --yellow:#ffd34d;
    --red:#ff4040;

}


/* =========================================================
   APP
========================================================= */

.app{

    width:100%;
    max-width:680px;

    margin:0 auto;

    padding-bottom:30px;

}


/* =========================================================
   CABEÇALHO INDUSTRIAL
========================================================= */

.header{

    position:relative;

    overflow:hidden;

    margin-bottom:7px;

    padding:12px;

    border:1px solid #4b595b;
    border-radius:16px;

    background:

        linear-gradient(
            145deg,
            #3c4749 0%,
            #242e30 35%,
            #111718 100%
        );

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.15),
        inset 0 -3px 0 rgba(0,0,0,.65),

        0 8px 22px rgba(0,0,0,.6);

}


/* brilho superior */

.header::before{

    content:"";

    position:absolute;

    width:240px;
    height:240px;

    right:-100px;
    top:-160px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(0,210,105,.28),
            transparent 68%
        );

}


/* linha inferior */

.header::after{

    content:"";

    position:absolute;

    left:4%;
    right:4%;
    bottom:0;

    height:2px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #00d967,
            transparent
        );

    box-shadow:
        0 0 10px rgba(0,217,103,.6);

}


/* =========================================================
   CABEÇALHO INTERNO
========================================================= */

.header-top{

    position:relative;
    z-index:2;

    display:flex;
    align-items:center;

    gap:10px;

}


/* =========================================================
   ÍCONE MOTOR
========================================================= */

.engine-icon{

    position:relative;

    width:47px;
    height:47px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    border:1px solid #21e276;

    background:

        linear-gradient(
            145deg,
            #13a957,
            #064f2a
        );

    box-shadow:

        inset 0 2px 3px rgba(255,255,255,.25),
        inset 0 -3px 5px rgba(0,0,0,.45),

        0 5px 14px rgba(0,0,0,.55),

        0 0 14px rgba(0,194,91,.13);

    font-size:23px;

    animation:
        motorPulse 4s ease-in-out infinite;

}


.engine-icon::after{

    content:"";

    position:absolute;

    inset:5px;

    border-radius:9px;

    border:1px solid rgba(255,255,255,.12);

}


@keyframes motorPulse{

    0%,100%{
        box-shadow:
            inset 0 2px 3px rgba(255,255,255,.25),
            inset 0 -3px 5px rgba(0,0,0,.45),
            0 5px 14px rgba(0,0,0,.55),
            0 0 8px rgba(0,194,91,.08);
    }

    50%{
        box-shadow:
            inset 0 2px 3px rgba(255,255,255,.25),
            inset 0 -3px 5px rgba(0,0,0,.45),
            0 5px 14px rgba(0,0,0,.55),
            0 0 18px rgba(0,194,91,.25);
    }

}


/* =========================================================
   TÍTULO
========================================================= */

.header h1{

    margin:0;

    color:#ffffff;

    font-size:16px;

    font-weight:950;

    letter-spacing:.7px;

    text-shadow:
        0 2px 3px rgba(0,0,0,.65);

}


.header p{

    margin:3px 0 0;

    color:#aab6b2;

    font-size:7px;

    font-weight:900;

    letter-spacing:1.2px;

}


/* =========================================================
   ONLINE
========================================================= */

.status-led{

    margin-left:auto;

    display:flex;
    align-items:center;

    gap:5px;

    color:#a3afab;

    font-size:7px;

    font-weight:900;

}


.status-led span{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#00ef70;

    box-shadow:
        0 0 6px #00ef70,
        0 0 14px rgba(0,239,112,.7);

}


/* =========================================================
   PAINEL SUPERIOR
========================================================= */

.quick-status{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-bottom:7px;

}


.quick-item{

    position:relative;

    overflow:hidden;

    padding:8px;

    border:1px solid #394648;

    border-radius:10px;

    background:

        linear-gradient(
            145deg,
            #293335,
            #141a1c
        );

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 -2px 0 rgba(0,0,0,.35),

        0 4px 10px rgba(0,0,0,.38);

}


.quick-item::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:2px;
    height:100%;

    background:#00b957;

    box-shadow:
        0 0 8px rgba(0,185,87,.6);

}


.quick-label{

    color:#7d8985;

    font-size:6px;

    font-weight:900;

    letter-spacing:.8px;

}


.quick-value{

    margin-top:3px;

    color:#f4f8f6;

    font-size:10px;

    font-weight:950;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =========================================================
   PAINEL
========================================================= */

.card{

    position:relative;

    margin-bottom:7px;

    padding:9px;

    border:1px solid #354245;

    border-radius:13px;

    background:

        linear-gradient(
            145deg,
            #252e30,
            #141a1c
        );

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 -2px 0 rgba(0,0,0,.55),

        0 6px 16px rgba(0,0,0,.42);

}


.card-title{

    display:flex;
    align-items:center;

    gap:6px;

    margin-bottom:7px;

    color:#e6ece9;

    font-size:9px;

    font-weight:950;

    letter-spacing:.7px;

}


.card-title::after{

    content:"";

    flex:1;

    height:1px;

    background:

        linear-gradient(
            90deg,
            #4a5658,
            transparent
        );

}


/* =========================================================
   DADOS DA INSPEÇÃO
   AGORA FICAM NO FINAL
========================================================= */

.final-section{

    margin-top:10px;

    animation:
        finalReveal .7s ease both;

}


@keyframes finalReveal{

    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================================================
   GRID
========================================================= */

.info-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:6px;

}


.field{
    min-width:0;
}


.field label{

    display:block;

    margin:
        0
        0
        3px
        2px;

    color:#7e8a86;

    font-size:7px;

    font-weight:900;

    letter-spacing:.7px;

}


.field input{

    width:100%;

    height:35px;

    padding:
        5px
        8px;

    border:1px solid #3f4c4e;

    border-radius:8px;

    outline:none;

    color:#f1f6f3;

    background:

        linear-gradient(
            180deg,
            #0e1415,
            #1b2325
        );

    font-size:11px;

    font-weight:800;

    box-shadow:

        inset 0 2px 5px rgba(0,0,0,.5),
        0 1px 0 rgba(255,255,255,.04);

    transition:
        .2s ease;

}


.field input:focus{

    border-color:#00b957;

    transform:
        translateY(-1px);

    box-shadow:

        0 0 0 2px rgba(0,185,87,.12),
        0 4px 10px rgba(0,0,0,.2),
        inset 0 2px 5px rgba(0,0,0,.5);

}


/* =========================================================
   LIMITE
========================================================= */

.limite{

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:8px;

    margin-bottom:7px;

    padding:
        8px
        10px;

    border:1px solid #5d512c;

    border-radius:9px;

    background:

        linear-gradient(
            145deg,
            #302b1b,
            #191711
        );

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.05),
        0 3px 8px rgba(0,0,0,.35);

    font-size:8px;

}


.limite strong{
    color:#e0e6e3;
}


.valor-limite{

    color:#ffd34e;

    font-weight:950;

}


.alerta{

    color:#ff5b5b;

    font-size:7px;

    font-weight:950;

    white-space:nowrap;

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navegacao{

    display:grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items:center;

    gap:6px;

    margin-bottom:7px;

}


.btn-nav{

    height:39px;

    border:1px solid #455255;

    border-radius:10px;

    color:#eaf1ee;

    background:

        linear-gradient(
            145deg,
            #343f41,
            #171e20
        );

    font-size:8px;

    font-weight:950;

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.09),
        0 4px 9px rgba(0,0,0,.45);

    transition:
        transform .12s ease,
        box-shadow .12s ease;

}


.btn-nav:active{

    transform:
        translateY(2px)
        scale(.98);

    box-shadow:
        inset 0 2px 4px rgba(0,0,0,.45);

}


.btn-nav:disabled{
    opacity:.25;
}


.indicador{

    min-width:74px;

    height:39px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:1px solid #13bd62;

    border-radius:10px;

    background:

        linear-gradient(
            145deg,
            #0a8743,
            #034c26
        );

    color:#ffffff;

    font-size:11px;

    font-weight:950;

    letter-spacing:1px;

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.15),
        inset 0 -2px 0 rgba(0,0,0,.3),

        0 4px 11px rgba(0,0,0,.5),

        0 0 12px rgba(0,185,87,.08);

}


/* =========================================================
   CILINDRO
========================================================= */

.valve-section{

    position:relative;

    margin-bottom:8px;

    padding:8px;

    border:1px solid #3c494b;

    border-radius:15px;

    background:

        linear-gradient(
            145deg,
            #283234,
            #13191b
        );

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -3px 0 rgba(0,0,0,.55),

        0 7px 18px rgba(0,0,0,.45);

    transition:
        transform .2s ease,
        box-shadow .2s ease;

}


.valve-section.efeito-clique{

    transform:
        translateY(-2px);

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -3px 0 rgba(0,0,0,.55),

        0 12px 25px rgba(0,0,0,.58),

        0 0 20px rgba(0,185,87,.13);

}


/* =========================================================
   CABEÇALHO DO CILINDRO
========================================================= */

.cilindro-label{

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    height:38px;

    margin-bottom:7px;

    border-radius:9px;

    border:1px solid #18bd63;

    background:

        linear-gradient(
            180deg,
            #0b9449,
            #04592d
        );

    color:#ffffff;

    font-size:11px;

    font-weight:950;

    letter-spacing:1.2px;

    box-shadow:

        inset 0 2px 0 rgba(255,255,255,.14),
        inset 0 -2px 0 rgba(0,0,0,.35),

        0 4px 9px rgba(0,0,0,.45);

}


.cilindro-label::before{

    content:"";

    position:absolute;

    left:9px;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#00ef70;

    box-shadow:
        0 0 7px #00ef70;

}


/* =========================================================
   GRID DAS VÁLVULAS
========================================================= */

.layout-cilindro{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:6px;

}


/* =========================================================
   BLOCO DA VÁLVULA
========================================================= */

.valvula-bloco{

    padding:5px;

    border:1px solid #3e4b4d;

    border-radius:10px;

    background:

        linear-gradient(
            145deg,
            #2a3335,
            #171e20
        );

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.06),
        0 3px 8px rgba(0,0,0,.38);

    transition:
        transform .15s ease,
        border-color .15s ease;

}


.valvula-bloco:active{

    transform:
        scale(.985);

    border-color:
        #00b957;

}


/* =========================================================
   TÍTULO VÁLVULA
========================================================= */

.valvula-titulo{

    display:flex;

    align-items:center;
    justify-content:center;

    height:26px;

    border:1px solid #4a5759;

    border-radius:6px;

    background:

        linear-gradient(
            180deg,
            #343e40,
            #20282a
        );

    color:#dfe7e3;

    font-size:8px;

    font-weight:950;

    letter-spacing:.5px;

}


.valvula-titulo::before{

    content:"";

    width:5px;
    height:5px;

    margin-right:5px;

    border-radius:50%;

    background:#00c861;

    box-shadow:
        0 0 7px rgba(0,200,97,.9);

}


/* =========================================================
   FOTO
========================================================= */

.photo-box{

    position:relative;

    width:100%;

    aspect-ratio:
        1.12 / 1;

    margin:5px auto;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    border:1px dashed #5a686b;

    border-radius:8px;

    background:

        linear-gradient(
            135deg,
            #0d1213,
            #1e2729
        );

    background-size:cover;

    background-position:center;

    color:#687572;

    font-size:8px;

    text-align:center;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;

}


.photo-box:has(
    input[type=file]:focus
){

    border-color:
        #00c861;

    box-shadow:
        0 0 0 2px rgba(0,200,97,.1);

}


.photo-box::before{

    content:"📷";

    position:absolute;

    font-size:21px;

    opacity:.17;

}


.photo-box input[type=file]{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    opacity:0;

}


.photo-label{

    position:absolute;

    left:3px;
    right:3px;
    bottom:3px;

    padding:4px 2px;

    border-radius:4px;

    background:
        rgba(5,10,11,.87);

    color:#e1e8e5;

    font-size:7px;

    font-weight:950;

    text-align:center;

}


/* =========================================================
   MEDIÇÃO
========================================================= */

.measurement{

    position:relative;

}


.measurement input{

    width:100%;

    height:39px;

    border:1px solid #536164;

    border-radius:7px;

    outline:none;

    background:

        linear-gradient(
            180deg,
            #080c0d,
            #161d1f
        );

    color:#67ed9e;

    text-align:center;

    font-family:
        "Courier New",
        monospace;

    font-size:16px;

    font-weight:950;

    letter-spacing:1px;

    box-shadow:
        inset 0 2px 6px rgba(0,0,0,.65);

    transition:
        .2s ease;

}


.measurement input:focus{

    border-color:#00b957;

    box-shadow:

        0 0 0 2px rgba(0,185,87,.13),
        inset 0 2px 6px rgba(0,0,0,.65);

}


.measurement input.afundamento{

    color:#ff6666;

    border-color:#cf2929;

    background:

        linear-gradient(
            180deg,
            #321111,
            #190a0a
        );

    box-shadow:

        inset 0 2px 6px rgba(0,0,0,.6),
        0 0 10px rgba(239,52,52,.18);

}


/* =========================================================
   ALERTA
========================================================= */

.alerta-afundamento{

    display:none;

    align-items:center;
    justify-content:center;

    width:100%;

    min-height:24px;

    margin-top:4px;

    padding:4px;

    border:1px solid #a92828;

    border-radius:5px;

    background:

        linear-gradient(
            180deg,
            #421414,
            #250b0b
        );

    color:#ff6868;

    font-size:8px;

    font-weight:950;

    text-align:center;

}


.alerta-afundamento.ativo{

    display:flex;

    animation:
        alertaPulse 1.3s ease-in-out infinite;

}


@keyframes alertaPulse{

    0%,100%{
        box-shadow:0 0 5px rgba(255,55,55,.08);
    }

    50%{
        box-shadow:0 0 14px rgba(255,55,55,.2);
    }

}


/* =========================================================
   BOTÃO REMOVER
========================================================= */

.remove-photo{

    width:100%;

    height:22px;

    margin-top:4px;

    border:1px solid #61332e;

    border-radius:5px;

    background:

        linear-gradient(
            180deg,
            #70372f,
            #4a241f
        );

    color:#ffb8b0;

    font-size:7px;

    font-weight:950;

}


/* =========================================================
   BOTÃO JPG
========================================================= */

.btn-jpg{

    width:100%;

    height:36px;

    margin-top:7px;

    border:1px solid #566366;

    border-radius:8px;

    background:

        linear-gradient(
            145deg,
            #384346,
            #171e20
        );

    color:#e2e9e6;

    font-size:8px;

    font-weight:950;

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.08),
        0 3px 8px rgba(0,0,0,.38);

    transition:
        .15s ease;

}


.btn-jpg:active{

    transform:
        translateY(2px)
        scale(.985);

    box-shadow:
        inset 0 2px 5px rgba(0,0,0,.5);

}


/* =========================================================
   OBSERVAÇÕES
========================================================= */

.observacoes-area{

    margin-top:8px;

}


textarea{

    width:100%;

    min-height:85px;

    resize:vertical;

    padding:9px;

    border:1px solid #414e50;

    border-radius:9px;

    outline:none;

    background:

        linear-gradient(
            180deg,
            #0f1516,
            #1a2123
        );

    color:#edf3f0;

    font-family:Arial;

    font-size:10px;

    box-shadow:
        inset 0 2px 5px rgba(0,0,0,.45);

}


textarea:focus{

    border-color:#00b957;

    box-shadow:
        0 0 0 2px rgba(0,185,87,.1),
        inset 0 2px 5px rgba(0,0,0,.45);

}


textarea::placeholder{
    color:#687571;
}


/* =========================================================
   ASSINATURA
========================================================= */

.signature{

    margin-top:7px;

    padding:8px;

    border:1px solid #394548;

    border-radius:10px;

    background:

        linear-gradient(
            145deg,
            #232c2e,
            #151b1d
        );

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.06),
        0 4px 12px rgba(0,0,0,.35);

}


.signature-title{

    margin-bottom:4px;

    color:#818d89;

    font-size:7px;

    font-weight:900;

    letter-spacing:.7px;

}


#assinatura{

    width:100%;

    height:37px;

    border:none;

    border-bottom:1px solid #687471;

    outline:none;

    background:transparent;

    color:#6bea9d;

    font-family:
        "Brush Script MT",
        cursive;

    font-size:22px;

    text-align:center;

}


/* =========================================================
   BOTÕES FINAIS
========================================================= */

.button-container{

    display:grid;

    grid-template-columns:
        1.5fr 1fr;

    gap:6px;

    margin:7px 0;

}


.btn-final{

    height:46px;

    border-radius:10px;

    font-size:9px;

    font-weight:950;

    color:#fff;

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.15),
        0 5px 12px rgba(0,0,0,.45);

    transition:
        .15s ease;

}


.btn-final:active{

    transform:
        translateY(2px);

}


.btn-pdf{

    border:1px solid #14bd61;

    background:

        linear-gradient(
            145deg,
            #0aad55,
            #056a34
        );

}


.btn-limpar{

    border:1px solid #854238;

    background:

        linear-gradient(
            145deg,
            #71362e,
            #421f1b
        );

    color:#ffc0ba;

}


/* =========================================================
   DIVISOR FINAL
========================================================= */

.final-divider{

    display:flex;

    align-items:center;

    gap:8px;

    margin:
        15px
        4px
        8px;

    color:#66736f;

    font-size:7px;

    font-weight:950;

<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const { jsPDF } = window.jspdf;

const LIMITE_AFUNDAMENTO = 67.50;

let cilindroAtual = 1;

let previewBlob = null;

let previewUrl = null;

let previewNome = "";


const container =
    document.getElementById(
        "valveContainer"
    );


/* =========================================================
   CRIAR CILINDROS
========================================================= */

for(
    let i = 1;
    i <= 6;
    i++
){

    const section =
        document.createElement("div");

    section.className =
        "valve-section";

    section.id =
        "cilindro-" + i;

    section.style.display =
        i === 1
        ? "block"
        : "none";


    section.innerHTML = `

        <div class="cilindro-label">

            CILINDRO ${String(i).padStart(2,"0")}

        </div>

    `;


    const layout =
        document.createElement("div");

    layout.className =
        "layout-cilindro";


    const posicoes = [

        {
            tipo:"exaustao",
            j:2
        },

        {
            tipo:"admissao",
            j:2
        },

        {
            tipo:"exaustao",
            j:1
        },

        {
            tipo:"admissao",
            j:1
        }

    ];


    posicoes.forEach(
        ({tipo,j})=>{

            const nome =
                tipo === "exaustao"
                ? "EXAUSTÃO"
                : "ADMISSÃO";


            const id =
                tipo +
                i +
                "_" +
                j;


            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "valvula-bloco";


            box.innerHTML = `

                <div class="valvula-titulo">

                    ${nome} ${j}

                </div>


                <div
                    class="photo-box"
                    id="photo${id}"
                >

                    TOQUE PARA FOTO

                    <div class="photo-label">

                        ${nome} ${j}

                    </div>


                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${id}')"
                    >

                </div>


                <div class="measurement">

                    <input
                        type="text"
                        id="${id}"
                        inputmode="decimal"
                        placeholder="MEDIÇÃO • mm"
                        oninput="atualizarDestaque(this)"
                    >


                    <div
                        class="alerta-afundamento"
                        id="alerta-${id}"
                    >

                        AFUNDAMENTO — SUBSTITUIR

                    </div>

                </div>


                <button
                    class="remove-photo"
                    onclick="removePhoto('${id}')"
                >

                    × REMOVER FOTO

                </button>

            `;


            layout.appendChild(box);

        }
    );


    section.appendChild(layout);


    const btn =
        document.createElement("button");


    btn.className =
        "btn-jpg";


    btn.textContent =
        `▣ GERAR IMAGEM DO CILINDRO ${i}`;


    btn.onclick =
        () => gerarJpgCilindro(i);


    section.appendChild(btn);


    container.appendChild(section);

}


/* =========================================================
   EFEITO DE CLIQUE NO CILINDRO
========================================================= */

document.addEventListener(
    "click",
    function(event){

        const cilindro =
            event.target.closest(
                ".valve-section"
            );


        if(!cilindro)
            return;


        cilindro.classList.remove(
            "efeito-clique"
        );


        void cilindro.offsetWidth;


        cilindro.classList.add(
            "efeito-clique"
        );


        setTimeout(
            ()=>{
                cilindro.classList.remove(
                    "efeito-clique"
                );
            },
            260
        );

    }
);


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function atualizarCilindro(){

    for(
        let i = 1;
        i <= 6;
        i++
    ){

        const el =
            document.getElementById(
                "cilindro-" + i
            );


        if(el){

            el.style.display =
                i === cilindroAtual
                ? "block"
                : "none";

        }

    }


    document.getElementById(
        "indicadorCilindro"
    ).textContent =
        `${String(cilindroAtual).padStart(2,"0")} / 06`;


    document.getElementById(
        "btnAnterior"
    ).disabled =
        cilindroAtual === 1;


    document.getElementById(
        "btnProximo"
    ).disabled =
        cilindroAtual === 6;

}


/* =========================================================
   LIMPAR FOTOS
========================================================= */

function limparFotosCilindro(i){

    const ids = [

        `exaustao${i}_2`,
        `admissao${i}_2`,
        `exaustao${i}_1`,
        `admissao${i}_1`

    ];


    ids.forEach(
        id=>{

            const box =
                document.getElementById(
                    "photo" + id
                );


            if(!box)
                return;


            box.style.backgroundImage =
                "";


            const nome =
                id.includes("exaustao")
                ? "EXAUSTÃO"
                : "ADMISSÃO";


            const numero =
                id.endsWith("_1")
                ? "1"
                : "2";


            box.innerHTML = `

                TOQUE PARA FOTO

                <div class="photo-label">

                    ${nome} ${numero}

                </div>


                <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="loadPhoto(event,'${id}')"
                >

            `;

        }
    );

}


/* =========================================================
   PRÓXIMO
========================================================= */

function proximoCilindro(){

    if(cilindroAtual < 6){

        limparFotosCilindro(
            cilindroAtual
        );

        cilindroAtual++;

        atualizarCilindro();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =========================================================
   ANTERIOR
========================================================= */

function cilindroAnterior(){

    if(cilindroAtual > 1){

        cilindroAtual--;

        atualizarCilindro();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =========================================================
   FOTO
========================================================= */

function loadPhoto(event,id){

    const file =
        event.target.files[0];


    if(!file)
        return;


    const box =
        document.getElementById(
            "photo" + id
        );


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            box.style.backgroundImage =
                `url("${e.target.result}")`;

        };


    reader.readAsDataURL(file);

}


/* =========================================================
   REMOVER FOTO
========================================================= */

function removePhoto(id){

    const box =
        document.getElementById(
            "photo" + id
        );


    if(!box)
        return;


    box.style.backgroundImage =
        "";


    const nome =
        id.includes("exaustao")
        ? "EXAUSTÃO"
        : "ADMISSÃO";


    const numero =
        id.endsWith("_1")
        ? "1"
        : "2";


    box.innerHTML = `

        TOQUE PARA FOTO

        <div class="photo-label">

            ${nome} ${numero}

        </div>


        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}


/* =========================================================
   DESTAQUE
========================================================= */

function atualizarDestaque(input){

    const valor =
        parseFloat(
            input.value
                .replace(",",".")
                .trim()
        );


    const alerta =
        document.getElementById(
            "alerta-" + input.id
        );


    if(
        !isNaN(valor) &&
        valor >= LIMITE_AFUNDAMENTO
    ){

        input.classList.add(
            "afundamento"
        );


        if(alerta){

            alerta.classList.add(
                "ativo"
            );

        }

    }
    else{

        input.classList.remove(
            "afundamento"
        );


        if(alerta){

            alerta.classList.remove(
                "ativo"
            );

        }

    }

}


/* =========================================================
   CARREGAR IMAGEM
========================================================= */

function carregarImagem(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();


            img.onload =
                () => resolve(img);


            img.onerror =
                () => reject();


            img.src =
                url;

        }
    );

}


/* =========================================================
   GERAR JPG
   1280 x 1700
========================================================= */

async function gerarJpgCilindro(i){

    const imgSize = 1280;

    const imgHeight = 1700;


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        imgSize;

    canvas.height =
        imgHeight;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        imgSize,
        imgHeight
    );


    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];


    const legendas = [

        "EXAUSTÃO 2",
        "ADMISSÃO 2",
        "EXAUSTÃO 1",
        "ADMISSÃO 1"

    ];


    const pos = [

        [0,0],
        [imgSize / 2,0],
        [0,imgHeight / 2],
        [imgSize / 2,imgHeight / 2]

    ];


    for(
        let j = 0;
        j < 4;
        j++
    ){

        const box =
            document.getElementById(
                fotos[j]
            );


        const valInputId =
            fotos[j].replace(
                "photo",
                ""
            );


        const inputValEl =
            document.getElementById(
                valInputId
            );


        const val =
            inputValEl
            ? parseFloat(
                inputValEl.value
                    .replace(",",".")
                    .trim()
            )
            : null;


        if(
            box &&
            box.style.backgroundImage &&
            box.style.backgroundImage !== "none"
        ){

            const imgUrl =
                box.style.backgroundImage
                    .replace(
                        /^url\(["']?/,
                        ""
                    )
                    .replace(
                        /["']?\)$/,
                        ""
                    );


            try{

                const img =
                    await carregarImagem(
                        imgUrl
                    );


                ctx.drawImage(
                    img,
                    pos[j][0],
                    pos[j][1],
                    imgSize / 2,
                    imgHeight / 2
                );


                const rectWidth =
                    imgSize / 2;


                const rectHeight =
                    40;


                const rectX =
                    pos[j][0];


                const rectY =
                    pos[j][1] +
                    imgHeight / 2 -
                    rectHeight;


                ctx.fillStyle =
                    "white";


                ctx.strokeStyle =
                    "black";


                ctx.lineWidth =
                    2;


                ctx.fillRect(
                    rectX,
                    rectY,
                    rectWidth,
                    rectHeight
                );


                ctx.strokeRect(
                    rectX,
                    rectY,
                    rectWidth,
                    rectHeight
                );


                ctx.fillStyle =
                    "black";


                ctx.font =
                    "bold 30px Arial";


                ctx.textAlign =
                    "center";


                ctx.textBaseline =
                    "middle";


                ctx.fillText(
                    legendas[j],
                    rectX + rectWidth / 2,
                    rectY + rectHeight / 2
                );


                if(
                    val !== null &&
                    !isNaN(val) &&
                    val >= LIMITE_AFUNDAMENTO
                ){

                    const desc =
                        `AFUNDAMENTO (${val.toFixed(2).replace(".",",")}mm)`;


                    const metrics =
                        ctx.measureText(
                            desc
                        );


                    const padding =
                        10;


                    const txtWidth =
                        metrics.width +
                        padding * 2;


                    const txtHeight =
                        40;


                    const txtX =
                        pos[j][0] +
                        (
                            imgSize / 2 -
                            txtWidth
                        ) / 2;


                    const txtY =
                        rectY -
                        txtHeight -
                        10;


                    ctx.fillStyle =
                        "white";


                    ctx.strokeStyle =
                        "black";


                    ctx.fillRect(
                        txtX,
                        txtY,
                        txtWidth,
                        txtHeight
                    );


                    ctx.strokeRect(
                        txtX,
                        txtY,
                        txtWidth,
                        txtHeight
                    );


                    ctx.fillStyle =
                        "red";


                    ctx.font =
                        "bold 30px Arial";


                    ctx.fillText(
                        desc,
                        txtX + txtWidth / 2,
                        txtY + txtHeight / 2
                    );

                }

            }
            catch(error){

                console.error(error);

            }

        }

    }


    /* =====================================================
       TÍTULO
    ===================================================== */

    const numText =
        `CILINDRO ${i}`;


    ctx.font =
        "bold 50px Arial";


    const numWidth =
        ctx.measureText(
            numText
        ).width;


    const numPadding =
        20;


    const rectHeight =
        60;


    const rectX =
        (
            imgSize -
            numWidth
        ) / 2 -
        numPadding;


    const rectY =
        5;


    ctx.fillStyle =
        "white";


    ctx.strokeStyle =
        "black";


    ctx.lineWidth =
        2;


    ctx.fillRect(
        rectX,
        rectY,
        numWidth +
        numPadding * 2,
        rectHeight
    );


    ctx.strokeRect(
        rectX,
        rectY,
        numWidth +
        numPadding * 2,
        rectHeight
    );


    ctx.fillStyle =
        "black";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        numText,
        imgSize / 2,
        rectY +
        rectHeight / 2
    );


    /* =====================================================
       BLOB
    ===================================================== */

    const blob =
        await new Promise(
            resolve =>
                canvas.toBlob(
                    resolve,
                    "image/jpeg",
                    0.95
                )
        );


    if(!blob){

        alert(
            "Não foi possível gerar a imagem."
        );

        return;

    }


    if(previewUrl){

        URL.revokeObjectURL(
            previewUrl
        );

    }


    previewBlob =
        blob;


    previewNome =
        `CILINDRO${i}.jpg`;


    previewUrl =
        URL.createObjectURL(
            blob
        );


    document.getElementById(
        "previewImage"
    ).src =
        previewUrl;


    document.getElementById(
        "previewTitle"
    ).textContent =
        `PRÉVIA — CILINDRO ${String(i).padStart(2,"0")}`;


    document.getElementById(
        "previewOverlay"
    ).classList.add(
        "ativo"
    );


    document.querySelector(
        ".preview-content"
    ).scrollTop = 0;

}


/* =========================================================
   FECHAR PREVIEW
========================================================= */

function fecharPreview(){

    document.getElementById(
        "previewOverlay"
    ).classList.remove(
        "ativo"
    );


    document.getElementById(
        "previewImage"
    ).src = "";


    if(previewUrl){

        URL.revokeObjectURL(
            previewUrl
        );

        previewUrl =
            null;

    }


    previewBlob =
        null;

}


/* =========================================================
   DOWNLOAD JPG
========================================================= */

document
.getElementById(
    "previewDownload"
)
.addEventListener(
    "click",
    function(){

        if(!previewBlob)
            return;


        const url =
            URL.createObjectURL(
                previewBlob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            previewNome;


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        setTimeout(
            ()=>{
                URL.revokeObjectURL(
                    url
                );
            },
            3000
        );


        mostrarMensagemDownload(
            previewNome
        );

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            fecharPreview();

        }

    }
);


/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagemDownload(nome){

    const el =
        document.getElementById(
            "downloadMensagem"
        );


    el.innerHTML =
        `⬇ ${nome}<br>Download realizado`;


    el.style.display =
        "block";


    setTimeout(
        ()=>{
            el.style.display =
                "none";
        },
        3000
    );

}


/* =========================================================
   GERAR PDF
========================================================= */

document
.getElementById("generatePdf")
.addEventListener(
    "click",
    async function(){

        try{

            const pdf =
                new jsPDF({
                    unit:"mm",
                    format:"a4"
                });


            const img =
                new Image();


            img.crossOrigin =
                "anonymous";


            img.src =
                "https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg";


            await new Promise(
                (resolve,reject)=>{

                    img.onload =
                        resolve;

                    img.onerror =
                        reject;

                }
            );


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                img.width;


            canvas.height =
                img.height;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            ctx.drawImage(
                img,
                0,
                0
            );


            ctx.font =
                "bold 18px Arial";


            ctx.fillStyle =
                "black";


            ctx.fillText(
                document.getElementById(
                    "mecanico"
                ).value || "",
                208,
                176
            );


            ctx.fillText(
                document.getElementById(
                    "usina"
                ).value || "",
                165,
                204
            );


            ctx.fillText(
                document.getElementById(
                    "serie"
                ).value || "",
                165,
                231
            );


            ctx.fillText(
                "UGD- " +
                (
                    document.getElementById(
                        "ugd"
                    ).value || ""
                ),
                590,
                262
            );


            ctx.fillText(
                document.getElementById(
                    "os"
                ).value || "",
                292,
                262
            );


            const dataVal =
                document.getElementById(
                    "data"
                ).value;


            if(dataVal){

                const partes =
                    dataVal.split("-");


                const dataBR =
                    `${partes[2]}/${partes[1]}/${partes[0]}`;


                ctx.fillText(
                    dataBR,
                    888,
                    204
                );

            }


            ctx.fillText(
                document.getElementById(
                    "horimetro"
                ).value || "",
                798,
                231
            );


            const campos = [

                ["exaustao1_1",105,616],
                ["exaustao1_2",105,576],
                ["admissao1_1",345,628],
                ["admissao1_2",345,589],

                ["exaustao2_1",450,1064],
                ["exaustao2_2",450,1024],
                ["admissao2_1",689,1075],
                ["admissao2_2",689,1038],

                ["exaustao3_1",792,617],
                ["exaustao3_2",792,576],
                ["admissao3_1",1032,628],
                ["admissao3_2",1032,589],

                ["exaustao4_1",793,1064],
                ["exaustao4_2",793,1024],
                ["admissao4_1",1033,1075],
                ["admissao4_2",1033,1038],

                ["exaustao5_1",450,617],
                ["exaustao5_2",450,576],
                ["admissao5_1",689,628],
                ["admissao5_2",689,589],

                ["exaustao6_1",105,1064],
                ["exaustao6_2",105,1024],
                ["admissao6_1",345,1075],
                ["admissao6_2",345,1038]

            ];


            campos.forEach(
                ([id,x,y])=>{

                    const valor =
                        document.getElementById(
                            id
                        )?.value || "";


                    const numero =
                        parseFloat(
                            valor
                                .replace(",",".")
                                .trim()
                        );


                    if(
                        !isNaN(numero) &&
                        numero >= LIMITE_AFUNDAMENTO
                    ){

                        ctx.fillStyle =
                            "red";


                        ctx.font =
                            "bold 18px Arial";


                        ctx.fillText(
                            valor,
                            x,
                            y
                        );


                        ctx.font =
                            "bold 12px Arial";


                        ctx.fillText(
                            "AFUNDAMENTO - SUBSTITUIR",
                            x,
                            y + 17
                        );

                    }
                    else{

                        ctx.fillStyle =
                            "black";


                        ctx.font =
                            "18px Arial";


                        ctx.fillText(
                            valor,
                            x,
                            y
                        );

                    }

                }
            );


            const obs =
                document.getElementById(
                    "observacoes"
                ).value;


            ctx.fillStyle =
                "black";


            ctx.font =
                "18px Arial";


            const maxWidth =
                950;


            const lineHeight =
                26;


            const palavras =
                obs.split(/\s+/);


            let linha =
                "";


            let y =
                1237;


            palavras.forEach(
                palavra=>{

                    const teste =
                        linha +
                        palavra +
                        " ";


                    if(
                        ctx.measureText(
                            teste
                        ).width >
                        maxWidth
                    ){

                        ctx.fillText(
                            linha,
                            183,
                            y
                        );


                        linha =
                            palavra +
                            " ";


                        y +=
                            lineHeight;

                    }
                    else{

                        linha =
                            teste;

                    }

                }
            );


            if(linha){

                ctx.fillText(
                    linha,
                    183,
                    y
                );

            }


            ctx.font =
                '40px "Brush Script MT", cursive';


            ctx.fillStyle =
                "#08783b";


            ctx.fillText(
                document.getElementById(
                    "assinatura"
                ).value || "",
                760,
                1538
            );


            const imgData =
                canvas.toDataURL(
                    "image/jpeg",
                    1
                );


            pdf.addImage(
                imgData,
                "JPEG",
                0,
                0,
                pdf.internal.pageSize.getWidth(),
                pdf.internal.pageSize.getHeight()
            );


            pdf.save(
                "MEDICAO_VALVULAS.pdf"
            );

        }
        catch(error){

            console.error(error);


            alert(
                "Não foi possível gerar o PDF. Verifique sua conexão com a internet."
            );

        }

    }
);


/* =========================================================
   LIMPAR
========================================================= */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    function(){

        if(
            !confirm(
                "Deseja realmente limpar todos os dados?"
            )
        ){

            return;

        }


        document
        .querySelectorAll(
            'input[type="text"], input[type="date"], textarea'
        )
        .forEach(
            el=>{
                el.value = "";
            }
        );


        document
        .querySelectorAll(
            ".measurement input"
        )
        .forEach(
            el=>{

                el.classList.remove(
                    "afundamento"
                );

            }
        );


        document
        .querySelectorAll(
            ".alerta-afundamento"
        )
        .forEach(
            el=>{

                el.classList.remove(
                    "ativo"
                );

            }
        );


        for(
            let i = 1;
            i <= 6;
            i++
        ){

            limparFotosCilindro(i);

        }


        cilindroAtual =
            1;


        atualizarCilindro();

    }
);

document.getElementById(
    "data"
).value =
    new Date()
        .toISOString()
        .split("T")[0];


/* =========================================================

========================================================= */

atualizarCilindro();


</script>
