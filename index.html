<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Medição de Válvulas - Scania 550</title>

<script
src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>

<style>

/* =========================================================
   BASE
========================================================= */

:root{

    --verde:#257500;
    --verde-dark:#174d00;
    --verde-light:#3f9b18;

    --laranja:#ff8c00;
    --laranja-dark:#d96f00;

    --vermelho:#d71920;

    --fundo:#eef2f0;
    --branco:#ffffff;
    --cinza:#66706b;

    --sombra:
        0 10px 25px rgba(0,0,0,.12);

    --sombra-forte:
        0 16px 35px rgba(0,0,0,.18);

}

*{

    box-sizing:border-box;

}

body{

    margin:0;

    padding:20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef2f0,
            #dfe7e2
        );

    color:#1d241f;

}


/* =========================================================
   CONTAINER PRINCIPAL
========================================================= */

.page{

    max-width:1250px;

    margin:auto;

}


/* =========================================================
   CABEÇALHO
========================================================= */

.header{

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            var(--verde-dark),
            var(--verde),
            var(--verde-light)
        );

    border-radius:18px;

    padding:25px;

    color:white;

    box-shadow:
        0 15px 35px rgba(0,0,0,.20);

    margin-bottom:20px;

}

.header::before{

    content:"";

    position:absolute;

    width:300px;

    height:300px;

    right:-100px;

    top:-150px;

    background:
        rgba(255,255,255,.08);

    border-radius:50%;

}

.header::after{

    content:"";

    position:absolute;

    width:180px;

    height:180px;

    left:-90px;

    bottom:-100px;

    background:
        rgba(255,255,255,.06);

    border-radius:50%;

}

.header-content{

    position:relative;

    z-index:2;

}

.header h1{

    margin:0;

    text-align:center;

    font-size:28px;

    letter-spacing:.5px;

}

.header p{

    margin:7px 0 0;

    text-align:center;

    opacity:.9;

    font-size:14px;

}


/* =========================================================
   CARD DE INFORMAÇÕES
========================================================= */

.info-card{

    background:white;

    border-radius:16px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:var(--sombra);

    border:1px solid rgba(0,0,0,.05);

}

.card-title{

    display:flex;

    align-items:center;

    gap:10px;

    font-size:18px;

    font-weight:bold;

    color:var(--verde-dark);

    margin-bottom:18px;

}

.card-title::before{

    content:"";

    width:5px;

    height:22px;

    background:var(--verde);

    border-radius:5px;

}

.info-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

}

.field{

    display:flex;

    flex-direction:column;

    gap:6px;

}

.field label{

    font-size:12px;

    font-weight:bold;

    color:#59625d;

    text-transform:uppercase;

}

.field input{

    width:100%;

    height:44px;

    border:1px solid #d4dad6;

    border-radius:9px;

    padding:8px 12px;

    font-size:15px;

    outline:none;

    background:#f9faf9;

    transition:.2s;

}

.field input:focus{

    border-color:var(--verde);

    background:white;

    box-shadow:
        0 0 0 3px rgba(37,117,0,.10);

}


/* =========================================================
   AVISO TÉCNICO
========================================================= */

.limites{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;

    margin-bottom:20px;

}

.limite{

    padding:16px;

    border-radius:12px;

    background:white;

    box-shadow:var(--sombra);

    border-left:5px solid var(--verde);

}

.limite.danger{

    border-left-color:var(--vermelho);

}

.limite-title{

    font-size:12px;

    font-weight:bold;

    color:#68716c;

    text-transform:uppercase;

    margin-bottom:5px;

}

.limite-value{

    font-size:20px;

    font-weight:bold;

    color:var(--verde-dark);

}

.limite.danger
.limite-value{

    color:var(--vermelho);

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navegacao-cilindros{

    display:grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items:center;

    gap:12px;

    margin-bottom:18px;

}

.btn-navegacao{

    border:none;

    border-radius:10px;

    min-height:48px;

    padding:10px 18px;

    background:
        linear-gradient(
            145deg,
            var(--verde-light),
            var(--verde-dark)
        );

    color:white;

    font-weight:bold;

    font-size:14px;

    cursor:pointer;

    box-shadow:
        0 5px 0 var(--verde-dark),
        0 8px 15px rgba(0,0,0,.15);

    transition:.15s;

}

.btn-navegacao:hover{

    transform:translateY(-2px);

}

.btn-navegacao:active{

    transform:translateY(3px);

    box-shadow:
        0 2px 0 var(--verde-dark);

}

.btn-navegacao:disabled{

    background:#aeb5b1;

    box-shadow:none;

    cursor:not-allowed;

    transform:none;

}

.indicador-cilindro{

    min-width:145px;

    text-align:center;

    padding:12px 18px;

    background:white;

    color:var(--verde-dark);

    border-radius:10px;

    font-weight:bold;

    box-shadow:var(--sombra);

    border:1px solid #dfe5e1;

}


/* =========================================================
   ÁREA DO CILINDRO
========================================================= */

.valve-section{

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f3f6f4
        );

    border-radius:18px;

    padding:18px;

    margin-bottom:20px;

    box-shadow:var(--sombra-forte);

    border:1px solid #dce4df;

    position:relative;

    overflow:hidden;

}

.valve-section::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    right:0;

    height:5px;

    background:
        linear-gradient(
            90deg,
            var(--verde-dark),
            var(--verde),
            var(--laranja)
        );

}

.cilindro-label{

    display:flex;

    justify-content:center;

    align-items:center;

    height:48px;

    margin-bottom:15px;

    border-radius:10px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #e9eeeb
        );

    color:var(--verde-dark);

    border:1px solid #d5ddd8;

    box-shadow:
        0 5px 10px rgba(0,0,0,.08);

    font-size:18px;

    font-weight:bold;

    letter-spacing:.5px;

}


/* =========================================================
   GRID DAS VÁLVULAS
========================================================= */

.layout-cilindro{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;

}


/* =========================================================
   CARD DA VÁLVULA
========================================================= */

.valvula-bloco{

    background:white;

    border-radius:13px;

    padding:10px;

    border:1px solid #dce2de;

    box-shadow:
        0 7px 15px rgba(0,0,0,.08);

    transition:.2s;

}

.valvula-bloco:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 22px rgba(0,0,0,.12);

}

.valvula-titulo{

    text-align:center;

    padding:9px;

    border-radius:8px;

    background:
        linear-gradient(
            145deg,
            var(--verde-light),
            var(--verde-dark)
        );

    color:white;

    font-size:13px;

    font-weight:bold;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.25);

}


/* =========================================================
   FOTO
========================================================= */

.photo-box{

    width:100%;

    height:190px;

    margin:10px auto;

    border-radius:10px;

    border:2px dashed var(--laranja);

    background-color:#fafafa;

    background-size:cover;

    background-position:center;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    overflow:hidden;

    color:#777;

    font-size:12px;

    text-align:center;

    cursor:pointer;

}

.photo-box input[type="file"]{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    opacity:0;

    cursor:pointer;

}

.photo-label{

    position:absolute;

    bottom:0;

    left:0;

    right:0;

    padding:6px;

    background:
        rgba(37,117,0,.90);

    color:white;

    font-size:11px;

    font-weight:bold;

}


/* =========================================================
   MEDIÇÃO
========================================================= */

.measurement{

    margin-top:10px;

    padding:10px;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #fffdf0,
            #fff8cf
        );

    border:1px solid #f0df9d;

}

.measurement-label{

    display:block;

    font-size:11px;

    font-weight:bold;

    color:#766b32;

    text-transform:uppercase;

    margin-bottom:5px;

}

.measurement input{

    width:100%;

    height:44px;

    border:2px solid var(--laranja);

    border-radius:8px;

    text-align:center;

    font-size:18px;

    font-weight:bold;

    background:white;

    outline:none;

}

.measurement input:focus{

    box-shadow:
        0 0 0 3px rgba(255,140,0,.15);

}


/* =========================================================
   BOTÃO REMOVER FOTO
========================================================= */

.remove-photo{

    width:100%;

    border:none;

    padding:8px;

    border-radius:7px;

    background:#f1f3f2;

    color:#8b332f;

    font-size:10px;

    font-weight:bold;

    cursor:pointer;

    margin-top:3px;

}

.remove-photo:hover{

    background:#ffe5e3;

}


/* =========================================================
   BOTÃO JPG
========================================================= */

.btn-jpg{

    display:block;

    margin:18px auto 2px;

    border:none;

    padding:12px 24px;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            var(--verde-light),
            var(--verde-dark)
        );

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 0 var(--verde-dark),
        0 8px 15px rgba(0,0,0,.12);

    transition:.15s;

}

.btn-jpg:hover{

    transform:translateY(-2px);

}

.btn-jpg:active{

    transform:translateY(3px);

    box-shadow:
        0 2px 0 var(--verde-dark);

}


/* =========================================================
   OBSERVAÇÕES
========================================================= */

.obs-card{

    background:white;

    border-radius:16px;

    padding:18px;

    box-shadow:var(--sombra);

    margin-bottom:20px;

}

.obs-card textarea{

    width:100%;

    min-height:120px;

    resize:vertical;

    border:1px solid #d5ddd8;

    border-radius:10px;

    padding:12px;

    font-family:Arial,sans-serif;

    font-size:14px;

    outline:none;

}

.obs-card textarea:focus{

    border-color:var(--verde);

    box-shadow:
        0 0 0 3px rgba(37,117,0,.10);

}


/* =========================================================
   ASSINATURA
========================================================= */

.signature-card{

    background:white;

    border-radius:16px;

    padding:20px;

    box-shadow:var(--sombra);

    margin-bottom:20px;

    text-align:center;

}

.signature{

    position:relative;

    width:min(400px,100%);

    margin:35px auto 0;

    border-top:1px solid #555;

    padding-top:8px;

    font-size:12px;

    color:#555;

}

#assinatura{

    position:absolute;

    bottom:15px;

    left:0;

    width:100%;

    border:none;

    background:transparent;

    outline:none;

    text-align:center;

    font-size:28px;

    font-family:
        "Brush Script MT",
        cursive;

    color:var(--verde);

}


/* =========================================================
   BOTÕES FINAIS
========================================================= */

.button-container{

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

    margin:25px 0;

}

.action-btn{

    min-width:190px;

    min-height:50px;

    border:none;

    border-radius:10px;

    padding:12px 25px;

    background:
        linear-gradient(
            145deg,
            var(--verde-light),
            var(--verde-dark)
        );

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 0 var(--verde-dark),
        0 8px 15px rgba(0,0,0,.15);

}

.action-btn:hover{

    transform:translateY(-2px);

}

.action-btn.clear-btn{

    background:
        linear-gradient(
            145deg,
            #ef5750,
            #b81717
        );

    box-shadow:
        0 5px 0 #891010,
        0 8px 15px rgba(0,0,0,.15);

}


/* =========================================================
   MENSAGEM
========================================================= */

.download-mensagem{

    position:fixed;

    left:50%;

    bottom:25px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:
        linear-gradient(
            145deg,
            var(--verde-light),
            var(--verde-dark)
        );

    color:white;

    padding:14px 22px;

    border-radius:10px;

    font-weight:bold;

    z-index:99999;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);

    display:none;

    text-align:center;

}


/* =========================================================
   CELULAR
========================================================= */

@media(max-width:800px){

    body{

        padding:8px;

    }

    .header{

        padding:20px 12px;

        border-radius:14px;

    }

    .header h1{

        font-size:21px;

    }

    .info-grid{

        grid-template-columns:1fr 1fr;

    }

    .limites{

        grid-template-columns:1fr;

    }

    .navegacao-cilindros{

        grid-template-columns:
            1fr auto 1fr;

        gap:5px;

    }

    .btn-navegacao{

        padding:9px 4px;

        font-size:11px;

    }

    .indicador-cilindro{

        min-width:90px;

        padding:10px 5px;

        font-size:11px;

    }

    .valve-section{

        padding:10px;

    }

    .layout-cilindro{

        gap:7px;

    }

    .valvula-bloco{

        padding:6px;

    }

    .photo-box{

        height:130px;

    }

    .measurement input{

        height:40px;

        font-size:16px;

    }

    .btn-jpg{

        width:100%;

    }

}

@media(max-width:500px){

    .info-grid{

        grid-template-columns:1fr;

    }

    .layout-cilindro{

        grid-template-columns:
            1fr 1fr;

    }

    .valvula-titulo{

        font-size:10px;

        padding:7px 3px;

    }

    .photo-box{

        height:105px;

        font-size:10px;

    }

    .measurement{

        padding:6px;

    }

    .measurement-label{

        font-size:9px;

    }

    .measurement input{

        height:36px;

        font-size:14px;

    }

    .remove-photo{

        font-size:8px;

        padding:6px 2px;

    }

    .button-container{

        flex-direction:column;

    }

    .action-btn{

        width:100%;

    }

}


/* =========================================================
   ANIMAÇÃO
========================================================= */

.valve-section{

    animation:
        entrada .25s ease;

}

@keyframes entrada{

    from{

        opacity:0;

        transform:
            translateY(8px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}

</style>

</head>


<body>

<div class="page">


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header class="header">

    <div class="header-content">

        <h1>
            MEDIÇÃO DAS VÁLVULAS
        </h1>

        <p>
            SCANIA 550 • CONTROLE DE INSPEÇÃO
        </p>

    </div>

</header>


<!-- =====================================================
     INFORMAÇÕES
===================================================== -->

<section class="info-card">

    <div class="card-title">
        DADOS DA INSPEÇÃO
    </div>

    <div class="info-grid">

        <div class="field">

            <label>Mecânico</label>

            <input
                type="text"
                id="mecanico"
            >

        </div>


        <div class="field">

            <label>Data</label>

            <input
                type="date"
                id="data"
            >

        </div>


        <div class="field">

            <label>Usina</label>

            <input
                type="text"
                id="usina"
            >

        </div>


        <div class="field">

            <label>Horímetro</label>

            <input
                type="text"
                id="horimetro"
            >

        </div>


        <div class="field">

            <label>Série</label>

            <input
                type="text"
                id="serie"
            >

        </div>


        <div class="field">

            <label>OS</label>

            <input
                type="text"
                id="os"
            >

        </div>


        <div class="field">

            <label>UGD</label>

            <input
                type="text"
                id="ugd"
                placeholder="Ex.: 01"
            >

        </div>

    </div>

</section>


<!-- =====================================================
     LIMITES
===================================================== -->

<div class="limites">

    <div class="limite">

        <div class="limite-title">
            Faixa aceitável
        </div>

        <div class="limite-value">
            64,00 mm — 67,49 mm
        </div>

    </div>


    <div class="limite danger">

        <div class="limite-title">
            Atenção
        </div>

        <div class="limite-value">
            ≥ 67,50 mm — SUBSTITUIR
        </div>

    </div>

</div>


<!-- =====================================================
     NAVEGAÇÃO
===================================================== -->

<div class="navegacao-cilindros">

    <button
        class="btn-navegacao"
        id="btnAnterior"
        onclick="cilindroAnterior()"
    >

        ← ANTERIOR

    </button>


    <div
        class="indicador-cilindro"
        id="indicadorCilindro"
    >

        CILINDRO 1 / 6

    </div>


    <button
        class="btn-navegacao"
        id="btnProximo"
        onclick="proximoCilindro()"
    >

        PRÓXIMO →

    </button>

</div>


<!-- =====================================================
     CILINDROS
===================================================== -->

<div
    class="valve-container"
    id="valveContainer"
></div>


<!-- =====================================================
     OBSERVAÇÕES
===================================================== -->

<section class="obs-card">

    <div class="card-title">
        OBSERVAÇÕES TÉCNICAS
    </div>

    <textarea
        id="observacoes"
        placeholder="Digite aqui as observações da inspeção..."
    ></textarea>

</section>


<!-- =====================================================
     ASSINATURA
===================================================== -->

<section class="signature-card">

    <div class="card-title">
        RESPONSÁVEL PELA INSPEÇÃO
    </div>

    <div class="signature">

        <input
            type="text"
            id="assinatura"
            placeholder="Digite seu nome"
        >

        ASSINATURA DO MECÂNICO

    </div>

</section>


<!-- =====================================================
     BOTÕES
===================================================== -->

<div class="button-container">

    <button
        class="action-btn"
        id="generatePdf"
    >

        📄 GERAR PDF

    </button>


    <button
        class="action-btn clear-btn"
        id="clearBtn"
    >

        🗑 LIMPAR FORMULÁRIO

    </button>

</div>


</div>


<!-- =====================================================
     MENSAGEM
===================================================== -->

<div
    class="download-mensagem"
    id="downloadMensagem"
></div>


<script>

const { jsPDF } = window.jspdf;


/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const LIMITE_MAXIMO = 67.50;

let cilindroAtual = 1;


/* =========================================================
   CRIAR CILINDROS
========================================================= */

const container =
    document.getElementById(
        'valveContainer'
    );


for(
    let i = 1;
    i <= 6;
    i++
){

    const section =
        document.createElement(
            'section'
        );

    section.className =
        'valve-section';

    section.id =
        'cilindro-' + i;

    section.style.display =
        i === 1
        ? 'block'
        : 'none';


    section.innerHTML = `

        <div class="cilindro-label">

            CILINDRO ${i}

        </div>

    `;


    const layout =
        document.createElement(
            'div'
        );

    layout.className =
        'layout-cilindro';


    const posicoes = [

        {
            tipo:'exaustao',
            j:2
        },

        {
            tipo:'admissao',
            j:2
        },

        {
            tipo:'exaustao',
            j:1
        },

        {
            tipo:'admissao',
            j:1
        }

    ];


    posicoes.forEach(
        ({tipo,j}) => {

            const nome =
                tipo === 'exaustao'
                ? 'EXAUSTÃO'
                : 'ADMISSÃO';


            const id =
                tipo + i + '_' + j;


            const div =
                document.createElement(
                    'div'
                );

            div.className =
                'valvula-bloco';


            div.innerHTML = `

                <div class="valvula-titulo">

                    ${nome} ${j}

                </div>


                <div
                    class="photo-box"
                    id="photo${id}"
                >

                    Clique para adicionar foto

                    <div class="photo-label">

                        ${nome} ${j}

                    </div>


                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${id}')"
                    >

                </div>


                <div class="measurement">

                    <span class="measurement-label">

                        Medição em mm

                    </span>

                    <input
                        type="text"
                        id="${id}"
                        inputmode="decimal"
                        placeholder="00,00"
                    >

                </div>


                <button
                    class="remove-photo"
                    onclick="removePhoto('${id}')"
                >

                    REMOVER FOTO

                </button>

            `;


            layout.appendChild(
                div
            );

        }
    );


    section.appendChild(
        layout
    );


    const btn =
        document.createElement(
            'button'
        );

    btn.className =
        'btn-jpg';

    btn.textContent =
        `📷 GERAR JPG DO CILINDRO ${i}`;

    btn.onclick =
        () => gerarJpgCilindro(i);


    section.appendChild(
        btn
    );


    container.appendChild(
        section
    );

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function atualizarCilindro(){

    for(
        let i=1;
        i<=6;
        i++
    ){

        const el =
            document.getElementById(
                'cilindro-' + i
            );

        if(el){

            el.style.display =
                i === cilindroAtual
                ? 'block'
                : 'none';

        }

    }


    document.getElementById(
        'indicadorCilindro'
    ).textContent =
        `CILINDRO ${cilindroAtual} / 6`;


    document.getElementById(
        'btnAnterior'
    ).disabled =
        cilindroAtual === 1;


    document.getElementById(
        'btnProximo'
    ).disabled =
        cilindroAtual === 6;


    window.scrollTo({

        top:0,

        behavior:'smooth'

    });

}


function proximoCilindro(){

    if(
        cilindroAtual < 6
    ){

        cilindroAtual++;

        atualizarCilindro();

    }

}


function cilindroAnterior(){

    if(
        cilindroAtual > 1
    ){

        cilindroAtual--;

        atualizarCilindro();

    }

}


/* =========================================================
   FOTO
========================================================= */

function loadPhoto(
    event,
    id
){

    const file =
        event.target.files[0];

    if(!file)
        return;


    const box =
        document.getElementById(
            'photo' + id
        );


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            box.style.backgroundImage =
                `url("${e.target.result}")`;

            box.dataset.image =
                e.target.result;

            box.style.color =
                'transparent';

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   REMOVER FOTO
========================================================= */

function removePhoto(id){

    const box =
        document.getElementById(
            'photo' + id
        );


    box.style.backgroundImage =
        '';


    box.dataset.image =
        '';


    box.style.color =
        '#777';


    const nome =
        id.includes('exaustao')
        ? 'EXAUSTÃO'
        : 'ADMISSÃO';


    box.innerHTML = `

        Clique para adicionar foto

        <div class="photo-label">

            ${nome}

        </div>


        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}


/* =========================================================
   ARREDONDAMENTO
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    if(
        typeof radius === 'number'
    ){

        radius = {

            tl:radius,
            tr:radius,
            br:radius,
            bl:radius

        };

    }


    ctx.beginPath();


    ctx.moveTo(
        x + radius.tl,
        y
    );


    ctx.lineTo(
        x + width - radius.tr,
        y
    );


    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius.tr
    );


    ctx.lineTo(
        x + width,
        y + height - radius.br
    );


    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius.br,
        y + height
    );


    ctx.lineTo(
        x + radius.bl,
        y + height
    );


    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius.bl
    );


    ctx.lineTo(
        x,
        y + radius.tl
    );


    ctx.quadraticCurveTo(
        x,
        y,
        x + radius.tl,
        y
    );


    ctx.closePath();


    if(fill)
        ctx.fill();

    if(stroke)
        ctx.stroke();

}


/* =========================================================
   GERAR JPG
========================================================= */

async function gerarJpgCilindro(i){

    const largura = 1280;

    const altura = 1500;


    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        largura;

    canvas.height =
        altura;


    const ctx =
        canvas.getContext(
            '2d'
        );


    /* FUNDO */

    ctx.fillStyle =
        '#ffffff';

    ctx.fillRect(
        0,
        0,
        largura,
        altura
    );


    /* =====================================================
       TÍTULO DISCRETO CENTRALIZADO
    ===================================================== */

    ctx.textAlign =
        'center';

    ctx.textBaseline =
        'middle';


    ctx.font =
        'bold 42px Arial';


    const titulo =
        `CILINDRO ${i}`;


    const larguraTitulo =
        ctx.measureText(
            titulo
        ).width;


    const paddingX =
        22;


    const tituloX =
        (largura - (
            larguraTitulo +
            paddingX * 2
        )) / 2;


    const tituloY =
        18;


    ctx.fillStyle =
        '#f4f6f4';

    ctx.strokeStyle =
        '#d2d8d4';

    ctx.lineWidth =
        2;


    roundRect(

        ctx,

        tituloX,

        tituloY,

        larguraTitulo +
        paddingX * 2,

        58,

        12,

        true,

        true

    );


    ctx.fillStyle =
        '#174d00';


    ctx.fillText(

        titulo,

        largura / 2,

        tituloY + 29

    );


    /* =====================================================
       CONFIGURAÇÃO DAS FOTOS
    ===================================================== */

    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];


    const legendas = [

        'EXAUSTÃO 2',
        'ADMISSÃO 2',
        'EXAUSTÃO 1',
        'ADMISSÃO 1'

    ];


    const margem =
        20;

    const topo =
        95;

    const espaco =
        12;

    const larguraFoto =
        (
            largura -
            margem * 2 -
            espaco
        ) / 2;

    const alturaFoto =
        (
            altura -
            topo -
            margem -
            espaco
        ) / 2;


    const posicoes = [

        [
            margem,
            topo
        ],

        [
            margem +
            larguraFoto +
            espaco,
            topo
        ],

        [
            margem,
            topo +
            alturaFoto +
            espaco
        ],

        [
            margem +
            larguraFoto +
            espaco,

            topo +
            alturaFoto +
            espaco
        ]

    ];


    /* =====================================================
       FOTOS
    ===================================================== */

    for(
        let j=0;
        j<4;
        j++
    ){

        const box =
            document.getElementById(
                fotos[j]
            );


        const x =
            posicoes[j][0];

        const y =
            posicoes[j][1];


        /* FUNDO DA FOTO */

        ctx.fillStyle =
            '#f5f6f5';


        roundRect(

            ctx,

            x,

            y,

            larguraFoto,

            alturaFoto,

            12,

            true,
            false

        );


        if(
            box &&
            box.dataset.image
        ){

            const img =
                new Image();


            img.src =
                box.dataset.image;


            await new Promise(
                resolve => {

                    img.onload =
                        resolve;

                    img.onerror =
                        resolve;

                }
            );


            /* =================================================
               CORTAR FOTO SEM DISTORCER
            ================================================= */

            const ratio =
                Math.max(

                    larguraFoto /
                    img.width,

                    alturaFoto /
                    img.height

                );


            const novoW =
                img.width *
                ratio;

            const novoH =
                img.height *
                ratio;


            const dx =
                x +
                (
                    larguraFoto -
                    novoW
                ) / 2;


            const dy =
                y +
                (
                    alturaFoto -
                    novoH
                ) / 2;


            ctx.save();


            ctx.beginPath();


            roundRect(

                ctx,

                x,

                y,

                larguraFoto,

                alturaFoto,

                12,

                false,
                false

            );


            ctx.clip();


            ctx.drawImage(

                img,

                dx,
                dy,

                novoW,
                novoH

            );


            ctx.restore();

        }


        /* BORDA */

        ctx.strokeStyle =
            '#d0d6d2';

        ctx.lineWidth =
            2;


        roundRect(

            ctx,

            x,

            y,

            larguraFoto,

            alturaFoto,

            12,

            false,
            true

        );


        /* =================================================
           LEGENDA
        ================================================= */

        const legendaH =
            48;


        ctx.fillStyle =
            'rgba(23,77,0,.92)';


        roundRect(

            ctx,

            x,
            y +
            alturaFoto -
            legendaH,

            larguraFoto,

            legendaH,

            {
                tl:0,
                tr:0,
                br:12,
                bl:12
            },

            true,
            false

        );


        ctx.fillStyle =
            '#ffffff';


        ctx.font =
            'bold 25px Arial';


        ctx.textAlign =
            'center';

        ctx.textBaseline =
            'middle';


        ctx.fillText(

            legendas[j],

            x +
            larguraFoto / 2,

            y +
            alturaFoto -
            legendaH / 2

        );


        /* =================================================
           MEDIÇÃO
        ================================================= */

        const input =
            document.getElementById(
                fotos[j].replace(
                    'photo',
                    ''
                )
            );


        const valorTexto =
            input
            ? input.value
            : '';


        const valor =
            parseFloat(
                valorTexto
                .replace(',','.')
            );


        if(
            !isNaN(valor)
        ){

            const texto =
                valor
                .toFixed(2)
                .replace('.',',') +
                ' mm';


            const cor =
                valor >= LIMITE_MAXIMO
                ? '#d71920'
                : '#174d00';


            ctx.fillStyle =
                'rgba(255,255,255,.95)';


            const boxW =
                180;

            const boxH =
                55;


            const boxX =
                x +
                15;


            const boxY =
                y +
                15;


            ctx.strokeStyle =
                cor;

            ctx.lineWidth =
                3;


            roundRect(

                ctx,

                boxX,
                boxY,
                boxW,
                boxH,
                10,
                true,
                true

            );


            ctx.fillStyle =
                cor;


            ctx.font =
                'bold 25px Arial';


            ctx.fillText(

                texto,

                boxX +
                boxW / 2,

                boxY +
                boxH / 2

            );


            /* ALERTA */

            if(
                valor >= LIMITE_MAXIMO
            ){

                ctx.fillStyle =
                    'rgba(215,25,32,.94)';


                const alertaW =
                    230;

                const alertaH =
                    44;


                const alertaX =
                    x +
                    larguraFoto -
                    alertaW -
                    15;


                const alertaY =
                    y +
                    15;


                roundRect(

                    ctx,

                    alertaX,
                    alertaY,
                    alertaW,
                    alertaH,
                    9,
                    true,
                    false

                );


                ctx.fillStyle =
                    '#ffffff';


                ctx.font =
                    'bold 20px Arial';


                ctx.fillText(

                    'SUBSTITUIR',

                    alertaX +
                    alertaW / 2,

                    alertaY +
                    alertaH / 2

                );

            }

        }

    }


    /* =====================================================
       GERAR DOWNLOAD
    ===================================================== */

    canvas.toBlob(

        function(blob){

            if(!blob){

                alert(
                    'Não foi possível gerar o JPG.'
                );

                return;

            }


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    'a'
                );


            link.href =
                url;


            link.download =
                `CILINDRO_${i}.jpg`;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                3000
            );


            mostrarMensagemDownload(
                `CILINDRO_${i}.jpg`
            );

        },

        'image/jpeg',

        0.95

    );

}


/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagemDownload(
    nome
){

    const mensagem =
        document.getElementById(
            'downloadMensagem'
        );


    mensagem.innerHTML =
        `⬇️ ${nome}<br>Download iniciado`;


    mensagem.style.display =
        'block';


    setTimeout(
        () => {

            mensagem.style.display =
                'none';

        },
        3000
    );

}


/* =========================================================
   DESTAQUE DA MEDIÇÃO
========================================================= */

function atualizarDestaque(
    input
){

    const valor =
        parseFloat(
            input.value
            .replace(',','.')
        );


    if(
        !isNaN(valor) &&
        valor >= LIMITE_MAXIMO
    ){

        input.style.color =
            '#d71920';

        input.style.fontWeight =
            'bold';

        input.style.borderColor =
            '#d71920';

        input.style.background =
            '#fff2f2';

    }
    else{

        input.style.color =
            '#1d241f';

        input.style.fontWeight =
            'bold';

        input.style.borderColor =
            '#ff8c00';

        input.style.background =
            'white';

    }

}


/* =========================================================
   EVENTOS DAS MEDIÇÕES
========================================================= */

document
.querySelectorAll(
    '.measurement input'
)
.forEach(
    input => {

        input.addEventListener(
            'input',

                );

            }
        );

    }
);


/* =========================================================
   GERAR PDF
========================================================= */

document
.getElementById(
    'generatePdf'
)
.addEventListener(
    'click',
    async function(){

        try{

            const pdf =
                new jsPDF({

                    unit:'mm',

                    format:'a4'

                });


            const img =
                new Image();


            img.crossOrigin =
                'anonymous';


            img.src =
                'https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg';


            await new Promise(
                (resolve,reject) => {

                    img.onload =
                        resolve;

                    img.onerror =
                        reject;

                }
            );


            const canvas =
                document.createElement(
                    'canvas'
                );


            canvas.width =
                img.width;

            canvas.height =
                img.height;


            const ctx =
                canvas.getContext(
                    '2d'
                );


            ctx.drawImage(
                img,
                0,
                0
            );


            /* =================================================
               DADOS
            ================================================= */

            ctx.fillStyle =
                'black';

            ctx.font =
                'bold 18px Arial';


            ctx.fillText(
                document.getElementById(
                    'mecanico'
                ).value || '',
                208,
                176
            );


            ctx.fillText(
                document.getElementById(
                    'usina'
                ).value || '',
                165,
                204
            );


            ctx.fillText(
                document.getElementById(
                    'serie'
                ).value || '',
                165,
                231
            );


            ctx.fillText(
                'UGD- ' +
                (
                    document.getElementById(
                        'ugd'
                    ).value || ''
                ),
                590,
                262
            );


            ctx.fillText(
                document.getElementById(
                    'os'
                ).value || '',
                292,
                262
            );


            const dataVal =
                document.getElementById(
                    'data'
                ).value;


            if(dataVal){

                const partes =
                    dataVal.split('-');


                const dataBR =
                    `${partes[2]}/${partes[1]}/${partes[0]}`;


                ctx.fillText(
                    dataBR,
                    888,
                    204
                );

            }


            ctx.fillText(
                document.getElementById(
                    'horimetro'
                ).value || '',
                798,
                231
            );


            /* =================================================
               MEDIÇÕES
            ================================================= */

            const campos = [

                ['exaustao1_1',105,616],
                ['exaustao1_2',105,576],
                ['admissao1_1',345,628],
                ['admissao1_2',345,589],

                ['exaustao2_1',450,1064],
                ['exaustao2_2',450,1024],
                ['admissao2_1',689,1075],
                ['admissao2_2',689,1038],

                ['exaustao3_1',792,617],
                ['exaustao3_2',792,576],
                ['admissao3_1',1032,628],
                ['admissao3_2',1032,589],

                ['exaustao4_1',793,1064],
                ['exaustao4_2',793,1024],
                ['admissao4_1',1033,1075],
                ['admissao4_2',1033,1038],

                ['exaustao5_1',450,617],
                ['exaustao5_2',450,576],
                ['admissao5_1',689,628],
                ['admissao5_2',689,589],

                ['exaustao6_1',105,1064],
                ['exaustao6_2',105,1024],
                ['admissao6_1',345,1075],
                ['admissao6_2',345,1038]

            ];


            campos.forEach(
                ([id,x,y]) => {

                    const raw =
                        document.getElementById(
                            id
                        )?.value || '';


                    const valor =
                        parseFloat(
                            raw.replace(',','.')
                        );


                    const alerta =
                        !isNaN(valor) &&
                        valor >= LIMITE_MAXIMO;


                    ctx.fillStyle =
                        alerta
                        ? 'red'
                        : 'black';


                    ctx.font =
                        alerta
                        ? 'bold 18px Arial'
                        : '18px Arial';


                    ctx.fillText(
                        raw,
                        x,
                        y
                    );

                }
            );


            /* =================================================
               OBSERVAÇÕES
            ================================================= */

            const obs =
                document.getElementById(
                    'observacoes'
                ).value;


            ctx.fillStyle =
                'black';

            ctx.font =
                '18px Arial';


            const maxWidth =
                950;

            const lineHeight =
                26;

            const palavras =
                obs.split(/\s+/);


            let linha =
                '';

            let y =
                1237;


            palavras.forEach(
                palavra => {

                    const teste =
                        linha +
                        palavra +
                        ' ';


                    if(
                        ctx.measureText(
                            teste
                        ).width >
                        maxWidth
                    ){

                        ctx.fillText(
                            linha,
                            183,
                            y
                        );


                        linha =
                            palavra +
                            ' ';


                        y +=
                            lineHeight;

                    }
                    else{

                        linha =
                            teste;

                    }

                }
            );


            if(linha){

                ctx.fillText(
                    linha,
                    183,
                    y
                );

            }


            /* =================================================
               ASSINATURA
            ================================================= */

            ctx.font =
                '40px "Brush Script MT", cursive';


            ctx.fillStyle =
                '#257500';


            ctx.fillText(

                document.getElementById(
                    'assinatura'
                ).value || '',

                760,
                1538

            );


            const imgData =
                canvas.toDataURL(
                    'image/jpeg',
                    1.0
                );


            pdf.addImage(

                imgData,
                'JPEG',
                0,
                0,

                pdf.internal.pageSize.getWidth(),
                pdf.internal.pageSize.getHeight()

            );


            pdf.save(
                'MEDICAO_VALVULAS.pdf'
            );

        }
        catch(error){

            console.error(error);

            alert(
                'Não foi possível gerar o PDF. Verifique se a imagem do formulário está disponível.'
            );

        }

    }
);

)

atualizarCilindro();
