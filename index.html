<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Medição de Válvulas do Scania-550</title>

<script
src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>

<style>

body{

    font-family:Arial,sans-serif;

    margin:20px;

    line-height:1.6;

    background-color:#fff;

}

h1,h2,h3{

    margin-top:20px;

    margin-bottom:10px;

}

h1{

    font-size:24px;

    text-align:center;

    border-bottom:3px solid #257500;

    padding-bottom:10px;

    color:#fff;

    background-color:#257500;

    border-radius:8px;

}

.valve-container{

    width:100%;

    margin-bottom:20px;

}

/* =========================
   CILINDRO
========================= */

.valve-section{

    border:2px solid #257500;

    padding:15px;

    margin-bottom:20px;

    width:100%;

    box-sizing:border-box;

    background-color:#fff;

    border-radius:10px;

    box-shadow:0 4px 8px rgba(0,0,0,0.1);

}

/* =========================
   NAVEGAÇÃO
========================= */

.navegacao-cilindros{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:15px;

}

.btn-navegacao{

    background-color:#257500;

    color:white;

    border:none;

    padding:12px 18px;

    border-radius:7px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

    flex:1;

}

.btn-navegacao:disabled{

    background-color:#aaa;

    cursor:not-allowed;

}

.indicador-cilindro{

    background:#257500;

    color:white;

    padding:10px 18px;

    border-radius:8px;

    font-weight:bold;

    white-space:nowrap;

}

/* =========================
   TÍTULO DO CILINDRO
========================= */

.cilindro-label{

    text-align:center;

    font-weight:bold;

    color:white;

    background-color:#257500;

    border-radius:10px;

    padding:8px;

    margin-bottom:15px;

    font-size:20px;

}

/* =========================
   BLOCO 2 x 2
========================= */

.layout-cilindro{

    display:grid;

    grid-template-columns:1fr 1fr;

    grid-template-rows:1fr 1fr;

    gap:10px;

    width:100%;

}

/* =========================
   CADA VÁLVULA
========================= */

.valvula-bloco{

    border:1px solid #ddd;

    border-radius:8px;

    padding:8px;

    text-align:center;

    background:#fafafa;

    min-width:0;

}

.valvula-titulo{

    background:#257500;

    color:white;

    font-weight:bold;

    padding:7px;

    border-radius:7px;

    font-size:15px;

}

/* =========================
   MEDIÇÃO
========================= */

.measurement{

    text-align:center;

    margin:8px 0;

    font-size:18px;

    background-color:#FFFACD;

    border-radius:8px;

    padding:5px;

    font-weight:bold;

    color:black;

}

.measurement input{

    width:110px;

    max-width:90%;

    padding:8px;

    text-align:center;

    font-size:16px;

    border:2px solid #FF8C00;

    border-radius:4px;

    box-sizing:border-box;

}

/* =========================
   FOTO
========================= */

.photo-box{

    width:120px;

    height:120px;

    border:2px dashed #FF8C00;

    margin:10px auto;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    font-size:12px;

    color:#666;

    position:relative;

    background-size:cover;

    background-position:center;

    overflow:hidden;

    border-radius:10px;

}

.photo-box input[type="file"]{

    position:absolute;

    width:100%;

    height:100%;

    opacity:0;

    cursor:pointer;

}

.photo-label{

    position:absolute;

    bottom:0;

    width:100%;

    text-align:center;

    background-color:#257500;

    color:white;

    font-weight:bold;

    font-size:12px;

    padding:2px 0;

}

.remove-photo{

    display:inline-block;

    background:#FF4500;

    color:#fff;

    border:none;

    padding:5px 8px;

    font-size:10px;

    cursor:pointer;

    border-radius:4px;

}

/* =========================
   BOTÃO JPG
========================= */

.btn-jpg{

    display:block;

    margin:20px auto 5px;

    background:#257500;

    color:white;

    border:none;

    padding:12px 22px;

    font-size:16px;

    border-radius:7px;

    cursor:pointer;

    font-weight:bold;

}

.btn-jpg:hover{

    background:#FF4500;

}

/* =========================
   INFORMAÇÕES
========================= */

.info-table{

    width:100%;

    margin-bottom:20px;

}

.info-table td{

    padding:5px 0;

    text-align:left;

}

input[type="text"],
input[type="date"],
textarea{

    width:120px;

    padding:8px;

    text-align:center;

    font-size:16px;

    border:2px solid #FF8C00;

    border-radius:4px;

    box-sizing:border-box;

}

textarea{

    width:100%;

    height:100px;

    padding:10px;

    text-align:left;

    resize:vertical;

    border:2px solid #FF8C00;

    border-radius:6px;

}

.signature{

    margin-top:50px;

    border-top:2px solid #FF8C00;

    width:320px;

    padding-top:5px;

    text-align:center;

    font-weight:bold;

    font-size:16px;

    position:relative;

}

#assinatura{

    position:absolute;

    top:-36px;

    left:0;

    width:320px;

    border:none;

    font-size:28px;

    text-align:center;

    background:transparent;

    outline:none;

    font-family:'Brush Script MT',cursive,Arial,sans-serif;

    color:#257500;

}

#assinatura::placeholder{

    color:#999;

}

.warning{

    background-color:#257500;

    padding:10px;

    border-left:6px solid #257500;

    margin:15px 0;

    text-align:center;

    color:white;

    font-weight:bold;

    border-radius:6px;

}

.obs{

    margin-top:30px;

    font-style:italic;

    background-color:#FFFACD;

    padding:10px;

    border-radius:6px;

    border:1px solid #FF8C00;

}

.button-container{

    margin-top:20px;

    text-align:center;

}

button{

    background-color:#257500;

    color:white;

    border:none;

    padding:10px 20px;

    margin:0 10px;

    font-size:16px;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;

    transition:all 0.3s ease;

}

button:hover{

    background-color:#FF4500;

}

button.clear-btn{

    background-color:#FF4500;

}

/* =========================
   CELULAR
   CONTINUA 2 x 2
========================= */

@media(max-width:900px){

    body{

        margin:8px;

    }

    h1{

        font-size:19px;

    }

    .valve-section{

        width:100%;

        padding:8px;

    }

    .layout-cilindro{

        display:grid;

        grid-template-columns:1fr 1fr;

        grid-template-rows:1fr 1fr;

        gap:6px;

    }

    .valvula-bloco{

        padding:5px;

    }

    .valvula-titulo{

        font-size:12px;

        padding:6px 2px;

    }

    .photo-box{

        width:100px;

        height:100px;

    }

    .measurement{

        margin:5px 0;

        padding:3px;

    }

    .measurement input{

        width:85px;

        font-size:14px;

        padding:6px;

    }

    .remove-photo{

        font-size:9px;

        padding:4px;

    }

    .navegacao-cilindros{

        gap:5px;

    }

    .btn-navegacao{

        padding:10px 5px;

        font-size:12px;

        margin:0;

    }

    .indicador-cilindro{

        padding:8px 7px;

        font-size:12px;

    }

    .btn-jpg{

        width:90%;

        margin:15px auto 5px;

    }

}

/* CELULARES PEQUENOS */

@media(max-width:400px){

    .photo-box{

        width:85px;

        height:85px;

    }

    .measurement input{

        width:75px;

        font-size:13px;

    }

    .valvula-titulo{

        font-size:11px;

    }

    .btn-navegacao{

        font-size:11px;

    }

}

/* =========================
   DOWNLOAD
========================= */

.download-mensagem{

    position:fixed;

    left:50%;

    bottom:25px;

    transform:translateX(-50%);

    background:#257500;

    color:white;

    padding:15px 22px;

    border-radius:10px;

    font-weight:bold;

    z-index:99999;

    box-shadow:0 5px 20px rgba(0,0,0,.3);

    display:none;

    text-align:center;

}

</style>

</head>

PRÓXIMO CILINDRO →

<div class="valve-container">

<script>

const container =
document.currentScript.parentNode;

for(let i=1;i<=6;i++){

    const section =
    document.createElement('div');

    section.className =
    'valve-section';

    section.id =
    'cilindro-' + i;

    section.style.display =
    i === 1 ? 'block' : 'none';

    section.innerHTML = `

        <div class="cilindro-label">

            CILINDRO ${i}

        </div>

    `;

    const layoutDiv =
    document.createElement('div');

    layoutDiv.className =
    'layout-cilindro';

    const posicoes = [

        {
            tipo:'exaustao',
            j:2
        },

        {
            tipo:'admissao',
            j:2
        },

        {
            tipo:'exaustao',
            j:1
        },

        {
            tipo:'admissao',
            j:1
        }

    ];

    posicoes.forEach(
        ({tipo,j}) => {

            const tipoNome =
            tipo === 'exaustao'
            ? 'EXAUSTÃO'
            : 'ADMISSÃO';

            const idPhoto =
            tipo + i + '_' + j;

            const div =
            document.createElement('div');

            div.className =
            'valvula-bloco';

            div.innerHTML = `

                <div class="valvula-titulo">

                    ${tipoNome} ${j}

                </div>

                <div
                    class="photo-box"
                    id="photo${idPhoto}"
                >

                    Clique para adicionar foto

                    <div class="photo-label">

                        ${tipoNome} ${j}

                    </div>

                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${idPhoto}')"
                    >

                </div>

                <div class="measurement">

                    <input
                        type="text"
                        id="${tipo}${i}_${j}"
                        placeholder="Medição"
                    >

                </div>

                <button
                    class="remove-photo"
                    onclick="removePhoto('${idPhoto}')"
                >

                    REMOVER FOTO

                </button>

            `;

            layoutDiv.appendChild(div);

        }
    );

    section.appendChild(
        layoutDiv
    );

    const btnJpg =
    document.createElement('button');

    btnJpg.className =
    'btn-jpg';

    btnJpg.textContent =
    `📷 GERAR JPG CILINDRO ${i}`;

    btnJpg.onclick =
    () => gerarJpgCilindro(i);

    section.appendChild(
        btnJpg
    );

    container.appendChild(
        section
    );

}

</script>

⬇️ JPG preparado para download

<script>

const { jsPDF } =
window.jspdf;


/* =====================================================
   CILINDRO ATUAL
===================================================== */

let cilindroAtual = 1;


/* =====================================================
   NAVEGAR
===================================================== */

function atualizarCilindro(){

    for(let i=1;i<=6;i++){

        const cilindro =
        document.getElementById(
            'cilindro-' + i
        );

        if(cilindro){

            cilindro.style.display =
            i === cilindroAtual
            ? 'block'
            : 'none';

        }

    }

    document.getElementById(
        'indicadorCilindro'
    ).textContent =
        `CILINDRO ${cilindroAtual} / 6`;

    document.getElementById(
        'btnAnterior'
    ).disabled =
        cilindroAtual === 1;

    document.getElementById(
        'btnProximo'
    ).disabled =
        cilindroAtual === 6;

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });

}


function proximoCilindro(){

    if(cilindroAtual < 6){

        cilindroAtual++;

        atualizarCilindro();

    }

}


function cilindroAnterior(){

    if(cilindroAtual > 1){

        cilindroAtual--;

        atualizarCilindro();

    }

}


/* =====================================================
   FOTO
===================================================== */

function loadPhoto(
    event,
    id
){

    const box =
    document.getElementById(
        'photo' + id
    );

    const file =
    event.target.files[0];

    if(file){

        const reader =
        new FileReader();

        reader.onload =
        function(e){

            box.style.backgroundImage =
            `url("${e.target.result}")`;

            console.log(
                "IMAGEM CARREGADA"
            );

        };

        reader.readAsDataURL(
            file
        );

    }

}


/* =====================================================
   REMOVER FOTO
===================================================== */

function removePhoto(id){

    const box =
    document.getElementById(
        'photo' + id
    );

    box.style.backgroundImage =
    '';

    box.innerHTML = `

        Clique para adicionar foto

        <div class="photo-label">

            ${id.includes('exaustao')
            ? 'EXAUSTÃO'
            : 'ADMISSÃO'}

        </div>

        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}


/* =====================================================
   RETÂNGULO ARREDONDADO
===================================================== */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    if(
        typeof radius ===
        'undefined'
    ){

        radius = 5;

    }

    if(
        typeof radius ===
        'number'
    ){

        radius = {

            tl:radius,
            tr:radius,
            br:radius,
            bl:radius

        };

    }

    ctx.beginPath();

    ctx.moveTo(
        x + radius.tl,
        y
    );

    ctx.lineTo(
        x + width - radius.tr,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius.tr
    );

    ctx.lineTo(
        x + width,
        y + height - radius.br
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius.br,
        y + height
    );

    ctx.lineTo(
        x + radius.bl,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius.bl
    );

    ctx.lineTo(
        x,
        y + radius.tl
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius.tl,
        y
    );

    ctx.closePath();

    if(fill)
        ctx.fill();

    if(stroke)
        ctx.stroke();

}


/* =====================================================
   GERAR JPG DO CILINDRO
===================================================== */

async function gerarJpgCilindro(i){

    const imgSize =
    1280;

    const imgHeight =
    1900;

    const canvasCil =
    document.createElement(
        'canvas'
    );

    canvasCil.width =
    imgSize;

    canvasCil.height =
    imgHeight;

    const ctxCil =
    canvasCil.getContext(
        '2d'
    );

    ctxCil.fillStyle =
    "#fff";

    ctxCil.fillRect(
        0,
        0,
        imgSize,
        imgHeight
    );


    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];


    const legendas = [

        'EXAUSTÃO 2',
        'ADMISSÃO 2',
        'EXAUSTÃO 1',
        'ADMISSÃO 1'

    ];


    const pos = [

        [0,0],
        [imgSize/2,0],
        [0,imgHeight/2],
        [imgSize/2,imgHeight/2]

    ];


    for(
        let j=0;
        j<4;
        j++
    ){

        const box =
        document.getElementById(
            fotos[j]
        );


        if(
            !box ||
            !box.style.backgroundImage
        ){

            continue;

        }


        const valInputId =
        fotos[j].replace(
            'photo',
            ''
        );


        const inputValEl =
        document.getElementById(
            valInputId
        );


        const val =
        inputValEl
        ? parseFloat(
            inputValEl.value
            .replace(',','.')
        )
        : null;


        let imgUrl =
        box.style.backgroundImage
        .replace(
            /^url\(["']?/,
            ''
        )
        .replace(
            /["']?\)$/,
            ''
        );


        const imgEl =
        new Image();


        imgEl.src =
        imgUrl;


        await new Promise(
            resolve => {

                imgEl.onload =
                resolve;

            }
        );


        ctxCil.drawImage(

            imgEl,

            pos[j][0],
            pos[j][1],

            imgSize/2,
            imgHeight/2

        );


        const rectWidth =
        imgSize/2;

        const rectHeight =
        50;

        const rectX =
        pos[j][0];

        const rectY =
        pos[j][1] +
        imgHeight/2 -
        rectHeight;


        ctxCil.fillStyle =
        "white";

        ctxCil.strokeStyle =
        "black";

        ctxCil.lineWidth =
        2;


        roundRect(

            ctxCil,

            rectX,
            rectY,

            rectWidth,
            rectHeight,

            10,

            true,
            true

        );


        ctxCil.fillStyle =
        "black";

        ctxCil.font =
        "bold 30px Arial";

        ctxCil.textAlign =
        "center";

        ctxCil.textBaseline =
        "middle";


        ctxCil.fillText(

            legendas[j],

            rectX +
            rectWidth/2,

            rectY +
            rectHeight/2

        );


        if(
            val !== null &&
            val >= 67.50
        ){

            const desc =
            `AFUNDAMENTO (${val
                .toFixed(2)
                .replace('.',',')}mm)`;


            ctxCil.font =
            "bold 26px Arial";


            const metrics =
            ctxCil.measureText(
                desc
            );


            const padding =
            10;


            const txtWidth =
            metrics.width +
            padding * 2;


            const txtHeight =
            45;


            const txtX =
            pos[j][0] +
            (
                imgSize/2 -
                txtWidth
            ) / 2;


            const txtY =
            rectY -
            txtHeight -
            10;


            ctxCil.fillStyle =
            "#FFFFFF";


            ctxCil.strokeStyle =
            "black";


            roundRect(

                ctxCil,

                txtX,
                txtY,

                txtWidth,
                txtHeight,

                10,

                true,
                true

            );


            ctxCil.fillStyle =
            "red";


            ctxCil.fillText(

                desc,

                txtX +
                txtWidth/2,

                txtY +
                txtHeight/2

            );

        }

    }


    /* =================================================
       TÍTULO
    ================================================= */

    const numText =
    `CILINDRO ${i}`;


    ctxCil.font =
    "bold 50px Arial";


    ctxCil.textAlign =
    "center";

    ctxCil.textBaseline =
    "middle";


    const numWidth =
    ctxCil.measureText(
        numText
    ).width;


    const numPadding =
    20;


    const rectHeight =
    65;


    const rectX =
    (
        imgSize -
        numWidth
    ) / 2 -
    numPadding;


    const rectY =
    5;


    ctxCil.fillStyle =
    "white";

    ctxCil.strokeStyle =
    "black";

    ctxCil.lineWidth =
    2;


    roundRect(

        ctxCil,

        rectX,
        rectY,

        numWidth +
        numPadding * 2,

        rectHeight,

        15,

        true,
        true

    );


    ctxCil.fillStyle =
    "black";


    ctxCil.fillText(

        numText,

        imgSize/2,

        rectY +
        rectHeight/2

    );


    /* =================================================
       CRIAR BLOB
    ================================================= */

    canvasCil.toBlob(

        function(blob){

            if(!blob){

                alert(
                    "❌ Não foi possível gerar o JPG."
                );

                return;

            }


            const nomeArquivo =
            `CILINDRO${i}.jpg`;


            const url =
            URL.createObjectURL(
                blob
            );


            /* ==========================================
               DOWNLOAD
            ========================================== */

            const link =
            document.createElement(
                'a'
            );


            link.href =
            url;

            link.download =
            nomeArquivo;

            link.style.display =
            'none';


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            setTimeout(
                function(){

                    URL.revokeObjectURL(
                        url
                    );

                },
                3000
            );


            mostrarMensagemDownload(
                nomeArquivo
            );

        },

        'image/jpeg',

        0.95

    );

}


/* =====================================================
   MENSAGEM DE DOWNLOAD
===================================================== */

function mostrarMensagemDownload(
    nome
){

    const mensagem =
    document.getElementById(
        'downloadMensagem'
    );

    mensagem.innerHTML =
    `⬇️ ${nome}<br>Download iniciado`;


    mensagem.style.display =
    'block';


    setTimeout(
        function(){

            mensagem.style.display =
            'none';

        },
        3000
    );

}


/* =====================================================
   GERAR PDF
===================================================== */

document.getElementById(
    'generatePdf'
).addEventListener(
    'click',
    async function(){

        const pdf =
        new jsPDF({

            unit:'mm',
            format:'a4'

        });


        const img =
        new Image();


        img.crossOrigin =
        'anonymous';


        img.src =
        'https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg';


        await new Promise(
            resolve =>
            img.onload =
            resolve
        );


        const canvas =
        document.createElement(
            'canvas'
        );


        canvas.width =
        img.width;

        canvas.height =
        img.height;


        const ctx =
        canvas.getContext(
            '2d'
        );


        ctx.drawImage(
            img,
            0,
            0
        );


        /* DADOS */

        ctx.font =
        'bold 18px Arial';

        ctx.fillStyle =
        'black';


        ctx.fillText(

            document.getElementById(
                'mecanico'
            ).value || '',

            208,
            176

        );


        ctx.fillText(

            document.getElementById(
                'usina'
            ).value || '',

            165,
            204

        );


        ctx.fillText(

            document.getElementById(
                'serie'
            ).value || '',

            165,
            231

        );


        ctx.fillText(

            'UGD- ' +
            (
                document.getElementById(
                    'ugd'
                ).value || ''
            ),

            590,
            262

        );


        ctx.fillText(

            document.getElementById(
                'os'
            ).value || '',

            292,
            262

        );


        const dataVal =
        document.getElementById(
            'data'
        ).value;


        if(dataVal){

            ctx.fillText(

                new Date(
                    dataVal
                ).toLocaleDateString(
                    'pt-BR'
                ),

                888,
                204

            );

        }


        ctx.fillText(

            document.getElementById(
                'horimetro'
            ).value || '',

            798,
            231

        );


        /* MEDIÇÕES */

        const limiteMaximo =
        67.50;


        const campos = [

            ['exaustao1_1',105,616],
            ['exaustao1_2',105,576],
            ['admissao1_1',345,628],
            ['admissao1_2',345,589],

            ['exaustao2_1',450,1064],
            ['exaustao2_2',450,1024],
            ['admissao2_1',689,1075],
            ['admissao2_2',689,1038],

            ['exaustao3_1',792,617],
            ['exaustao3_2',792,576],
            ['admissao3_1',1032,628],
            ['admissao3_2',1032,589],

            ['exaustao4_1',793,1064],
            ['exaustao4_2',793,1024],
            ['admissao4_1',1033,1075],
            ['admissao4_2',1033,1038],

            ['exaustao5_1',450,617],
            ['exaustao5_2',450,576],
            ['admissao5_1',689,628],
            ['admissao5_2',689,589],

            ['exaustao6_1',105,1064],
            ['exaustao6_2',105,1024],
            ['admissao6_1',345,1075],
            ['admissao6_2',345,1038]

        ];


        campos.forEach(
            ([id,x,y]) => {

                const valRaw =
                document.getElementById(
                    id
                )?.value || '';


                const valNum =
                parseFloat(
                    valRaw.replace(
                        ',',
                        '.'
                    )
                );


                ctx.fillStyle =
                (
                    !isNaN(valNum) &&
                    valNum >= limiteMaximo
                )
                ? 'red'
                : 'black';


                ctx.font =
                (
                    !isNaN(valNum) &&
                    valNum >= limiteMaximo
                )
                ? 'bold 18px Arial'
                : '18px Arial';


                ctx.fillText(
                    valRaw,
                    x,
                    y
                );

            }
        );


        /* OBSERVAÇÕES */

        const obs =
        document.getElementById(
            'observacoes'
        ).value;


        const maxWidth =
        950;


        const lineHeight =
        26;


        const words =
        obs.split(' ');


        let line =
        '';


        let y =
        1237;


        words.forEach(
            word => {

                const testLine =
                line +
                word +
                ' ';


                const metrics =
                ctx.measureText(
                    testLine
                );


                if(
                    metrics.width >
                    maxWidth
                ){

                    ctx.fillText(
                        line,
                        183,
                        y
                    );


                    line =
                    word +
                    ' ';


                    y +=
                    lineHeight;

                }
                else{

                    line =
                    testLine;

                }

            }
        );


        ctx.fillText(
            line,
            183,
            y
        );


        /* ASSINATURA */

        ctx.font =
        '40px "Brush Script MT", cursive';


        ctx.fillText(

            document.getElementById(
                'assinatura'
            ).value || '',

            760,
            1538

        );


        const imgData =
        canvas.toDataURL(
            'image/jpeg',
            1.0
        );


        pdf.addImage(

            imgData,
            'JPEG',
            0,
            0,

            pdf.internal.pageSize.getWidth(),
            pdf.internal.pageSize.getHeight()

        );


        pdf.save(
            'MEDICAO_VALVULAS.pdf'
        );

    }
);

/* =====================================================
   DESTAQUE AUTOMÁTICO
===================================================== */

function atualizarDestaque(
    input
){

    const valor =
    parseFloat(
        input.value.replace(
            ',',
            '.'
        )
    );


    if(
        !isNaN(valor) &&
        valor >= 67.50
    ){

        input.style.color =
        "red";

        input.style.fontWeight =
        "bold";

    }
    else{

        input.style.color =
        "black";

        input.style.fontWeight =
        "normal";

    }

}


document
.querySelectorAll(
    '.measurement input'
)
.forEach(
    input => {

        input.addEventListener(
            'input',
            () =>
            atualizarDestaque(
                input
            )
        );

    }
);


/* INICIAR */

atualizarCilindro();
