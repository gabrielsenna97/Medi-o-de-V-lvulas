<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Medição de Válvulas - Scania 550</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================================================
   CONFIGURAÇÃO GERAL
========================================================= */

:root{

    --verde:#087a3b;
    --verde-escuro:#04552a;
    --verde-claro:#10a957;

    --laranja:#f28c00;
    --laranja-claro:#fff4df;

    --vermelho:#d71920;

    --fundo:#eef2ef;
    --branco:#ffffff;

    --texto:#1d2923;
    --cinza:#68736d;

    --sombra:
        0 10px 25px rgba(0,0,0,.10);

    --sombra-forte:
        0 15px 35px rgba(0,0,0,.16);

    --raio:16px;

}

*{

    box-sizing:border-box;

}

body{

    margin:0;

    padding:12px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:

        radial-gradient(
            circle at top,
            #ffffff 0%,
            #eef3ef 45%,
            #e4e9e5 100%
        );

    color:var(--texto);

    min-height:100vh;

}

/* =========================================================
   CONTAINER
========================================================= */

.app{

    width:100%;

    max-width:850px;

    margin:auto;

}

/* =========================================================
   CABEÇALHO
========================================================= */

.topo{

    background:
        linear-gradient(
            145deg,
            #0b8d47,
            #05632f
        );

    color:white;

    border-radius:20px;

    padding:18px 16px;

    box-shadow:

        0 8px 0 #03451f,

        0 15px 30px rgba(0,0,0,.18);

    margin-bottom:16px;

    position:relative;

    overflow:hidden;

}

.topo::before{

    content:"";

    position:absolute;

    width:180px;

    height:180px;

    right:-70px;

    top:-90px;

    background:rgba(255,255,255,.08);

    border-radius:50%;

}

.topo::after{

    content:"";

    position:absolute;

    width:120px;

    height:120px;

    left:-60px;

    bottom:-70px;

    background:rgba(255,255,255,.05);

    border-radius:50%;

}

.topo h1{

    margin:0;

    text-align:center;

    font-size:22px;

    letter-spacing:.3px;

    position:relative;

    z-index:2;

}

.topo p{

    margin:6px 0 0;

    text-align:center;

    font-size:12px;

    opacity:.85;

    position:relative;

    z-index:2;

}

/* =========================================================
   CARD DE INFORMAÇÕES
========================================================= */

.info-card{

    background:white;

    border-radius:18px;

    padding:14px;

    margin-bottom:15px;

    box-shadow:var(--sombra);

    border:1px solid #e1e6e2;

}

.info-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}

.campo{

    display:flex;

    flex-direction:column;

    gap:5px;

}

.campo label{

    font-size:11px;

    font-weight:bold;

    color:#526058;

    text-transform:uppercase;

}

.campo input{

    width:100%;

    height:44px;

    border:1.5px solid #d5ddd8;

    border-radius:10px;

    padding:8px 10px;

    font-size:15px;

    text-align:center;

    outline:none;

    background:#fafcfb;

    transition:.2s;

}

.campo input:focus{

    border-color:var(--verde);

    background:white;

    box-shadow:
        0 0 0 3px rgba(8,122,59,.10);

}

/* =========================================================
   LIMITE
========================================================= */

.limite{

    background:#f8faf9;

    border:1px solid #dce4df;

    border-radius:13px;

    padding:12px;

    margin-top:12px;

    text-align:center;

}

.limite-titulo{

    font-size:11px;

    font-weight:bold;

    color:#66716b;

    text-transform:uppercase;

    margin-bottom:5px;

}

.limite-valor{

    font-size:17px;

    font-weight:800;

    color:var(--verde);

}

.limite-alerta{

    margin-top:4px;

    font-size:11px;

    color:var(--vermelho);

    font-weight:bold;

}

/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navegacao{

    display:grid;

    grid-template-columns:1fr auto 1fr;

    gap:8px;

    align-items:center;

    margin-bottom:14px;

}

.btn-nav{

    height:44px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #0a9148,
            #05642f
        );

    color:white;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 4px 0 #034b24,
        0 7px 14px rgba(0,0,0,.12);

    transition:.15s;

}

.btn-nav:active{

    transform:translateY(3px);

    box-shadow:
        0 1px 0 #034b24,
        0 3px 7px rgba(0,0,0,.12);

}

.btn-nav:disabled{

    background:#b7bfba;

    box-shadow:none;

    cursor:not-allowed;

}

.indicador{

    min-width:105px;

    height:44px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:white;

    border:1px solid #dce3df;

    border-radius:12px;

    font-weight:bold;

    font-size:12px;

    box-shadow:0 4px 12px rgba(0,0,0,.08);

}

/* =========================================================
   CILINDRO
========================================================= */

.valve-section{

    background:white;

    border-radius:20px;

    padding:12px;

    margin-bottom:15px;

    border:1px solid #dde5df;

    box-shadow:var(--sombra-forte);

    overflow:hidden;

}

.cilindro-header{

    display:flex;

    align-items:center;

    justify-content:center;

    height:48px;

    margin-bottom:12px;

    border-radius:13px;

    color:white;

    font-size:18px;

    font-weight:800;

    letter-spacing:.5px;

    background:
        linear-gradient(
            145deg,
            #0a9148,
            #05632f
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.2),
        0 5px 0 #034b24,
        0 8px 16px rgba(0,0,0,.12);

}

/* =========================================================
   GRID DAS VÁLVULAS
========================================================= */

.layout-cilindro{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}

/* =========================================================
   CARD DA VÁLVULA
========================================================= */

.valvula-bloco{

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f3f6f4
        );

    border:1px solid #dfe6e1;

    border-radius:15px;

    padding:8px;

    box-shadow:

        0 5px 12px rgba(0,0,0,.08),

        inset 0 1px 0 white;

    transition:.2s;

}

.valvula-bloco:active{

    transform:scale(.985);

}

.valvula-titulo{

    background:
        linear-gradient(
            145deg,
            #0b8b45,
            #06632f
        );

    color:white;

    text-align:center;

    font-weight:bold;

    font-size:12px;

    padding:8px 4px;

    border-radius:9px;

    box-shadow:
        0 3px 0 #034b24;

}

/* =========================================================
   FOTO
========================================================= */

.photo-box{

    width:100%;

    aspect-ratio:1/1;

    min-height:100px;

    margin:9px auto;

    border:2px dashed #e1a14a;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    font-size:10px;

    color:#7b827e;

    position:relative;

    background-color:#fafbf9;

    background-size:cover;

    background-position:center;

    overflow:hidden;

    cursor:pointer;

}

.photo-box input[type="file"]{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    opacity:0;

    cursor:pointer;

}

.photo-label{

    position:absolute;

    left:0;

    bottom:0;

    width:100%;

    padding:5px 2px;

    background:rgba(4,75,36,.88);

    color:white;

    font-size:10px;

    font-weight:bold;

}

/* =========================================================
   MEDIÇÃO
========================================================= */

.measurement{

    background:
        linear-gradient(
            145deg,
            #fff9ec,
            #fff1d2
        );

    border:1px solid #f0d49f;

    border-radius:10px;

    padding:7px;

    margin-top:7px;

}

.measurement-label{

    font-size:9px;

    color:#79633e;

    font-weight:bold;

    text-transform:uppercase;

    text-align:center;

    margin-bottom:4px;

}

.measurement input{

    width:100%;

    height:42px;

    border:2px solid #ef9b25;

    border-radius:9px;

    background:white;

    font-size:17px;

    font-weight:bold;

    text-align:center;

    outline:none;

}

.measurement input:focus{

    box-shadow:
        0 0 0 3px rgba(242,140,0,.14);

}

.measurement input.afundamento{

    color:var(--vermelho);

    border-color:var(--vermelho);

    background:#fff4f4;

}

/* =========================================================
   STATUS DA MEDIÇÃO
========================================================= */

.status-medicao{

    text-align:center;

    font-size:9px;

    font-weight:bold;

    margin-top:4px;

    min-height:11px;

}

.status-normal{

    color:var(--verde);

}

.status-afundamento{

    color:var(--vermelho);

}

/* =========================================================
   REMOVER FOTO
========================================================= */

.remove-photo{

    width:100%;

    height:30px;

    border:0;

    border-radius:8px;

    background:#ecefed;

    color:#737b76;

    font-size:9px;

    font-weight:bold;

    cursor:pointer;

}

/* =========================================================
   BOTÃO JPG
========================================================= */

.btn-jpg{

    width:100%;

    height:44px;

    margin-top:12px;

    border:0;

    border-radius:11px;

    background:
        linear-gradient(
            145deg,
            #0b8c46,
            #05632f
        );

    color:white;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 4px 0 #034b24,
        0 7px 13px rgba(0,0,0,.10);

}

.btn-jpg:active{

    transform:translateY(3px);

    box-shadow:
        0 1px 0 #034b24;

}

/* =========================================================
   OBSERVAÇÕES
========================================================= */

.obs-card{

    background:white;

    border-radius:17px;

    padding:13px;

    margin-bottom:15px;

    box-shadow:var(--sombra);

}

.obs-title{

    font-size:12px;

    font-weight:bold;

    color:#56615b;

    margin-bottom:7px;

}

textarea{

    width:100%;

    min-height:100px;

    resize:vertical;

    border:1.5px solid #d7dfda;

    border-radius:11px;

    padding:10px;

    font-family:Arial,sans-serif;

    font-size:14px;

    outline:none;

}

textarea:focus{

    border-color:var(--verde);

    box-shadow:
        0 0 0 3px rgba(8,122,59,.08);

}

/* =========================================================
   ASSINATURA
========================================================= */

.assinatura-card{

    background:white;

    border-radius:17px;

    padding:14px;

    margin-bottom:15px;

    box-shadow:var(--sombra);

}

.assinatura-titulo{

    font-size:11px;

    font-weight:bold;

    color:#59645e;

    text-align:center;

    margin-bottom:10px;

}

#assinatura{

    width:100%;

    height:45px;

    border:0;

    border-bottom:2px solid #59645e;

    background:transparent;

    outline:none;

    text-align:center;

    font-size:25px;

    font-family:
        "Brush Script MT",
        cursive;

    color:var(--verde);

}

/* =========================================================
   BOTÕES FINAIS
========================================================= */

.acoes{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:20px;

}

.btn-final{

    height:50px;

    border:0;

    border-radius:13px;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    color:white;

    box-shadow:
        0 5px 0 rgba(0,0,0,.18),
        0 9px 18px rgba(0,0,0,.10);

}

.btn-pdf{

    background:
        linear-gradient(
            145deg,
            #0b9148,
            #05632f
        );

}

.btn-limpar{

    background:
        linear-gradient(
            145deg,
            #e34a4a,
            #b9161d
        );

}

.btn-final:active{

    transform:translateY(3px);

    box-shadow:
        0 2px 0 rgba(0,0,0,.18);

}

/* =========================================================
   MENSAGEM
========================================================= */

.download-mensagem{

    position:fixed;

    left:50%;

    bottom:18px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:
        linear-gradient(
            145deg,
            #0a8c46,
            #05632f
        );

    color:white;

    padding:12px 20px;

    border-radius:12px;

    font-size:12px;

    font-weight:bold;

    z-index:99999;

    box-shadow:0 8px 25px rgba(0,0,0,.25);

    display:none;

    text-align:center;

}

/* =========================================================
   CELULAR
========================================================= */

@media(max-width:600px){

    body{

        padding:8px;

    }

    .topo{

        padding:15px 12px;

        border-radius:17px;

    }

    .topo h1{

        font-size:18px;

    }

    .info-grid{

        gap:8px;

    }

    .campo input{

        height:42px;

        font-size:14px;

    }

    .layout-cilindro{

        gap:7px;

    }

    .valvula-bloco{

        padding:6px;

        border-radius:12px;

    }

    .photo-box{

        min-height:90px;

    }

    .cilindro-header{

        height:44px;

        font-size:16px;

    }

    .btn-nav{

        font-size:10px;

    }

}

@media(max-width:380px){

    .info-grid{

        grid-template-columns:1fr;

    }

    .layout-cilindro{

        gap:5px;

    }

    .valvula-titulo{

        font-size:10px;

    }

    .measurement input{

        height:38px;

        font-size:15px;

    }

    .btn-nav{

        padding:0 4px;

    }

}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:900px){

    body{

        padding:25px;

    }

    .valve-section{

        padding:18px;

    }

    .photo-box{

        min-height:180px;

    }

}

/* =========================================================
   IMPRESSÃO
========================================================= */

@media print{

    body{

        background:white;

    }

}

</style>

</head>

<body>

<div class="app">

<!-- ======================================================
     CABEÇALHO
====================================================== -->

<div class="topo">

    <h1>
        MEDIÇÃO DAS VÁLVULAS
    </h1>

    <p>
        SCANIA 550 • INSPEÇÃO TÉCNICA
    </p>

</div>


<!-- ======================================================
     INFORMAÇÕES
====================================================== -->

<div class="info-card">

    <div class="info-grid">

        <div class="campo">

            <label>Mecânico</label>

            <input
                type="text"
                id="mecanico"
            >

        </div>

        <div class="campo">

            <label>Data</label>

            <input
                type="date"
                id="data"
            >

        </div>

        <div class="campo">

            <label>Usina</label>

            <input
                type="text"
                id="usina"
            >

        </div>

        <div class="campo">

            <label>Horímetro</label>

            <input
                type="text"
                id="horimetro"
            >

        </div>

        <div class="campo">

            <label>Série</label>

            <input
                type="text"
                id="serie"
            >

        </div>

        <div class="campo">

            <label>OS</label>

            <input
                type="text"
                id="os"
            >

        </div>

        <div class="campo">

            <label>UGD</label>

            <input
                type="text"
                id="ugd"
                placeholder="Ex.: 01"
            >

        </div>

    </div>


    <div class="limite">

        <div class="limite-titulo">
            Faixa de medição
        </div>

        <div class="limite-valor">
            64,00 mm até 67,49 mm
        </div>

        <div class="limite-alerta">
            ≥ 67,50 mm = AFUNDAMENTO / SUBSTITUIÇÃO
        </div>

    </div>

</div>


<!-- ======================================================
     NAVEGAÇÃO
====================================================== -->

<div class="navegacao">

    <button
        class="btn-nav"
        id="btnAnterior"
        onclick="cilindroAnterior()"
    >
        ← ANTERIOR
    </button>

    <div
        class="indicador"
        id="indicadorCilindro"
    >
        CILINDRO 1 / 6
    </div>

    <button
        class="btn-nav"
        id="btnProximo"
        onclick="proximoCilindro()"
    >
        PRÓXIMO →
    </button>

</div>


<!-- ======================================================
     CILINDROS
====================================================== -->

<div
    class="valve-container"
    id="valveContainer"
></div>


<!-- ======================================================
     OBSERVAÇÕES
====================================================== -->

<div class="obs-card">

    <div class="obs-title">
        OBSERVAÇÕES
    </div>

    <textarea
        id="observacoes"
        placeholder="Digite as observações da inspeção..."
    ></textarea>

</div>


<!-- ======================================================
     ASSINATURA
====================================================== -->

<div class="assinatura-card">

    <div class="assinatura-titulo">
        ASSINATURA DO MECÂNICO
    </div>

    <input
        type="text"
        id="assinatura"
        placeholder="Digite seu nome"
    >

</div>


<!-- ======================================================
     AÇÕES
====================================================== -->

<div class="acoes">

    <button
        class="btn-final btn-pdf"
        id="generatePdf"
    >
        GERAR PDF
    </button>

    <button
        class="btn-final btn-limpar"
        id="clearBtn"
    >
        LIMPAR
    </button>

</div>


<div
    class="download-mensagem"
    id="downloadMensagem"
></div>

</div>


<script>

/* =========================================================
   PDF
========================================================= */

const { jsPDF } = window.jspdf;


/* =========================================================
   CILINDRO ATUAL
========================================================= */

let cilindroAtual = 1;


/* =========================================================
   CRIAR CILINDROS
========================================================= */

const container =
document.getElementById(
    "valveContainer"
);


for(let i=1;i<=6;i++){

    const section =
    document.createElement(
        "div"
    );

    section.className =
    "valve-section";

    section.id =
    "cilindro-" + i;

    section.style.display =
    i === 1
    ? "block"
    : "none";


    section.innerHTML = `

        <div class="cilindro-header">

            CILINDRO ${i}

        </div>

    `;


    const layout =
    document.createElement(
        "div"
    );

    layout.className =
    "layout-cilindro";


    const posicoes = [

        {
            tipo:"exaustao",
            j:2
        },

        {
            tipo:"admissao",
            j:2
        },

        {
            tipo:"exaustao",
            j:1
        },

        {
            tipo:"admissao",
            j:1
        }

    ];


    posicoes.forEach(
        ({tipo,j}) => {

            const nome =
            tipo === "exaustao"
            ? "EXAUSTÃO"
            : "ADMISSÃO";


            const id =
            tipo + i + "_" + j;


            const photoId =
            "photo" + id;


            const bloco =
            document.createElement(
                "div"
            );

            bloco.className =
            "valvula-bloco";


            bloco.innerHTML = `

                <div class="valvula-titulo">

                    ${nome} ${j}

                </div>


                <div
                    class="photo-box"
                    id="${photoId}"
                >

                    Toque para adicionar foto

                    <div class="photo-label">

                        ${nome} ${j}

                    </div>

                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${id}')"
                    >

                </div>


                <div class="measurement">

                    <div class="measurement-label">

                        Medição (mm)

                    </div>

                    <input
                        type="text"
                        id="${id}"
                        inputmode="decimal"
                        placeholder="00,00"
                    >

                    <div
                        class="status-medicao"
                        id="status-${id}"
                    ></div>

                </div>


                <button
                    class="remove-photo"
                    onclick="removePhoto('${id}')"
                >
                    REMOVER FOTO
                </button>

            `;


            layout.appendChild(
                bloco
            );

        }
    );


    section.appendChild(
        layout
    );


    const btnJpg =
    document.createElement(
        "button"
    );


    btnJpg.className =
    "btn-jpg";


    btnJpg.textContent =
    "GERAR JPG DO CILINDRO " + i;


    btnJpg.onclick =
    () => gerarJpgCilindro(i);


    section.appendChild(
        btnJpg
    );


    container.appendChild(
        section
    );

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function atualizarCilindro(){

    for(let i=1;i<=6;i++){

        const elemento =
        document.getElementById(
            "cilindro-" + i
        );

        if(elemento){

            elemento.style.display =
            i === cilindroAtual
            ? "block"
            : "none";

        }

    }


    document.getElementById(
        "indicadorCilindro"
    ).textContent =
    `CILINDRO ${cilindroAtual} / 6`;


    document.getElementById(
        "btnAnterior"
    ).disabled =
    cilindroAtual === 1;


    document.getElementById(
        "btnProximo"
    ).disabled =
    cilindroAtual === 6;


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


function proximoCilindro(){

    if(cilindroAtual < 6){

        cilindroAtual++;

        atualizarCilindro();

    }

}


function cilindroAnterior(){

    if(cilindroAtual > 1){

        cilindroAtual--;

        atualizarCilindro();

    }

}

function loadPhoto(event,id){

    const box =
    document.getElementById(
        "photo" + id
    );


    const file =
    event.target.files[0];


    if(!file)
        return;


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        box.style.backgroundImage =
        `url("${e.target.result}")`;

        box.style.borderStyle =
        "solid";

        box.style.borderColor =
        "#087a3b";

    };


    reader.readAsDataURL(file);

}

/* =========================================================
   RETÂNGULO
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();

    if(fill)
        ctx.fill();

    if(stroke)
        ctx.stroke();

}


/* =========================================================
   CARREGAR IMAGEM COM SEGURANÇA
========================================================= */

function carregarImagem(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
            new Image();

            img.onload =
            () => resolve(img);

            img.onerror =
            () => reject();

            img.src = url;

        }
    );

}


/* =========================================================
   GERAR JPG
========================================================= */

async function gerarJpgCilindro(i){

    const largura =
    1280;

    const altura =
    1900;


    const canvas =
    document.createElement(
        "canvas"
    );


    canvas.width =
    largura;

    canvas.height =
    altura;


    const ctx =
    canvas.getContext(
        "2d"
    );


    /* FUNDO */

    ctx.fillStyle =
    "#ffffff";

    ctx.fillRect(
        0,
        0,
        largura,
        altura
    );


    /* POSIÇÃO DAS 4 FOTOS */

    const fotos = [

        {
            id:`photoexaustao${i}_2`,
            med:`exaustao${i}_2`,
            nome:"EXAUSTÃO 2",
            x:0,
            y:0
        },

        {
            id:`photoadmissao${i}_2`,
            med:`admissao${i}_2`,
            nome:"ADMISSÃO 2",
            x:largura/2,
            y:0
        },

        {
            id:`photoexaustao${i}_1`,
            med:`exaustao${i}_1`,
            nome:"EXAUSTÃO 1",
            x:0,
            y:altura/2
        },

        {
            id:`photoadmissao${i}_1`,
            med:`admissao${i}_1`,
            nome:"ADMISSÃO 1",
            x:largura/2,
            y:altura/2
        }

    ];


    const larguraFoto =
    largura/2;

    const alturaFoto =
    altura/2;


    for(
        const item of fotos
    ){

        const box =
        document.getElementById(
            item.id
        );


        if(
            !box ||
            !box.style.backgroundImage
        ){

            continue;

        }


        let url =
        box.style.backgroundImage;


        url =
        url
        .replace(/^url\(["']?/,"")
        .replace(/["']?\)$/,"");


        try{

            const img =
            await carregarImagem(
                url
            );


            /* FOTO */

            ctx.drawImage(

                img,

                item.x,
                item.y,

                larguraFoto,
                alturaFoto

            );


            /* IDENTIFICAÇÃO DISCRETA */

            ctx.fillStyle =
            "rgba(0,0,0,.65)";


            ctx.fillRect(

                item.x,
                item.y +
                alturaFoto -
                48,

                larguraFoto,
                48

            );


            ctx.fillStyle =
            "#ffffff";


            ctx.font =
            "bold 28px Arial";


            ctx.textAlign =
            "center";


            ctx.textBaseline =
            "middle";


            ctx.fillText(

                item.nome,

                item.x +
                larguraFoto/2,

                item.y +
                alturaFoto -
                24

            );


            /* ==========================================
               SOMENTE SE HOUVER AFUNDAMENTO
            ========================================== */

            const input =
            document.getElementById(
                item.med
            );


            if(input){

                const valor =
                parseFloat(
                    input.value
                    .replace(",",".")
                );


                if(
                    !isNaN(valor) &&
                    valor >= 67.50
                ){

                    const texto =
                    `AFUNDAMENTO - ${
                        valor
                        .toFixed(2)
                        .replace(".",",")
                    } mm`;


                    ctx.font =
                    "bold 28px Arial";


                    const medida =
                    ctx.measureText(
                        texto
                    ).width;


                    const padding =
                    18;


                    const boxW =
                    medida +
                    padding * 2;


                    const boxH =
                    50;


                    const boxX =
                    item.x +
                    (larguraFoto-boxW)/2;


                    const boxY =
                    item.y +
                    alturaFoto -
                    105;


                    ctx.fillStyle =
                    "rgba(255,255,255,.96)";


                    ctx.strokeStyle =
                    "#d71920";


                    ctx.lineWidth =
                    3;


                    roundRect(

                        ctx,

                        boxX,
                        boxY,

                        boxW,
                        boxH,

                        10,

                        true,
                        true

                    );


                    ctx.fillStyle =
                    "#d71920";


                    ctx.fillText(

                        texto,

                        item.x +
                        larguraFoto/2,

                        boxY +
                        boxH/2

                    );

                }

            }

        }
        catch(e){

            console.log(
                "Erro ao carregar imagem:",
                item.id
            );

        }

    }


    /* =====================================================
       GERAR DOWNLOAD
    ===================================================== */

    canvas.toBlob(

        function(blob){

            if(!blob){

                alert(
                    "Não foi possível gerar o JPG."
                );

                return;

            }


            const url =
            URL.createObjectURL(
                blob
            );


            const link =
            document.createElement(
                "a"
            );


            link.href =
            url;


            link.download =
            `CILINDRO_${i}.jpg`;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            setTimeout(

                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },

                3000

            );


            mostrarMensagemDownload(
                `CILINDRO ${i}.jpg`
            );

        },

        "image/jpeg",

        .95

    );

}

                208,

            );

            );


            ctx.fillText(

                document.getElementById(

                ).value || "",

                165,

            );


            ctx.fillText(

                "UGD- " +
                (
                    document.getElementById(

                ),

                590,
                262

            );


            ctx.fillText(

            );


            const dataVal =

                ctx.fillText(

                    204

                );

            }


            ctx.fillText(

                document.getElementById(
                    "horimetro"
                ).value || "",

                798,
                231

            );


            /* ==========================================
               MEDIÇÕES
            ========================================== */

            const limite =
            67.50;


            const campos = [

                ["exaustao1_1",105,616],
                ["exaustao1_2",105,576],
                ["admissao1_1",345,628],
                ["admissao1_2",345,589],

                ["exaustao2_1",450,1064],
                ["exaustao2_2",450,1024],
                ["admissao2_1",689,1075],
                ["admissao2_2",689,1038],

                ["exaustao3_1",792,617],
                ["exaustao3_2",792,576],
                ["admissao3_1",1032,628],
                ["admissao3_2",1032,589],

                ["exaustao4_1",793,1064],
                ["exaustao4_2",793,1024],
                ["admissao4_1",1033,1075],
                ["admissao4_2",1033,1038],

                ["exaustao5_1",450,617],
                ["exaustao5_2",450,576],
                ["admissao5_1",689,628],
                ["admissao5_2",689,589],

                ["exaustao6_1",105,1064],
                ["exaustao6_2",105,1024],
                ["admissao6_1",345,1075],
                ["admissao6_2",345,1038]

            ];


            campos.forEach(

                ([id,x,y])=>{

                    const raw =
                    document.getElementById(
                        id
                    )?.value || "";


                    const valor =
                    parseFloat(
                        raw.replace(
                            ",",
                            "."
                        )
                    );


                    const alerta =
                    !isNaN(valor) &&
                    valor >= limite;


                    ctx.fillStyle =
                    alerta
                    ? "red"
                    : "black";


                    ctx.font =
                    alerta
                    ? "bold 18px Arial"
                    : "18px Arial";


                    ctx.fillText(
                        raw,
                        x,
                        y
                    );

                }

            );


            /* ==========================================
               OBSERVAÇÕES
            ========================================== */

            const obs =
            document.getElementById(
                "observacoes"
            ).value;


            const maxWidth =
            950;


            const lineHeight =
            26;


            const words =
            obs.split(/\s+/);


            let line =
            "";


            let y =
            1237;


            words.forEach(

                word=>{

                    const teste =
                    line +
                    word +
                    " ";


                    if(
                        ctx.measureText(
                            teste
                        ).width >
                        maxWidth
                    ){

                        ctx.fillText(
                            line,
                            183,
                            y
                        );


                        line =
                        word +
                        " ";


                        y +=
                        lineHeight;

                    }
                    else{

                        line =
                        teste;

                    }

                }

            );


            ctx.fillText(
                line,
                183,
                y
            );


            /* ==========================================
               ASSINATURA

            );


            pdf.addImage(

                imgData,
                "JPEG",
                0,
                0,

                pdf.internal.pageSize.getWidth(),

                pdf.internal.pageSize.getHeight()

            );


            pdf.save(
                "MEDICAO_VALVULAS.pdf"
            );

        }
        catch(error){

            console.error(error);

            alert(
                "Não foi possível gerar o PDF. Verifique sua conexão com a internet."
            );

        }

    }

);
