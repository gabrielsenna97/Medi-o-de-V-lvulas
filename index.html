<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Medição de Válvulas - Scania 550</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
}

:root{
    --verde:#08783b;
    --verde-escuro:#045b2c;
    --verde-claro:#0ca957;
    --laranja:#f28c00;
    --vermelho:#d71920;
    --cinza:#f2f4f5;
    --cinza2:#dfe4e7;
    --texto:#17211b;
    --branco:#fff;
}

body{
    margin:0;
    padding:12px;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#eef7f1 0%,#dfe9e3 45%,#d4ded8 100%);
    color:var(--texto);
}

/* =========================================================
   CONTAINER PRINCIPAL
========================================================= */

.app{
    width:100%;
    max-width:900px;
    margin:auto;
}

/* =========================================================
   CABEÇALHO 3D
========================================================= */

.header{
    background:
        linear-gradient(
            145deg,
            #0b9b4b,
            #08783b 55%,
            #045b2c
        );

    color:white;
    border-radius:18px;
    padding:18px 16px;
    text-align:center;

    box-shadow:
        0 8px 0 #034b25,
        0 15px 30px rgba(0,0,0,.20);

    margin-bottom:16px;
}

.header h1{
    margin:0;
    font-size:21px;
    letter-spacing:.4px;
}

.header p{
    margin:5px 0 0;
    font-size:12px;
    opacity:.9;
}

/* =========================================================
   CARTÃO DE DADOS
========================================================= */

.card{
    background:rgba(255,255,255,.96);
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;

    box-shadow:
        0 5px 0 rgba(0,0,0,.08),
        0 10px 25px rgba(0,0,0,.12);
}

.card-title{
    font-size:14px;
    font-weight:bold;
    color:var(--verde);
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:7px;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.field label{
    font-size:11px;
    font-weight:bold;
    color:#66706a;
}

.field input{
    width:100%;
    height:42px;
    border:2px solid #d9dfdc;
    border-radius:10px;
    padding:8px 10px;
    font-size:15px;
    outline:none;
    background:#f9fbfa;
    transition:.2s;
}

.field input:focus{
    border-color:var(--verde);
    background:white;
    box-shadow:0 0 0 3px rgba(8,120,59,.10);
}

/* =========================================================
   AVISO
========================================================= */

.limite{
    background:linear-gradient(135deg,#fffdf1,#fff7d5);
    border:1px solid #f0d47a;
    border-left:5px solid var(--laranja);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:15px;
    text-align:center;
}

.limite strong{
    font-size:13px;
}

.limite span{
    color:var(--vermelho);
    font-weight:bold;
}

/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navegacao{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
}

.btn-nav{
    border:none;
    min-height:45px;
    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            var(--verde-claro),
            var(--verde)
        );

    color:white;
    font-weight:bold;
    font-size:12px;
    cursor:pointer;

    box-shadow:
        0 4px 0 var(--verde-escuro),
        0 7px 12px rgba(0,0,0,.15);

    transition:.15s;
}

.btn-nav:active{
    transform:translateY(3px);
    box-shadow:
        0 1px 0 var(--verde-escuro),
        0 3px 7px rgba(0,0,0,.15);
}

.btn-nav:disabled{
    background:#aeb6b1;
    box-shadow:0 3px 0 #858d89;
    cursor:not-allowed;
}

.indicador{
    background:#ffffff;
    border:2px solid var(--verde);
    color:var(--verde);
    min-width:85px;
    text-align:center;
    padding:11px 8px;
    border-radius:12px;
    font-size:12px;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,.10);
}

/* =========================================================
   CILINDRO
========================================================= */

.valve-section{
    background:#fff;
    border-radius:18px;
    padding:12px;
    box-shadow:
        0 5px 0 rgba(0,0,0,.08),
        0 10px 25px rgba(0,0,0,.13);
}

.cilindro-label{
    text-align:center;
    color:white;

    background:
        linear-gradient(
            145deg,
            #0a9849,
            #08783b
        );

    border-radius:12px;
    padding:10px;
    margin-bottom:12px;

    font-size:17px;
    font-weight:bold;

    box-shadow:
        0 4px 0 #045b2c;
}

/* =========================================================
   GRID DAS VÁLVULAS
========================================================= */

.layout-cilindro{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

/* =========================================================
   BLOCO DE CADA VÁLVULA
========================================================= */

.valvula-bloco{
    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f1f4f2
        );

    border:1px solid #d9dfdc;
    border-radius:13px;
    padding:7px;

    box-shadow:
        0 3px 7px rgba(0,0,0,.10);

    text-align:center;
}

.valvula-titulo{
    background:#08783b;
    color:white;
    border-radius:8px;
    padding:7px 3px;
    font-size:11px;
    font-weight:bold;

    box-shadow:
        0 3px 0 #045b2c;
}

/* =========================================================
   FOTO
========================================================= */

.photo-box{
    width:100%;
    aspect-ratio:1 / 1;

    max-width:145px;
    margin:9px auto;

    border:2px dashed #f0a03a;
    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    font-size:10px;
    color:#737b76;

    position:relative;

    background-color:#fafafa;
    background-size:cover;
    background-position:center;

    overflow:hidden;
}

.photo-box input[type=file]{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
}

.photo-label{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;

    padding:4px 2px;

    background:rgba(8,120,59,.92);
    color:white;

    font-size:9px;
    font-weight:bold;
}

/* =========================================================
   MEDIÇÃO
========================================================= */

.measurement{
    margin:5px 0;
}

.measurement input{
    width:100%;
    height:40px;

    border:2px solid #f0a03a;
    border-radius:9px;

    background:#fffdf1;

    text-align:center;
    font-size:16px;
    font-weight:bold;

    outline:none;
}

.measurement input:focus{
    border-color:var(--verde);
    box-shadow:0 0 0 3px rgba(8,120,59,.10);
}

.measurement input.afundamento{
    color:var(--vermelho);
    border-color:var(--vermelho);
    background:#fff1f1;
}

/* =========================================================
   REMOVER FOTO
========================================================= */

.remove-photo{
    border:none;
    background:#e85a45;
    color:white;

    padding:6px 7px;

    border-radius:7px;

    font-size:9px;
    font-weight:bold;

    cursor:pointer;
}

/* =========================================================
   BOTÃO JPG
========================================================= */

.btn-jpg{
    width:100%;
    margin-top:13px;

    border:none;
    border-radius:11px;

    padding:12px;

    background:
        linear-gradient(
            145deg,
            #148f4d,
            #08783b
        );

    color:white;
    font-weight:bold;
    font-size:13px;

    box-shadow:
        0 4px 0 #045b2c,
        0 6px 12px rgba(0,0,0,.15);

    cursor:pointer;
}

.btn-jpg:active{
    transform:translateY(3px);
    box-shadow:
        0 1px 0 #045b2c;
}

/* =========================================================
   OBSERVAÇÕES
========================================================= */

textarea{
    width:100%;
    min-height:100px;

    resize:vertical;

    border:2px solid #d9dfdc;
    border-radius:11px;

    padding:10px;

    font-family:Arial;
    font-size:14px;

    outline:none;
}

textarea:focus{
    border-color:var(--verde);
}

/* =========================================================
   BOTÕES FINAIS
========================================================= */

.button-container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:15px 0;
}

.btn-final{
    border:none;
    min-height:48px;
    border-radius:12px;

    color:white;
    font-weight:bold;
    font-size:13px;

    cursor:pointer;

    box-shadow:
        0 4px 0 #045b2c,
        0 7px 12px rgba(0,0,0,.15);
}

.btn-pdf{
    background:
        linear-gradient(
            145deg,
            #0b984b,
            #08783b
        );
}

.btn-limpar{
    background:
        linear-gradient(
            145deg,
            #f05c45,
            #d83c2a
        );

    box-shadow:
        0 4px 0 #a6291d,
        0 7px 12px rgba(0,0,0,.15);
}

/* =========================================================
   ASSINATURA
========================================================= */

.signature{
    background:white;
    border-radius:15px;
    padding:14px;
    margin-bottom:20px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.10);
}

.signature-title{
    font-size:11px;
    color:#68736d;
    font-weight:bold;
    margin-bottom:7px;
}

#assinatura{
    width:100%;
    border:none;
    border-bottom:2px solid #555;

    height:45px;

    font-family:
        "Brush Script MT",
        cursive;

    font-size:25px;
    text-align:center;

    outline:none;
}

/* =========================================================
   MENSAGEM
========================================================= */

.download-mensagem{
    position:fixed;
    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    background:#08783b;
    color:white;

    padding:12px 18px;

    border-radius:12px;

    font-size:13px;
    font-weight:bold;

    z-index:99999;

    box-shadow:0 8px 25px rgba(0,0,0,.25);

    display:none;

    text-align:center;
}

/* =========================================================
   CELULAR
========================================================= */

@media(max-width:600px){

    body{
        padding:7px;
    }

    .header{
        padding:15px 10px;
        border-radius:15px;
    }

    .header h1{
        font-size:18px;
    }

    .info-grid{
        gap:7px;
    }

    .field input{
        height:40px;
        font-size:14px;
    }

    .valve-section{
        padding:9px;
    }

    .valvula-bloco{
        padding:5px;
    }

    .photo-box{
        max-width:120px;
    }

    .remove-photo{
        font-size:8px;
        padding:5px;
    }

    .btn-nav{
        font-size:10px;
        padding:5px;
    }

    .indicador{
        min-width:70px;
        font-size:10px;
    }

}

/* =========================================================
   CELULAR PEQUENO
========================================================= */

@media(max-width:380px){

    .header h1{
        font-size:16px;
    }

    .field input{
        font-size:13px;
    }

    .valvula-titulo{
        font-size:10px;
    }

    .photo-box{
        max-width:100px;
    }

    .measurement input{
        height:37px;
        font-size:14px;
    }

}

</style>

</head>

<body>

<div class="app">

<!-- =====================================================
     CABEÇALHO
===================================================== -->

<div class="header">

    <h1>
        MEDIÇÃO DAS VÁLVULAS
    </h1>

    <p>
        SCANIA 550 • INSPEÇÃO DE VÁLVULAS
    </p>

</div>


<!-- =====================================================
     DADOS
===================================================== -->

<div class="card">

    <div class="card-title">
        📋 DADOS DA INSPEÇÃO
    </div>

    <div class="info-grid">

        <div class="field">
            <label>MECÂNICO</label>
            <input type="text" id="mecanico">
        </div>

        <div class="field">
            <label>DATA</label>
            <input type="date" id="data">
        </div>

        <div class="field">
            <label>USINA</label>
            <input type="text" id="usina">
        </div>

        <div class="field">
            <label>HORÍMETRO</label>
            <input type="text" id="horimetro">
        </div>

        <div class="field">
            <label>SÉRIE</label>
            <input type="text" id="serie">
        </div>

        <div class="field">
            <label>OS</label>
            <input type="text" id="os">
        </div>

        <div class="field">
            <label>UGD</label>
            <input type="text" id="ugd" placeholder="Ex.: 01">
        </div>

    </div>

</div>


<!-- =====================================================
     LIMITE
===================================================== -->

<div class="limite">

    <strong>
        LIMITE DE MEDIÇÃO:
    </strong>

    64,00 mm a

    <span>
        67,50 mm
    </span>

    <br>

    <strong>
        ≥ 67,50 mm = SUBSTITUIÇÃO
    </strong>

</div>


<!-- =====================================================
     NAVEGAÇÃO
===================================================== -->

<div class="navegacao">

    <button
        class="btn-nav"
        id="btnAnterior"
        onclick="cilindroAnterior()"
    >
        ← ANTERIOR
    </button>

    <div
        class="indicador"
        id="indicadorCilindro"
    >
        1 / 6
    </div>

    <button
        class="btn-nav"
        id="btnProximo"
        onclick="proximoCilindro()"
    >
        PRÓXIMO →
    </button>

</div>


<!-- =====================================================
     CILINDROS
===================================================== -->

<div id="valveContainer"></div>


<!-- =====================================================
     OBSERVAÇÕES
===================================================== -->

<div class="card">

    <div class="card-title">
        📝 OBSERVAÇÕES
    </div>

    <textarea
        id="observacoes"
        placeholder="Digite as observações da inspeção..."
    ></textarea>

</div>


<!-- =====================================================
     BOTÕES
===================================================== -->

<div class="button-container">

    <button
        class="btn-final btn-pdf"
        id="generatePdf"
    >
        📄 GERAR PDF
    </button>

    <button
        class="btn-final btn-limpar"
        id="clearBtn"
    >
        🗑 LIMPAR
    </button>

</div>


<!-- =====================================================
     ASSINATURA
===================================================== -->

<div class="signature">

    <div class="signature-title">
        ASSINATURA DO MECÂNICO
    </div>

    <input
        type="text"
        id="assinatura"
        placeholder="Digite seu nome"
    >

</div>

</div>


<div
    class="download-mensagem"
    id="downloadMensagem"
></div>


<script>

const { jsPDF } = window.jspdf;


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const LIMITE_AFUNDAMENTO = 67.50;

let cilindroAtual = 1;


/* =========================================================
   CRIAR CILINDROS
========================================================= */

const container =
    document.getElementById(
        "valveContainer"
    );


for(let i = 1; i <= 6; i++){

    const section =
        document.createElement("div");

    section.className =
        "valve-section";

    section.id =
        "cilindro-" + i;

    section.style.display =
        i === 1 ? "block" : "none";


    section.innerHTML = `

        <div class="cilindro-label">

            CILINDRO ${i}

        </div>

    `;


    const layout =
        document.createElement("div");

    layout.className =
        "layout-cilindro";


    const posicoes = [

        {
            tipo:"exaustao",
            j:2
        },

        {
            tipo:"admissao",
            j:2
        },

        {
            tipo:"exaustao",
            j:1
        },

        {
            tipo:"admissao",
            j:1
        }

    ];


    posicoes.forEach(
        ({tipo,j}) => {

            const nome =
                tipo === "exaustao"
                ? "EXAUSTÃO"
                : "ADMISSÃO";


            const id =
                tipo + i + "_" + j;


            const box =
                document.createElement("div");

            box.className =
                "valvula-bloco";


            box.innerHTML = `

                <div class="valvula-titulo">

                    ${nome} ${j}

                </div>


                <div
                    class="photo-box"
                    id="photo${id}"
                >

                    Clique para adicionar foto

                    <div class="photo-label">

                        ${nome} ${j}

                    </div>

                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${id}')"
                    >

                </div>


                <div class="measurement">

                    <input
                        type="text"
                        id="${id}"
                        inputmode="decimal"
                        placeholder="mm"
                        oninput="atualizarDestaque(this)"
                    >

                </div>


                <button
                    class="remove-photo"
                    onclick="removePhoto('${id}')"
                >
                    REMOVER FOTO
                </button>

            `;


            layout.appendChild(box);

        }
    );


    section.appendChild(layout);


    const btn =
        document.createElement("button");

    btn.className =
        "btn-jpg";

    btn.textContent =
        `📷 GERAR IMAGEM DO CILINDRO ${i}`;

    btn.onclick =
        () => gerarJpgCilindro(i);


    section.appendChild(btn);


    container.appendChild(section);

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function atualizarCilindro(){

    for(let i=1;i<=6;i++){

        const el =
            document.getElementById(
                "cilindro-" + i
            );

        if(el){

            el.style.display =
                i === cilindroAtual
                ? "block"
                : "none";

        }

    }


    document.getElementById(
        "indicadorCilindro"
    ).textContent =
        `${cilindroAtual} / 6`;


    document.getElementById(
        "btnAnterior"
    ).disabled =
        cilindroAtual === 1;


    document.getElementById(
        "btnProximo"
    ).disabled =
        cilindroAtual === 6;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function proximoCilindro(){

    if(cilindroAtual < 6){

        cilindroAtual++;

        atualizarCilindro();

    }

}


function cilindroAnterior(){

    if(cilindroAtual > 1){

        cilindroAtual--;

        atualizarCilindro();

    }

}


/* =========================================================
   FOTO
========================================================= */

function loadPhoto(event,id){

    const file =
        event.target.files[0];

    if(!file)
        return;


    const box =
        document.getElementById(
            "photo" + id
        );


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            box.style.backgroundImage =
                `url("${e.target.result}")`;

        };


    reader.readAsDataURL(file);

}


/* =========================================================
   REMOVER FOTO
========================================================= */

function removePhoto(id){

    const box =
        document.getElementById(
            "photo" + id
        );


    box.style.backgroundImage =
        "";


    const nome =
        id.includes("exaustao")
        ? "EXAUSTÃO"
        : "ADMISSÃO";


    box.innerHTML = `

        Clique para adicionar foto

        <div class="photo-label">
            ${nome}
        </div>

        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}


/* =========================================================
   DESTAQUE DA MEDIÇÃO
========================================================= */

function atualizarDestaque(input){

    const valor =
        parseFloat(
            input.value
            .replace(",",".")
        );


    if(
        !isNaN(valor) &&
        valor >= LIMITE_AFUNDAMENTO
    ){

        input.classList.add(
            "afundamento"
        );

    }
    else{

        input.classList.remove(
            "afundamento"
        );

    }

}


/* =========================================================
   ARREDONDAMENTO CANVAS
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();


    if(fill)
        ctx.fill();

    if(stroke)
        ctx.stroke();

}


/* =========================================================
   CARREGAR IMAGEM
========================================================= */

function carregarImagem(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();

            img.onload =
                () => resolve(img);

            img.onerror =
                () => reject();

            img.src = url;

        }
    );

}


/* =========================================================
   GERAR JPG
   ESTRUTURA ORGANIZADA
========================================================= */

async function gerarJpgCilindro(i){

    const largura = 1280;

    const altura = 1500;

    const metadeW =
        largura / 2;

    const metadeH =
        altura / 2;


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        largura;

    canvas.height =
        altura;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /* FUNDO */

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        largura,
        altura
    );


    /* =====================================================
       CONFIGURAÇÃO DAS FOTOS
    ===================================================== */

    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];


    const legendas = [

        "EXAUSTÃO 2",
        "ADMISSÃO 2",
        "EXAUSTÃO 1",
        "ADMISSÃO 1"

    ];


    const posicoes = [

        [0,0],
        [metadeW,0],
        [0,metadeH],
        [metadeW,metadeH]

    ];


    /* =====================================================
       FOTOS
    ===================================================== */

    for(
        let j=0;
        j<4;
        j++
    ){

        const box =
            document.getElementById(
                fotos[j]
            );


        if(
            !box ||
            !box.style.backgroundImage
        ){

            continue;

        }


        let url =
            box.style.backgroundImage
                .replace(
                    /^url\(["']?/,
                    ""
                )
                .replace(
                    /["']?\)$/,
                    ""
                );


        try{

            const img =
                await carregarImagem(url);


            const x =
                posicoes[j][0];

            const y =
                posicoes[j][1];


            /* =================================================
               DESENHAR FOTO MANTENDO PROPORÇÃO
            ================================================= */

            const escala =
                Math.max(
                    metadeW / img.width,
                    metadeH / img.height
                );


            const nw =
                img.width * escala;

            const nh =
                img.height * escala;


            const dx =
                x +
                (metadeW - nw) / 2;

            const dy =
                y +
                (metadeH - nh) / 2;


            ctx.save();

            ctx.beginPath();

            ctx.rect(
                x,
                y,
                metadeW,
                metadeH
            );

            ctx.clip();


            ctx.drawImage(
                img,
                dx,
                dy,
                nw,
                nh
            );


            ctx.restore();


        }
        catch(e){

            console.log(
                "Erro ao carregar imagem",
                e
            );

        }


        /* =================================================
           LEGENDA DISCRETA
        ================================================= */

        ctx.fillStyle =
            "rgba(255,255,255,.90)";


        ctx.strokeStyle =
            "rgba(0,0,0,.35)";


        ctx.lineWidth =
            2;


        const legendaH =
            42;


        const legendaY =
            posicoes[j][1] +
            metadeH -
            legendaH;


        roundRect(
            ctx,
            posicoes[j][0] + 15,
            legendaY - 5,
            metadeW - 30,
            legendaH,
            8,
            true,
            true
        );


        ctx.fillStyle =
            "#222";


        ctx.font =
            "bold 24px Arial";


        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        ctx.fillText(
            legendas[j],
            posicoes[j][0] + metadeW/2,
            legendaY + legendaH/2 - 5
        );


        /* =================================================
           MEDIÇÃO
        ================================================= */

        const input =
            document.getElementById(
                fotos[j].replace(
                    "photo",
                    ""
                )
            );


        const valorTexto =
            input
            ? input.value.trim()
            : "";


        const valor =
            parseFloat(
                valorTexto.replace(
                    ",",
                    "."
                )
            );


        /* =================================================
           MOSTRAR AFUNDAMENTO
           SOMENTE SE ≥ 67,50
        ================================================= */

        if(
            !isNaN(valor) &&
            valor >= LIMITE_AFUNDAMENTO
        ){

            const texto =
                `AFUNDAMENTO (${valor.toFixed(2).replace(".",",")} mm)`;


            ctx.font =
                "bold 25px Arial";


            const medida =
                ctx.measureText(
                    texto
                );


            const paddingX =
                15;

            const boxW =
                medida.width +
                paddingX * 2;

            const boxH =
                42;


            const boxX =
                posicoes[j][0] +
                (metadeW - boxW) / 2;


            const boxY =
                posicoes[j][1] +
                15;


            ctx.fillStyle =
                "rgba(255,255,255,.95)";


            ctx.strokeStyle =
                "#d71920";


            ctx.lineWidth =
                3;


            roundRect(
                ctx,
                boxX,
                boxY,
                boxW,
                boxH,
                8,
                true,
                true
            );


            ctx.fillStyle =
                "#d71920";


            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";


            ctx.fillText(
                texto,
                boxX + boxW/2,
                boxY + boxH/2
            );

        }

    }


    /* =====================================================
       TÍTULO DO CILINDRO
       DISCRETO E CENTRALIZADO
    ===================================================== */

    const titulo =
        `CILINDRO ${i}`;


    ctx.font =
        "bold 30px Arial";


    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    const tituloWidth =
        ctx.measureText(
            titulo
        ).width;


    const tituloPadding =
        16;


    const tituloHeight =
        42;


    const tituloBoxWidth =
        tituloWidth +
        tituloPadding * 2;


    const tituloX =
        (largura - tituloBoxWidth) / 2;


    const tituloY =
        14;


    /* FUNDO DISCRETO */

    ctx.fillStyle =
        "rgba(255,255,255,.94)";


    ctx.strokeStyle =
        "rgba(0,0,0,.35)";


    ctx.lineWidth =
        2;


    roundRect(
        ctx,
        tituloX,
        tituloY,
        tituloBoxWidth,
        tituloHeight,
        10,
        true,
        true
    );


    ctx.fillStyle =
        "#222";


    ctx.fillText(
        titulo,
        largura / 2,
        tituloY + tituloHeight/2
    );


    /* =====================================================
       DOWNLOAD
    ===================================================== */

    canvas.toBlob(
        function(blob){

            if(!blob){

                alert(
                    "Não foi possível gerar a imagem."
                );

                return;

            }


            const nome =
                `CILINDRO_${i}.jpg`;


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;

            link.download =
                nome;

            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            setTimeout(
                ()=>{
                    URL.revokeObjectURL(
                        url
                    );
                },
                3000
            );


            mostrarMensagemDownload(
                nome
            );

        },
        "image/jpeg",
        .95
    );

}


/* =========================================================
   MENSAGEM DOWNLOAD
========================================================= */

function mostrarMensagemDownload(nome){

    const el =
        document.getElementById(
            "downloadMensagem"
        );


    el.innerHTML =
        `⬇️ ${nome}<br>Download iniciado`;


    el.style.display =
        "block";


    setTimeout(
        ()=>{
            el.style.display =
                "none";
        },
        3000
    );

}


/* =========================================================
   GERAR PDF
========================================================= */

document
.getElementById("generatePdf")
.addEventListener(
    "click",
    async function(){

        try{

            const pdf =
                new jsPDF({
                    unit:"mm",
                    format:"a4"
                });


            const img =
                new Image();


            img.crossOrigin =
                "anonymous";


            img.src =
                "https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg";


            await new Promise(
                (resolve,reject)=>{

                    img.onload =
                        resolve;

                    img.onerror =
                        reject;

                }
            );


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                img.width;

            canvas.height =
                img.height;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            ctx.drawImage(
                img,
                0,
                0
            );


            /* =================================================
               DADOS
            ================================================= */

            ctx.font =
                "bold 18px Arial";

            ctx.fillStyle =
                "black";


            ctx.fillText(
                document.getElementById("mecanico").value || "",
                208,
                176
            );


            ctx.fillText(
                document.getElementById("usina").value || "",
                165,
                204
            );


            ctx.fillText(
                document.getElementById("serie").value || "",
                165,
                231
            );


            ctx.fillText(
                "UGD- " +
                (
                    document.getElementById("ugd").value || ""
                ),
                590,
                262
            );


            ctx.fillText(
                document.getElementById("os").value || "",
                292,
                262
            );


            const dataVal =
                document.getElementById(
                    "data"
                ).value;


            if(dataVal){

                const partes =
                    dataVal.split("-");


                const dataBR =
                    `${partes[2]}/${partes[1]}/${partes[0]}`;


                ctx.fillText(
                    dataBR,
                    888,
                    204
                );

            }


            ctx.fillText(
                document.getElementById("horimetro").value || "",
                798,
                231
            );


            /* =================================================
               MEDIÇÕES
            ================================================= */

            const campos = [

                ["exaustao1_1",105,616],
                ["exaustao1_2",105,576],
                ["admissao1_1",345,628],
                ["admissao1_2",345,589],

                ["exaustao2_1",450,1064],
                ["exaustao2_2",450,1024],
                ["admissao2_1",689,1075],
                ["admissao2_2",689,1038],

                ["exaustao3_1",792,617],
                ["exaustao3_2",792,576],
                ["admissao3_1",1032,628],
                ["admissao3_2",1032,589],

                ["exaustao4_1",793,1064],
                ["exaustao4_2",793,1024],
                ["admissao4_1",1033,1075],
                ["admissao4_2",1033,1038],

                ["exaustao5_1",450,617],
                ["exaustao5_2",450,576],
                ["admissao5_1",689,628],
                ["admissao5_2",689,589],

                ["exaustao6_1",105,1064],
                ["exaustao6_2",105,1024],
                ["admissao6_1",345,1075],
                ["admissao6_2",345,1038]

            ];


            campos.forEach(
                ([id,x,y])=>{

                    const valor =
                        document.getElementById(
                            id
                        )?.value || "";


                    const numero =
                        parseFloat(
                            valor.replace(
                                ",",
                                "."
                            )
                        );


                    if(
                        !isNaN(numero) &&
                        numero >= LIMITE_AFUNDAMENTO
                    ){

                        ctx.fillStyle =
                            "red";

                        ctx.font =
                            "bold 18px Arial";

                    }
                    else{

                        ctx.fillStyle =
                            "black";

                        ctx.font =
                            "18px Arial";

                    }


                    ctx.fillText(
                        valor,
                        x,
                        y
                    );

                }
            );


            /* =================================================
               OBSERVAÇÕES
            ================================================= */

            const obs =
                document.getElementById(
                    "observacoes"
                ).value;


            ctx.fillStyle =
                "black";

            ctx.font =
                "18px Arial";


            const maxWidth =
                950;

            const lineHeight =
                26;


            const palavras =
                obs.split(/\s+/);


            let linha =
                "";

            let y =
                1237;


            palavras.forEach(
                palavra=>{

                    const teste =
                        linha +
                        palavra +
                        " ";


                    if(
                        ctx.measureText(
                            teste
                        ).width >
                        maxWidth
                    ){

                        ctx.fillText(
                            linha,
                            183,
                            y
                        );


                        linha =
                            palavra + " ";


                        y +=
                            lineHeight;

                    }
                    else{

                        linha =
                            teste;

                    }

                }
            );


            if(linha){

                ctx.fillText(
                    linha,
                    183,
                    y
                );

            }


            /* =================================================
               ASSINATURA
            ================================================= */

            ctx.font =
                '40px "Brush Script MT", cursive';


            ctx.fillStyle =
                "#08783b";


            ctx.fillText(
                document.getElementById(
                    "assinatura"
                ).value || "",
                760,
                1538
            );


            /* =================================================
               PDF
            ================================================= */

            const imgData =
                canvas.toDataURL(
                    "image/jpeg",
                    1
                );


            pdf.addImage(
                imgData,
                "JPEG",
                0,
                0,
                pdf.internal.pageSize.getWidth(),
                pdf.internal.pageSize.getHeight()
            );


            pdf.save(
                "MEDICAO_VALVULAS.pdf"
            );

        }
        catch(error){

            console.error(error);

            alert(
                "Não foi possível gerar o PDF. Verifique sua conexão com a internet."
            );

        }

    }
);


/* =========================================================
   LIMPAR
========================================================= */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    function(){

        if(
            !confirm(
                "Deseja realmente limpar todos os dados?"
            )
        ){

            return;

        }


        document
        .querySelectorAll(
            'input[type="text"], input[type="date"], textarea'
        )
        .forEach(
            el=>{
                el.value = "";
            }
        );


        document
        .querySelectorAll(
            ".measurement input"
        )
        .forEach(
            el=>{
                el.classList.remove(
                    "afundamento"
                );
            }
        );


        document
        .querySelectorAll(
            ".photo-box"
        )
        .forEach(
            box=>{

                const id =
                    box.id.replace(
                        "photo",
                        ""
                    );


                const nome =
                    id.includes("exaustao")
                    ? "EXAUSTÃO"
                    : "ADMISSÃO";


                box.style.backgroundImage =
                    "";


                box.innerHTML = `

                    Clique para adicionar foto

                    <div class="photo-label">
                        ${nome}
                    </div>

                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${id}')"
                    >

                `;

            }
        );


        cilindroAtual =
            1;


        atualizarCilindro();

    }
);


/* =========================================================
   DATA AUTOMÁTICA
========================================================= */

document.getElementById(
    "data"
).value =
    new Date()
    .toISOString()
    .split("T")[0];


/* =========================================================
   INICIAR
========================================================= */

atualizarCilindro();

</script>
