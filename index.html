<style>

*{
    box-sizing:border-box;
}

body{

    font-family:
    Arial,
    sans-serif;

    margin:20px;

    line-height:1.6;

    background:#fff;

}

h1,h2,h3{

    margin-top:20px;

    margin-bottom:10px;

}

h1{

    font-size:24px;

    text-align:center;

    border-bottom:3px solid #257500;

    padding:10px;

    color:#fff;

    background-color:#257500;

    border-radius:8px;

}

.info-table{

    width:100%;

    margin-bottom:20px;

}

.info-table td{

    padding:5px 0;

    text-align:left;

}

input[type="text"],
input[type="date"],
textarea{

    width:120px;

    padding:8px;

    text-align:center;

    font-size:16px;

    border:2px solid #FF8C00;

    border-radius:4px;

}

textarea{

    width:100%;

    height:100px;

    padding:10px;

    text-align:left;

    resize:vertical;

    border:2px solid #FF8C00;

    border-radius:6px;

}

.warning{

    background-color:#257500;

    padding:10px;

    border-left:6px solid #257500;

    margin:15px 0;

    text-align:center;

    color:white;

    font-weight:bold;

    border-radius:6px;

}

/* =====================================================
   ÁREA DOS CILINDROS
   ===================================================== */

.cilindro-wrapper{

    display:none;

}

.cilindro-wrapper.ativo{

    display:block;

}

.cilindro-titulo{

    text-align:center;

    background:#257500;

    color:white;

    font-size:24px;

    font-weight:bold;

    padding:10px;

    border-radius:8px;

    margin-bottom:15px;

}

/* =====================================================
   GRID 2 X 2
   ===================================================== */

.valve-container{

    width:100%;

}

.valve-grid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    grid-template-rows:
    1fr 1fr;

    gap:12px;

    width:100%;

}

.valve-section{

    border:2px solid #257500;

    padding:10px;

    background-color:#fff;

    border-radius:10px;

    box-shadow:
    0 4px 8px rgba(0,0,0,0.1);

    min-width:0;

}

.valve-title{

    text-align:center;

    font-weight:bold;

    color:white;

    background-color:#257500;

    border-radius:8px;

    padding:6px;

    margin-bottom:8px;

    font-size:16px;

}

.measurement{

    text-align:center;

    margin:8px 0;

    font-size:18px;

    background-color:#FFFACD;

    border-radius:8px;

    padding:5px;

    font-weight:bold;

    color:black;

}

.measurement input{

    width:120px;

    max-width:100%;

    padding:8px;

    text-align:center;

    font-size:18px;

    border:2px solid #FF8C00;

    border-radius:4px;

}

.photo-box{

    width:100%;

    height:180px;

    border:2px dashed #FF8C00;

    margin:8px auto;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    font-size:13px;

    color:#666;

    position:relative;

    background-size:cover;

    background-position:center;

    overflow:hidden;

    border-radius:10px;

}

.photo-box input[type="file"]{

    position:absolute;

    width:100%;

    height:100%;

    opacity:0;

    cursor:pointer;

}

.photo-label{

    position:absolute;

    bottom:0;

    width:100%;

    text-align:center;

    background-color:#257500;

    color:white;

    font-weight:bold;

    font-size:12px;

    padding:3px 0;

}

.remove-photo{

    display:block;

    margin:5px auto;

    background:#FF4500;

    color:#fff;

    border:none;

    padding:5px 8px;

    font-size:11px;

    cursor:pointer;

    border-radius:4px;

}

/* =====================================================
   NAVEGAÇÃO
   ===================================================== */

.navegacao-cilindros{

    display:flex;

    justify-content:space-between;

    gap:10px;

    margin:20px 0;

}

.navegacao-cilindros button{

    flex:1;

}

.progresso-cilindro{

    text-align:center;

    font-weight:bold;

    font-size:18px;

    margin-bottom:10px;

    color:#257500;

}

/* =====================================================
   BOTÕES
   ===================================================== */

.button-container{

    margin-top:20px;

    text-align:center;

    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;

}

button{

    background-color:#257500;

    color:white;

    border:none;

    padding:10px 20px;

    margin:0 5px;

    font-size:16px;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;

    transition:
    all 0.3s ease;

}

button:hover{

    background-color:#FF4500;

}

button.clear-btn{

    background-color:#FF4500;

}

/* =====================================================
   OBSERVAÇÕES
   ===================================================== */

.obs{

    margin-top:30px;

    font-style:italic;

    background-color:#FFFACD;

    padding:10px;

    border-radius:6px;

    border:1px solid #FF8C00;

}

/* =====================================================
   ASSINATURA
   ===================================================== */

.signature{

    margin-top:50px;

    border-top:2px solid #FF8C00;

    width:320px;

    padding-top:5px;

    text-align:center;

    font-weight:bold;

    font-size:16px;

    position:relative;

}

#assinatura{

    position:absolute;

    top:-36px;

    left:0;

    width:320px;

    border:none;

    font-size:28px;

    text-align:center;

    background:transparent;

    outline:none;

    font-family:
    'Brush Script MT',
    cursive,
    Arial,
    sans-serif;

    color:#257500;

}

#assinatura::placeholder{

    color:#999;

}

/* =====================================================
   DESTAQUE MEDIÇÃO
   ===================================================== */

.medicao-alerta{

    color:red !important;

    font-weight:bold !important;

}

/* =====================================================
   TELA DE DOWNLOAD
   ===================================================== */

.download-tela{

    position:fixed;

    inset:0;

    background:#222;

    z-index:999999;

    overflow:auto;

    padding:20px;

    text-align:center;

}

.download-tela h2{

    color:white;

    margin:0 0 15px 0;

}

.download-tela img{

    width:100%;

    max-width:900px;

    height:auto;

    display:block;

    margin:auto;

    background:white;

    border-radius:8px;

}

.download-botoes{

    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;

    margin-top:20px;

}

.download-botoes button{

    padding:15px 25px;

    font-size:16px;

}

/* =====================================================
   CELULAR
   ===================================================== */

@media(max-width:900px){

    body{

        margin:10px;

    }

    h1{

        font-size:19px;

    }

    .info-table{

        display:block;

        overflow-x:auto;

    }

    /*
       IMPORTANTE:
       NÃO colocar grid-template-columns:1fr aqui.
       O 2x2 permanece no celular.
    */

    .valve-grid{

        grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

        grid-template-rows:
        auto auto;

        gap:6px;

    }

    .valve-section{

        padding:6px;

    }

    .valve-title{

        font-size:13px;

        padding:5px;

    }

    .photo-box{

        height:130px;

    }

    .measurement{

        margin:5px 0;

        padding:3px;

    }

    .measurement input{

        width:95px;

        font-size:16px;

        padding:6px;

    }

    .remove-photo{

        font-size:9px;

        padding:4px 5px;

    }

    .navegacao-cilindros{

        gap:5px;

    }

    .navegacao-cilindros button{

        font-size:12px;

        padding:10px 5px;

        margin:0;

    }

    .cilindro-titulo{

        font-size:20px;

    }

}

/* =====================================================
   CELULARES MUITO PEQUENOS
   ===================================================== */

@media(max-width:380px){

    body{

        margin:5px;

    }

    .photo-box{

        height:110px;

    }

    .measurement input{

        width:80px;

    }

    .valve-title{

        font-size:11px;

    }

}

/* =====================================================
   IMPRESSÃO
   ===================================================== */

@media print{

    body{

        background:white;

        margin:0;

    }

    .navegacao-cilindros,
    .button-container,
    .remove-photo{

        display:none !important;

    }

    .cilindro-wrapper{

        display:block !important;

        page-break-inside:avoid;

    }

}

</style>

<script>

const {
    jsPDF
} = window.jspdf;

let cilindroAtual = 1;

const totalCilindros = 6;

/* =====================================================
   CRIAR CILINDROS
   ===================================================== */

function criarCilindros(){

    const container =
        document.getElementById(
            'cilindrosContainer'
        );

    container.innerHTML = '';

    for(
        let i = 1;
        i <= totalCilindros;
        i++
    ){

        const wrapper =
            document.createElement(
                'div'
            );

        wrapper.className =
            'cilindro-wrapper';

        wrapper.id =
            `cilindro-${i}`;

        wrapper.innerHTML = `

            <div class="cilindro-titulo">

                CILINDRO ${i}

            </div>

            <div class="valve-grid">

                <!-- EXAUSTÃO 2 -->

                <div class="valve-section">

                    <div class="valve-title">

                        EXAUSTÃO 2

                    </div>

                    <div
                        class="photo-box"
                        id="photoexaustao${i}_2"
                    >

                        📷 FOTO

                        <div class="photo-label">

                            EXAUSTÃO 2

                        </div>

                        <input
                            type="file"
                            accept="image/*"
                            capture="environment"
                            onchange="loadPhoto(event,'exaustao${i}_2')"
                        >

                    </div>

                    <div class="measurement">

                        <input
                            type="text"
                            id="exaustao${i}_2"
                            placeholder="Medição"
                            inputmode="decimal"
                        >

                    </div>

                    <button
                        class="remove-photo"
                        onclick="removePhoto('exaustao${i}_2')"
                    >

                        REMOVER FOTO

                    </button>

                </div>

                <!-- ADMISSÃO 2 -->

                <div class="valve-section">

                    <div class="valve-title">

                        ADMISSÃO 2

                    </div>

                    <div
                        class="photo-box"
                        id="photoadmissao${i}_2"
                    >

                        📷 FOTO

                        <div class="photo-label">

                            ADMISSÃO 2

                        </div>

                        <input
                            type="file"
                            accept="image/*"
                            capture="environment"
                            onchange="loadPhoto(event,'admissao${i}_2')"
                        >

                    </div>

                    <div class="measurement">

                        <input
                            type="text"
                            id="admissao${i}_2"
                            placeholder="Medição"
                            inputmode="decimal"
                        >

                    </div>

                    <button
                        class="remove-photo"
                        onclick="removePhoto('admissao${i}_2')"
                    >

                        REMOVER FOTO

                    </button>

                </div>

                <!-- EXAUSTÃO 1 -->

                <div class="valve-section">

                    <div class="valve-title">

                        EXAUSTÃO 1

                    </div>

                    <div
                        class="photo-box"
                        id="photoexaustao${i}_1"
                    >

                        📷 FOTO

                        <div class="photo-label">

                            EXAUSTÃO 1

                        </div>

                        <input
                            type="file"
                            accept="image/*"
                            capture="environment"
                            onchange="loadPhoto(event,'exaustao${i}_1')"
                        >

                    </div>

                    <div class="measurement">

                        <input
                            type="text"
                            id="exaustao${i}_1"
                            placeholder="Medição"
                            inputmode="decimal"
                        >

                    </div>

                    <button
                        class="remove-photo"
                        onclick="removePhoto('exaustao${i}_1')"
                    >

                        REMOVER FOTO

                    </button>

                </div>

                <!-- ADMISSÃO 1 -->

                <div class="valve-section">

                    <div class="valve-title">

                        ADMISSÃO 1

                    </div>

                    <div
                        class="photo-box"
                        id="photoadmissao${i}_1"
                    >

                        📷 FOTO

                        <div class="photo-label">

                            ADMISSÃO 1

                        </div>

                        <input
                            type="file"
                            accept="image/*"

                    </div>

            <div class="button-container">

                <button
                    onclick="gerarJpgCilindro(${i})"

                    📷 GERAR JPG CILINDRO ${i}

                </button>

            </div>

        `;

        container.appendChild(
            wrapper
        );

}

/* =====================================================
   MOSTRAR CILINDRO
   ===================================================== */

function mostrarCilindro(numero){

    if(
        numero < 1 ||
        numero > totalCilindros
    ){

        return;

    }

    cilindroAtual =
        numero;

    document
        .querySelectorAll(
            '.cilindro-wrapper'
        )
        .forEach(
            elemento => {

                elemento.classList.remove(
                    'ativo'
                );

            }
        );

    const atual =
        document.getElementById(
            `cilindro-${numero}`
        );

    if(atual){

        atual.classList.add(
            'ativo'
        );

    }

    document.getElementById(
        'progressoCilindro'
    ).innerText =
        `CILINDRO ${numero} DE ${totalCilindros}`;

    document.getElementById(
        'btnAnterior'
    ).disabled =
        numero === 1;

    document.getElementById(
        'btnProximo'
    ).disabled =
        numero === totalCilindros;

    window.scrollTo(
        0,
        0
    );

}

/* =====================================================
   CILINDRO ANTERIOR
   ===================================================== */

function cilindroAnterior(){

    if(
        cilindroAtual > 1
    ){

        mostrarCilindro(
            cilindroAtual - 1
        );

    }

}

/* =====================================================
   PRÓXIMO CILINDRO
   ===================================================== */

function cilindroProximo(){

    if(
        cilindroAtual <
        totalCilindros
    ){

        mostrarCilindro(
            cilindroAtual + 1
        );

    }

}

/* =====================================================
   FOTO
   ===================================================== */

function loadPhoto(
    event,
    id
){

    const box =
        document.getElementById(
            'photo' + id
        );

    const file =
        event.target.files[0];

    if(!file)
        return;

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            box.style.backgroundImage =
                `url("${e.target.result}")`;

            box.dataset.photo =
                e.target.result;

            box.innerHTML = `

                <div
                    class="photo-label"
                >
                    ${id
                        .replace(/[0-9_]/g,' ')
                        .toUpperCase()}
                </div>

                <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="loadPhoto(event,'${id}')"
                >

            `;

        };

    reader.readAsDataURL(
        file
    );

}

/* =====================================================
   REMOVER FOTO
   ===================================================== */

function removePhoto(id){

    const box =
        document.getElementById(
            'photo' + id
        );

    if(!box)
        return;

    box.style.backgroundImage =
        '';

    box.dataset.photo =
        '';

    const tipo =
        id
            .replace(/[0-9_]/g,' ')
            .toUpperCase();

    box.innerHTML = `

        📷 FOTO

        <div class="photo-label">

            ${tipo}

        </div>

        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}

/* =====================================================
   RETÂNGULO ARREDONDADO
   ===================================================== */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    if(
        typeof radius ===
        'undefined'
    ){

        radius = 5;

    }

    if(
        typeof radius ===
        'number'
    ){

        radius = {

            tl:radius,
            tr:radius,
            br:radius,
            bl:radius

        };

    }

    ctx.beginPath();

    ctx.moveTo(
        x + radius.tl,
        y
    );

    ctx.lineTo(
        x + width - radius.tr,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius.tr
    );

    ctx.lineTo(
        x + width,
        y + height - radius.br
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius.br,
        y + height
    );

    ctx.lineTo(
        x + radius.bl,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius.bl
    );

    ctx.lineTo(
        x,
        y + radius.tl
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius.tl,
        y
    );

    ctx.closePath();

    if(fill)
        ctx.fill();

    if(stroke)
        ctx.stroke();

}

/* =====================================================
   GERAR JPG
   ===================================================== */

async function gerarJpgCilindro(i){

    const imgSize =
        1280;

    const imgHeight =
        1900;

    const canvasCil =
        document.createElement(
            'canvas'
        );

    canvasCil.width =
        imgSize;

    canvasCil.height =
        imgHeight;

    const ctxCil =
        canvasCil.getContext(
            '2d'
        );

    ctxCil.fillStyle =
        "#fff";

    ctxCil.fillRect(
        0,
        0,
        imgSize,
        imgHeight
    );

    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];

    const idsMedicao = [

        `exaustao${i}_2`,
        `admissao${i}_2`,
        `exaustao${i}_1`,
        `admissao${i}_1`

    ];

    const legendas = [

        'EXAUSTÃO 2',
        'ADMISSÃO 2',
        'EXAUSTÃO 1',
        'ADMISSÃO 1'

    ];

    const pos = [

        [0,0],

        [
            imgSize / 2,
            0
        ],

        [
            0,
            imgHeight / 2
        ],

        [
            imgSize / 2,
            imgHeight / 2
        ]

    ];

    for(
        let j = 0;
        j < 4;
        j++
    ){

        const box =
            document.getElementById(
                fotos[j]
            );

        const medicao =
            document.getElementById(
                idsMedicao[j]
            );

        const valor =
            medicao
                ? parseFloat(
                    medicao.value
                        .replace(',','.')
                  )
                : null;

        const x =
            pos[j][0];

        const y =
            pos[j][1];

        const largura =
            imgSize / 2;

        const altura =
            imgHeight / 2;

        /*
        FOTO
        */

        if(
            box &&
            box.style.backgroundImage &&
            box.style.backgroundImage !== 'none'
        ){

            let imgUrl =
                box.style.backgroundImage
                    .replace(
                        /^url\(["']?/,
                        ''
                    )
                    .replace(
                        /["']?\)$/,
                        ''
                    );

            const imgEl =
                new Image();

            imgEl.src =
                imgUrl;

            await new Promise(
                resolve => {

                    imgEl.onload =
                        resolve;

                    imgEl.onerror =
                        resolve;

                }
            );

            ctxCil.drawImage(
                imgEl,
                x,
                y,
                largura,
                altura
            );

        }

        /*
        FUNDO CASO NÃO TENHA FOTO
        */

        else{

            ctxCil.fillStyle =
                "#eeeeee";

            ctxCil.fillRect(
                x,
                y,
                largura,
                altura
            );

            ctxCil.fillStyle =
                "#777";

            ctxCil.font =
                "bold 40px Arial";

            ctxCil.textAlign =
                "center";

            ctxCil.textBaseline =
                "middle";

            ctxCil.fillText(
                "📷 FOTO",
                x + largura / 2,
                y + altura / 2
            );

        }

        /*
        LEGENDA
        */

        const rectHeight =
            60;

        const rectY =
            y +
            altura -
            rectHeight;

        ctxCil.fillStyle =
            "white";

        ctxCil.strokeStyle =
            "black";

        ctxCil.lineWidth =
            2;

        roundRect(
            ctxCil,
            x,
            rectY,
            largura,
            rectHeight,
            10,
            true,
            true
        );

        ctxCil.fillStyle =
            "black";

        ctxCil.font =
            "bold 32px Arial";

        ctxCil.textAlign =
            "center";

        ctxCil.textBaseline =
            "middle";

        ctxCil.fillText(
            legendas[j],
            x + largura / 2,
            rectY + rectHeight / 2
        );

        /*
        MEDIÇÃO
        */

        if(
            valor !== null &&
            !isNaN(valor)
        ){

            const medicaoTexto =
                valor
                    .toFixed(2)
                    .replace(
                        '.',
                        ','
                    ) +
                " mm";

            ctxCil.font =
                "bold 42px Arial";

            const larguraTexto =
                ctxCil.measureText(
                    medicaoTexto
                ).width;

            const caixaLargura =
                larguraTexto + 50;

            const caixaAltura =
                65;

            const caixaX =
                x +
                (
                    largura -
                    caixaLargura
                ) / 2;

            const caixaY =
                rectY -
                caixaAltura -
                15;

            ctxCil.fillStyle =
                "white";

            ctxCil.strokeStyle =
                valor >= 67.50
                    ? "red"
                    : "black";

            ctxCil.lineWidth =
                3;

            roundRect(
                ctxCil,
                caixaX,
                caixaY,
                caixaLargura,
                caixaAltura,
                12,
                true,
                true
            );

            ctxCil.fillStyle =
                valor >= 67.50
                    ? "red"
                    : "black";

            ctxCil.fillText(
                medicaoTexto,
                x + largura / 2,
                caixaY + caixaAltura / 2
            );

            /*
            AFUNDAMENTO
            */

            if(
                valor >= 67.50
            ){

                const desc =
                    "AFUNDAMENTO";

                ctxCil.font =
                    "bold 28px Arial";

                const larguraDesc =
                    ctxCil.measureText(
                        desc
                    ).width + 30;

                const alturaDesc =
                    45;

                const descX =
                    x +
                    (
                        largura -
                        larguraDesc
                    ) / 2;

                const descY =
                    caixaY -
                    alturaDesc -
                    10;

                ctxCil.fillStyle =
                    "white";

                ctxCil.strokeStyle =
                    "red";

                ctxCil.lineWidth =
                    2;

                roundRect(
                    ctxCil,
                    descX,
                    descY,
                    larguraDesc,
                    alturaDesc,
                    10,
                    true,
                    true
                );

                ctxCil.fillStyle =
                    "red";

                ctxCil.fillText(
                    desc,
                    x + largura / 2,
                    descY + alturaDesc / 2
                );

            }

        }

    }

    /*
    =====================================================
    TÍTULO
    =====================================================
    */

    const titulo =
        `CILINDRO ${i}`;

    ctxCil.font =
        "bold 55px Arial";

    const tituloWidth =
        ctxCil.measureText(
            titulo
        ).width;

    const tituloPadding =
        30;

    const tituloHeight =
        75;

    const tituloX =
        (
            imgSize -
            tituloWidth -
            tituloPadding * 2
        ) / 2;

    const tituloY =
        10;

    ctxCil.fillStyle =
        "white";

    ctxCil.strokeStyle =
        "black";

    ctxCil.lineWidth =
        3;

    roundRect(
        ctxCil,
        tituloX,
        tituloY,
        tituloWidth +
        tituloPadding * 2,
        tituloHeight,
        15,
        true,
        true
    );

    ctxCil.fillStyle =
        "black";

    ctxCil.textAlign =
        "center";

    ctxCil.textBaseline =
        "middle";

    ctxCil.fillText(
        titulo,
        imgSize / 2,
        tituloY +
        tituloHeight / 2
    );

    /*
    =====================================================
    GERAR JPG
    =====================================================
    */

    const imgData =
        canvasCil.toDataURL(
            'image/jpeg',
            0.95
        );

    const nomeArquivo =
        `CILINDRO_${i}.jpg`;

    /*
    TENTATIVA DE DOWNLOAD
    */

    const link =
        document.createElement(
            'a'
        );

    link.href =
        imgData;

    link.download =
        nomeArquivo;

    link.style.display =
        'none';

    document.body.appendChild(
        link
    );

    try{

        link.click();

    }
    catch(erro){

        console.log(
            "Download automático bloqueado."
        );

    }

    document.body.removeChild(
        link
    );

    /*
    =====================================================
    TELA PARA CELULAR
    =====================================================
    */

    setTimeout(
        function(){

            const janela =
                window.open(
                    '',
                    '_blank'
                );

            if(!janela){

                alert(
                    "O navegador bloqueou a abertura da imagem."
                );

                return;

            }

/* =====================================================
   DESTAQUE AUTOMÁTICO
   ===================================================== */

function atualizarDestaque(
    input
){

    const valor =
        parseFloat(
            input.value.replace(
                ',',
                '.'
            )
        );

    if(
        !isNaN(valor) &&
        valor >= 67.50
    ){

        input.style.color =
            "red";

        input.style.fontWeight =
            "bold";

    }
    else{

        input.style.color =
            "black";

        input.style.fontWeight =
            "normal";

    }

}

/* =====================================================
   PDF
   ===================================================== */

document.getElementById(
    'generatePdf'
).addEventListener(
    'click',
    async function(){

        const pdf =
            new jsPDF({
                unit:'mm',
                format:'a4'
            });

        const img =
            new Image();

        img.crossOrigin =
            'anonymous';

        img.src =
            'https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg';

        await new Promise(
            resolve => {

                img.onload =
                    resolve;

            }
        );

        const canvas =
            document.createElement(
                'canvas'
            );

        canvas.width =
            img.width;

        canvas.height =
            img.height;

        const ctx =
            canvas.getContext(
                '2d'
            );

        ctx.drawImage(
            img,
            0,
            0
        );

        ctx.font =
            'bold 18px Arial';

        ctx.fillStyle =
            'black';

        ctx.fillText(
            document.getElementById(
                'mecanico'
            ).value || '',
            208,
            176
        );

        ctx.fillText(
            document.getElementById(
                'usina'
            ).value || '',
            165,
            204
        );

        ctx.fillText(
            document.getElementById(
                'serie'
            ).value || '',
            165,
            231
        );

        ctx.fillText(
            'UGD- ' +
            (
                document.getElementById(
                    'ugd'
                ).value || ''
            ),
            590,
            262
        );

        ctx.fillText(
            document.getElementById(
                'os'
            ).value || '',
            292,
            262
        );

        const dataVal =
            document.getElementById(
                'data'
            ).value;

        if(dataVal){

            ctx.fillText(
                new Date(
                    dataVal
                ).toLocaleDateString(
                    'pt-BR'
                ),
                888,
                204
            );

        }

        ctx.fillText(
            document.getElementById(
                'horimetro'
            ).value || '',
            798,
            231
        );

        const limiteMaximo =
            67.50;

        const campos = [

            ['exaustao1_1',105,616],
            ['exaustao1_2',105,576],
            ['admissao1_1',345,628],
            ['admissao1_2',345,589],

            ['exaustao2_1',450,1064],
            ['exaustao2_2',450,1024],
            ['admissao2_1',689,1075],
            ['admissao2_2',689,1038],

            ['exaustao3_1',792,617],
            ['exaustao3_2',792,576],
            ['admissao3_1',1032,628],
            ['admissao3_2',1032,589],

            ['exaustao4_1',793,1064],
            ['exaustao4_2',793,1024],
            ['admissao4_1',1033,1075],
            ['admissao4_2',1033,1038],

            ['exaustao5_1',450,617],
            ['exaustao5_2',450,576],
            ['admissao5_1',689,628],
            ['admissao5_2',689,589],

            ['exaustao6_1',105,1064],
            ['exaustao6_2',105,1024],
            ['admissao6_1',345,1075],
            ['admissao6_2',345,1038]

        ];

        campos.forEach(
            ([id,x,y]) => {

                const valRaw =
                    document.getElementById(
                        id
                    )?.value || '';

                const valNum =
                    parseFloat(
                        valRaw.replace(
                            ',',
                            '.'
                        )
                    );

                ctx.fillStyle =
                    (
                        !isNaN(valNum) &&
                        valNum >= limiteMaximo
                    )
                    ? 'red'
                    : 'black';

                ctx.font =
                    (
                        !isNaN(valNum) &&
                        valNum >= limiteMaximo
                    )
                    ? 'bold 18px Arial'
                    : '18px Arial';

                ctx.fillText(
                    valRaw,
                    x,
                    y
                );

            }
        );

        const obs =
            document.getElementById(
                'observacoes'
            ).value;

        const maxWidth =
            950;

        const lineHeight =
            26;

        const words =
            obs.split(' ');

        let line =
            '';

        let y =
            1237;

        words.forEach(
            word => {

                const testLine =
                    line +
                    word +
                    ' ';

                const metrics =
                    ctx.measureText(
                        testLine
                    );

                if(
                    metrics.width >
                    maxWidth
                ){

                    ctx.fillText(
                        line,
                        183,
                        y
                    );

                    line =
                        word +
                        ' ';

                    y +=
                        lineHeight;

                }
                else{

                    line =
                        testLine;

                }

            }
        );

        ctx.fillText(
            line,
            183,
            y
        );

        ctx.font =
            '40px "Brush Script MT", cursive';

        ctx.fillText(
            document.getElementById(
                'assinatura'
            ).value || '',
            760,
            1538
        );

        const imgData =
            canvas.toDataURL(
                'image/jpeg',
                1.0
            );

        pdf.addImage(
            imgData,
            'JPEG',
            0,
            0,
            pdf.internal.pageSize.getWidth(),
            pdf.internal.pageSize.getHeight()
        );

        pdf.save(
            'MEDICAO_VALVULAS.pdf'
        );

    }
);

).addEventListener(
    'click',
    function(){

        if(
            !confirm(
                'Deseja limpar todos os dados?'
            )
        ){

            return;

        }

        document
            .querySelectorAll(
                'input[type="text"], input[type="date"], textarea'

            );

            .querySelectorAll(

            )

                    const id =
                        box.id.replace(

                        );

                    removePhoto(
                        id
                    );

                }
            );

        cilindroAtual =
            1;

        mostrarCilindro(
            1
        );

    }
);
