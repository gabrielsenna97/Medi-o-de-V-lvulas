<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Medição de Válvulas do Scania-550</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    margin:0;

    line-height:1.6;

    background:#f3f3f3;

    padding:20px;

}

h1,
h2,
h3{

    margin-top:20px;

    margin-bottom:10px;

}

h1{

    font-size:24px;

    text-align:center;

    border-bottom:3px solid #257500;

    padding:12px;

    color:#fff;

    background-color:#257500;

    border-radius:8px;

}

/* =========================
   INFORMAÇÕES
========================= */

.info-table{

    width:100%;

    margin-bottom:20px;

    background:white;

    padding:10px;

    border-radius:10px;

}

.info-table td{

    padding:7px;

    text-align:left;

}

input[type="text"],
input[type="date"],
textarea{

    width:120px;

    padding:8px;

    text-align:center;

    font-size:16px;

    border:2px solid #FF8C00;

    border-radius:4px;

}

textarea{

    width:100%;

    height:100px;

    padding:10px;

    text-align:left;

    resize:vertical;

    border:2px solid #FF8C00;

    border-radius:6px;

}

/* =========================
   AVISO
========================= */

.warning{

    background-color:#257500;

    padding:10px;

    border-left:6px solid #257500;

    margin:15px 0;

    text-align:center;

    color:white;

    font-weight:bold;

    border-radius:6px;

}

/* =========================
   ÁREA DOS CILINDROS
========================= */

.cilindros-wrapper{

    width:100%;

    max-width:1000px;

    margin:0 auto;

}

/* navegação */

.navegacao-cilindro{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin:15px 0;

}

.btn-navegacao{

    flex:1;

    background:#257500;

    color:white;

    border:none;

    padding:13px 10px;

    font-size:15px;

    font-weight:bold;

    border-radius:8px;

    cursor:pointer;

}

.btn-navegacao:hover{

    background:#FF4500;

}

.indicador-cilindro{

    min-width:130px;

    text-align:center;

    font-size:20px;

    font-weight:900;

    color:#257500;

}

/* cilindro */

.valve-container{

    width:100%;

}

.valve-section{

    display:none;

    width:100%;

    border:2px solid #257500;

    padding:15px;

    margin-bottom:20px;

    box-sizing:border-box;

    background-color:#fff;

    border-radius:10px;

    box-shadow:0 4px 8px rgba(0,0,0,0.1);

}

.valve-section.ativo{

    display:block;

}

/* título */

.cilindro-label{

    text-align:center;

    font-weight:bold;

    color:white;

    background-color:#257500;

    border-radius:10px;

    padding:10px;

    margin-bottom:15px;

    font-size:20px;

}

/* =========================
   GRID 2x2
========================= */

.layout-cilindro{

    display:grid;

    grid-template-columns:1fr 1fr;

    grid-template-rows:1fr 1fr;

    gap:12px;

    width:100%;

}

/* cada posição */

.posicao-valvula{

    border:1px solid #ddd;

    border-radius:10px;

    padding:10px;

    background:#fafafa;

    text-align:center;

    min-width:0;

}

/* nome */

.tipo-valvula{

    background:#257500;

    color:white;

    border-radius:7px;

    padding:6px;

    font-size:16px;

    font-weight:bold;

    margin-bottom:10px;

}

/* medição */

.measurement{

    text-align:center;

    margin:10px 0;

    font-size:18px;

    background-color:#FFFACD;

    border-radius:8px;

    padding:5px;

    font-weight:bold;

    color:black;

}

.measurement input{

    width:120px;

    max-width:100%;

    padding:8px;

    text-align:center;

    font-size:18px;

    border:2px solid #FF8C00;

    border-radius:6px;

}

/* =========================
   FOTO
========================= */

.photo-box{

    width:100%;

    max-width:220px;

    height:180px;

    border:2px dashed #FF8C00;

    margin:10px auto;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    font-size:13px;

    color:#666;

    position:relative;

    background-size:cover;

    background-position:center;

    overflow:hidden;

    border-radius:10px;

}

.photo-box input[type="file"]{

    position:absolute;

    width:100%;

    height:100%;

    opacity:0;

    cursor:pointer;

    top:0;

    left:0;

}

.photo-label{

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    text-align:center;

    background-color:#257500;

    color:white;

    font-weight:bold;

    font-size:12px;

    padding:4px 0;

}

.remove-photo{

    display:inline-block;

    background:#FF4500;

    color:#fff;

    border:none;

    padding:6px 9px;

    font-size:11px;

    cursor:pointer;

    border-radius:5px;

}

/* =========================
   JPG
========================= */

.btn-jpg{

    display:block;

    width:100%;

    margin-top:15px;

    background:#257500;

    color:white;

    border:none;

    padding:13px;

    font-size:16px;

    font-weight:bold;

    border-radius:8px;

    cursor:pointer;

}

.btn-jpg:hover{

    background:#FF4500;

}

/* =========================
   OBSERVAÇÕES
========================= */

.obs{

    margin-top:30px;

    font-style:italic;

    background-color:#FFFACD;

    padding:10px;

    border-radius:6px;

    border:1px solid #FF8C00;

}

/* =========================
   BOTÕES
========================= */

.button-container{

    margin-top:20px;

    text-align:center;

    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;

}

button{

    background-color:#257500;

    color:white;

    border:none;

    padding:10px 20px;

    margin:0 5px;

    font-size:16px;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;

    transition:all .3s ease;

}

button:hover{

    background-color:#FF4500;

}

button.clear-btn{

    background-color:#FF4500;

}

/* =========================
   ASSINATURA
========================= */

.signature{

    margin:50px auto 20px;

    border-top:2px solid #FF8C00;

    width:320px;

    padding-top:5px;

    text-align:center;

    font-weight:bold;

    font-size:16px;

    position:relative;

}

#assinatura{

    position:absolute;

    top:-36px;

    left:0;

    width:320px;

    border:none;

    font-size:28px;

    text-align:center;

    background:transparent;

    outline:none;

    font-family:'Brush Script MT',cursive,Arial,sans-serif;

    color:#257500;

}

#assinatura::placeholder{

    color:#999;

}

/* =========================
   CELULAR
========================= */

@media(max-width:700px){

    body{

        padding:10px;

    }

    h1{

        font-size:19px;

        padding:10px;

    }

    .info-table{

        display:block;

        overflow-x:auto;

    }

    .info-table table{

        width:100%;

    }

    .info-table td{

        display:block;

        width:100%;

    }

    .info-table input{

        max-width:100%;

    }

    .navegacao-cilindro{

        position:sticky;

        top:0;

        z-index:100;

        background:#f3f3f3;

        padding:8px 0;

    }

    .btn-navegacao{

        font-size:12px;

        padding:12px 5px;

    }

    .indicador-cilindro{

        min-width:70px;

        font-size:15px;

    }

    .valve-section{

        padding:10px;

    }

    .layout-cilindro{

        grid-template-columns:1fr 1fr;

        grid-template-rows:1fr 1fr;

        gap:7px;

    }

    .posicao-valvula{

        padding:6px;

    }

    .tipo-valvula{

        font-size:12px;

        padding:5px 2px;

    }

    .measurement{

        font-size:14px;

        padding:3px;

    }

    .measurement input{

        width:90px;

        font-size:16px;

        padding:7px 3px;

    }

    .photo-box{

        height:130px;

        width:100%;

        font-size:11px;

    }

    .remove-photo{

        font-size:9px;

        padding:5px;

    }

    .btn-jpg{

        font-size:14px;

    }

}

/* =========================
   DESTAQUE
========================= */

.marcacao-vermelha{

    color:red !important;

    font-weight:bold !important;

}

</style>

</head>

ACIMA DE

<!-- =========================

<div class="cilindros-wrapper">

class="btn-navegacao"

>

Gerar PDF

ASSINATURA DO MECÂNICO:

<input
type="text"

/>

</div>

<script>

const { jsPDF } = window.jspdf;

let cilindroAtual = 1;

const totalCilindros = 6;

/* =========================
   CRIA CILINDROS
========================= */

function criarCilindros(){

    const container =
        document.getElementById(
            "valveContainer"
        );

    container.innerHTML = "";

    for(
        let i=1;
        i<=totalCilindros;
        i++
    ){

        const section =
            document.createElement(
                "div"
            );

        section.className =
            "valve-section";

        section.id =
            "cilindro-" + i;

        if(i === 1){

            section.classList.add(
                "ativo"
            );

        }

        section.innerHTML = `

            <div class="cilindro-label">

                CILINDRO ${i}

            </div>

            <div class="layout-cilindro">

                ${criarPosicao(
                    "exaustao",
                    i,
                    2,
                    "EXAUSTÃO 2"
                )}

                ${criarPosicao(
                    "admissao",
                    i,
                    2,
                    "ADMISSÃO 2"
                )}

                ${criarPosicao(
                    "exaustao",
                    i,
                    1,
                    "EXAUSTÃO 1"
                )}

                ${criarPosicao(
                    "admissao",
                    i,
                    1,
                    "ADMISSÃO 1"
                )}

            </div>

            <button
                class="btn-jpg"
                onclick="gerarJpgCilindro(${i})"
            >

                📷 GERAR JPG CILINDRO ${i}

            </button>

        `;

        container.appendChild(
            section
        );

    }

}

/* =========================
   POSIÇÃO DA VÁLVULA
========================= */

function criarPosicao(
    tipo,
    cilindro,
    numero,
    nome
){

    const id =
        tipo +
        cilindro +
        "_" +
        numero;

    const photoId =
        "photo" +
        tipo +
        cilindro +
        "_" +
        numero;

    return `

        <div class="posicao-valvula">

            <div class="tipo-valvula">

                ${nome}

            </div>

            <div class="photo-box"
                 id="${photoId}">

                Clique para adicionar foto

                <div class="photo-label">

                    ${nome}

                </div>

                <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="loadPhoto(event,'${photoId}')"
                >

            </div>

            <button
                class="remove-photo"
                onclick="removePhoto('${photoId}')"
            >

                REMOVER FOTO

            </button>

            <div class="measurement">

                <input
                    type="text"
                    id="${id}"
                    placeholder="Medição"
                >

            </div>

        </div>

    `;

}

/* =========================
   NAVEGAÇÃO
========================= */

function mostrarCilindro(numero){

    if(
        numero < 1 ||
        numero > totalCilindros
    ){

        return;

    }

    document.querySelectorAll(
        ".valve-section"
    ).forEach(
        section => {

            section.classList.remove(
                "ativo"
            );

        }
    );

    const cilindro =
        document.getElementById(
            "cilindro-" + numero
        );

    if(cilindro){

        cilindro.classList.add(
            "ativo"
        );

    }

    cilindroAtual =
        numero;

    document.getElementById(
        "indicadorCilindro"
    ).innerText =
        "CILINDRO " +
        numero +
        " / " +
        totalCilindros;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function cilindroAnterior(){

    if(cilindroAtual > 1){

        mostrarCilindro(
            cilindroAtual - 1
        );

    }

}

function proximoCilindro(){

    if(
        cilindroAtual <
        totalCilindros
    ){

        mostrarCilindro(
            cilindroAtual + 1
        );

    }

}

/* =========================
   FOTOS
========================= */

function loadPhoto(
    event,
    id
){

    const box =
        document.getElementById(
            id
        );

    const file =
        event.target.files[0];

    if(file){

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                box.style.backgroundImage =
                    `url("${e.target.result}")`;

                box.style.backgroundSize =
                    "cover";

                box.style.backgroundPosition =
                    "center";

            };

        reader.readAsDataURL(
            file
        );

    }

}

function removePhoto(id){

    const box =
        document.getElementById(
            id
        );

    if(!box)
        return;

    box.style.backgroundImage =
        "";

    box.innerHTML = `

        Clique para adicionar foto

        <div class="photo-label">

            ${obterNomeFoto(id)}

        </div>

        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}

function obterNomeFoto(id){

    if(
        id.includes("exaustao")
    ){

        const partes =
            id.replace(
                "photoexaustao",
                ""
            );

        const numero =
            partes.split("_")[1];

        return "EXAUSTÃO " + numero;

    }

    if(
        id.includes("admissao")
    ){

        const partes =
            id.replace(
                "photoadmissao",
                ""
            );

        const numero =
            partes.split("_")[1];

        return "ADMISSÃO " + numero;

    }

    return "";

}

/* =========================
   RETÂNGULO
========================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    if(
        typeof radius ===
        "undefined"
    ){

        radius = 5;

    }

    if(
        typeof radius ===
        "number"
    ){

        radius = {

            tl:radius,
            tr:radius,
            br:radius,
            bl:radius

        };

    }

    ctx.beginPath();

    ctx.moveTo(
        x + radius.tl,
        y
    );

    ctx.lineTo(
        x + width - radius.tr,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius.tr
    );

    ctx.lineTo(
        x + width,
        y + height - radius.br
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius.br,
        y + height
    );

    ctx.lineTo(
        x + radius.bl,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius.bl
    );

    ctx.lineTo(
        x,
        y + radius.tl
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius.tl,
        y
    );

    ctx.closePath();

    if(fill)
        ctx.fill();

    if(stroke)
        ctx.stroke();

}

/* =========================
   GERAR PDF
========================= */

document.getElementById(
    "generatePdf"
).addEventListener(
    "click",
    async function(){

        const pdf =
            new jsPDF({
                unit:"mm",
                format:"a4"
            });

        const img =
            new Image();

        img.crossOrigin =
            "anonymous";

        img.src =
            "https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg";

        await new Promise(
            resolve =>
                img.onload =
                resolve
        );

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.width =
            img.width;

        canvas.height =
            img.height;

        const ctx =
            canvas.getContext(
                "2d"
            );

        ctx.drawImage(
            img,
            0,
            0
        );

        /* DADOS */

        ctx.font =
            "bold 18px Arial";

        ctx.fillStyle =
            "black";

        ctx.fillText(
            document.getElementById(
                "mecanico"
            ).value || "",
            208,
            176
        );

        ctx.fillText(
            document.getElementById(
                "usina"
            ).value || "",
            165,
            204
        );

        ctx.fillText(
            document.getElementById(
                "serie"
            ).value || "",
            165,
            231
        );

        ctx.fillText(
            "UGD- " +
            (
                document.getElementById(
                    "ugd"
                ).value || ""
            ),
            590,
            262
        );

        ctx.fillText(
            document.getElementById(
                "os"
            ).value || "",
            292,
            262
        );

        const dataVal =
            document.getElementById(
                "data"
            ).value;

        if(dataVal){

            ctx.fillText(
                new Date(
                    dataVal
                ).toLocaleDateString(
                    "pt-BR"
                ),
                888,
                204
            );

        }

        ctx.fillText(
            document.getElementById(
                "horimetro"
            ).value || "",
            798,
            231
        );

        /* MEDIÇÕES */

        const limiteMaximo =
            67.50;

        const campos = [

            ["exaustao1_1",105,616],
            ["exaustao1_2",105,576],
            ["admissao1_1",345,628],
            ["admissao1_2",345,589],

            ["exaustao2_1",450,1064],
            ["exaustao2_2",450,1024],
            ["admissao2_1",689,1075],
            ["admissao2_2",689,1038],

            ["exaustao3_1",792,617],
            ["exaustao3_2",792,576],
            ["admissao3_1",1032,628],
            ["admissao3_2",1032,589],

            ["exaustao4_1",793,1064],
            ["exaustao4_2",793,1024],
            ["admissao4_1",1033,1075],
            ["admissao4_2",1033,1038],

            ["exaustao5_1",450,617],
            ["exaustao5_2",450,576],
            ["admissao5_1",689,628],
            ["admissao5_2",689,589],

            ["exaustao6_1",105,1064],
            ["exaustao6_2",105,1024],
            ["admissao6_1",345,1075],
            ["admissao6_2",345,1038]

        ];

        campos.forEach(
            ([id,x,y]) => {

                const valRaw =
                    document.getElementById(
                        id
                    )?.value || "";

                const valNum =
                    parseFloat(
                        valRaw.replace(
                            ",",
                            "."
                        )
                    );

                ctx.fillStyle =
                    (
                        !isNaN(valNum) &&
                        valNum >= limiteMaximo
                    )
                        ? "red"
                        : "black";

                ctx.font =
                    (
                        !isNaN(valNum) &&
                        valNum >= limiteMaximo
                    )
                        ? "bold 18px Arial"
                        : "18px Arial";

                ctx.fillText(
                    valRaw,
                    x,
                    y
                );

            }
        );

        /* OBSERVAÇÕES */

        const obs =
            document.getElementById(
                "observacoes"
            ).value;

        const maxWidth =
            950;

        const lineHeight =
            26;

        const words =
            obs.split(" ");

        let line = "";

        let y = 1237;

        words.forEach(
            word => {

                const testLine =
                    line +
                    word +
                    " ";

                const metrics =
                    ctx.measureText(
                        testLine
                    );

                if(
                    metrics.width >
                    maxWidth
                ){

                    ctx.fillText(
                        line,
                        183,
                        y
                    );

                    line =
                        word + " ";

                    y +=
                        lineHeight;

                }
                else{

                    line =
                        testLine;

                }

            }
        );

        ctx.fillText(
            line,
            183,
            y
        );

        /* ASSINATURA */

        ctx.font =
            '40px "Brush Script MT", cursive';

        ctx.fillText(
            document.getElementById(
                "assinatura"
            ).value || "",
            760,
            1538
        );

        const imgData =
            canvas.toDataURL(
                "image/jpeg",
                1.0
            );

        pdf.addImage(
            imgData,
            "JPEG",
            0,
            0,
            pdf.internal.pageSize.getWidth(),
            pdf.internal.pageSize.getHeight()
        );

        pdf.save(
            "MEDICAO_VALVULAS.pdf"
        );

    }
);

/* =========================
   GERAR JPG CILINDRO
========================= */

async function gerarJpgCilindro(i){

    const imgSize =
        1280;

    const imgHeight =
        1900;

    const canvasCil =
        document.createElement(
            "canvas"
        );

    canvasCil.width =
        imgSize;

    canvasCil.height =
        imgHeight;

    const ctxCil =
        canvasCil.getContext(
            "2d"
        );

    ctxCil.fillStyle =
        "#fff";

    ctxCil.fillRect(
        0,
        0,
        imgSize,
        imgHeight
    );

    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];

    const legendas = [

        "EXAUSTÃO 2",
        "ADMISSÃO 2",
        "EXAUSTÃO 1",
        "ADMISSÃO 1"

    ];

    const pos = [

        [0,0],
        [imgSize/2,0],
        [0,imgHeight/2],
        [imgSize/2,imgHeight/2]

    ];

    for(
        let j=0;
        j<4;
        j++
    ){

        const box =
            document.getElementById(
                fotos[j]
            );

        const valInputId =
            fotos[j].replace(
                "photo",
                ""
            );

        const inputValEl =
            document.getElementById(
                valInputId
            );

        const val =
            inputValEl
                ? parseFloat(
                    inputValEl.value.replace(
                        ",",
                        "."
                    )
                )
                : null;

        if(
            box &&
            box.style.backgroundImage
        ){

            let imgUrl =
                box.style.backgroundImage
                    .replace(
                        /^url\(["']?/,
                        ""
                    )
                    .replace(
                        /["']?\)$/,
                        ""
                    );

            const imgEl =
                new Image();

            imgEl.src =
                imgUrl;

            await new Promise(
                resolve =>
                    imgEl.onload =
                    resolve
            );

            ctxCil.drawImage(
                imgEl,
                pos[j][0],
                pos[j][1],
                imgSize/2,
                imgHeight/2
            );

            const rectWidth =
                imgSize/2;

            const rectHeight =
                40;

            const rectX =
                pos[j][0];

            const rectY =
                pos[j][1] +
                imgHeight/2 -
                rectHeight;

            ctxCil.fillStyle =
                "white";

            ctxCil.strokeStyle =
                "black";

            ctxCil.lineWidth =
                2;

            roundRect(
                ctxCil,
                rectX,
                rectY,
                rectWidth,
                rectHeight,
                10,
                true,
                true
            );

            ctxCil.fillStyle =
                "black";

            ctxCil.font =
                "bold 30px Arial";

            ctxCil.textAlign =
                "center";

            ctxCil.textBaseline =
                "middle";

            ctxCil.fillText(
                legendas[j],
                rectX +
                rectWidth/2,
                rectY +
                rectHeight/2
            );

            if(
                val !== null &&
                val >= 67.50
            ){

                const desc =
                    `AFUNDAMENTO (${val.toFixed(2).replace(".",",")}mm)`;

                const metrics =
                    ctxCil.measureText(
                        desc
                    );

                const padding =
                    10;

                const txtWidth =
                    metrics.width +
                    padding * 2;

                const txtHeight =
                    40;

                const txtX =
                    pos[j][0] +
                    (
                        imgSize/2 -
                        txtWidth
                    ) / 2;

                const txtY =
                    rectY -
                    txtHeight -
                    10;

                ctxCil.fillStyle =
                    "#FFFFFF";

                roundRect(
                    ctxCil,
                    txtX,
                    txtY,
                    txtWidth,
                    txtHeight,
                    10,
                    true,
                    true
                );

                ctxCil.fillStyle =
                    "red";

                ctxCil.fillText(
                    desc,
                    txtX +
                    txtWidth/2,
                    txtY +
                    txtHeight/2
                );

            }

        }

    }

    /* TÍTULO */

    const numText =
        `CILINDRO ${i}`;

    ctxCil.font =
        "bold 50px Arial";

    const numWidth =
        ctxCil.measureText(
            numText
        ).width;

    const numPadding =
        20;

    const rectHeight =
        60;

    const rectX =
        (
            imgSize -
            numWidth
        ) / 2 -
        numPadding;

    const rectY =
        5;

    ctxCil.fillStyle =
        "white";

    ctxCil.strokeStyle =
        "black";

    ctxCil.lineWidth =
        2;

    roundRect(
        ctxCil,
        rectX,
        rectY,
        numWidth +
        numPadding * 2,
        rectHeight,
        15,
        true,
        true
    );

    ctxCil.fillStyle =
        "black";

    ctxCil.textAlign =
        "center";

    ctxCil.textBaseline =
        "middle";

    ctxCil.fillText(
        numText,
        imgSize/2,
        rectY +
        rectHeight/2
    );

    const link =
        document.createElement(
            "a"
        );

    link.download =
        `CILINDRO${i}.jpg`;

    link.href =
        canvasCil.toDataURL(
            "image/jpeg",
            0.95
        );

    link.click();

}

                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${id}')"
                    >

                `;

            }
        );

        mostrarCilindro(1);

    }
);

/* =========================
   DESTAQUE AUTOMÁTICO
========================= */

function atualizarDestaque(
    input
){

    const valor =
        parseFloat(
            input.value.replace(
                ",",
                "."
            )
        );

    if(
        !isNaN(valor) &&
        valor >= 67.50
    ){

        input.classList.add(
            "marcacao-vermelha"
        );

    }
    else{

        input.classList.remove(
            "marcacao-vermelha"
        );

    }

}

document.addEventListener(
    "input",
    function(event){

        if(
            event.target.matches(
                'input[type="text"]'
            )
        ){

            atualizarDestaque(
                event.target
            );

        }

    }
);

criarCilindros();

mostrarCilindro(1);
