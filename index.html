<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Medição de Válvulas - Scania 550</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;
    padding:12px;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:
    linear-gradient(
        145deg,
        #eef2f0,
        #dce4df
    );

    color:#202522;

}

/* =========================================================
   CONTAINER PRINCIPAL
========================================================= */

.app{

    width:100%;
    max-width:850px;

    margin:auto;

}

/* =========================================================
   CABEÇALHO
========================================================= */

.header{

    background:
    linear-gradient(
        145deg,
        #16833f,
        #075c2b
    );

    color:white;

    border-radius:18px;

    padding:18px 16px;

    margin-bottom:12px;

    box-shadow:
    0 8px 18px rgba(0,0,0,.20),
    inset 0 1px 1px rgba(255,255,255,.25);

    position:relative;

    overflow:hidden;

}

.header::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-70px;
    top:-100px;

    background:
    rgba(255,255,255,.08);

    border-radius:50%;

}

.header h1{

    margin:0;

    text-align:center;

    font-size:21px;

    letter-spacing:.5px;

    position:relative;

}

.header p{

    margin:6px 0 0;

    text-align:center;

    font-size:12px;

    opacity:.85;

}

/* =========================================================
   CARD DE INFORMAÇÕES
========================================================= */

.card{

    background:white;

    border-radius:16px;

    padding:14px;

    margin-bottom:12px;

    box-shadow:
    0 5px 15px rgba(0,0,0,.10);

    border:1px solid rgba(0,0,0,.05);

}

.card-title{

    font-size:13px;

    font-weight:bold;

    color:#075c2b;

    margin-bottom:10px;

    text-transform:uppercase;

    letter-spacing:.4px;

}

/* =========================================================
   CAMPOS
========================================================= */

.info-grid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:9px;

}

.field{

    display:flex;

    flex-direction:column;

}

.field label{

    font-size:11px;

    font-weight:bold;

    color:#5c655f;

    margin-bottom:4px;

}

.field input{

    width:100%;

    height:42px;

    border:1px solid #cfd6d1;

    border-radius:9px;

    padding:8px 10px;

    font-size:15px;

    background:#f8faf9;

    outline:none;

    transition:.2s;

}

.field input:focus{

    border-color:#16833f;

    background:white;

    box-shadow:
    0 0 0 3px rgba(22,131,63,.10);

}

/* =========================================================
   AVISO
========================================================= */

.limite{

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:#f7faf8;

    border:1px solid #dce5df;

    border-radius:10px;

    padding:9px;

    margin-bottom:12px;

    font-size:12px;

}

.limite strong{

    color:#075c2b;

}

.limite .danger{

    color:#d71920;

    font-weight:bold;

}

/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navegacao{

    display:grid;

    grid-template-columns:
    1fr auto 1fr;

    gap:8px;

    align-items:center;

    margin-bottom:12px;

}

.nav-btn{

    height:42px;

    border:none;

    border-radius:10px;

    background:
    linear-gradient(
        145deg,
        #16833f,
        #075c2b
    );

    color:white;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 4px 8px rgba(0,0,0,.16);

}

.nav-btn:active{

    transform:translateY(1px);

}

.nav-btn:disabled{

    opacity:.35;

    box-shadow:none;

}

.indicador{

    height:42px;

    min-width:100px;

    padding:0 12px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    border-radius:10px;

    font-size:12px;

    font-weight:bold;

    color:#075c2b;

    box-shadow:
    0 4px 10px rgba(0,0,0,.08);

}

/* =========================================================
   CILINDRO
========================================================= */

.valve-section{

    background:white;

    border-radius:18px;

    padding:12px;

    box-shadow:
    0 8px 18px rgba(0,0,0,.12);

    border:1px solid rgba(0,0,0,.05);

    margin-bottom:12px;

}

.cilindro-label{

    width:max-content;

    min-width:130px;

    margin:0 auto 12px;

    padding:7px 18px;

    text-align:center;

    border-radius:9px;

    background:
    linear-gradient(
        145deg,
        #16833f,
        #075c2b
    );

    color:white;

    font-size:14px;

    font-weight:bold;

    box-shadow:
    0 4px 8px rgba(0,0,0,.15);

}

/* =========================================================
   GRID DAS VÁLVULAS
========================================================= */

.layout-cilindro{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:8px;

}

/* =========================================================
   BLOCO DA VÁLVULA
========================================================= */

.valvula-bloco{

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #f1f4f2
    );

    border:1px solid #dce2de;

    border-radius:12px;

    padding:7px;

    box-shadow:
    0 3px 7px rgba(0,0,0,.07);

}

.valvula-titulo{

    background:#075c2b;

    color:white;

    text-align:center;

    padding:6px 3px;

    border-radius:7px;

    font-size:11px;

    font-weight:bold;

}

/* =========================================================
   FOTO
========================================================= */

.photo-box{

    width:100%;

    aspect-ratio:1 / 1;

    max-height:145px;

    margin:7px auto;

    border:2px dashed #c4ccc6;

    border-radius:9px;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    overflow:hidden;

    background-color:#f5f7f6;

    background-size:cover;

    background-position:center;

    color:#7a817c;

    font-size:10px;

    text-align:center;

}

.photo-box input[type=file]{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    opacity:0;

    cursor:pointer;

}

.photo-label{

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    background:
    rgba(7,92,43,.90);

    color:white;

    padding:4px;

    font-size:9px;

    font-weight:bold;

    text-align:center;

}

/* =========================================================
   MEDIÇÃO
========================================================= */

.measurement{

    margin-top:5px;

}

.measurement-label{

    display:block;

    text-align:center;

    font-size:10px;

    color:#6b726d;

    margin-bottom:3px;

    font-weight:bold;

}

.measurement input{

    display:block;

    width:100%;

    height:42px;

    border-radius:8px;

    border:2px solid #d5ddd7;

    background:#fff;

    text-align:center;

    font-size:18px;

    font-weight:bold;

    color:#202522;

    outline:none;

}

.measurement input:focus{

    border-color:#16833f;

    box-shadow:
    0 0 0 3px rgba(22,131,63,.10);

}

/* MEDIÇÃO FORA DO LIMITE */

.measurement input.afundamento{

    border-color:#d71920;

    background:#fff5f5;

    color:#d71920;

}

/* =========================================================
   BOTÃO REMOVER FOTO
========================================================= */

.remove-photo{

    width:100%;

    border:none;

    background:#f0f2f1;

    color:#777;

    border-radius:6px;

    padding:5px;

    font-size:9px;

    font-weight:bold;

    cursor:pointer;

}

/* =========================================================
   BOTÃO JPG
========================================================= */

.btn-jpg{

    display:block;

    width:100%;

    height:43px;

    margin-top:11px;

    border:none;

    border-radius:9px;

    background:
    linear-gradient(
        145deg,
        #16833f,
        #075c2b
    );

    color:white;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 5px 10px rgba(0,0,0,.15);

}

.btn-jpg:active{

    transform:translateY(1px);

}

/* =========================================================
   OBSERVAÇÕES
========================================================= */

textarea{

    width:100%;

    min-height:90px;

    resize:vertical;

    border:1px solid #d0d8d3;

    border-radius:9px;

    padding:10px;

    font-size:14px;

    outline:none;

    background:#f8faf9;

}

textarea:focus{

    border-color:#16833f;

    background:white;

}

/* =========================================================
   ASSINATURA
========================================================= */

.signature{

    position:relative;

    margin-top:35px;

    border-top:1px solid #999;

    padding-top:7px;

    text-align:center;

    font-size:11px;

    color:#555;

}

#assinatura{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    top:-35px;

    width:90%;

    border:none;

    outline:none;

    background:transparent;

    text-align:center;

    font-family:
    "Brush Script MT",
    cursive;

    font-size:27px;

    color:#075c2b;

}

/* =========================================================
   BOTÕES FINAIS
========================================================= */

.action-buttons{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:8px;

    margin-top:15px;

}

.action-buttons button{

    height:46px;

    border:none;

    border-radius:10px;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

}

#generatePdf{

    background:
    linear-gradient(
        145deg,
        #16833f,
        #075c2b
    );

    color:white;

    box-shadow:
    0 5px 10px rgba(0,0,0,.15);

}

.clear-btn{

    background:#e5e8e6;

    color:#555;

}

/* =========================================================
   MENSAGEM
========================================================= */

.download-mensagem{

    position:fixed;

    left:50%;

    bottom:18px;

    transform:translateX(-50%);

    background:
    #075c2b;

    color:white;

    padding:12px 18px;

    border-radius:10px;

    font-size:12px;

    font-weight:bold;

    box-shadow:
    0 8px 20px rgba(0,0,0,.25);

    z-index:9999;

    display:none;

    text-align:center;

    min-width:220px;

}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:901px){

    body{

        padding:25px;

    }

    .header h1{

        font-size:25px;

    }

    .photo-box{

        max-height:none;

    }

}

/* =========================================================
   CELULAR PEQUENO
========================================================= */

@media(max-width:380px){

    body{

        padding:7px;

    }

    .info-grid{

        grid-template-columns:1fr;

    }

    .header h1{

        font-size:18px;

    }

    .nav-btn{

        font-size:10px;

    }

    .indicador{

        min-width:85px;

        font-size:10px;

    }

    .photo-box{

        font-size:9px;

    }

    .measurement input{

        height:38px;

        font-size:16px;

    }

}

</style>

</head>

<body>

<div class="app">

<!-- =====================================================
     CABEÇALHO
===================================================== -->

<div class="header">

    <h1>MEDIÇÃO DAS VÁLVULAS</h1>

    <p>SCANIA 550 • UTE MAUÉS</p>

</div>


<!-- =====================================================
     INFORMAÇÕES
===================================================== -->

<div class="card">

    <div class="card-title">
        Dados da inspeção
    </div>

    <div class="info-grid">

        <div class="field">

            <label>MECÂNICO</label>

            <input
                type="text"
                id="mecanico"
            >

        </div>

        <div class="field">

            <label>DATA</label>

            <input
                type="date"
                id="data"
            >

        </div>

        <div class="field">

            <label>USINA</label>

            <input
                type="text"
                id="usina"
                value="UTE MAUÉS"
            >

        </div>

        <div class="field">

            <label>HORÍMETRO</label>

            <input
                type="text"
                id="horimetro"
                inputmode="numeric"
            >

        </div>

        <div class="field">

            <label>SÉRIE</label>

            <input
                type="text"
                id="serie"
            >

        </div>

        <div class="field">

            <label>OS</label>

            <input
                type="text"
                id="os"
                inputmode="numeric"
            >

        </div>

        <div class="field">

            <label>UGD</label>

            <input
                type="text"
                id="ugd"
                placeholder="Ex.: 01"
                inputmode="numeric"
            >

        </div>

    </div>

</div>


<!-- =====================================================
     LIMITE
===================================================== -->

<div class="limite">

    <span>

        Faixa aceitável:
        <strong>64,00 a 67,50 mm</strong>

        &nbsp;|&nbsp;

        <span class="danger">
            ≥ 67,50 mm = SUBSTITUIÇÃO
        </span>

    </span>

</div>


<!-- =====================================================
     NAVEGAÇÃO
===================================================== -->

<div class="navegacao">

    <button
        class="nav-btn"
        id="btnAnterior"
        onclick="cilindroAnterior()"
    >
        ← ANTERIOR
    </button>

    <div
        class="indicador"
        id="indicadorCilindro"
    >
        CILINDRO 1 / 6
    </div>

    <button
        class="nav-btn"
        id="btnProximo"
        onclick="proximoCilindro()"
    >
        PRÓXIMO →
    </button>

</div>


<!-- =====================================================
     CILINDROS
===================================================== -->

<div
    class="valve-container"
    id="valveContainer"
></div>


<!-- =====================================================
     OBSERVAÇÕES
===================================================== -->

<div class="card">

    <div class="card-title">
        Observações
    </div>

    <textarea
        id="observacoes"
        placeholder="Digite alguma observação da inspeção..."
    ></textarea>

    <div class="signature">

        ASSINATURA DO MECÂNICO

        <input
            type="text"
            id="assinatura"
            placeholder="Digite seu nome"
        >

    </div>

</div>


<!-- =====================================================
     BOTÕES
===================================================== -->

<div class="action-buttons">

    <button id="generatePdf">
        GERAR PDF
    </button>

    <button
        id="clearBtn"
        class="clear-btn"
    >
        LIMPAR
    </button>

</div>


</div>


<!-- =====================================================
     MENSAGEM
===================================================== -->

<div
    class="download-mensagem"
    id="downloadMensagem"
></div>


<script>

const { jsPDF } = window.jspdf;


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const LIMITE = 67.50;

let cilindroAtual = 1;


/* =========================================================
   CRIAR CILINDROS
========================================================= */

const container =
document.getElementById("valveContainer");


for(let i = 1; i <= 6; i++){

    const section =
    document.createElement("div");

    section.className =
    "valve-section";

    section.id =
    "cilindro-" + i;

    section.style.display =
    i === 1
    ? "block"
    : "none";


    section.innerHTML = `

        <div class="cilindro-label">

            CILINDRO ${i}

        </div>

    `;


    const layout =
    document.createElement("div");

    layout.className =
    "layout-cilindro";


    const posicoes = [

        {
            tipo:"exaustao",
            numero:2
        },

        {
            tipo:"admissao",
            numero:2
        },

        {
            tipo:"exaustao",
            numero:1
        },

        {
            tipo:"admissao",
            numero:1
        }

    ];


    posicoes.forEach(pos => {

        const nome =
        pos.tipo === "exaustao"
        ? "EXAUSTÃO"
        : "ADMISSÃO";


        const id =
        `${pos.tipo}${i}_${pos.numero}`;


        const photoId =
        `photo${id}`;


        const bloco =
        document.createElement("div");


        bloco.className =
        "valvula-bloco";


        bloco.innerHTML = `

            <div class="valvula-titulo">

                ${nome} ${pos.numero}

            </div>


            <div
                class="photo-box"
                id="${photoId}"
            >

                Clique para adicionar foto

                <div class="photo-label">

                    ${nome} ${pos.numero}

                </div>

                <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="loadPhoto(event,'${id}')"
                >

            </div>


            <div class="measurement">

                <span class="measurement-label">
                    MEDIÇÃO (mm)
                </span>

                <input
                    type="text"
                    id="${id}"
                    inputmode="decimal"
                    placeholder="00,00"
                    oninput="atualizarDestaque(this)"
                >

            </div>


            <button
                class="remove-photo"
                onclick="removePhoto('${id}')"
            >
                REMOVER FOTO
            </button>

        `;


        layout.appendChild(bloco);

    });


    section.appendChild(layout);


    const btn =
    document.createElement("button");


    btn.className =
    "btn-jpg";


    btn.textContent =
    `📷 GERAR IMAGEM DO CILINDRO ${i}`;


    btn.onclick =
    () => gerarJpgCilindro(i);


    section.appendChild(btn);


    container.appendChild(section);

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function atualizarCilindro(){

    for(let i = 1; i <= 6; i++){

        const el =
        document.getElementById(
            "cilindro-" + i
        );

        if(el){

            el.style.display =
            i === cilindroAtual
            ? "block"
            : "none";

        }

    }


    document.getElementById(
        "indicadorCilindro"
    ).textContent =
    `CILINDRO ${cilindroAtual} / 6`;


    document.getElementById(
        "btnAnterior"
    ).disabled =
    cilindroAtual === 1;


    document.getElementById(
        "btnProximo"
    ).disabled =
    cilindroAtual === 6;


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


function proximoCilindro(){

    if(cilindroAtual < 6){

        cilindroAtual++;

        atualizarCilindro();

    }

}


function cilindroAnterior(){

    if(cilindroAtual > 1){

        cilindroAtual--;

        atualizarCilindro();

    }

}


/* =========================================================
   FOTO
========================================================= */

function loadPhoto(event,id){

    const file =
    event.target.files[0];

    if(!file)
        return;


    const box =
    document.getElementById(
        "photo" + id
    );


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        box.style.backgroundImage =
        `url("${e.target.result}")`;

    };


    reader.readAsDataURL(file);

}


/* =========================================================
   REMOVER FOTO
========================================================= */

function removePhoto(id){

    const box =
    document.getElementById(
        "photo" + id
    );


    const nome =
    id.includes("exaustao")
    ? "EXAUSTÃO"
    : "ADMISSÃO";


    const numero =
    id.endsWith("_1")
    ? "1"
    : "2";


    box.style.backgroundImage =
    "";


    box.innerHTML = `

        Clique para adicionar foto

        <div class="photo-label">

            ${nome} ${numero}

        </div>

        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}


/* =========================================================
   DESTAQUE DA MEDIÇÃO
========================================================= */

function atualizarDestaque(input){

    const valor =
    parseFloat(
        input.value
        .replace(",",".")
    );


    if(
        !isNaN(valor) &&
        valor >= LIMITE
    ){

        input.classList.add(
            "afundamento"
        );

    }
    else{

        input.classList.remove(
            "afundamento"
        );

    }

}


/* =========================================================
   RETÂNGULO ARREDONDADO
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
){

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();

}


/* =========================================================
   CARREGAR IMAGEM
========================================================= */

function carregarImagem(src){

    return new Promise(
        resolve => {

            const img =
            new Image();

            img.onload =
            () => resolve(img);

            img.onerror =
            () => resolve(null);

            img.src = src;

        }
    );

}


/* =========================================================
   GERAR JPG
========================================================= */

async function gerarJpgCilindro(i){

    const largura = 1400;

    const altura = 1200;

    const canvas =
    document.createElement("canvas");


    canvas.width =
    largura;

    canvas.height =
    altura;


    const ctx =
    canvas.getContext("2d");


    /* FUNDO */

    ctx.fillStyle =
    "#f2f4f3";

    ctx.fillRect(
        0,
        0,
        largura,
        altura
    );


    /* =====================================================
       TÍTULO DISCRETO E CENTRALIZADO
    ===================================================== */

    ctx.fillStyle =
    "#ffffff";

    roundRect(
        ctx,
        500,
        25,
        400,
        70,
        16
    );

    ctx.fill();

    ctx.strokeStyle =
    "#d5dcd7";

    ctx.stroke();


    ctx.fillStyle =
    "#075c2b";

    ctx.font =
    "bold 42px Arial";

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";

    ctx.fillText(
        `CILINDRO ${i}`,
        largura / 2,
        60
    );


    /* =====================================================
       QUADRANTES
    ===================================================== */

    const margemX = 35;

    const margemY = 120;

    const gap = 18;

    const boxW =
    (largura - margemX * 2 - gap) / 2;

    const boxH =
    (altura - margemY - 35 - gap) / 2;


    const posicoes = [

        {
            id:`photoexaustao${i}_2`,
            med:`exaustao${i}_2`,
            nome:"EXAUSTÃO 2",
            x:margemX,
            y:margemY
        },

        {
            id:`photoadmissao${i}_2`,
            med:`admissao${i}_2`,
            nome:"ADMISSÃO 2",
            x:margemX + boxW + gap,
            y:margemY
        },

        {
            id:`photoexaustao${i}_1`,
            med:`exaustao${i}_1`,
            nome:"EXAUSTÃO 1",
            x:margemX,
            y:margemY + boxH + gap
        },

        {
            id:`photoadmissao${i}_1`,
            med:`admissao${i}_1`,
            nome:"ADMISSÃO 1",
            x:margemX + boxW + gap,
            y:margemY + boxH + gap
        }

    ];


    for(
        const item of posicoes
    ){

        const photo =
        document.getElementById(
            item.id
        );


        const input =
        document.getElementById(
            item.med
        );


        const valorTexto =
        input
        ? input.value.trim()
        : "";


        const valor =
        parseFloat(
            valorTexto.replace(",",".")
        );


        /* =================================================
           CARD
        ================================================= */

        ctx.fillStyle =
        "#ffffff";

        roundRect(
            ctx,
            item.x,
            item.y,
            boxW,
            boxH,
            18
        );

        ctx.fill();


        ctx.strokeStyle =
        "#d1d8d3";

        ctx.lineWidth = 2;

        ctx.stroke();


        /* =================================================
           IMAGEM
        ================================================= */

        let imagem = null;


        if(
            photo &&
            photo.style.backgroundImage
        ){

            let src =
            photo.style.backgroundImage;

            src =
            src
            .replace(/^url\(["']?/,"")
            .replace(/["']?\)$/,"");


            imagem =
            await carregarImagem(src);

        }


        const imgX =
        item.x + 10;

        const imgY =
        item.y + 52;

        const imgW =
        boxW - 20;

        const imgH =
        boxH - 62;


        if(imagem){

            ctx.save();


            roundRect(
                ctx,
                imgX,
                imgY,
                imgW,
                imgH,
                12
            );


            ctx.clip();


            const proporcao =
            Math.max(
                imgW / imagem.width,
                imgH / imagem.height
            );


            const larguraImg =
            imagem.width * proporcao;

            const alturaImg =
            imagem.height * proporcao;


            const drawX =
            imgX +
            (imgW - larguraImg) / 2;


            const drawY =
            imgY +
            (imgH - alturaImg) / 2;


            ctx.drawImage(
                imagem,
                drawX,
                drawY,
                larguraImg,
                alturaImg
            );


            ctx.restore();

        }
        else{

            ctx.fillStyle =
            "#f1f4f2";

            roundRect(
                ctx,
                imgX,
                imgY,
                imgW,
                imgH,
                12
            );

            ctx.fill();


            ctx.fillStyle =
            "#9aa39d";

            ctx.font =
            "22px Arial";

            ctx.textAlign =
            "center";

            ctx.textBaseline =
            "middle";


            ctx.fillText(
                "SEM FOTO",
                item.x + boxW/2,
                imgY + imgH/2
            );

        }


        /* =================================================
           TÍTULO DO QUADRANTE
        ================================================= */

        ctx.fillStyle =
        "#075c2b";

        roundRect(
            ctx,
            item.x + 10,
            item.y + 10,
            boxW - 20,
            32,
            8
        );

        ctx.fill();


        ctx.fillStyle =
        "#ffffff";

        ctx.font =
        "bold 18px Arial";

        ctx.textAlign =
        "center";

        ctx.textBaseline =
        "middle";


        ctx.fillText(
            item.nome,
            item.x + boxW/2,
            item.y + 26
        );


        /* =================================================
           MEDIÇÃO — SEMPRE APARECE
        ================================================= */

        const medBoxH = 48;

        const medBoxW = 220;

        const medX =
        item.x +
        (boxW - medBoxW) / 2;

        const medY =
        item.y +
        boxH -
        medBoxH -
        12;


        if(
            !isNaN(valor) &&
            valor >= LIMITE
        ){

            /* MEDIÇÃO COM AFUNDAMENTO */

            ctx.fillStyle =
            "#fff3f3";

            roundRect(
                ctx,
                medX,
                medY,
                medBoxW,
                medBoxH,
                10
            );

            ctx.fill();


            ctx.strokeStyle =
            "#d71920";

            ctx.lineWidth = 2;

            ctx.stroke();


            ctx.fillStyle =
            "#d71920";

            ctx.font =
            "bold 24px Arial";

            ctx.textAlign =
            "center";

            ctx.textBaseline =
            "middle";


            ctx.fillText(
                valor.toFixed(2).replace(".",",") + " mm",
                item.x + boxW/2,
                medY + 24
            );


            /* AVISO DISCRETO */

            ctx.fillStyle =
            "#d71920";

            ctx.font =
            "bold 16px Arial";


            ctx.fillText(
                "AFUNDAMENTO",
                item.x + boxW/2,
                medY - 12
            );

        }
        else{

            /* MEDIÇÃO NORMAL */

            ctx.fillStyle =
            "#f4f8f5";

            roundRect(
                ctx,
                medX,
                medY,
                medBoxW,
                medBoxH,
                10
            );

            ctx.fill();


            ctx.strokeStyle =
            "#16833f";

            ctx.lineWidth = 2;

            ctx.stroke();


            ctx.fillStyle =
            "#075c2b";

            ctx.font =
            "bold 24px Arial";

            ctx.textAlign =
            "center";

            ctx.textBaseline =
            "middle";


            ctx.fillText(

                valorTexto
                ? valorTexto.replace(".",",") + " mm"
                : "SEM MEDIÇÃO",

                item.x + boxW/2,
                medY + 24

            );

        }

    }


    /* =====================================================
       RODAPÉ
    ===================================================== */

    ctx.fillStyle =
    "#6c746f";

    ctx.font =
    "14px Arial";

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "alphabetic";


    ctx.fillText(
        "MEDIÇÃO DAS VÁLVULAS • SCANIA 550",
        largura / 2,
        altura - 12
    );


    /* =====================================================
       DOWNLOAD
    ===================================================== */

    canvas.toBlob(

        function(blob){

            if(!blob){

                alert(
                    "Não foi possível gerar a imagem."
                );

                return;

            }


            const url =
            URL.createObjectURL(blob);


            const link =
            document.createElement("a");


            link.href =
            url;


            link.download =
            `CILINDRO_${i}.jpg`;


            document.body.appendChild(link);


            link.click();


            document.body.removeChild(link);


            setTimeout(
                () => URL.revokeObjectURL(url),
                2000
            );


            mostrarMensagemDownload(
                `CILINDRO ${i}.jpg`
            );

        },

        "image/jpeg",

        0.95

    );

}


/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagemDownload(nome){

    const mensagem =
    document.getElementById(
        "downloadMensagem"
    );


    mensagem.innerHTML =
    `⬇️ ${nome}<br>Imagem gerada com sucesso`;


    mensagem.style.display =
    "block";


    setTimeout(
        () => {

            mensagem.style.display =
            "none";

        },
        3000
    );

}


/* =========================================================
   GERAR PDF
========================================================= */

document
.getElementById("generatePdf")
.addEventListener(
    "click",
    async function(){

        try{

            const pdf =
            new jsPDF({

                unit:"mm",
                format:"a4"

            });


            const img =
            new Image();


            img.crossOrigin =
            "anonymous";


            img.src =
            "https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg";


            await new Promise(
                (resolve,reject) => {

                    img.onload =
                    resolve;

                    img.onerror =
                    reject;

                }
            );


            const canvas =
            document.createElement("canvas");


            canvas.width =
            img.width;

            canvas.height =
            img.height;


            const ctx =
            canvas.getContext("2d");


            ctx.drawImage(
                img,
                0,
                0
            );


            /* =================================================
               DADOS
            ================================================= */

            ctx.font =
            "bold 18px Arial";

            ctx.fillStyle =
            "black";


            ctx.fillText(
                document.getElementById("mecanico").value || "",
                208,
                176
            );


            ctx.fillText(
                document.getElementById("usina").value || "",
                165,
                204
            );


            ctx.fillText(
                document.getElementById("serie").value || "",
                165,
                231
            );


            ctx.fillText(
                "UGD- " +
                (
                    document.getElementById("ugd").value || ""
                ),
                590,
                262
            );


            ctx.fillText(
                document.getElementById("os").value || "",
                292,
                262
            );


            const dataVal =
            document.getElementById("data").value;


            if(dataVal){

                const partes =
                dataVal.split("-");


                const dataBR =
                `${partes[2]}/${partes[1]}/${partes[0]}`;


                ctx.fillText(
                    dataBR,
                    888,
                    204
                );

            }


            ctx.fillText(
                document.getElementById("horimetro").value || "",
                798,
                231
            );


            /* =================================================
               MEDIÇÕES
            ================================================= */

            const campos = [

                ["exaustao1_1",105,616],
                ["exaustao1_2",105,576],
                ["admissao1_1",345,628],
                ["admissao1_2",345,589],

                ["exaustao2_1",450,1064],
                ["exaustao2_2",450,1024],
                ["admissao2_1",689,1075],
                ["admissao2_2",689,1038],

                ["exaustao3_1",792,617],
                ["exaustao3_2",792,576],
                ["admissao3_1",1032,628],
                ["admissao3_2",1032,589],

                ["exaustao4_1",793,1064],
                ["exaustao4_2",793,1024],
                ["admissao4_1",1033,1075],
                ["admissao4_2",1033,1038],

                ["exaustao5_1",450,617],
                ["exaustao5_2",450,576],
                ["admissao5_1",689,628],
                ["admissao5_2",689,589],

                ["exaustao6_1",105,1064],
                ["exaustao6_2",105,1024],
                ["admissao6_1",345,1075],
                ["admissao6_2",345,1038]

            ];


            campos.forEach(
                ([id,x,y]) => {

                    const el =
                    document.getElementById(id);


                    const valor =
                    el?.value || "";


                    const numero =
                    parseFloat(
                        valor.replace(",",".")
                    );


                    const afundamento =
                    !isNaN(numero) &&
                    numero >= LIMITE;


                    ctx.fillStyle =
                    afundamento
                    ? "red"
                    : "black";


                    ctx.font =
                    afundamento
                    ? "bold 18px Arial"
                    : "18px Arial";


                    ctx.fillText(
                        valor,
                        x,
                        y
                    );

                }
            );


            /* =================================================
               OBSERVAÇÕES
            ================================================= */

            const obs =
            document.getElementById(
                "observacoes"
            ).value;


            ctx.fillStyle =
            "black";

            ctx.font =
            "18px Arial";


            const maxWidth = 950;

            const lineHeight = 26;

            let linha = "";

            let y = 1237;


            const palavras =
            obs.split(/\s+/);


            palavras.forEach(
                palavra => {

                    const teste =
                    linha +
                    palavra +
                    " ";


                    if(
                        ctx.measureText(teste).width >
                        maxWidth
                    ){

                        ctx.fillText(
                            linha,
                            183,
                            y
                        );


                        linha =
                        palavra + " ";


                        y +=
                        lineHeight;

                    }
                    else{

                        linha =
                        teste;

                    }

                }
            );


            if(linha){

                ctx.fillText(
                    linha,
                    183,
                    y
                );

            }


            /* =================================================
               ASSINATURA
            ================================================= */

            ctx.font =
            '40px "Brush Script MT", cursive';


            ctx.fillStyle =
            "#075c2b";


            ctx.fillText(

                document.getElementById(
                    "assinatura"
                ).value || "",

                760,
                1538

            );


            /* =================================================
               PDF
            ================================================= */

            const imgData =
            canvas.toDataURL(
                "image/jpeg",
                1.0
            );


            pdf.addImage(

                imgData,
                "JPEG",
                0,
                0,

                pdf.internal.pageSize.getWidth(),
                pdf.internal.pageSize.getHeight()

            );


            pdf.save(
                "MEDICAO_VALVULAS.pdf"
            );

        }
        catch(error){

            console.error(error);

            alert(
                "Não foi possível gerar o PDF. Verifique sua conexão e tente novamente."
            );

        }

    }
);


/* =========================================================
   LIMPAR
========================================================= */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    function(){

        const confirmar =
        confirm(
            "Deseja realmente limpar toda a inspeção?"
        );


        if(!confirmar)
            return;


        document
        .querySelectorAll(
            "input[type=text], input[type=date], textarea"
        )
        .forEach(
            el => {

                if(el.id !== "usina"){

                    el.value = "";

                }

            }
        );


        document
        .querySelectorAll(
            ".measurement input"
        )
        .forEach(
            el => {

                el.classList.remove(
                    "afundamento"
                );

            }
        );


        document
        .querySelectorAll(
            ".photo-box"
        )
        .forEach(
            box => {

                const id =
                box.id.replace(
                    "photo",
                    ""
                );


                removePhoto(id);

            }
        );


        cilindroAtual = 1;

        atualizarCilindro();

    }
);


/* =========================================================
   INICIAR
========================================================= */

atualizarCilindro();

</script>
