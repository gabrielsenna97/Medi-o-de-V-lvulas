<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medição de Válvulas - Scania 550</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
========================================================= */

:root{

    --verde:#08783f;
    --verde-dark:#04572e;
    --verde-light:#0da85a;

    --laranja:#f28c00;
    --laranja-light:#ffad32;

    --vermelho:#d92323;

    --fundo:#eef2f0;
    --branco:#ffffff;

    --texto:#1d2923;
    --cinza:#68736d;

    --sombra:0 10px 30px rgba(0,0,0,.10);
    --sombra-forte:0 15px 35px rgba(0,0,0,.15);

}

*{
    box-sizing:border-box;
}

body{

    margin:0;
    padding:25px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #ffffff 0%,
            #eef2f0 45%,
            #dfe6e2 100%
        );

    color:var(--texto);

}

/* =========================================================
   CONTAINER PRINCIPAL
========================================================= */

body::before{

    content:"";

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:5px;

    background:
        linear-gradient(
            90deg,
            var(--verde-dark),
            var(--verde),
            var(--laranja)
        );

    z-index:9999;

}

.container{

    max-width:1200px;

    margin:auto;

}

/* =========================================================
   CABEÇALHO
========================================================= */

.header{

    background:
        linear-gradient(
            145deg,
            #0b7d43,
            #056332
        );

    color:white;

    padding:25px;

    border-radius:18px;

    box-shadow:var(--sombra-forte);

    position:relative;

    overflow:hidden;

    margin-bottom:20px;

}

.header::before{

    content:"";

    position:absolute;

    width:280px;
    height:280px;

    right:-100px;
    top:-140px;

    background:rgba(255,255,255,.08);

    border-radius:50%;

}

.header::after{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    left:-80px;
    bottom:-120px;

    background:rgba(255,255,255,.06);

    border-radius:50%;

}

.header-content{

    position:relative;

    z-index:2;

}

.header-title{

    font-size:27px;

    font-weight:800;

    letter-spacing:.5px;

    margin:0;

}

.header-subtitle{

    margin-top:7px;

    opacity:.85;

    font-size:14px;

}

.header-line{

    margin-top:18px;

    height:3px;

    width:100px;

    background:var(--laranja);

    border-radius:10px;

}

/* =========================================================
   CARDS
========================================================= */

.card{

    background:white;

    border-radius:16px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:var(--sombra);

    border:1px solid rgba(0,0,0,.05);

    transition:.25s;

}

.card:hover{

    box-shadow:
        0 15px 35px rgba(0,0,0,.13);

}

.card-title{

    display:flex;

    align-items:center;

    gap:10px;

    font-size:17px;

    font-weight:bold;

    color:var(--verde-dark);

    margin-bottom:18px;

}

.card-title::before{

    content:"";

    width:5px;

    height:22px;

    background:var(--laranja);

    border-radius:10px;

}

/* =========================================================
   INFORMAÇÕES
========================================================= */

.info-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

}

.field{

    display:flex;

    flex-direction:column;

    gap:6px;

}

.field label{

    font-size:12px;

    font-weight:bold;

    color:var(--cinza);

    text-transform:uppercase;

    letter-spacing:.4px;

}

.field input{

    width:100%;

    padding:12px 13px;

    border:1px solid #d5ddd8;

    border-radius:10px;

    background:#f8faf9;

    font-size:15px;

    color:var(--texto);

    outline:none;

    transition:.2s;

}

.field input:focus{

    border-color:var(--verde);

    background:white;

    box-shadow:
        0 0 0 3px rgba(8,120,63,.10);

}

/* =========================================================
   ALERTA TÉCNICO
========================================================= */

.limite-box{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    background:
        linear-gradient(
            135deg,
            #f5f8f6,
            #ffffff
        );

    border:1px solid #dce5df;

    border-radius:14px;

    padding:16px 20px;

}

.limite-info{

    display:flex;

    flex-direction:column;

    gap:5px;

}

.limite-titulo{

    font-weight:bold;

    font-size:14px;

    color:var(--verde-dark);

}

.limite-valor{

    font-size:23px;

    font-weight:800;

    color:var(--laranja);

}

.limite-aviso{

    font-size:13px;

    color:var(--cinza);

}

.limite-status{

    padding:10px 15px;

    border-radius:10px;

    background:#fff3e1;

    color:#a65d00;

    font-weight:bold;

    font-size:12px;

    white-space:nowrap;

}

/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navegacao-cilindros{

    display:grid;

    grid-template-columns:1fr auto 1fr;

    gap:12px;

    align-items:center;

    margin-bottom:18px;

}

.btn-navegacao{

    border:none;

    padding:13px 18px;

    border-radius:11px;

    background:
        linear-gradient(
            145deg,
            var(--verde),
            var(--verde-dark)
        );

    color:white;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 10px rgba(0,0,0,.12);

    transition:.2s;

}

.btn-navegacao:hover{

    transform:translateY(-2px);

    box-shadow:
        0 8px 15px rgba(0,0,0,.17);

}

.btn-navegacao:active{

    transform:translateY(1px);

}

.btn-navegacao:disabled{

    background:#b7bdb9;

    box-shadow:none;

    cursor:not-allowed;

    transform:none;

}

.indicador-cilindro{

    padding:12px 18px;

    background:white;

    border:1px solid #dce3df;

    border-radius:11px;

    color:var(--verde-dark);

    font-weight:800;

    font-size:14px;

    box-shadow:0 4px 10px rgba(0,0,0,.06);

    white-space:nowrap;

}

/* =========================================================
   CILINDRO
========================================================= */

.valve-section{

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f4f7f5
        );

    border:1px solid #dbe3de;

    border-radius:18px;

    padding:20px;

    box-shadow:
        0 12px 25px rgba(0,0,0,.10),
        inset 0 1px 0 white;

    animation:entrada .25s ease;

}

@keyframes entrada{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.cilindro-label{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    font-size:18px;

    font-weight:800;

    color:var(--verde-dark);

    margin-bottom:18px;

}

.cilindro-label::before,
.cilindro-label::after{

    content:"";

    height:1px;

    flex:1;

    background:#d7dfda;

}

.layout-cilindro{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;

}

/* =========================================================
   BLOCO VÁLVULA
========================================================= */

.valvula-bloco{

    background:white;

    border:1px solid #dce3df;

    border-radius:14px;

    padding:12px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.06);

    transition:.2s;

}

.valvula-bloco:hover{

    transform:translateY(-2px);

    box-shadow:
        0 9px 18px rgba(0,0,0,.10);

}

.valvula-titulo{

    text-align:center;

    padding:9px;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #0a8045,
            #056332
        );

    color:white;

    font-size:13px;

    font-weight:800;

    letter-spacing:.3px;

}

/* =========================================================
   FOTO
========================================================= */

.photo-box{

    width:100%;

    height:180px;

    margin:12px auto;

    border:2px dashed #d5ddd8;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:#8a948e;

    font-size:12px;

    position:relative;

    background-size:cover;

    background-position:center;

    background-color:#f7f9f8;

    overflow:hidden;

    transition:.2s;

}

.photo-box:hover{

    border-color:var(--laranja);

}

.photo-box input[type=file]{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    opacity:0;

    cursor:pointer;

}

.photo-label{

    position:absolute;

    left:8px;
    right:8px;
    bottom:8px;

    padding:7px;

    background:rgba(0,0,0,.65);

    color:white;

    border-radius:7px;

    font-size:11px;

    font-weight:bold;

}

/* =========================================================
   MEDIÇÃO
========================================================= */

.measurement{

    background:#f7f9f8;

    border:1px solid #e1e7e3;

    border-radius:10px;

    padding:10px;

}

.measurement-title{

    display:block;

    font-size:10px;

    font-weight:bold;

    color:var(--cinza);

    margin-bottom:5px;

    text-transform:uppercase;

}

.measurement input{

    width:100%;

    padding:11px;

    text-align:center;

    font-size:20px;

    font-weight:bold;

    border:2px solid #d8e0db;

    border-radius:8px;

    background:white;

    outline:none;

    transition:.2s;

}

.measurement input:focus{

    border-color:var(--laranja);

    box-shadow:
        0 0 0 3px rgba(242,140,0,.12);

}

.remove-photo{

    width:100%;

    margin-top:9px;

    padding:8px;

    border:none;

    border-radius:8px;

    background:#f0f2f1;

    color:#68736d;

    font-size:10px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.remove-photo:hover{

    background:#ffe4e4;

    color:var(--vermelho);

}

/* =========================================================
   OBSERVAÇÕES
========================================================= */

textarea{

    width:100%;

    min-height:120px;

    resize:vertical;

    padding:13px;

    border:1px solid #d5ddd8;

    border-radius:10px;

    font-family:Arial,sans-serif;

    font-size:14px;

    outline:none;

    background:#f8faf9;

}

textarea:focus{

    background:white;

    border-color:var(--verde);

    box-shadow:
        0 0 0 3px rgba(8,120,63,.10);

}

/* =========================================================
   ASSINATURA
========================================================= */

.signature-box{

    margin-top:25px;

    max-width:450px;

}

.signature-box label{

    display:block;

    font-size:12px;

    color:var(--cinza);

    font-weight:bold;

    margin-bottom:7px;

}

#assinatura{

    width:100%;

    border:none;

    border-bottom:2px solid var(--verde);

    border-radius:0;

    background:transparent;

    font-family:
        "Brush Script MT",
        cursive;

    font-size:27px;

    padding:5px;

    outline:none;

}

/* =========================================================
   BOTÕES FINAIS
========================================================= */

.button-container{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:20px;

}

button.main-btn{

    border:none;

    padding:15px;

    border-radius:11px;

    color:white;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}

.btn-pdf{

    background:
        linear-gradient(
            145deg,
            var(--verde),
            var(--verde-dark)
        );

}

.btn-limpar{

    background:
        linear-gradient(
            145deg,
            #e05252,
            #bd2424
        );

}

button.main-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 8px 18px rgba(0,0,0,.15);

}

/* =========================================================
   JPG
========================================================= */

.btn-jpg{

    display:block;

    width:100%;

    margin-top:15px;

    padding:11px;

    border:none;

    border-radius:9px;

    background:#edf2ef;

    color:var(--verde-dark);

    font-size:12px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.btn-jpg:hover{

    background:var(--verde);

    color:white;

}

/* =========================================================
   DOWNLOAD
========================================================= */

.download-mensagem{

    position:fixed;

    left:50%;

    bottom:25px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            145deg,
            var(--verde),
            var(--verde-dark)
        );

    color:white;

    padding:13px 20px;

    border-radius:11px;

    font-weight:bold;

    z-index:99999;

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);

    display:none;

    text-align:center;

    font-size:13px;

}

/* =========================================================
   CELULAR
========================================================= */

@media(max-width:800px){

    body{

        padding:10px;

    }

    .header{

        padding:20px;

        border-radius:14px;

    }

    .header-title{

        font-size:20px;

    }

    .info-grid{

        grid-template-columns:1fr 1fr;

    }

    .layout-cilindro{

        gap:8px;

    }

    .photo-box{

        height:125px;

    }

}

@media(max-width:500px){

    body{

        padding:7px;

    }

    .card{

        padding:12px;

        border-radius:13px;

    }

    .info-grid{

        grid-template-columns:1fr;

    }

    .navegacao-cilindros{

        grid-template-columns:1fr auto 1fr;

        gap:5px;

    }

    .btn-navegacao{

        padding:11px 5px;

        font-size:10px;

    }

    .indicador-cilindro{

        padding:10px 7px;

        font-size:11px;

    }

    .valve-section{

        padding:10px;

    }

    .layout-cilindro{

        grid-template-columns:1fr 1fr;

        gap:6px;

    }

    .valvula-bloco{

        padding:7px;

    }

    .valvula-titulo{

        font-size:10px;

        padding:7px 2px;

    }

    .photo-box{

        height:100px;

        font-size:9px;

    }

    .measurement input{

        font-size:16px;

        padding:8px;

    }

    .button-container{

        grid-template-columns:1fr;

    }

}

/* =========================================================
   MUITO PEQUENO
========================================================= */

@media(max-width:360px){

    .photo-box{

        height:85px;

    }

    .measurement input{

        font-size:14px;

    }

    .cilindro-label{

        font-size:15px;

    }

}

</style>

</head>

<body>

<div class="container">

<!-- ======================================================
     CABEÇALHO
======================================================= -->

<header class="header">

    <div class="header-content">

        <h1 class="header-title">
            MEDIÇÃO DAS VÁLVULAS
        </h1>

        <div class="header-subtitle">
            SCANIA 550 • FORMULÁRIO DE INSPEÇÃO TÉCNICA
        </div>

        <div class="header-line"></div>

    </div>

</header>


<!-- ======================================================
     DADOS DA INSPEÇÃO
======================================================= -->

<div class="card">

    <div class="card-title">
        Dados da inspeção
    </div>

    <div class="info-grid">

        <div class="field">

            <label>Mecânico</label>

            <input
                type="text"
                id="mecanico"
            >

        </div>

        <div class="field">

            <label>Data</label>

            <input
                type="date"
                id="data"
            >

        </div>

        <div class="field">

            <label>Usina</label>

            <input
                type="text"
                id="usina"
            >

        </div>

        <div class="field">

            <label>Horímetro</label>

            <input
                type="text"
                id="horimetro"
            >

        </div>

        <div class="field">

            <label>Série</label>

            <input
                type="text"
                id="serie"
            >

        </div>

        <div class="field">

            <label>OS</label>

            <input
                type="text"
                id="os"
            >

        </div>

        <div class="field">

            <label>UGD</label>

            <input
                type="text"
                id="ugd"
                placeholder="Ex.: 01"
            >

        </div>

    </div>

</div>


<!-- ======================================================
     LIMITE
======================================================= -->

<div class="card">

    <div class="limite-box">

        <div class="limite-info">

            <div class="limite-titulo">
                LIMITE DE INSPEÇÃO
            </div>

            <div class="limite-valor">
                64,00 — 67,50 mm
            </div>

            <div class="limite-aviso">
                Valores iguais ou superiores a 67,50 mm devem ser avaliados para substituição.
            </div>

        </div>

        <div class="limite-status">
            LIMITE: 67,50 mm
        </div>

    </div>

</div>


<!-- ======================================================
     NAVEGAÇÃO
======================================================= -->

<div class="navegacao-cilindros">

    <button
        class="btn-navegacao"
        id="btnAnterior"
        onclick="cilindroAnterior()"
    >
        ← ANTERIOR
    </button>

    <div
        class="indicador-cilindro"
        id="indicadorCilindro"
    >
        CILINDRO 1 / 6
    </div>

    <button
        class="btn-navegacao"
        id="btnProximo"
        onclick="proximoCilindro()"
    >
        PRÓXIMO →
    </button>

</div>


<!-- ======================================================
     CILINDROS
======================================================= -->

<div class="card">

    <div id="valveContainer"></div>

</div>


<!-- ======================================================
     OBSERVAÇÕES
======================================================= -->

<div class="card">

    <div class="card-title">
        Observações técnicas
    </div>

    <textarea
        id="observacoes"
        placeholder="Digite aqui as observações da inspeção..."
    ></textarea>

    <div class="signature-box">

        <label>
            ASSINATURA DO MECÂNICO
        </label>

        <input
            type="text"
            id="assinatura"
            placeholder="Digite seu nome"
        >

    </div>

</div>


<!-- ======================================================
     AÇÕES
======================================================= -->

<div class="button-container">

    <button
        id="generatePdf"
        class="main-btn btn-pdf"
    >
        📄 GERAR RELATÓRIO PDF
    </button>

    <button
        id="clearBtn"
        class="main-btn btn-limpar"
    >
        🗑 LIMPAR FORMULÁRIO
    </button>

</div>


<div
    class="download-mensagem"
    id="downloadMensagem"
>
</div>

</div>


<script>

const { jsPDF } = window.jspdf;


/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const LIMITE_MAXIMO = 67.50;

let cilindroAtual = 1;


/* =========================================================
   CRIAR CILINDROS
========================================================= */

const container =
    document.getElementById("valveContainer");


for(let i = 1; i <= 6; i++){

    const section =
        document.createElement("div");

    section.className =
        "valve-section";

    section.id =
        "cilindro-" + i;

    section.style.display =
        i === 1 ? "block" : "none";


    section.innerHTML = `

        <div class="cilindro-label">

            CILINDRO ${i}

        </div>

    `;


    const layout =
        document.createElement("div");

    layout.className =
        "layout-cilindro";


    const posicoes = [

        {
            tipo:"exaustao",
            j:2
        },

        {
            tipo:"admissao",
            j:2
        },

        {
            tipo:"exaustao",
            j:1
        },

        {
            tipo:"admissao",
            j:1
        }

    ];


    posicoes.forEach(({tipo,j}) => {

        const tipoNome =
            tipo === "exaustao"
            ? "EXAUSTÃO"
            : "ADMISSÃO";


        const idPhoto =
            tipo + i + "_" + j;


        const div =
            document.createElement("div");


        div.className =
            "valvula-bloco";


        div.innerHTML = `

            <div class="valvula-titulo">

                ${tipoNome} ${j}

            </div>


            <div
                class="photo-box"
                id="photo${idPhoto}"
            >

                Clique para adicionar foto

                <div class="photo-label">

                    ${tipoNome} ${j}

                </div>


                <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="loadPhoto(event,'${idPhoto}')"
                >

            </div>


            <div class="measurement">

                <span class="measurement-title">
                    Medição da válvula
                </span>

                <input
                    type="text"
                    id="${tipo}${i}_${j}"
                    placeholder="00,00 mm"
                    inputmode="decimal"
                >

            </div>


            <button
                class="remove-photo"
                onclick="removePhoto('${idPhoto}')"
            >
                REMOVER FOTO
            </button>

        `;


        layout.appendChild(div);

    });


    section.appendChild(layout);


    const btnJpg =
        document.createElement("button");


    btnJpg.className =
        "btn-jpg";


    btnJpg.textContent =
        `📷 GERAR IMAGEM DO CILINDRO ${i}`;


    btnJpg.onclick =
        () => gerarJpgCilindro(i);


    section.appendChild(btnJpg);


    container.appendChild(section);

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function atualizarCilindro(){

    for(let i=1; i<=6; i++){

        const cilindro =
            document.getElementById(
                "cilindro-" + i
            );

        if(cilindro){

            cilindro.style.display =
                i === cilindroAtual
                ? "block"
                : "none";

        }

    }


    document.getElementById(
        "indicadorCilindro"
    ).textContent =
        `CILINDRO ${cilindroAtual} / 6`;


    document.getElementById(
        "btnAnterior"
    ).disabled =
        cilindroAtual === 1;


    document.getElementById(
        "btnProximo"
    ).disabled =
        cilindroAtual === 6;


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


function proximoCilindro(){

    if(cilindroAtual < 6){

        cilindroAtual++;

        atualizarCilindro();

    }

}


function cilindroAnterior(){

    if(cilindroAtual > 1){

        cilindroAtual--;

        atualizarCilindro();

    }

}

function loadPhoto(event,id){

/* =========================================================
   RETÂNGULO ARREDONDADO
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    if(typeof radius === "undefined")
        radius = 5;


    if(typeof radius === "number"){

        radius = {

            tl:radius,
            tr:radius,
            br:radius,
            bl:radius

        };

    }


    ctx.beginPath();


    ctx.moveTo(
        x + radius.tl,
        y
    );


    ctx.lineTo(
        x + width - radius.tr,
        y
    );


    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius.tr
    );


    ctx.lineTo(
        x + width,
        y + height - radius.br
    );


    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius.br,
        y + height
    );


    ctx.lineTo(
        x + radius.bl,
        y + height
    );


    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius.bl
    );


    ctx.lineTo(
        x,
        y + radius.tl
    );


    ctx.quadraticCurveTo(
        x,
        y,
        x + radius.tl,
        y
    );


    ctx.closePath();


    if(fill)
        ctx.fill();


    if(stroke)
        ctx.stroke();

}


/* =========================================================

========================================================= */

async function gerarJpgCilindro(i){

    const imgSize =
        1280;


    const imgHeight =
        1900;


    const canvas =
        document.createElement("canvas");


    canvas.width =
        imgSize;


    canvas.height =
        imgHeight;


    const ctx =
        canvas.getContext("2d");


    /* FUNDO */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        imgSize,
        imgHeight
    );


    /* LINHA SUPERIOR */

    ctx.fillStyle =
        "#08783f";


    ctx.fillRect(
        0,
        0,
        imgSize,
        12
    );


    /*
       IDENTIFICAÇÃO DISCRETA
       SEM BLOCO VERDE GRANDE
    */

    ctx.fillStyle =
        "#1f2b25";


    ctx.font =
        "bold 30px Arial";


    ctx.textAlign =
        "left";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        `CILINDRO ${i}`,
        35,
        55
    );


    ctx.fillStyle =
        "#f28c00";


    ctx.fillRect(
        35,
        78,
        95,
        4
    );


    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];


    const legendas = [

        "EXAUSTÃO 2",
        "ADMISSÃO 2",
        "EXAUSTÃO 1",
        "ADMISSÃO 1"

    ];


    const pos = [

        [0,110],
        [imgSize/2,110],
        [0,imgHeight/2 + 30],
        [imgSize/2,imgHeight/2 + 30]

    ];


    for(let j=0;j<4;j++){

        const box =
            document.getElementById(
                fotos[j]
            );


        if(
            !box ||
            !box.style.backgroundImage
        )
            continue;


        const valInputId =
            fotos[j].replace(
                "photo",
                ""
            );


        const input =
            document.getElementById(
                valInputId
            );


        const val =
            input
            ? parseFloat(
                input.value.replace(",","." )
            )
            : null;


        let imgUrl =
            box.style.backgroundImage
            .replace(/^url\(["']?/,"")
            .replace(/["']?\)$/,"");


        const imgEl =
            new Image();


        imgEl.src =
            imgUrl;


        await new Promise(resolve => {

            imgEl.onload =
                resolve;

        });


        ctx.drawImage(

            imgEl,

            pos[j][0],
            pos[j][1],

            imgSize/2,
            imgHeight/2 - 40

        );


        const rectWidth =
            imgSize/2;


        const rectHeight =
            48;


        const rectX =
            pos[j][0];


        const rectY =
            pos[j][1] +
            imgHeight/2 -
            88;


        /*
           LEGENDA DISCRETA
        */

        ctx.fillStyle =
            "rgba(255,255,255,.92)";


        ctx.strokeStyle =
            "#dddddd";


        ctx.lineWidth =
            1;


        roundRect(

            ctx,

            rectX + 12,
            rectY,

            rectWidth - 24,
            rectHeight,

            8,

            true,
            true

        );


        ctx.fillStyle =
            "#1f2b25";


        ctx.font =
            "bold 25px Arial";


        ctx.textAlign =
            "center";


        ctx.fillText(

            legendas[j],

            rectX + rectWidth/2,

            rectY + rectHeight/2

        );


        /*
           ALERTA
        */

        if(
            val !== null &&
            !isNaN(val) &&
            val >= LIMITE_MAXIMO
        ){

            const desc =
                `AFUNDAMENTO • ${
                    val
                    .toFixed(2)
                    .replace(".",",")
                } mm`;


            ctx.font =
                "bold 23px Arial";


            const metrics =
                ctx.measureText(desc);


            const padding =
                14;


            const txtWidth =
                metrics.width +
                padding * 2;


            const txtHeight =
                42;


            const txtX =
                pos[j][0] +
                (
                    imgSize/2 -
                    txtWidth
                ) / 2;


            const txtY =
                rectY -
                txtHeight -
                8;


            ctx.fillStyle =
                "#fff";


            ctx.strokeStyle =
                "#d92323";


            ctx.lineWidth =
                2;


            roundRect(

                ctx,

                txtX,
                txtY,

                txtWidth,
                txtHeight,

                8,

                true,
                true

            );


            ctx.fillStyle =
                "#d92323";


            ctx.textAlign =
                "center";


            ctx.fillText(

                desc,

                txtX + txtWidth/2,

                txtY + txtHeight/2

            );

        }

    }


    /* =====================================================
       DOWNLOAD
    ===================================================== */

    canvas.toBlob(

        function(blob){

            if(!blob){

                alert(
                    "Não foi possível gerar o JPG."
                );

                return;

            }


            const nomeArquivo =
                `CILINDRO_${i}.jpg`;


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href =
                url;


            link.download =
                nomeArquivo;


            document.body.appendChild(link);


            link.click();


            document.body.removeChild(link);


            setTimeout(() => {

                URL.revokeObjectURL(url);

            },3000);


            mostrarMensagemDownload(
                nomeArquivo
            );

        },

        "image/jpeg",

        .95

    );

}
