<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medição de Válvulas - Scania 550</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

:root{
    --verde:#257500;
    --verde-escuro:#185000;
    --laranja:#ff8c00;
    --vermelho:#d60000;
    --cinza:#f3f5f4;
    --cinza2:#e5e8e6;
    --texto:#222;
}

*{
    box-sizing:border-box;
}

body{

    margin:0;
    padding:12px;

    font-family:Arial,Helvetica,sans-serif;

    background:
    linear-gradient(
        145deg,
        #eef1ef,
        #ffffff 45%,
        #e8ece9
    );

    color:var(--texto);

}

/* =====================================================
   CONTAINER PRINCIPAL
===================================================== */

.main-container{

    max-width:1000px;

    margin:auto;

}

/* =====================================================
   CABEÇALHO
===================================================== */

.header{

    background:
    linear-gradient(
        145deg,
        var(--verde),
        var(--verde-escuro)
    );

    color:white;

    border-radius:16px;

    padding:18px 15px;

    text-align:center;

    box-shadow:
    0 8px 20px rgba(0,0,0,.20);

    margin-bottom:14px;

}

.header h1{

    margin:0;

    font-size:21px;

    letter-spacing:.5px;

}

.header p{

    margin:6px 0 0;

    font-size:12px;

    opacity:.9;

}

/* =====================================================
   CARD INFORMAÇÕES
===================================================== */

.info-card{

    background:white;

    border-radius:14px;

    padding:14px;

    box-shadow:
    0 5px 15px rgba(0,0,0,.10);

    margin-bottom:14px;

}

.info-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}

.info-item{

    display:flex;

    flex-direction:column;

    gap:4px;

}

.info-item label{

    font-size:11px;

    font-weight:bold;

    color:#555;

    text-transform:uppercase;

}

.info-item input{

    width:100%;

    height:40px;

    border:1.5px solid #ccc;

    border-radius:8px;

    padding:8px 10px;

    font-size:15px;

    outline:none;

    background:#fafafa;

}

.info-item input:focus{

    border-color:var(--verde);

    box-shadow:
    0 0 0 2px rgba(37,117,0,.12);

    background:white;

}

/* =====================================================
   LIMITE
===================================================== */

.limite-card{

    background:white;

    border-radius:14px;

    padding:13px;

    margin-bottom:14px;

    box-shadow:
    0 5px 15px rgba(0,0,0,.08);

    text-align:center;

}

.limite-titulo{

    color:var(--verde);

    font-size:13px;

    font-weight:bold;

    margin-bottom:5px;

}

.limite-valor{

    font-size:20px;

    font-weight:bold;

}

.limite-alerta{

    margin-top:5px;

    color:var(--vermelho);

    font-size:12px;

    font-weight:bold;

}

/* =====================================================
   NAVEGAÇÃO
===================================================== */

.navegacao-cilindros{

    display:grid;

    grid-template-columns:1fr auto 1fr;

    gap:8px;

    align-items:center;

    margin-bottom:12px;

}

.btn-navegacao{

    height:42px;

    border:none;

    border-radius:10px;

    background:
    linear-gradient(
        145deg,
        var(--verde),
        var(--verde-escuro)
    );

    color:white;

    font-weight:bold;

    font-size:12px;

    cursor:pointer;

    box-shadow:
    0 4px 8px rgba(0,0,0,.15);

}

.btn-navegacao:active{

    transform:scale(.97);

}

.btn-navegacao:disabled{

    background:#aaa;

    box-shadow:none;

}

.indicador-cilindro{

    background:#fff;

    color:var(--verde);

    border:2px solid var(--verde);

    border-radius:10px;

    padding:10px 12px;

    font-size:12px;

    font-weight:bold;

    white-space:nowrap;

}

/* =====================================================
   CILINDRO
===================================================== */

.valve-section{

    background:white;

    border-radius:16px;

    padding:12px;

    margin-bottom:15px;

    box-shadow:
    0 8px 20px rgba(0,0,0,.12);

    border:1px solid #e1e4e2;

}

/* =====================================================
   TÍTULO CILINDRO
===================================================== */

.cilindro-label{

    text-align:center;

    background:
    linear-gradient(
        145deg,
        var(--verde),
        var(--verde-escuro)
    );

    color:white;

    padding:9px;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    margin-bottom:10px;

    box-shadow:
    inset 0 1px rgba(255,255,255,.2);

}

/* =====================================================
   GRID DAS VÁLVULAS
===================================================== */

.layout-cilindro{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

}

/* =====================================================
   BLOCO VÁLVULA
===================================================== */

.valvula-bloco{

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #f3f5f4
    );

    border:1px solid #d9ddda;

    border-radius:11px;

    padding:7px;

    text-align:center;

    box-shadow:
    0 3px 8px rgba(0,0,0,.08);

}

/* =====================================================
   TÍTULO VÁLVULA
===================================================== */

.valvula-titulo{

    background:#f1f3f2;

    color:var(--verde);

    border-left:4px solid var(--verde);

    padding:6px;

    border-radius:6px;

    font-size:11px;

    font-weight:bold;

}

/* =====================================================
   FOTO
===================================================== */

.photo-box{

    width:100%;

    height:130px;

    margin:8px auto;

    border:2px dashed var(--laranja);

    border-radius:9px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    font-size:10px;

    color:#777;

    position:relative;

    background-color:#fafafa;

    background-size:cover;

    background-position:center;

    overflow:hidden;

}

.photo-box input[type="file"]{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    opacity:0;

    cursor:pointer;

}

.photo-label{

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    background:rgba(37,117,0,.92);

    color:white;

    font-size:10px;

    font-weight:bold;

    padding:4px;

}

/* =====================================================
   MEDIÇÃO
===================================================== */

.measurement{

    background:#fffbea;

    border-radius:8px;

    padding:5px;

    border:1px solid #ffe08a;

}

.measurement input{

    width:100%;

    height:38px;

    border:2px solid var(--laranja);

    border-radius:7px;

    text-align:center;

    font-size:17px;

    font-weight:bold;

    outline:none;

    background:white;

}

.measurement input:focus{

    box-shadow:
    0 0 0 2px rgba(255,140,0,.15);

}

/* =====================================================
   BOTÃO FOTO
===================================================== */

.remove-photo{

    width:100%;

    border:none;

    background:#eee;

    color:#555;

    border-radius:6px;

    padding:6px;

    font-size:9px;

    font-weight:bold;

    cursor:pointer;

}

.remove-photo:active{

    background:#ddd;

}

/* =====================================================
   BOTÃO JPG
===================================================== */

.btn-jpg{

    width:100%;

    margin-top:11px;

    height:42px;

    border:none;

    border-radius:9px;

    background:
    linear-gradient(
        145deg,
        #333,
        #111
    );

    color:white;

    font-weight:bold;

    font-size:12px;

    cursor:pointer;

    box-shadow:
    0 4px 9px rgba(0,0,0,.15);

}

.btn-jpg:active{

    transform:scale(.98);

}

/* =====================================================
   OBSERVAÇÕES
===================================================== */

.obs-card{

    background:white;

    padding:13px;

    border-radius:14px;

    box-shadow:
    0 5px 15px rgba(0,0,0,.08);

    margin-bottom:14px;

}

.obs-card label{

    display:block;

    font-size:12px;

    font-weight:bold;

    color:var(--verde);

    margin-bottom:6px;

}

textarea{

    width:100%;

    min-height:100px;

    resize:vertical;

    border:1.5px solid #ccc;

    border-radius:9px;

    padding:10px;

    font-size:14px;

    outline:none;

}

textarea:focus{

    border-color:var(--verde);

}

/* =====================================================
   ASSINATURA
===================================================== */

.signature-card{

    background:white;

    border-radius:14px;

    padding:14px;

    box-shadow:
    0 5px 15px rgba(0,0,0,.08);

    margin-bottom:14px;

}

.signature-card label{

    font-size:11px;

    font-weight:bold;

    color:#555;

}

#assinatura{

    width:100%;

    border:none;

    border-bottom:2px solid #444;

    height:45px;

    text-align:center;

    font-size:25px;

    font-family:
    "Brush Script MT",
    cursive;

    outline:none;

    color:var(--verde);

}

/* =====================================================
   BOTÕES FINAIS
===================================================== */

.button-container{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:20px;

}

.button-container button{

    height:48px;

    border:none;

    border-radius:10px;

    color:white;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 5px 12px rgba(0,0,0,.15);

}

#generatePdf{

    background:
    linear-gradient(
        145deg,
        var(--verde),
        var(--verde-escuro)
    );

}

.clear-btn{

    background:
    linear-gradient(
        145deg,
        #e53935,
        #b71c1c
    );

}

/* =====================================================
   MENSAGEM DOWNLOAD
===================================================== */

.download-mensagem{

    position:fixed;

    left:50%;

    bottom:20px;

    transform:translateX(-50%);

    background:
    linear-gradient(
        145deg,
        var(--verde),
        var(--verde-escuro)
    );

    color:white;

    padding:12px 18px;

    border-radius:10px;

    font-size:12px;

    font-weight:bold;

    box-shadow:
    0 7px 20px rgba(0,0,0,.25);

    z-index:99999;

    display:none;

    text-align:center;

}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:500px){

    body{

        padding:7px;

    }

    .header h1{

        font-size:18px;

    }

    .info-grid{

        gap:7px;

    }

    .photo-box{

        height:105px;

    }

    .valvula-bloco{

        padding:5px;

    }

    .cilindro-label{

        font-size:15px;

    }

}

@media(max-width:360px){

    .btn-navegacao{

        font-size:10px;

    }

    .indicador-cilindro{

        font-size:10px;

        padding:9px 7px;

    }

    .photo-box{

        height:90px;

    }

    .measurement input{

        font-size:15px;

    }

}

</style>

</head>

<body>

<div class="main-container">

<!-- ===================================================
     CABEÇALHO
=================================================== -->

<div class="header">

    <h1>MEDIÇÃO DAS VÁLVULAS</h1>

    <p>SCANIA 550 • INSPEÇÃO DE VÁLVULAS</p>

</div>


<!-- ===================================================
     INFORMAÇÕES
=================================================== -->

<div class="info-card">

    <div class="info-grid">

        <div class="info-item">

            <label>Mecânico</label>

            <input
                type="text"
                id="mecanico"
            >

        </div>

        <div class="info-item">

            <label>Data</label>

            <input
                type="date"
                id="data"
            >

        </div>

        <div class="info-item">

            <label>Usina</label>

            <input
                type="text"
                id="usina"
            >

        </div>

        <div class="info-item">

            <label>Horímetro</label>

            <input
                type="text"
                id="horimetro"
            >

        </div>

        <div class="info-item">

            <label>Série</label>

            <input
                type="text"
                id="serie"
            >

        </div>

        <div class="info-item">

            <label>OS</label>

            <input
                type="text"
                id="os"
            >

        </div>

        <div class="info-item">

            <label>UGD</label>

            <input
                type="text"
                id="ugd"
                placeholder="Ex.: 01"
            >

        </div>

    </div>

</div>


<!-- ===================================================
     LIMITE
=================================================== -->

<div class="limite-card">

    <div class="limite-titulo">
        LIMITE DE MEDIÇÃO
    </div>

    <div class="limite-valor">
        64,00 mm — 67,50 mm
    </div>

    <div class="limite-alerta">
        ≥ 67,50 mm → SUBSTITUIÇÃO
    </div>

</div>


<!-- ===================================================
     NAVEGAÇÃO
=================================================== -->

<div class="navegacao-cilindros">

    <button
        class="btn-navegacao"
        id="btnAnterior"
        onclick="cilindroAnterior()"
    >
        ← ANTERIOR
    </button>

    <div
        class="indicador-cilindro"
        id="indicadorCilindro"
    >
        CILINDRO 1 / 6
    </div>

    <button
        class="btn-navegacao"
        id="btnProximo"
        onclick="proximoCilindro()"
    >
        PRÓXIMO →
    </button>

</div>


<!-- ===================================================
     CILINDROS
=================================================== -->

<div
    class="valve-container"
    id="valveContainer"
></div>


<!-- ===================================================
     OBSERVAÇÕES
=================================================== -->

<div class="obs-card">

    <label>OBSERVAÇÕES</label>

    <textarea
        id="observacoes"
        placeholder="Digite as observações da inspeção..."
    ></textarea>

</div>


<!-- ===================================================
     ASSINATURA
=================================================== -->

<div class="signature-card">

    <label>ASSINATURA DO MECÂNICO</label>

    <input
        type="text"
        id="assinatura"
        placeholder="Digite seu nome"
    >

</div>


<!-- ===================================================
     BOTÕES
=================================================== -->

<div class="button-container">

    <button id="generatePdf">
        GERAR PDF
    </button>

    <button
        id="clearBtn"
        class="clear-btn"
    >
        LIMPAR
    </button>

</div>

</div>


<div
    class="download-mensagem"
    id="downloadMensagem"
></div>


<script>

const { jsPDF } = window.jspdf;


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const LIMITE_MAXIMO = 67.50;

let cilindroAtual = 1;


/* =====================================================
   CRIAR CILINDROS
===================================================== */

const container =
document.getElementById(
    'valveContainer'
);

for(let i = 1; i <= 6; i++){

    const section =
    document.createElement('div');

    section.className =
    'valve-section';

    section.id =
    'cilindro-' + i;

    section.style.display =
    i === 1 ? 'block' : 'none';


    section.innerHTML = `

        <div class="cilindro-label">

            CILINDRO ${i}

        </div>

    `;


    const layout =
    document.createElement('div');

    layout.className =
    'layout-cilindro';


    const posicoes = [

        {
            tipo:'exaustao',
            j:2
        },

        {
            tipo:'admissao',
            j:2
        },

        {
            tipo:'exaustao',
            j:1
        },

        {
            tipo:'admissao',
            j:1
        }

    ];


    posicoes.forEach(
        ({tipo,j}) => {

            const tipoNome =
            tipo === 'exaustao'
            ? 'EXAUSTÃO'
            : 'ADMISSÃO';


            const id =
            tipo + i + '_' + j;


            const photoId =
            'photo' + id;


            const bloco =
            document.createElement('div');

            bloco.className =
            'valvula-bloco';


            bloco.innerHTML = `

                <div class="valvula-titulo">

                    ${tipoNome} ${j}

                </div>

                <div
                    class="photo-box"
                    id="${photoId}"
                >

                    Clique para adicionar foto

                    <div class="photo-label">

                        ${tipoNome} ${j}

                    </div>

                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${id}')"
                    >

                </div>

                <div class="measurement">

                    <input
                        type="text"
                        id="${id}"
                        placeholder="Medição mm"
                    >

                </div>

                <button
                    class="remove-photo"
                    onclick="removePhoto('${id}')"
                >
                    REMOVER FOTO
                </button>

            `;


            layout.appendChild(bloco);

        }
    );


    section.appendChild(layout);


    const btn =
    document.createElement('button');

    btn.className =
    'btn-jpg';

    btn.textContent =
    '📷 GERAR IMAGEM DO CILINDRO';


    btn.onclick =
    () => gerarJpgCilindro(i);


    section.appendChild(btn);


    container.appendChild(section);

}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function atualizarCilindro(){

    for(let i=1;i<=6;i++){

        const el =
        document.getElementById(
            'cilindro-' + i
        );

        if(el){

            el.style.display =
            i === cilindroAtual
            ? 'block'
            : 'none';

        }

    }


    document.getElementById(
        'indicadorCilindro'
    ).textContent =
    `CILINDRO ${cilindroAtual} / 6`;


    document.getElementById(
        'btnAnterior'
    ).disabled =
    cilindroAtual === 1;


    document.getElementById(
        'btnProximo'
    ).disabled =
    cilindroAtual === 6;


    window.scrollTo({
        top:0,
        behavior:'smooth'
    });

}


function proximoCilindro(){

    if(cilindroAtual < 6){

        cilindroAtual++;

        atualizarCilindro();

    }

}


function cilindroAnterior(){

    if(cilindroAtual > 1){

        cilindroAtual--;

        atualizarCilindro();

    }

}


/* =====================================================
   FOTO
===================================================== */

function loadPhoto(event,id){

    const box =
    document.getElementById(
        'photo' + id
    );


    const file =
    event.target.files[0];


    if(!file)
        return;


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        box.style.backgroundImage =
        `url("${e.target.result}")`;

    };


    reader.readAsDataURL(file);

}


/* =====================================================
   REMOVER FOTO
===================================================== */

function removePhoto(id){

    const box =
    document.getElementById(
        'photo' + id
    );


    box.style.backgroundImage =
    '';


    const tipo =
    id.includes('exaustao')
    ? 'EXAUSTÃO'
    : 'ADMISSÃO';


    const numero =
    id.slice(-1);


    box.innerHTML = `

        Clique para adicionar foto

        <div class="photo-label">

            ${tipo} ${numero}

        </div>

        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}


/* =====================================================
   RETÂNGULO
===================================================== */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
){

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();

}


/* =====================================================
   GERAR JPG
===================================================== */

async function gerarJpgCilindro(i){

    /*
       MANTIDA A PROPORÇÃO ORIGINAL
       1280 x 1900
    */

    const largura = 1280;

    const altura = 1900;


    const canvas =
    document.createElement('canvas');

    canvas.width =
    largura;

    canvas.height =
    altura;


    const ctx =
    canvas.getContext('2d');


    /* FUNDO */

    ctx.fillStyle =
    '#ffffff';

    ctx.fillRect(
        0,
        0,
        largura,
        altura
    );


    /*
       4 FOTOS EM 2 x 2
    */

    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];


    const idsMedicao = [

        `exaustao${i}_2`,
        `admissao${i}_2`,
        `exaustao${i}_1`,
        `admissao${i}_1`

    ];


    const legendas = [

        'EXAUSTÃO 2',
        'ADMISSÃO 2',
        'EXAUSTÃO 1',
        'ADMISSÃO 1'

    ];


    const posicoes = [

        [0,0],
        [largura/2,0],
        [0,altura/2],
        [largura/2,altura/2]

    ];


    const larguraFoto =
    largura / 2;


    const alturaFoto =
    altura / 2;


    /* =================================================
       FOTOS
    ================================================= */

    for(let j=0;j<4;j++){

        const box =
        document.getElementById(
            fotos[j]
        );


        if(
            !box ||
            !box.style.backgroundImage
        ){

            continue;

        }


        let url =
        box.style.backgroundImage
        .replace(/^url\(["']?/,'')
        .replace(/["']?\)$/,'');


        const img =
        new Image();


        img.src = url;


        await new Promise(resolve => {

            img.onload =
            resolve;

        });


        /*
           DESENHAR FOTO
        */

        ctx.drawImage(

            img,

            posicoes[j][0],
            posicoes[j][1],

            larguraFoto,
            alturaFoto

        );


        /*
           LEGENDA DISCRETA
        */

        ctx.fillStyle =
        'rgba(255,255,255,.88)';


        ctx.fillRect(

            posicoes[j][0],

            posicoes[j][1] +
            alturaFoto -
            55,

            larguraFoto,

            55

        );


        ctx.fillStyle =
        '#222';


        ctx.font =
        'bold 30px Arial';


        ctx.textAlign =
        'center';


        ctx.textBaseline =
        'middle';


        ctx.fillText(

            legendas[j],

            posicoes[j][0] +
            larguraFoto/2,

            posicoes[j][1] +
            alturaFoto -
            27

        );


        /* =================================================
           VERIFICAR MEDIÇÃO
        ================================================= */

        const input =
        document.getElementById(
            idsMedicao[j]
        );


        const valorTexto =
        input
        ? input.value
        : '';


        const valor =
        parseFloat(
            valorTexto
            .replace(',','.')
        );


        /*
           SOMENTE SE HOUVER AFUNDAMENTO
        */

        if(
            !isNaN(valor) &&
            valor >= LIMITE_MAXIMO
        ){

            const texto =
            `AFUNDAMENTO - ${
                valor
                .toFixed(2)
                .replace('.',',')
            } mm`;


            ctx.font =
            'bold 27px Arial';


            const medida =
            ctx.measureText(texto);


            const paddingX =
            18;


            const caixaLargura =
            medida.width +
            paddingX * 2;


            const caixaAltura =
            48;


            /*
               FICA ACIMA DA LEGENDA,
               SEM COBRIR A FOTO
            */

            const caixaX =
            posicoes[j][0] +
            (
                larguraFoto -
                caixaLargura
            ) / 2;


            const caixaY =
            posicoes[j][1] +
            alturaFoto -
            55 -
            caixaAltura -
            10;


            /*
               FUNDO BRANCO
            */

            ctx.fillStyle =
            'rgba(255,255,255,.95)';


            roundRect(

                ctx,

                caixaX,
                caixaY,

                caixaLargura,
                caixaAltura,

                10

            );


            ctx.fill();


            /*
               BORDA VERMELHA
            */

            ctx.strokeStyle =
            '#d60000';

            ctx.lineWidth =
            3;


            ctx.stroke();


            /*
               TEXTO
            */

            ctx.fillStyle =
            '#d60000';


            ctx.font =
            'bold 27px Arial';


            ctx.textAlign =
            'center';


            ctx.textBaseline =
            'middle';


            ctx.fillText(

                texto,

                caixaX +
                caixaLargura/2,

                caixaY +
                caixaAltura/2

            );

        }

    }


    /* =================================================
       TÍTULO DISCRETO E CENTRALIZADO
    ================================================= */

    const titulo =
    `CILINDRO ${i}`;


    ctx.font =
    'bold 38px Arial';


    const tituloMedida =
    ctx.measureText(titulo);


    const tituloPadding =
    18;


    const tituloLargura =
    tituloMedida.width +
    tituloPadding * 2;


    const tituloAltura =
    52;


    const tituloX =
    (
        largura -
        tituloLargura
    ) / 2;


    const tituloY =
    10;


    /*
       FUNDO BRANCO DISCRETO
    */

    ctx.fillStyle =
    'rgba(255,255,255,.94)';


    roundRect(

        ctx,

        tituloX,
        tituloY,

        tituloLargura,
        tituloAltura,
        12

    );


    ctx.fill();


    ctx.strokeStyle =
    '#257500';


    ctx.lineWidth =
    2;


    ctx.stroke();


    ctx.fillStyle =
    '#257500';


    ctx.font =
    'bold 38px Arial';


    ctx.textAlign =
    'center';


    ctx.textBaseline =
    'middle';


    ctx.fillText(

        titulo,

        largura/2,

        tituloY +
        tituloAltura/2

    );


    /* =================================================
       DOWNLOAD
    ================================================= */

    canvas.toBlob(

        function(blob){

            if(!blob){

                alert(
                    'Não foi possível gerar a imagem.'
                );

                return;

            }


            const url =
            URL.createObjectURL(blob);


            const link =
            document.createElement('a');


            link.href =
            url;


            link.download =
            `CILINDRO_${i}.jpg`;


            document.body.appendChild(link);


            link.click();


            document.body.removeChild(link);


            setTimeout(
                () => {

                    URL.revokeObjectURL(url);

                },
                3000
            );


            mostrarMensagemDownload(
                `CILINDRO_${i}.jpg`
            );

        },

        'image/jpeg',

        0.95

    );

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagemDownload(nome){

    const mensagem =
    document.getElementById(
        'downloadMensagem'
    );


    mensagem.innerHTML =
    `⬇️ ${nome}<br>Download iniciado`;


    mensagem.style.display =
    'block';


    setTimeout(
        () => {

            mensagem.style.display =
            'none';

        },
        3000
    );

}


/* =====================================================
   DESTAQUE MEDIÇÃO
===================================================== */

function atualizarDestaque(input){

    const valor =
    parseFloat(
        input.value
        .replace(',','.')
    );


    if(
        !isNaN(valor) &&
        valor >= LIMITE_MAXIMO
    ){

        input.style.color =
        '#d60000';

        input.style.fontWeight =
        'bold';

        input.style.borderColor =
        '#d60000';

    }
    else{

        input.style.color =
        '#222';

        input.style.fontWeight =
        'bold';

        input.style.borderColor =
        '#ff8c00';

    }

}


document.addEventListener(
    'input',
    function(event){

        if(
            event.target.matches(
                '.measurement input'
            )
        ){

            atualizarDestaque(
                event.target
            );

        }

    }
);


/* =====================================================
   GERAR PDF
===================================================== */

document.getElementById(
    'generatePdf'
).addEventListener(
    'click',
    async function(){

        try{

            const pdf =
            new jsPDF({

                unit:'mm',
                format:'a4'

            });


            const img =
            new Image();


            img.crossOrigin =
            'anonymous';


            img.src =
            'https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg';


            await new Promise(
                (resolve,reject) => {

                    img.onload =
                    resolve;

                    img.onerror =
                    reject;

                }
            );


            const canvas =
            document.createElement(
                'canvas'
            );


            canvas.width =
            img.width;

            canvas.height =
            img.height;


            const ctx =
            canvas.getContext('2d');


            ctx.drawImage(
                img,
                0,
                0
            );


            /* DADOS */

            ctx.font =
            'bold 18px Arial';

            ctx.fillStyle =
            'black';


            ctx.fillText(
                document.getElementById(
                    'mecanico'
                ).value || '',
                208,
                176
            );


            ctx.fillText(
                document.getElementById(
                    'usina'
                ).value || '',
                165,
                204
            );


            ctx.fillText(
                document.getElementById(
                    'serie'
                ).value || '',
                165,
                231
            );


            ctx.fillText(
                'UGD- ' +
                (
                    document.getElementById(
                        'ugd'
                    ).value || ''
                ),
                590,
                262
            );


            ctx.fillText(
                document.getElementById(
                    'os'
                ).value || '',
                292,
                262
            );


            const dataVal =
            document.getElementById(
                'data'
            ).value;


            if(dataVal){

                const partes =
                dataVal.split('-');


                const dataFormatada =
                `${partes[2]}/${partes[1]}/${partes[0]}`;


                ctx.fillText(
                    dataFormatada,
                    888,
                    204
                );

            }


            ctx.fillText(
                document.getElementById(
                    'horimetro'
                ).value || '',
                798,
                231
            );


            /* MEDIÇÕES */

            const campos = [

                ['exaustao1_1',105,616],
                ['exaustao1_2',105,576],
                ['admissao1_1',345,628],
                ['admissao1_2',345,589],

                ['exaustao2_1',450,1064],
                ['exaustao2_2',450,1024],
                ['admissao2_1',689,1075],
                ['admissao2_2',689,1038],

                ['exaustao3_1',792,617],
                ['exaustao3_2',792,576],
                ['admissao3_1',1032,628],
                ['admissao3_2',1032,589],

                ['exaustao4_1',793,1064],
                ['exaustao4_2',793,1024],
                ['admissao4_1',1033,1075],
                ['admissao4_2',1033,1038],

                ['exaustao5_1',450,617],
                ['exaustao5_2',450,576],
                ['admissao5_1',689,628],
                ['admissao5_2',689,589],

                ['exaustao6_1',105,1064],
                ['exaustao6_2',105,1024],
                ['admissao6_1',345,1075],
                ['admissao6_2',345,1038]

            ];


            campos.forEach(
                ([id,x,y]) => {

                    const valRaw =
                    document.getElementById(
                        id
                    )?.value || '';


                    const valNum =
                    parseFloat(
                        valRaw.replace(
                            ',',
                            '.'
                        )
                    );


                    const alerta =
                    !isNaN(valNum) &&
                    valNum >= LIMITE_MAXIMO;


                    ctx.fillStyle =
                    alerta
                    ? '#d60000'
                    : 'black';


                    ctx.font =
                    alerta
                    ? 'bold 18px Arial'
                    : '18px Arial';


                    ctx.fillText(
                        valRaw,
                        x,
                        y
                    );

                }
            );


            /* OBSERVAÇÕES */

            const obs =
            document.getElementById(
                'observacoes'
            ).value;


            ctx.fillStyle =
            'black';


            ctx.font =
            '18px Arial';


            const maxWidth =
            950;


            const lineHeight =
            26;


            const palavras =
            obs.split(/\s+/);


            let linha =
            '';


            let y =
            1237;


            palavras.forEach(
                palavra => {

                    const teste =
                    linha +
                    palavra +
                    ' ';


                    if(
                        ctx.measureText(teste).width >
                        maxWidth
                    ){

                        ctx.fillText(
                            linha,
                            183,
                            y
                        );


                        linha =
                        palavra +
                        ' ';


                        y +=
                        lineHeight;

                    }
                    else{

                        linha =
                        teste;

                    }

                }
            );


            if(linha){

                ctx.fillText(
                    linha,
                    183,
                    y
                );

            }


            /* ASSINATURA */

            ctx.font =
            '40px "Brush Script MT", cursive';


            ctx.fillStyle =
            '#257500';


            ctx.fillText(

                document.getElementById(
                    'assinatura'
                ).value || '',

                760,
                1538

            );


            const imgData =
            canvas.toDataURL(
                'image/jpeg',
                1.0
            );


            pdf.addImage(

                imgData,
                'JPEG',
                0,
                0,

                pdf.internal.pageSize.getWidth(),
                pdf.internal.pageSize.getHeight()

            );


            pdf.save(
                'MEDICAO_VALVULAS.pdf'
            );

        }
        catch(error){

            console.error(error);

            alert(
                'Não foi possível gerar o PDF.'
            );

        }

    }
);


/* =====================================================
   LIMPAR
===================================================== */

document.getElementById(
    'clearBtn'
).addEventListener(
    'click',
    function(){

        if(
            !confirm(
                'Deseja limpar todos os dados?'
            )
        ){

            return;

        }


        document
        .querySelectorAll(
            'input[type="text"], input[type="date"], textarea'
        )
        .forEach(
            input => {

                input.value = '';

                input.style.color =
                '#222';

                input.style.borderColor =
                '';

            }
        );


        document
        .querySelectorAll(
            '.photo-box'
        )
        .forEach(
            box => {

                const id =
                box.id.replace(
                    'photo',
                    ''
                );


                box.style.backgroundImage =
                '';


                const tipo =
                id.includes('exaustao')
                ? 'EXAUSTÃO'
                : 'ADMISSÃO';


                const numero =
                id.slice(-1);


                box.innerHTML = `

                    Clique para adicionar foto

                    <div class="photo-label">

                        ${tipo} ${numero}

                    </div>

                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${id}')"
                    >

                `;

            }
        );


        cilindroAtual =
        1;


        atualizarCilindro();

    }
);

atualizarCilindro();
