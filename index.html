<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Scania 550 • Medição de Válvulas</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================================================
   SCANIA 550 — INDUSTRIAL MOBILE UI
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --green:#00a651;
    --green2:#08783b;
    --green3:#045a2b;

    --metal1:#30383a;
    --metal2:#202628;
    --metal3:#151a1c;

    --black:#090d0e;
    --panel:#171d1f;
    --panel2:#202729;

    --line:#394346;
    --text:#f1f5f3;
    --muted:#8f9a98;

    --orange:#ff9d21;
    --red:#ef3434;
    --yellow:#ffd34e;
}

html{
    background:#080b0c;
}

body{
    margin:0;
    padding:8px;
    background:
        radial-gradient(
            circle at 50% -10%,
            #344043 0%,
            #171d1f 38%,
            #080b0c 78%
        );
    color:var(--text);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    min-height:100vh;
}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    max-width:620px;
    margin:auto;
    padding-bottom:18px;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #354042 0%,
            #1c2426 42%,
            #101516 100%
        );

    border:1px solid #485356;
    border-radius:16px;

    padding:13px 15px;
    margin-bottom:8px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -2px 0 rgba(0,0,0,.5),
        0 7px 18px rgba(0,0,0,.45);
}

.header::before{
    content:"";
    position:absolute;
    width:170px;
    height:170px;
    right:-80px;
    top:-100px;

    background:
        radial-gradient(
            circle,
            rgba(0,166,81,.28),
            transparent 70%
        );
}

.header::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--green),
            transparent
        );
}

.header-top{
    display:flex;
    align-items:center;
    gap:11px;
}

.engine-icon{
    width:43px;
    height:43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:
        linear-gradient(
            145deg,
            #0ca957,
            #045b2c
        );

    border:1px solid #22c86e;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.25),
        0 4px 9px rgba(0,0,0,.5);

    font-size:22px;
}

.header h1{
    margin:0;
    font-size:17px;
    font-weight:800;
    letter-spacing:.4px;
}

.header p{
    margin:3px 0 0;
    font-size:9px;
    color:#aeb8b5;
    letter-spacing:1px;
    font-weight:bold;
}

.status-led{
    margin-left:auto;

    display:flex;
    align-items:center;
    gap:5px;

    color:#9ba7a3;
    font-size:8px;
    font-weight:bold;
    text-transform:uppercase;
}

.status-led span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#00d866;

    box-shadow:
        0 0 8px #00d866;
}

/* =========================================================
   MINI STATUS
========================================================= */

.quick-status{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:8px;
}

.quick-item{
    min-width:0;

    background:
        linear-gradient(
            145deg,
            #262e30,
            #14191b
        );

    border:1px solid #384244;
    border-radius:10px;

    padding:7px 8px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 3px 8px rgba(0,0,0,.35);
}

.quick-label{
    color:#7f8a87;
    font-size:7px;
    font-weight:bold;
    letter-spacing:.7px;
}

.quick-value{
    margin-top:2px;
    color:#f4f7f6;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
   CARD INDUSTRIAL
========================================================= */

.card{
    background:
        linear-gradient(
            145deg,
            #222a2c,
            #151b1d
        );

    border:1px solid #353f42;
    border-radius:13px;

    padding:10px;
    margin-bottom:8px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 -1px 0 rgba(0,0,0,.5),
        0 5px 15px rgba(0,0,0,.4);
}

.card-title{
    display:flex;
    align-items:center;
    gap:6px;

    margin-bottom:8px;

    color:#dfe7e4;
    font-size:10px;
    font-weight:800;
    letter-spacing:.6px;
}

.card-title::after{
    content:"";
    height:1px;
    flex:1;

    background:
        linear-gradient(
            90deg,
            #3b4749,
            transparent
        );
}

/* =========================================================
   DADOS
========================================================= */

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.field{
    min-width:0;
}

.field label{
    display:block;
    margin:0 0 3px 2px;

    color:#7e8986;
    font-size:7px;
    font-weight:bold;
    letter-spacing:.7px;
}

.field input{
    width:100%;
    height:35px;

    border:1px solid #3b4749;
    border-radius:8px;

    padding:5px 8px;

    background:
        linear-gradient(
            180deg,
            #111719,
            #1b2224
        );

    color:#f4f7f5;

    font-size:12px;
    font-weight:bold;

    outline:none;

    box-shadow:
        inset 0 2px 4px rgba(0,0,0,.4),
        0 1px 0 rgba(255,255,255,.04);
}

.field input:focus{
    border-color:var(--green);

    box-shadow:
        0 0 0 2px rgba(0,166,81,.12),
        inset 0 2px 4px rgba(0,0,0,.4);
}

/* =========================================================
   LIMITE
========================================================= */

.limite{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;

    padding:8px 10px;
    margin-bottom:8px;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #302b1c,
            #1d1b14
        );

    border:1px solid #62552c;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 3px 9px rgba(0,0,0,.35);

    font-size:9px;
}

.limite strong{
    color:#dce3df;
}

.limite .valor-limite{
    color:var(--yellow);
    font-weight:900;
}

.limite .alerta{
    color:#ff5a5a;
    font-weight:900;
}

/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navegacao{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:7px;
    align-items:center;

    margin-bottom:8px;
}

.btn-nav{
    height:38px;

    border:1px solid #3c494b;
    border-radius:9px;

    color:#e9efec;
    background:
        linear-gradient(
            145deg,
            #303a3c,
            #1b2224
        );

    font-size:9px;
    font-weight:800;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1),
        0 3px 7px rgba(0,0,0,.4);

    cursor:pointer;
}

.btn-nav:active{
    transform:translateY(1px);
}

.btn-nav:disabled{
    opacity:.3;
}

.indicador{
    height:38px;
    min-width:68px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #08783b,
            #034e27
        );

    border:1px solid #13b95d;

    color:#fff;

    font-size:11px;
    font-weight:900;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        0 4px 9px rgba(0,0,0,.4);
}

/* =========================================================
   CILINDRO
========================================================= */

.valve-section{
    position:relative;

    background:
        linear-gradient(
            145deg,
            #262e30,
            #151b1d
        );

    border:1px solid #3b4749;
    border-radius:14px;

    padding:9px;
    margin-bottom:8px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 -2px 0 rgba(0,0,0,.5),
        0 6px 18px rgba(0,0,0,.42);
}

.cilindro-label{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    height:34px;

    margin-bottom:8px;

    border-radius:8px;

    background:
        linear-gradient(
            180deg,
            #087f40,
            #045b2d
        );

    border:1px solid #13a957;

    color:#fff;

    font-size:12px;
    font-weight:900;
    letter-spacing:1px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        0 3px 8px rgba(0,0,0,.4);
}

.cilindro-label::before,
.cilindro-label::after{
    content:"";
    position:absolute;
    top:50%;

    width:25%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35)
        );
}

.cilindro-label::before{
    left:8px;
}

.cilindro-label::after{
    right:8px;
    transform:scaleX(-1);
}

/* =========================================================
   GRID VÁLVULAS
========================================================= */

.layout-cilindro{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

/* =========================================================
   BLOCO VÁLVULA
========================================================= */

.valvula-bloco{
    position:relative;

    background:
        linear-gradient(
            145deg,
            #2a3234,
            #171d1f
        );

    border:1px solid #3b4749;
    border-radius:10px;

    padding:6px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 3px 8px rgba(0,0,0,.38);
}

.valvula-titulo{
    display:flex;
    align-items:center;
    justify-content:center;

    height:25px;

    border-radius:6px;

    background:
        linear-gradient(
            180deg,
            #323d3f,
            #202729
        );

    border:1px solid #465255;

    color:#dce4e1;

    font-size:8px;
    font-weight:900;
    letter-spacing:.5px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07);
}

.valvula-titulo::before{
    content:"";
    width:5px;
    height:5px;

    margin-right:5px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 6px rgba(0,166,81,.8);
}

/* =========================================================
   FOTO
========================================================= */

.photo-box{
    position:relative;

    width:100%;
    aspect-ratio:1.12 / 1;

    margin:6px auto;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border:1px dashed #586467;
    border-radius:7px;

    background:
        linear-gradient(
            135deg,
            #101516,
            #1c2325
        );

    background-size:cover;
    background-position:center;

    color:#6e7976;

    font-size:8px;
    text-align:center;
}

.photo-box::before{
    content:"📷";
    position:absolute;

    font-size:20px;
    opacity:.18;
}

.photo-box input[type=file]{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    opacity:0;
    cursor:pointer;
}

.photo-label{
    position:absolute;
    left:3px;
    right:3px;
    bottom:3px;

    padding:4px 2px;

    border-radius:4px;

    background:rgba(5,10,11,.86);

    color:#dbe2df;

    font-size:7px;
    font-weight:800;

    text-align:center;
}

/* =========================================================
   MEDIÇÃO DIGITAL
========================================================= */

.measurement{
    position:relative;
}

.measurement input{
    width:100%;
    height:39px;

    border:1px solid #536064;
    border-radius:7px;

    background:
        linear-gradient(
            180deg,
            #080c0d,
            #161c1e
        );

    color:#65e89a;

    text-align:center;

    font-family:
        "Courier New",
        monospace;

    font-size:17px;
    font-weight:900;

    letter-spacing:1px;

    outline:none;

    box-shadow:
        inset 0 2px 6px rgba(0,0,0,.65),
        0 2px 4px rgba(0,0,0,.3);
}

.measurement input::placeholder{
    color:#52605c;
    font-size:11px;
    letter-spacing:0;
}

.measurement input:focus{
    border-color:var(--green);

    box-shadow:
        0 0 0 2px rgba(0,166,81,.13),
        inset 0 2px 6px rgba(0,0,0,.65);
}

.measurement input.afundamento{
    color:#ff5d5d;

    border-color:#c92828;

    background:
        linear-gradient(
            180deg,
            #2b1010,
            #180b0b
        );

    box-shadow:
        inset 0 2px 6px rgba(0,0,0,.6),
        0 0 8px rgba(239,52,52,.18);
}

/* =========================================================
   REMOVER FOTO
========================================================= */

.remove-photo{
    width:100%;
    height:23px;

    margin-top:5px;

    border:1px solid #60332e;
    border-radius:5px;

    background:
        linear-gradient(
            180deg,
            #71362e,
            #4c2520
        );

    color:#ffb4ad;

    font-size:7px;
    font-weight:900;

    cursor:pointer;
}

/* =========================================================
   JPG
========================================================= */

.btn-jpg{
    width:100%;
    height:34px;

    margin-top:8px;

    border:1px solid #485456;
    border-radius:8px;

    background:
        linear-gradient(
            145deg,
            #303a3c,
            #181e20
        );

    color:#dce4e1;

    font-size:9px;
    font-weight:900;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 3px 7px rgba(0,0,0,.35);

    cursor:pointer;
}

.btn-jpg:active{
    transform:translateY(1px);
}

/* =========================================================
   OBSERVAÇÕES
========================================================= */

textarea{
    width:100%;
    min-height:70px;

    resize:vertical;

    border:1px solid #3d494b;
    border-radius:8px;

    padding:9px;

    background:
        linear-gradient(
            180deg,
            #101516,
            #1a2123
        );

    color:#edf2f0;

    font-family:Arial;
    font-size:11px;

    outline:none;

    box-shadow:
        inset 0 2px 5px rgba(0,0,0,.4);
}

textarea::placeholder{
    color:#697572;
}

textarea:focus{
    border-color:var(--green);
}

/* =========================================================
   BOTÕES FINAIS
========================================================= */

.button-container{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:7px;

    margin:8px 0;
}

.btn-final{
    height:45px;

    border-radius:9px;

    color:white;

    font-size:10px;
    font-weight:900;

    border:1px solid transparent;

    cursor:pointer;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        0 4px 10px rgba(0,0,0,.4);
}

.btn-pdf{
    background:
        linear-gradient(
            145deg,
            #0aaa53,
            #056a34
        );

    border-color:#14b95d;
}

.btn-limpar{
    background:
        linear-gradient(
            145deg,
            #70342e,
            #421f1b
        );

    border-color:#854238;
    color:#ffc0ba;
}

.btn-final:active{
    transform:translateY(1px);
}

/* =========================================================
   ASSINATURA
========================================================= */

.signature{
    background:
        linear-gradient(
            145deg,
            #222a2c,
            #151b1d
        );

    border:1px solid #353f42;
    border-radius:10px;

    padding:9px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 4px 12px rgba(0,0,0,.35);
}

.signature-title{
    color:#7e8986;

    font-size:7px;
    font-weight:bold;
    letter-spacing:.7px;

    margin-bottom:5px;
}

#assinatura{
    width:100%;
    height:34px;

    border:none;
    border-bottom:1px solid #65716e;

    background:transparent;

    color:#65e89a;

    font-family:
        "Brush Script MT",
        cursive;

    font-size:22px;

    text-align:center;

    outline:none;
}

/* =========================================================
   DOWNLOAD MESSAGE
========================================================= */

.download-mensagem{
    position:fixed;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    min-width:190px;

    padding:9px 13px;

    border:1px solid #14a957;
    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #08783b,
            #034d26
        );

    color:white;

    font-size:10px;
    font-weight:bold;

    text-align:center;

    z-index:99999;

    box-shadow:
        0 8px 25px rgba(0,0,0,.5);

    display:none;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

    body{
        padding:5px;
    }

    .app{
        max-width:100%;
    }

    .header{
        padding:11px;
    }

    .engine-icon{
        width:39px;
        height:39px;
    }

    .header h1{
        font-size:15px;
    }

    .quick-item{
        padding:6px;
    }

    .quick-value{
        font-size:10px;
    }

    .info-grid{
        gap:5px;
    }

    .field input{
        height:33px;
        font-size:11px;
    }

    .valve-section{
        padding:7px;
    }

    .layout-cilindro{
        gap:5px;
    }

    .valvula-bloco{
        padding:5px;
    }

    .photo-box{
        margin:5px auto;
    }

    .measurement input{
        height:36px;
        font-size:15px;
    }

}

/* =========================================================
   DESKTOP — CONTINUA PARECENDO APP
========================================================= */

@media(min-width:700px){

    body{
        padding:18px;
    }

    .app{
        max-width:650px;
    }

}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-track{
    background:#090d0e;
}

::-webkit-scrollbar-thumb{
    background:#344042;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="header-top">

        <div class="engine-icon">
            ⚙
        </div>

        <div>

            <h1>
                MEDIÇÃO DE VÁLVULAS
            </h1>

            <p>
                SCANIA 550 • INSPEÇÃO INDUSTRIAL
            </p>

        </div>

        <div class="status-led">
            <span></span>
            ONLINE
        </div>

    </div>

</div>


<!-- =====================================================
     STATUS RÁPIDO
===================================================== -->

<div class="quick-status">

    <div class="quick-item">
        <div class="quick-label">EQUIPAMENTO</div>
        <div class="quick-value">SCANIA 550</div>
    </div>

    <div class="quick-item">
        <div class="quick-label">CILINDROS</div>
        <div class="quick-value">06</div>
    </div>

    <div class="quick-item">
        <div class="quick-label">LIMITE</div>
        <div class="quick-value">67,50 mm</div>
    </div>

</div>


<!-- =====================================================
     DADOS
===================================================== -->

<div class="card">

    <div class="card-title">
        ⚙ DADOS DA INSPEÇÃO
    </div>

    <div class="info-grid">

        <div class="field">
            <label>MECÂNICO</label>
            <input type="text" id="mecanico">
        </div>

        <div class="field">
            <label>DATA</label>
            <input type="date" id="data">
        </div>

        <div class="field">
            <label>USINA</label>
            <input type="text" id="usina">
        </div>

        <div class="field">
            <label>HORÍMETRO</label>
            <input type="text" id="horimetro">
        </div>

        <div class="field">
            <label>SÉRIE</label>
            <input type="text" id="serie">
        </div>

        <div class="field">
            <label>OS</label>
            <input type="text" id="os">
        </div>

        <div class="field">
            <label>UGD</label>
            <input
                type="text"
                id="ugd"
                placeholder="01"
            >
        </div>

    </div>

</div>


<!-- =====================================================
     LIMITE
===================================================== -->

<div class="limite">

    <div>
        <strong>FAIXA:</strong>
        64,00 — <span class="valor-limite">67,50 mm</span>
    </div>

    <div class="alerta">
        ≥ 67,50 SUBSTITUIR
    </div>

</div>


<!-- =====================================================
     NAVEGAÇÃO
===================================================== -->

<div class="navegacao">

    <button
        class="btn-nav"
        id="btnAnterior"
        onclick="cilindroAnterior()"
    >
        ← ANTERIOR
    </button>

    <div
        class="indicador"
        id="indicadorCilindro"
    >
        01 / 06
    </div>

    <button
        class="btn-nav"
        id="btnProximo"
        onclick="proximoCilindro()"
    >
        PRÓXIMO →
    </button>

</div>


<!-- =====================================================
     CILINDROS
===================================================== -->

<div id="valveContainer"></div>


<!-- =====================================================
     OBSERVAÇÕES
===================================================== -->

<div class="card">

    <div class="card-title">
        📝 OBSERVAÇÕES
    </div>

    <textarea
        id="observacoes"
        placeholder="Registre anormalidades, condições ou observações..."
    ></textarea>

</div>


<!-- =====================================================
     BOTÕES
===================================================== -->

<div class="button-container">

    <button
        class="btn-final btn-pdf"
        id="generatePdf"
    >
        📄 GERAR PDF
    </button>

    <button
        class="btn-final btn-limpar"
        id="clearBtn"
    >
        🗑 LIMPAR
    </button>

</div>


<!-- =====================================================
     ASSINATURA
===================================================== -->

<div class="signature">

    <div class="signature-title">
        ASSINATURA DO MECÂNICO
    </div>

    <input
        type="text"
        id="assinatura"
        placeholder="Digite seu nome"
    >

</div>

</div>


<div
    class="download-mensagem"
    id="downloadMensagem"
></div>


<script>

const { jsPDF } = window.jspdf;

const LIMITE_AFUNDAMENTO = 67.50;

let cilindroAtual = 1;

const container =
    document.getElementById("valveContainer");


/* =========================================================
   CRIAR 6 CILINDROS
========================================================= */

for(let i = 1; i <= 6; i++){

    const section =
        document.createElement("div");

    section.className =
        "valve-section";

    section.id =
        "cilindro-" + i;

    section.style.display =
        i === 1 ? "block" : "none";


    section.innerHTML = `

        <div class="cilindro-label">

            CILINDRO ${String(i).padStart(2,"0")}

        </div>

    `;


    const layout =
        document.createElement("div");

    layout.className =
        "layout-cilindro";


    const posicoes = [

        {
            tipo:"exaustao",
            j:2
        },

        {
            tipo:"admissao",
            j:2
        },

        {
            tipo:"exaustao",
            j:1
        },

        {
            tipo:"admissao",
            j:1
        }

    ];


    posicoes.forEach(
        ({tipo,j}) => {

            const nome =
                tipo === "exaustao"
                ? "EXAUSTÃO"
                : "ADMISSÃO";


            const id =
                tipo + i + "_" + j;


            const box =
                document.createElement("div");

            box.className =
                "valvula-bloco";


            box.innerHTML = `

                <div class="valvula-titulo">
                    ${nome} ${j}
                </div>

                <div
                    class="photo-box"
                    id="photo${id}"
                >

                    TOQUE PARA FOTO

                    <div class="photo-label">
                        ${nome} ${j}
                    </div>

                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${id}')"
                    >

                </div>

                <div class="measurement">

                    <input
                        type="text"
                        id="${id}"
                        inputmode="decimal"
                        placeholder="MEDIÇÃO • mm"
                        oninput="atualizarDestaque(this)"
                    >

                </div>

                <button
                    class="remove-photo"
                    onclick="removePhoto('${id}')"
                >
                    × REMOVER FOTO
                </button>

            `;

            layout.appendChild(box);

        }
    );


    section.appendChild(layout);


    const btn =
        document.createElement("button");

    btn.className =
        "btn-jpg";

    btn.textContent =
        `▣ GERAR IMAGEM DO CILINDRO ${i}`;

    btn.onclick =
        () => gerarJpgCilindro(i);


    section.appendChild(btn);

    container.appendChild(section);

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function atualizarCilindro(){

    for(let i=1;i<=6;i++){

        const el =
            document.getElementById(
                "cilindro-" + i
            );

        if(el){

            el.style.display =
                i === cilindroAtual
                ? "block"
                : "none";

        }

    }


    document.getElementById(
        "indicadorCilindro"
    ).textContent =
        `${String(cilindroAtual).padStart(2,"0")} / 06`;


    document.getElementById(
        "btnAnterior"
    ).disabled =
        cilindroAtual === 1;


    document.getElementById(
        "btnProximo"
    ).disabled =
        cilindroAtual === 6;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function proximoCilindro(){

    if(cilindroAtual < 6){

        cilindroAtual++;

        atualizarCilindro();

    }

}


function cilindroAnterior(){

    if(cilindroAtual > 1){

        cilindroAtual--;

        atualizarCilindro();

    }

}


/* =========================================================
   FOTO
========================================================= */

function loadPhoto(event,id){

    const file =
        event.target.files[0];

    if(!file)
        return;


    const box =
        document.getElementById(
            "photo" + id
        );


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            box.style.backgroundImage =
                `url("${e.target.result}")`;

        };


    reader.readAsDataURL(file);

}


/* =========================================================
   REMOVER FOTO
========================================================= */

function removePhoto(id){

    const box =
        document.getElementById(
            "photo" + id
        );


    box.style.backgroundImage =
        "";


    const nome =
        id.includes("exaustao")
        ? "EXAUSTÃO"
        : "ADMISSÃO";


    box.innerHTML = `

        TOQUE PARA FOTO

        <div class="photo-label">
            ${nome}
        </div>

        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}


/* =========================================================
   DESTAQUE
========================================================= */

function atualizarDestaque(input){

    const valor =
        parseFloat(
            input.value
            .replace(",",".")
        );


    if(
        !isNaN(valor) &&
        valor >= LIMITE_AFUNDAMENTO
    ){

        input.classList.add(
            "afundamento"
        );

    }
    else{

        input.classList.remove(
            "afundamento"
        );

    }

}


/* =========================================================
   CANVAS
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();

    if(fill)
        ctx.fill();

    if(stroke)
        ctx.stroke();

}


/* =========================================================
   CARREGAR IMAGEM
========================================================= */

function carregarImagem(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();

            img.onload =
                () => resolve(img);

            img.onerror =
                () => reject();

            img.src = url;

        }
    );

}


/* =========================================================
   GERAR JPG
========================================================= */

async function gerarJpgCilindro(i){

    const largura = 1280;
    const altura = 1500;

    const metadeW =
        largura / 2;

    const metadeH =
        altura / 2;


    const canvas =
        document.createElement("canvas");

    canvas.width =
        largura;

    canvas.height =
        altura;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#111719";

    ctx.fillRect(
        0,
        0,
        largura,
        altura
    );


    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];


    const legendas = [

        "EXAUSTÃO 2",
        "ADMISSÃO 2",
        "EXAUSTÃO 1",
        "ADMISSÃO 1"

    ];


    const posicoes = [

        [0,0],
        [metadeW,0],
        [0,metadeH],
        [metadeW,metadeH]

    ];


    for(
        let j=0;
        j<4;
        j++
    ){

        const box =
            document.getElementById(
                fotos[j]
            );


        if(
            !box ||
            !box.style.backgroundImage
        ){
            continue;
        }


        let url =
            box.style.backgroundImage
                .replace(/^url\(["']?/,"")
                .replace(/["']?\)$/,"");


        try{

            const img =
                await carregarImagem(url);


            const x =
                posicoes[j][0];

            const y =
                posicoes[j][1];


            const escala =
                Math.max(
                    metadeW / img.width,
                    metadeH / img.height
                );


            const nw =
                img.width * escala;

            const nh =
                img.height * escala;


            const dx =
                x +
                (metadeW - nw) / 2;

            const dy =
                y +
                (metadeH - nh) / 2;


            ctx.save();

            ctx.beginPath();

            ctx.rect(
                x,
                y,
                metadeW,
                metadeH
            );

            ctx.clip();


            ctx.drawImage(
                img,
                dx,
                dy,
                nw,
                nh
            );

            ctx.restore();

        }
        catch(e){

            console.log(
                "Erro ao carregar imagem",
                e
            );

        }


        /* BORDA */

        ctx.strokeStyle =
            "#00a651";

        ctx.lineWidth =
            4;

        ctx.strokeRect(
            posicoes[j][0] + 3,
            posicoes[j][1] + 3,
            metadeW - 6,
            metadeH - 6
        );


        /* LEGENDA */

        ctx.fillStyle =
            "rgba(8,12,13,.88)";

        ctx.fillRect(
            posicoes[j][0],
            posicoes[j][1] + metadeH - 55,
            metadeW,
            55
        );


        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 25px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        ctx.fillText(
            legendas[j],
            posicoes[j][0] + metadeW/2,
            posicoes[j][1] + metadeH - 28
        );


        /* MEDIÇÃO */

        const input =
            document.getElementById(
                fotos[j].replace(
                    "photo",
                    ""
                )
            );


        const valorTexto =
            input
            ? input.value.trim()
            : "";


        const valor =
            parseFloat(
                valorTexto.replace(",",".")
            );


        if(
            !isNaN(valor) &&
            valor >= LIMITE_AFUNDAMENTO
        ){

            ctx.fillStyle =
                "#d71920";

            ctx.font =
                "bold 26px Arial";

            ctx.fillText(
                `⚠ ${valor.toFixed(2).replace(".",",")} mm`,
                posicoes[j][0] + metadeW/2,
                posicoes[j][1] + 35
            );

        }

    }


    /* TÍTULO */

    ctx.fillStyle =
        "rgba(8,12,13,.94)";

    ctx.fillRect(
        0,
        0,
        largura,
        70
    );


    ctx.fillStyle =
        "#00c963";

    ctx.font =
        "bold 32px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        `SCANIA 550 • CILINDRO ${i}`,
        largura/2,
        45
    );


    canvas.toBlob(
        function(blob){

            if(!blob){

                alert(
                    "Não foi possível gerar a imagem."
                );

                return;

            }


            const nome =
                `CILINDRO_${i}.jpg`;


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href =
                url;

            link.download =
                nome;

            document.body.appendChild(
                link
            );

            link.click();

            document.body.removeChild(
                link
            );


            setTimeout(
                ()=>{
                    URL.revokeObjectURL(
                        url
                    );
                },
                3000
            );


            mostrarMensagemDownload(
                nome
            );

        },
        "image/jpeg",
        .95
    );

}


/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagemDownload(nome){

    const el =
        document.getElementById(
            "downloadMensagem"
        );


    el.innerHTML =
        `⬇ ${nome}<br>Download iniciado`;


    el.style.display =
        "block";


    setTimeout(
        ()=>{
            el.style.display =
                "none";
        },
        3000
    );

}


/* =========================================================
   PDF
   MANTIDO COM A MESMA ESTRUTURA DO ORIGINAL
========================================================= */

document
.getElementById("generatePdf")
.addEventListener(
    "click",
    async function(){

        try{

            const pdf =
                new jsPDF({
                    unit:"mm",
                    format:"a4"
                });


            const img =
                new Image();


            img.crossOrigin =
                "anonymous";


            img.src =
                "https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg";


            await new Promise(
                (resolve,reject)=>{

                    img.onload =
                        resolve;

                    img.onerror =
                        reject;

                }
            );


            const canvas =
                document.createElement("canvas");


            canvas.width =
                img.width;

            canvas.height =
                img.height;


            const ctx =
                canvas.getContext("2d");


            ctx.drawImage(
                img,
                0,
                0
            );


            /* DADOS */

            ctx.font =
                "bold 18px Arial";

            ctx.fillStyle =
                "black";


            ctx.fillText(
                document.getElementById("mecanico").value || "",
                208,
                176
            );


            ctx.fillText(
                document.getElementById("usina").value || "",
                165,
                204
            );


            ctx.fillText(
                document.getElementById("serie").value || "",
                165,
                231
            );


            ctx.fillText(
                "UGD- " +
                (
                    document.getElementById("ugd").value || ""
                ),
                590,
                262
            );


            ctx.fillText(
                document.getElementById("os").value || "",
                292,
                262
            );


            const dataVal =
                document.getElementById("data").value;


            if(dataVal){

                const partes =
                    dataVal.split("-");


                const dataBR =
                    `${partes[2]}/${partes[1]}/${partes[0]}`;


                ctx.fillText(
                    dataBR,
                    888,
                    204
                );

            }


            ctx.fillText(
                document.getElementById("horimetro").value || "",
                798,
                231
            );


            /* MEDIÇÕES */

            const campos = [

                ["exaustao1_1",105,616],
                ["exaustao1_2",105,576],
                ["admissao1_1",345,628],
                ["admissao1_2",345,589],

                ["exaustao2_1",450,1064],
                ["exaustao2_2",450,1024],
                ["admissao2_1",689,1075],
                ["admissao2_2",689,1038],

                ["exaustao3_1",792,617],
                ["exaustao3_2",792,576],
                ["admissao3_1",1032,628],
                ["admissao3_2",1032,589],

                ["exaustao4_1",793,1064],
                ["exaustao4_2",793,1024],
                ["admissao4_1",1033,1075],
                ["admissao4_2",1033,1038],

                ["exaustao5_1",450,617],
                ["exaustao5_2",450,576],
                ["admissao5_1",689,628],
                ["admissao5_2",689,589],

                ["exaustao6_1",105,1064],
                ["exaustao6_2",105,1024],
                ["admissao6_1",345,1075],
                ["admissao6_2",345,1038]

            ];


            campos.forEach(
                ([id,x,y])=>{

                    const valor =
                        document.getElementById(
                            id
                        )?.value || "";


                    const numero =
                        parseFloat(
                            valor.replace(",",".")
                        );


                    if(
                        !isNaN(numero) &&
                        numero >= LIMITE_AFUNDAMENTO
                    ){

                        ctx.fillStyle =
                            "red";

                        ctx.font =
                            "bold 18px Arial";

                    }
                    else{

                        ctx.fillStyle =
                            "black";

                        ctx.font =
                            "18px Arial";

                    }


                    ctx.fillText(
                        valor,
                        x,
                        y
                    );

                }
            );


            /* OBSERVAÇÕES */

            const obs =
                document.getElementById(
                    "observacoes"
                ).value;


            ctx.fillStyle =
                "black";

            ctx.font =
                "18px Arial";


            const maxWidth =
                950;

            const lineHeight =
                26;


            const palavras =
                obs.split(/\s+/);


            let linha =
                "";

            let y =
                1237;


            palavras.forEach(
                palavra=>{

                    const teste =
                        linha +
                        palavra +
                        " ";


                    if(
                        ctx.measureText(
                            teste
                        ).width >
                        maxWidth
                    ){

                        ctx.fillText(
                            linha,
                            183,
                            y
                        );


                        linha =
                            palavra + " ";


                        y +=
                            lineHeight;

                    }
                    else{

                        linha =
                            teste;

                    }

                }
            );


            if(linha){

                ctx.fillText(
                    linha,
                    183,
                    y
                );

            }


            /* ASSINATURA */

            ctx.font =
                '40px "Brush Script MT", cursive';

            ctx.fillStyle =
                "#08783b";


            ctx.fillText(
                document.getElementById(
                    "assinatura"
                ).value || "",
                760,
                1538
            );


            /* PDF */

            const imgData =
                canvas.toDataURL(
                    "image/jpeg",
                    1
                );


            pdf.addImage(
                imgData,
                "JPEG",
                0,
                0,
                pdf.internal.pageSize.getWidth(),
                pdf.internal.pageSize.getHeight()
            );


            pdf.save(
                "MEDICAO_VALVULAS.pdf"
            );

        }
        catch(error){

            console.error(error);

            alert(
                "Não foi possível gerar o PDF. Verifique sua conexão com a internet."
            );

        }

    }
);


/* =========================================================
   LIMPAR
========================================================= */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    function(){

        if(
            !confirm(
                "Deseja realmente limpar todos os dados?"
            )
        ){

            return;

        }


        document
        .querySelectorAll(
            'input[type="text"], input[type="date"], textarea'
        )
        .forEach(
            el=>{
                el.value = "";
            }
        );


        document
        .querySelectorAll(
            ".measurement input"
        )
        .forEach(
            el=>{
                el.classList.remove(
                    "afundamento"
                );
            }
        );


        document
        .querySelectorAll(
            ".photo-box"
        )
        .forEach(
            box=>{

                const id =
                    box.id.replace(
                        "photo",
                        ""
                    );


                const nome =
                    id.includes("exaustao")
                    ? "EXAUSTÃO"
                    : "ADMISSÃO";


                box.style.backgroundImage =
                    "";


                box.innerHTML = `

                    TOQUE PARA FOTO

                    <div class="photo-label">
                        ${nome}
                    </div>

                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${id}')"
                    >

                `;

            }
        );


        cilindroAtual =
            1;


        atualizarCilindro();

    }
);


/* =========================================================
   DATA AUTOMÁTICA
========================================================= */

document.getElementById(
    "data"
).value =
    new Date()
    .toISOString()
    .split("T")[0];


/* =========================================================
   INICIAR
========================================================= */

atualizarCilindro();

</script>

</body>
</html>
