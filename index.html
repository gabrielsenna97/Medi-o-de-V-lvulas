<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Medição de Válvulas - Scania 550</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:#070a0b;
}

body{
    margin:0;
    padding:7px;

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            #354043 0%,
            #1a2022 32%,
            #0b0f10 70%,
            #060808 100%
        );

    color:#eef3f1;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root{

    --green:#00a651;
    --green-light:#16d96b;
    --green-dark:#045b2c;

    --black:#070a0b;
    --dark:#101516;
    --panel:#171d1f;
    --panel2:#202729;

    --metal:#303a3c;
    --metal-dark:#1a2022;
    --border:#394547;

    --text:#f1f5f3;
    --muted:#818d89;

    --yellow:#ffd34e;
    --orange:#ff9d21;
    --red:#ef3939;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    max-width:650px;

    margin:0 auto;

    padding-bottom:20px;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:relative;

    overflow:hidden;

    margin-bottom:7px;

    padding:12px 14px;

    border-radius:15px;

    border:1px solid #485456;

    background:
        linear-gradient(
            145deg,
            #343e40 0%,
            #20282a 45%,
            #101516 100%
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -2px 0 rgba(0,0,0,.55),
        0 7px 18px rgba(0,0,0,.5);
}

.header::before{

    content:"";

    position:absolute;

    width:190px;
    height:190px;

    right:-90px;
    top:-125px;

    background:
        radial-gradient(
            circle,
            rgba(0,166,81,.28),
            transparent 68%
        );
}

.header::after{

    content:"";

    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--green),
            transparent
        );
}

.header-top{

    display:flex;

    align-items:center;

    gap:10px;

    position:relative;

    z-index:2;
}

.engine-icon{

    width:44px;
    height:44px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    border:1px solid #1dd56e;

    background:
        linear-gradient(
            145deg,
            #0da957,
            #045a2c
        );

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.25),
        0 4px 10px rgba(0,0,0,.5);

    font-size:22px;
}

.header h1{

    margin:0;

    font-size:16px;

    font-weight:900;

    letter-spacing:.5px;
}

.header p{

    margin:3px 0 0;

    color:#aab5b1;

    font-size:8px;

    font-weight:bold;

    letter-spacing:1px;
}

.status-led{

    margin-left:auto;

    display:flex;

    align-items:center;

    gap:5px;

    color:#9ba7a3;

    font-size:7px;

    font-weight:bold;
}

.status-led span{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#00df68;

    box-shadow:
        0 0 9px #00df68;
}


/* =========================================================
   STATUS SUPERIOR
========================================================= */

.quick-status{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-bottom:7px;
}

.quick-item{

    min-width:0;

    padding:7px 8px;

    border:1px solid #374345;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #272f31,
            #14191b
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 3px 8px rgba(0,0,0,.35);
}

.quick-label{

    color:#7e8986;

    font-size:7px;

    font-weight:bold;

    letter-spacing:.7px;
}

.quick-value{

    margin-top:2px;

    color:#f4f7f6;

    font-size:11px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   CARD
========================================================= */

.card{

    margin-bottom:7px;

    padding:9px;

    border:1px solid #354144;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #232b2d,
            #151b1d
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 -1px 0 rgba(0,0,0,.5),
        0 5px 14px rgba(0,0,0,.4);
}

.card-title{

    display:flex;

    align-items:center;

    gap:6px;

    margin-bottom:7px;

    color:#e2e9e6;

    font-size:9px;

    font-weight:900;

    letter-spacing:.6px;
}

.card-title::after{

    content:"";

    flex:1;

    height:1px;

    background:
        linear-gradient(
            90deg,
            #3d494b,
            transparent
        );
}


/* =========================================================
   CAMPOS
========================================================= */

.info-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:6px;
}

.field{

    min-width:0;
}

.field label{

    display:block;

    margin:0 0 3px 2px;

    color:#7d8985;

    font-size:7px;

    font-weight:bold;

    letter-spacing:.7px;
}

.field input{

    width:100%;

    height:34px;

    padding:5px 8px;

    border:1px solid #3c484a;

    border-radius:8px;

    outline:none;

    color:#f2f6f4;

    background:
        linear-gradient(
            180deg,
            #101617,
            #1b2224
        );

    font-size:11px;

    font-weight:bold;

    box-shadow:
        inset 0 2px 4px rgba(0,0,0,.45),
        0 1px 0 rgba(255,255,255,.04);
}

.field input:focus{

    border-color:var(--green);

    box-shadow:
        0 0 0 2px rgba(0,166,81,.12),
        inset 0 2px 4px rgba(0,0,0,.45);
}


/* =========================================================
   LIMITE
========================================================= */

.limite{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    margin-bottom:7px;

    padding:8px 10px;

    border:1px solid #5e522d;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #302b1c,
            #1b1913
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 3px 8px rgba(0,0,0,.35);

    font-size:8px;
}

.limite strong{
    color:#dfe5e2;
}

.valor-limite{
    color:var(--yellow);

    font-weight:900;
}

.alerta{
    color:#ff5a5a;

    font-size:7px;

    font-weight:900;

    white-space:nowrap;
}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navegacao{

    display:grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items:center;

    gap:6px;

    margin-bottom:7px;
}

.btn-nav{

    height:37px;

    border:1px solid #3d494b;

    border-radius:9px;

    color:#eaf0ed;

    background:
        linear-gradient(
            145deg,
            #303a3c,
            #1a2123
        );

    font-size:8px;

    font-weight:900;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 3px 7px rgba(0,0,0,.4);
}

.btn-nav:active{

    transform:translateY(1px);
}

.btn-nav:disabled{

    opacity:.28;
}

.indicador{

    min-width:68px;

    height:37px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:9px;

    border:1px solid #14b85c;

    background:
        linear-gradient(
            145deg,
            #087c3d,
            #034e27
        );

    color:#fff;

    font-size:10px;

    font-weight:900;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        0 4px 9px rgba(0,0,0,.4);
}


/* =========================================================
   CILINDRO
========================================================= */

.valve-section{

    margin-bottom:7px;

    padding:8px;

    border:1px solid #3b4749;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #272f31,
            #151b1d
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 -2px 0 rgba(0,0,0,.5),
        0 6px 16px rgba(0,0,0,.42);
}

.cilindro-label{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    height:34px;

    margin-bottom:7px;

    border-radius:8px;

    border:1px solid #13a957;

    background:
        linear-gradient(
            180deg,
            #098441,
            #045a2c
        );

    color:#fff;

    font-size:11px;

    font-weight:900;

    letter-spacing:1px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        0 3px 8px rgba(0,0,0,.4);
}


/* =========================================================
   GRID VÁLVULAS
========================================================= */

.layout-cilindro{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:6px;
}


/* =========================================================
   VÁLVULA
========================================================= */

.valvula-bloco{

    padding:5px;

    border:1px solid #3d494b;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #2a3234,
            #171d1f
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 3px 8px rgba(0,0,0,.38);
}

.valvula-titulo{

    display:flex;

    align-items:center;

    justify-content:center;

    height:25px;

    border:1px solid #465255;

    border-radius:6px;

    background:
        linear-gradient(
            180deg,
            #333d3f,
            #202729
        );

    color:#dce4e1;

    font-size:8px;

    font-weight:900;

    letter-spacing:.5px;
}

.valvula-titulo::before{

    content:"";

    width:5px;
    height:5px;

    margin-right:5px;

    border-radius:50%;

    background:#00b85a;

    box-shadow:
        0 0 6px rgba(0,166,81,.9);
}


/* =========================================================
   FOTO
========================================================= */

.photo-box{

    position:relative;

    width:100%;

    aspect-ratio:1.12 / 1;

    margin:5px auto;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border:1px dashed #596568;

    border-radius:7px;

    background:
        linear-gradient(
            135deg,
            #101516,
            #1d2426
        );

    background-size:cover;

    background-position:center;

    color:#6d7976;

    font-size:8px;

    text-align:center;
}

.photo-box::before{

    content:"📷";

    position:absolute;

    font-size:20px;

    opacity:.18;
}

.photo-box input[type=file]{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    opacity:0;

    cursor:pointer;
}

.photo-label{

    position:absolute;

    left:3px;
    right:3px;
    bottom:3px;

    padding:4px 2px;

    border-radius:4px;

    background:rgba(5,10,11,.86);

    color:#dbe2df;

    font-size:7px;

    font-weight:900;

    text-align:center;
}


/* =========================================================
   MEDIÇÃO
========================================================= */

.measurement input{

    width:100%;

    height:38px;

    border:1px solid #536064;

    border-radius:7px;

    outline:none;

    background:
        linear-gradient(
            180deg,
            #080c0d,
            #161c1e
        );

    color:#65e89a;

    text-align:center;

    font-family:
        "Courier New",
        monospace;

    font-size:16px;

    font-weight:900;

    letter-spacing:1px;

    box-shadow:
        inset 0 2px 6px rgba(0,0,0,.65);
}

.measurement input::placeholder{

    color:#52605c;

    font-size:10px;

    letter-spacing:0;
}

.measurement input:focus{

    border-color:var(--green);

    box-shadow:
        0 0 0 2px rgba(0,166,81,.13),
        inset 0 2px 6px rgba(0,0,0,.65);
}

.measurement input.afundamento{

    color:#ff5d5d;

    border-color:#c92828;

    background:
        linear-gradient(
            180deg,
            #2b1010,
            #180b0b
        );

    box-shadow:
        inset 0 2px 6px rgba(0,0,0,.6),
        0 0 8px rgba(239,52,52,.18);
}


/* =========================================================
   REMOVER FOTO
========================================================= */

.remove-photo{

    width:100%;

    height:22px;

    margin-top:4px;

    border:1px solid #60332e;

    border-radius:5px;

    background:
        linear-gradient(
            180deg,
            #71362e,
            #4c2520
        );

    color:#ffb4ad;

    font-size:7px;

    font-weight:900;
}


/* =========================================================
   JPG
========================================================= */

.btn-jpg{

    width:100%;

    height:34px;

    margin-top:7px;

    border:1px solid #485456;

    border-radius:8px;

    background:
        linear-gradient(
            145deg,
            #303a3c,
            #181e20
        );

    color:#dce4e1;

    font-size:8px;

    font-weight:900;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 3px 7px rgba(0,0,0,.35);
}


/* =========================================================
   OBSERVAÇÕES
========================================================= */

textarea{

    width:100%;

    min-height:70px;

    resize:vertical;

    padding:8px;

    border:1px solid #3d494b;

    border-radius:8px;

    outline:none;

    background:
        linear-gradient(
            180deg,
            #101516,
            #1a2123
        );

    color:#edf2f0;

    font-family:Arial;

    font-size:10px;

    box-shadow:
        inset 0 2px 5px rgba(0,0,0,.4);
}

textarea::placeholder{
    color:#697572;
}


/* =========================================================
   BOTÕES
========================================================= */

.button-container{

    display:grid;

    grid-template-columns:
        1.5fr 1fr;

    gap:6px;

    margin:7px 0;
}

.btn-final{

    height:44px;

    border-radius:9px;

    font-size:9px;

    font-weight:900;

    color:#fff;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        0 4px 10px rgba(0,0,0,.4);
}

.btn-pdf{

    border:1px solid #14b95d;

    background:
        linear-gradient(
            145deg,
            #0aaa53,
            #056a34
        );
}

.btn-limpar{

    border:1px solid #854238;

    background:
        linear-gradient(
            145deg,
            #70342e,
            #421f1b
        );

    color:#ffc0ba;
}


/* =========================================================
   ASSINATURA
========================================================= */

.signature{

    padding:8px;

    border:1px solid #353f42;

    border-radius:10px;

    background:
        linear-gradient(
            145deg,
            #222a2c,
            #151b1d
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 4px 12px rgba(0,0,0,.35);
}

.signature-title{

    margin-bottom:4px;

    color:#7e8986;

    font-size:7px;

    font-weight:bold;

    letter-spacing:.7px;
}

#assinatura{

    width:100%;

    height:34px;

    border:none;

    border-bottom:1px solid #65716e;

    outline:none;

    background:transparent;

    color:#65e89a;

    font-family:
        "Brush Script MT",
        cursive;

    font-size:22px;

    text-align:center;
}


/* =========================================================
   MENSAGEM DOWNLOAD
========================================================= */

.download-mensagem{

    position:fixed;

    left:50%;

    bottom:15px;

    transform:translateX(-50%);

    min-width:190px;

    padding:9px 13px;

    border:1px solid #14a957;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #08783b,
            #034d26
        );

    color:#fff;

    font-size:10px;

    font-weight:bold;

    text-align:center;

    z-index:99999;

    box-shadow:
        0 8px 25px rgba(0,0,0,.5);

    display:none;
}


/* =========================================================
   PRÉVIA DO JPG
========================================================= */

.preview-overlay{

    position:fixed;

    inset:0;

    z-index:100000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:10px;

    background:
        rgba(0,0,0,.88);

    backdrop-filter:
        blur(5px);
}

.preview-overlay.ativo{

    display:flex;
}

.preview-window{

    width:100%;

    max-width:700px;

    max-height:96vh;

    display:flex;

    flex-direction:column;

    overflow:hidden;

    border:1px solid #485456;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #252e30,
            #101516
        );

    box-shadow:
        0 20px 60px rgba(0,0,0,.75),
        inset 0 1px 0 rgba(255,255,255,.08);
}

.preview-header{

    flex:none;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    padding:10px 12px;

    border-bottom:1px solid #394547;
}

.preview-title{

    color:#fff;

    font-size:11px;

    font-weight:900;

    letter-spacing:.6px;
}

.preview-close{

    width:32px;

    height:32px;

    border:1px solid #5a6567;

    border-radius:8px;

    background:#1b2224;

    color:#fff;

    font-size:18px;

    font-weight:bold;
}

.preview-content{

    flex:1;

    min-height:0;

    overflow:auto;

    padding:8px;

    background:#080b0c;
}

#previewImage{

    display:block;

    width:100%;

    height:auto;

    max-height:calc(96vh - 145px);

    object-fit:contain;

    margin:0 auto;

    border:1px solid #394547;

    border-radius:7px;

    background:#111;
}

.preview-actions{

    flex:none;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:7px;

    padding:9px;

    border-top:1px solid #394547;

    background:#171d1f;
}

.preview-btn{

    height:42px;

    border-radius:9px;

    font-size:9px;

    font-weight:900;

    color:#fff;
}

.preview-download{

    border:1px solid #16bd62;

    background:
        linear-gradient(
            145deg,
            #0aaa53,
            #056b35
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        0 4px 10px rgba(0,0,0,.35);
}

.preview-cancel{

    border:1px solid #5a4541;

    background:
        linear-gradient(
            145deg,
            #4d302c,
            #2e1e1b
        );

    color:#ffc1ba;
}


/* =========================================================
   MOBILE PEQUENO
========================================================= */

@media(max-width:380px){

    body{
        padding:4px;
    }

    .header{
        padding:10px;
    }

    .engine-icon{
        width:39px;
        height:39px;
    }

    .header h1{
        font-size:14px;
    }

    .header p{
        font-size:7px;
    }

    .field input{
        height:32px;
        font-size:10px;
    }

    .valve-section{
        padding:6px;
    }

    .valvula-bloco{
        padding:4px;
    }

    .measurement input{
        height:35px;
        font-size:14px;
    }

}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    body{
        padding:18px;
    }

    .app{
        max-width:650px;
    }

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-track{
    background:#080b0c;
}

::-webkit-scrollbar-thumb{
    background:#344042;
    border-radius:10px;
}

</style>

</head>


<body>

<div class="app">


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<div class="header">

    <div class="header-top">

        <div class="engine-icon">
            ⚙
        </div>

        <div>

            <h1>
                MEDIÇÃO DE VÁLVULAS
            </h1>

            <p>
                SCANIA 550 • INSPEÇÃO INDUSTRIAL
            </p>

        </div>

        <div class="status-led">

            <span></span>

            ONLINE

        </div>

    </div>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div class="quick-status">

    <div class="quick-item">

        <div class="quick-label">
            EQUIPAMENTO
        </div>

        <div class="quick-value">
            SCANIA 550
        </div>

    </div>


    <div class="quick-item">

        <div class="quick-label">
            CILINDROS
        </div>

        <div class="quick-value">
            06
        </div>

    </div>


    <div class="quick-item">

        <div class="quick-label">
            LIMITE
        </div>

        <div class="quick-value">
            67,50 mm
        </div>

    </div>

</div>


<!-- =====================================================
     DADOS
===================================================== -->

<div class="card">

    <div class="card-title">

<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const { jsPDF } = window.jspdf;

const LIMITE_AFUNDAMENTO = 67.50;

let cilindroAtual = 1;

let previewBlob = null;

let previewUrl = null;

let previewNome = "";

const container =
    document.getElementById(
        "valveContainer"
    );


/* =========================================================
   CRIAÇÃO DOS CILINDROS
========================================================= */

for(
    let i = 1;
    i <= 6;
    i++
){

    const section =
        document.createElement("div");


    section.className =
        "valve-section";


    section.id =
        "cilindro-" + i;


    section.style.display =
        i === 1
        ? "block"
        : "none";


    section.innerHTML = `

        <div class="cilindro-label">

            CILINDRO ${String(i).padStart(2,"0")}

        </div>

    `;


    const layout =
        document.createElement("div");


    layout.className =
        "layout-cilindro";


    const posicoes = [

        {
            tipo:"exaustao",
            j:2
        },

        {
            tipo:"admissao",
            j:2
        },

        {
            tipo:"exaustao",
            j:1
        },

        {
            tipo:"admissao",
            j:1
        }

    ];


    posicoes.forEach(
        ({tipo,j})=>{

            const nome =
                tipo === "exaustao"
                ? "EXAUSTÃO"
                : "ADMISSÃO";


            const id =
                tipo +
                i +
                "_" +
                j;


            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "valvula-bloco";


            box.innerHTML = `

                <div class="valvula-titulo">

                    ${nome} ${j}

                </div>


                <div
                    class="photo-box"
                    id="photo${id}"
                >

                    TOQUE PARA FOTO


                    <div class="photo-label">

                        ${nome} ${j}

                    </div>


                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="loadPhoto(event,'${id}')"
                    >

                </div>


                <div class="measurement">

                    <input
                        type="text"
                        id="${id}"
                        inputmode="decimal"
                        placeholder="MEDIÇÃO • mm"
                        oninput="atualizarDestaque(this)"
                    >

                </div>


                <button
                    class="remove-photo"
                    onclick="removePhoto('${id}')"
                >

                    × REMOVER FOTO

                </button>

            `;


            layout.appendChild(box);

        }
    );


    section.appendChild(layout);


    const btn =
        document.createElement("button");


    btn.className =
        "btn-jpg";


    btn.textContent =
        `▣ GERAR IMAGEM DO CILINDRO ${i}`;


    btn.onclick =
        () => gerarJpgCilindro(i);


    section.appendChild(btn);


    container.appendChild(section);

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function atualizarCilindro(){

    for(
        let i = 1;
        i <= 6;
        i++
    ){

        const el =
            document.getElementById(
                "cilindro-" + i
            );


        if(el){

            el.style.display =
                i === cilindroAtual
                ? "block"
                : "none";

        }

    }


    document.getElementById(
        "indicadorCilindro"
    ).textContent =
        `${String(cilindroAtual).padStart(2,"0")} / 06`;


    document.getElementById(
        "btnAnterior"
    ).disabled =
        cilindroAtual === 1;


    document.getElementById(
        "btnProximo"
    ).disabled =
        cilindroAtual === 6;

}


/* =========================================================
   LIMPAR FOTOS DE UM CILINDRO
   NÃO APAGA AS MEDIÇÕES
========================================================= */

function limparFotosCilindro(i){

    const ids = [

        `exaustao${i}_2`,
        `admissao${i}_2`,
        `exaustao${i}_1`,
        `admissao${i}_1`

    ];


    ids.forEach(
        id=>{

            const box =
                document.getElementById(
                    "photo" + id
                );


            if(!box)
                return;


            const input =
                box.querySelector(
                    'input[type="file"]'
                );


            if(input){

                input.value = "";

            }


            box.style.backgroundImage =
                "";


            const nome =
                id.includes("exaustao")
                ? "EXAUSTÃO"
                : "ADMISSÃO";


            const numero =
                id.endsWith("_1")
                ? "1"
                : "2";


            box.innerHTML = `

                TOQUE PARA FOTO

                <div class="photo-label">

                    ${nome} ${numero}

                </div>

                <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="loadPhoto(event,'${id}')"
                >

            `;

        }
    );

}


/* =========================================================
   PRÓXIMO
========================================================= */

function proximoCilindro(){

    if(
        cilindroAtual < 6
    ){

        /*
         * Antes de sair do cilindro atual,
         * elimina as fotos dele para não acumular
         * imagens pesadas na memória.
         */
        limparFotosCilindro(
            cilindroAtual
        );


        cilindroAtual++;


        atualizarCilindro();


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =========================================================
   ANTERIOR
========================================================= */

function cilindroAnterior(){

    if(
        cilindroAtual > 1
    ){

        cilindroAtual--;


        atualizarCilindro();


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =========================================================
   FOTO
========================================================= */

function loadPhoto(
    event,
    id
){

    const file =
        event.target.files[0];


    if(!file)
        return;


    const box =
        document.getElementById(
            "photo" + id
        );


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            box.style.backgroundImage =
                `url("${e.target.result}")`;

        };


    reader.readAsDataURL(file);

}


/* =========================================================
   REMOVER FOTO
========================================================= */

function removePhoto(id){

    const box =
        document.getElementById(
            "photo" + id
        );


    if(!box)
        return;


    const input =
        box.querySelector(
            'input[type="file"]'
        );


    if(input){

        input.value = "";

    }


    box.style.backgroundImage =
        "";


    const nome =
        id.includes("exaustao")
        ? "EXAUSTÃO"
        : "ADMISSÃO";


    const numero =
        id.endsWith("_1")
        ? "1"
        : "2";


    box.innerHTML = `

        TOQUE PARA FOTO

        <div class="photo-label">

            ${nome} ${numero}

        </div>


        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}


/* =========================================================
   DESTAQUE DA MEDIÇÃO
========================================================= */

function atualizarDestaque(input){

    const valor =
        parseFloat(
            input.value.replace(",",".")
        );


    if(
        !isNaN(valor) &&
        valor >= LIMITE_AFUNDAMENTO
    ){

        input.classList.add(
            "afundamento"
        );

    }
    else{

        input.classList.remove(
            "afundamento"
        );

    }

}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    ctx.beginPath();


    ctx.moveTo(
        x + radius,
        y
    );


    ctx.lineTo(
        x + width - radius,
        y
    );


    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );


    ctx.lineTo(
        x + width,
        y + height - radius
    );


    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );


    ctx.lineTo(
        x + radius,
        y + height
    );


    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );


    ctx.lineTo(
        x,
        y + radius
    );


    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );


    ctx.closePath();


    if(fill)
        ctx.fill();


    if(stroke)
        ctx.stroke();

}


/* =========================================================
   CARREGAR IMAGEM
========================================================= */

function carregarImagem(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();


            img.onload =
                () => resolve(img);


            img.onerror =
                () => reject();


            img.src =
                url;

        }
    );

}


/* =========================================================
   DESENHAR FOTO
   PRESERVA PROPORÇÃO
========================================================= */

function desenharFotoCentralizada(
    ctx,
    img,
    x,
    y,
    largura,
    altura
){

    /*
     * Fundo neutro.
     * Serve para fotos claras e escuras.
     */
    ctx.fillStyle =
        "#d8dcda";


    ctx.fillRect(
        x,
        y,
        largura,
        altura
    );


    /*
     * Mantém exatamente a proporção
     * original da foto.
     */
    const escala =
        Math.min(
            largura / img.width,
            altura / img.height
        );


    const imgW =
        img.width * escala;


    const imgH =
        img.height * escala;


    const imgX =
        x +
        (largura - imgW) / 2;


    const imgY =
        y +
        (altura - imgH) / 2;


    ctx.drawImage(
        img,
        imgX,
        imgY,
        imgW,
        imgH
    );


    /*
     * Borda discreta.
     */
    ctx.strokeStyle =
        "#7b8582";


    ctx.lineWidth =
        3;


    ctx.strokeRect(
        x,
        y,
        largura,
        altura
    );

}


/* =========================================================
   GERAR JPG DO CILINDRO
   FORMATO ORIGINAL 1600 x 1200
   SOMENTE 4 FOTOS + CILINDRO CENTRALIZADO
========================================================= */

async function gerarJpgCilindro(i){

    const largura =
        1600;


    const altura =
        1200;


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        largura;


    canvas.height =
        altura;


    const ctx =
        canvas.getContext("2d");


    /*
     * FUNDO GERAL
     */
    const fundo =
        ctx.createLinearGradient(
            0,
            0,
            0,
            altura
        );


    fundo.addColorStop(
        0,
        "#eef1ef"
    );


    fundo.addColorStop(
        1,
        "#d8ddda"
    );


    ctx.fillStyle =
        fundo;


    ctx.fillRect(
        0,
        0,
        largura,
        altura
    );


    /*
     * CABEÇALHO COM CONTRASTE
     */
    ctx.fillStyle =
        "#202729";


    ctx.fillRect(
        0,
        0,
        largura,
        150
    );


    /*
     * LINHA VERDE
     */
    ctx.fillStyle =
        "#00a651";


    ctx.fillRect(
        0,
        146,
        largura,
        4
    );


    /*
     * NÚMERO DO CILINDRO
     * CENTRALIZADO
     */
    ctx.fillStyle =
        "#ffffff";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.font =
        "900 62px Arial";


    ctx.fillText(
        `CILINDRO ${String(i).padStart(2,"0")}`,
        largura / 2,
        75
    );


    /*
     * ÁREA DAS 4 FOTOS
     */
    const margem =
        30;


    const espacamento =
        20;


    const topo =
        180;


    const larguraFoto =
        (
            largura -
            margem * 2 -
            espacamento
        ) / 2;


    const alturaFoto =
        (
            altura -
            topo -
            margem -
            espacamento
        ) / 2;


    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];


    for(
        let index = 0;
        index < fotos.length;
        index++
    ){

        const photoBox =
            document.getElementById(
                fotos[index]
            );


        const coluna =
            index % 2;


        const linha =
            Math.floor(index / 2);


        const x =
            margem +
            coluna *
            (
                larguraFoto +
                espacamento
            );


        const y =
            topo +
            linha *
            (
                alturaFoto +
                espacamento
            );


        /*
         * CARD EXTERNO
         */
        ctx.fillStyle =
            "#ffffff";


        ctx.strokeStyle =
            "#aeb7b4";


        ctx.lineWidth =
            2;


        roundRect(
            ctx,
            x,
            y,
            larguraFoto,
            alturaFoto,
            10,
            true,
            true
        );


        /*
         * Tenta pegar a imagem atual.
         */
        let possuiFoto =
            photoBox &&
            photoBox.style.backgroundImage;


        if(
            possuiFoto &&
            possuiFoto !== "none"
        ){

            let url =
                photoBox.style.backgroundImage
                .replace(
                    /^url\(["']?/,
                    ""
                )
                .replace(
                    /["']?\)$/,
                    ""
                );


            try{

                const img =
                    await carregarImagem(
                        url
                    );


                /*
                 * Pequena margem interna.
                 */
                const fotoX =
                    x + 8;


                const fotoY =
                    y + 8;


                const fotoW =
                    larguraFoto - 16;


                const fotoH =
                    alturaFoto - 16;


                desenharFotoCentralizada(
                    ctx,
                    img,
                    fotoX,
                    fotoY,
                    fotoW,
                    fotoH
                );

            }
            catch(error){

                desenharSemFotoJpg(
                    ctx,
                    x,
                    y,
                    larguraFoto,
                    alturaFoto
                );

            }

        }
        else{

            desenharSemFotoJpg(
                ctx,
                x,
                y,
                larguraFoto,
                alturaFoto
            );

        }

    }


    /*
     * GERA BLOB
     */
    const blob =
        await new Promise(
            resolve =>
                canvas.toBlob(
                    resolve,
                    "image/jpeg",
                    0.96
                )
        );


    if(!blob){

        alert(
            "Não foi possível gerar a imagem."
        );

        return;

    }


    /*
     * GUARDA PARA A PRÉVIA
     */
    if(previewUrl){

        URL.revokeObjectURL(
            previewUrl
        );

    }


    previewBlob =
        blob;


    previewNome =
        `CILINDRO_${String(i).padStart(2,"0")}.jpg`;


    previewUrl =
        URL.createObjectURL(
            blob
        );


    /*
     * MOSTRA PRÉVIA
     */
    const imagem =
        document.getElementById(
            "previewImage"
        );


    imagem.src =
        previewUrl;


    document.getElementById(
        "previewTitle"
    ).textContent =
        `PRÉVIA — CILINDRO ${String(i).padStart(2,"0")}`;


    document.getElementById(
        "previewOverlay"
    ).classList.add(
        "ativo"
    );


    /*
     * Vai para o topo da prévia.
     */
    document.querySelector(
        ".preview-content"
    ).scrollTop = 0;

}


/* =========================================================
   SEM FOTO NO JPG
========================================================= */

function desenharSemFotoJpg(
    ctx,
    x,
    y,
    largura,
    altura
){

    const internoX =
        x + 8;


    const internoY =
        y + 8;


    const internoW =
        largura - 16;


    const internoH =
        altura - 16;


    ctx.fillStyle =
        "#c9cfcc";


    ctx.fillRect(
        internoX,
        internoY,
        internoW,
        internoH
    );


    ctx.strokeStyle =
        "#9ba5a2";


    ctx.lineWidth =
        2;


    ctx.strokeRect(
        internoX,
        internoY,
        internoW,
        internoH
    );


    ctx.fillStyle =
        "#68736f";


    ctx.font =
        "bold 24px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "SEM FOTO",
        x + largura / 2,
        y + altura / 2
    );

}


/* =========================================================
   FECHAR PRÉVIA
========================================================= */

function fecharPreview(){

    document.getElementById(
        "previewOverlay"
    ).classList.remove(
        "ativo"
    );


    const imagem =
        document.getElementById(
            "previewImage"
        );


    imagem.src = "";


    if(previewUrl){

        URL.revokeObjectURL(
            previewUrl
        );

        previewUrl =
            null;

    }


    previewBlob =
        null;

}


/* =========================================================
   BAIXAR JPG DA PRÉVIA
========================================================= */

document
.getElementById("previewDownload")
.addEventListener(
    "click",
    function(){

        if(!previewBlob)
            return;


        const url =
            URL.createObjectURL(
                previewBlob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            previewNome;


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        setTimeout(
            ()=>{
                URL.revokeObjectURL(
                    url
                );
            },
            3000
        );


        mostrarMensagemDownload(
            previewNome
        );

    }
);


/* =========================================================
   FECHAR COM ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            fecharPreview();

        }

    }
);


/* =========================================================
   MENSAGEM DE DOWNLOAD
========================================================= */

function mostrarMensagemDownload(nome){

    const el =
        document.getElementById(
            "downloadMensagem"
        );


    el.innerHTML =
        `⬇ ${nome}<br>Download realizado`;


    el.style.display =
        "block";


    setTimeout(
        ()=>{

            el.style.display =
                "none";

        },
        3000
    );

}


/* =========================================================
   GERAR PDF
========================================================= */

document
.getElementById("generatePdf")
.addEventListener(
    "click",
    async function(){

        try{

            const pdf =
                new jsPDF({
                    unit:"mm",
                    format:"a4"
                });


            const img =
                new Image();


            img.crossOrigin =
                "anonymous";


            img.src =
                "https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg";


            await new Promise(
                (resolve,reject)=>{

                    img.onload =
                        resolve;

                    img.onerror =
                        reject;

                }
            );


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                img.width;


            canvas.height =
                img.height;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            ctx.drawImage(
                img,
                0,
                0
            );


            /* =================================================
               DADOS
            ================================================= */

            ctx.font =
                "bold 18px Arial";


            ctx.fillStyle =
                "black";


            ctx.fillText(
                document.getElementById(
                    "mecanico"
                ).value || "",
                208,
                176
            );


            ctx.fillText(
                document.getElementById(
                    "usina"
                ).value || "",
                165,
                204
            );


            ctx.fillText(
                document.getElementById(
                    "serie"
                ).value || "",
                165,
                231
            );


            ctx.fillText(
                "UGD- " +
                (
                    document.getElementById(
                        "ugd"
                    ).value || ""
                ),
                590,
                262
            );


            ctx.fillText(
                document.getElementById(
                    "os"
                ).value || "",
                292,
                262
            );


            const dataVal =
                document.getElementById(
                    "data"
                ).value;


            if(dataVal){

                const partes =
                    dataVal.split("-");


                const dataBR =
                    `${partes[2]}/${partes[1]}/${partes[0]}`;


                ctx.fillText(
                    dataBR,
                    888,
                    204
                );

            }


            ctx.fillText(
                document.getElementById(
                    "horimetro"
                ).value || "",
                798,
                231
            );


            /* =================================================
               MEDIÇÕES
            ================================================= */

            const campos = [

                ["exaustao1_1",105,616],
                ["exaustao1_2",105,576],
                ["admissao1_1",345,628],
                ["admissao1_2",345,589],

                ["exaustao2_1",450,1064],
                ["exaustao2_2",450,1024],
                ["admissao2_1",689,1075],
                ["admissao2_2",689,1038],

                ["exaustao3_1",792,617],
                ["exaustao3_2",792,576],
                ["admissao3_1",1032,628],
                ["admissao3_2",1032,589],

                ["exaustao4_1",793,1064],
                ["exaustao4_2",793,1024],
                ["admissao4_1",1033,1075],
                ["admissao4_2",1033,1038],

                ["exaustao5_1",450,617],
                ["exaustao5_2",450,576],
                ["admissao5_1",689,628],
                ["admissao5_2",689,589],

                ["exaustao6_1",105,1064],
                ["exaustao6_2",105,1024],
                ["admissao6_1",345,1075],
                ["admissao6_2",345,1038]

            ];


            campos.forEach(
                ([id,x,y])=>{

                    const valor =
                        document.getElementById(
                            id
                        )?.value || "";


                    const numero =
                        parseFloat(
                            valor.replace(",",".")
                        );


                    if(
                        !isNaN(numero) &&
                        numero >= LIMITE_AFUNDAMENTO
                    ){

                        ctx.fillStyle =
                            "red";


                        ctx.font =
                            "bold 18px Arial";

                    }
                    else{

                        ctx.fillStyle =
                            "black";


                        ctx.font =
                            "18px Arial";

                    }


                    ctx.fillText(
                        valor,
                        x,
                        y
                    );

                }
            );


            /* =================================================
               OBSERVAÇÕES
            ================================================= */

            const obs =
                document.getElementById(
                    "observacoes"
                ).value;


            ctx.fillStyle =
                "black";


            ctx.font =
                "18px Arial";


            const maxWidth =
                950;


            const lineHeight =
                26;


            const palavras =
                obs.split(/\s+/);


            let linha =
                "";


            let y =
                1237;


            palavras.forEach(
                palavra=>{

                    const teste =
                        linha +
                        palavra +
                        " ";


                    if(
                        ctx.measureText(
                            teste
                        ).width >
                        maxWidth
                    ){

                        ctx.fillText(
                            linha,
                            183,
                            y
                        );


                        linha =
                            palavra + " ";


                        y +=
                            lineHeight;

                    }
                    else{

                        linha =
                            teste;

                    }

                }
            );


            if(linha){

                ctx.fillText(
                    linha,
                    183,
                    y
                );

            }


            /* =================================================
               ASSINATURA
            ================================================= */

            ctx.font =
                '40px "Brush Script MT", cursive';


            ctx.fillStyle =
                "#08783b";


            ctx.fillText(
                document.getElementById(
                    "assinatura"
                ).value || "",
                760,
                1538
            );


            /* =================================================
               PDF
            ================================================= */

            const imgData =
                canvas.toDataURL(
                    "image/jpeg",
                    1
                );


            pdf.addImage(
                imgData,
                "JPEG",
                0,
                0,
                pdf.internal.pageSize.getWidth(),
                pdf.internal.pageSize.getHeight()
            );


            pdf.save(
                "MEDICAO_VALVULAS.pdf"
            );

        }
        catch(error){

            console.error(
                error
            );


            alert(
                "Não foi possível gerar o PDF. Verifique sua conexão com a internet."
            );

        }

    }
);


/* =========================================================
   LIMPAR
========================================================= */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    function(){

        if(
            !confirm(
                "Deseja realmente limpar todos os dados?"
            )
        ){

            return;

        }


        document
        .querySelectorAll(
            'input[type="text"], input[type="date"], textarea'
        )
        .forEach(
            el=>{
                el.value = "";
            }
        );


        document
        .querySelectorAll(
            ".measurement input"
        )
        .forEach(
            el=>{

                el.classList.remove(
                    "afundamento"
                );

            }
        );


        for(
            let i = 1;
            i <= 6;
            i++
        ){

            limparFotosCilindro(i);

        }


        cilindroAtual =
            1;


        atualizarCilindro();

    }
);


/* =========================================================
   DATA AUTOMÁTICA
========================================================= */

document.getElementById(
    "data"
).value =
    new Date()
    .toISOString()
    .split("T")[0];


/* =========================================================
   INICIAR
========================================================= */

atualizarCilindro();

</script>

</body>
</html>
