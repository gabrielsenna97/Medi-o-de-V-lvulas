<script>

/* =========================================================
   PDF
========================================================= */

const { jsPDF } = window.jspdf;


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const LIMITE = 67.50;

let cilindroAtual = 1;


/* =========================================================
   CRIAR CILINDROS
========================================================= */

const container =
    document.getElementById("valveContainer");


for(let i = 1; i <= 6; i++){

    const section =
        document.createElement("div");

    section.className =
        "valve-section";

    section.id =
        "cilindro-" + i;

    section.style.display =
        i === 1 ? "block" : "none";


    section.innerHTML = `

        <div class="cilindro-label">
            CILINDRO ${i}
        </div>

        <div class="layout-cilindro">

            ${criarValvula("EXAUSTÃO",2,i)}
            ${criarValvula("ADMISSÃO",2,i)}
            ${criarValvula("EXAUSTÃO",1,i)}
            ${criarValvula("ADMISSÃO",1,i)}

        </div>

        <button
            class="btn-principal"
            style="width:100%;margin-top:10px;"
            onclick="gerarJpgCilindro(${i})"
        >
            📷 GERAR FOTO DO CILINDRO ${i}
        </button>

    `;

    container.appendChild(section);

}


/* =========================================================
   CRIAR VÁLVULA
========================================================= */

function criarValvula(tipo,j,i){

    const tipoId =
        tipo === "EXAUSTÃO"
        ? "exaustao"
        : "admissao";

    const id =
        tipoId + i + "_" + j;

    const photo =
        "photo" + id;

    return `

        <div class="valvula-bloco">

            <div class="valvula-titulo">

                ${tipo} ${j}

            </div>

            <div
                class="photo-box"
                id="${photo}"
            >

                📷<br>
                TOQUE PARA<br>
                ADICIONAR FOTO

                <div class="photo-label">
                    ${tipo} ${j}
                </div>

                <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="loadPhoto(event,'${id}')"
                >

            </div>

            <div class="measurement">

                <input
                    type="text"
                    inputmode="decimal"
                    id="${id}"
                    placeholder="mm"
                >

            </div>

            <button
                class="remove-photo"
                onclick="removePhoto('${id}')"
            >
                REMOVER FOTO
            </button>

        </div>

    `;
}


/* =========================================================
   FOTO
========================================================= */

function loadPhoto(event,id){

    const box =
        document.getElementById("photo" + id);

    const file =
        event.target.files[0];

    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            box.style.backgroundImage =
                `url("${e.target.result}")`;

            box.classList.add("has-photo");

            box.innerHTML = `

                <div class="photo-label">
                    ${id.includes("exaustao")
                    ? "EXAUSTÃO"
                    : "ADMISSÃO"}
                </div>

                <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="loadPhoto(event,'${id}')"
                >

            `;

        };


    reader.readAsDataURL(file);

}


/* =========================================================
   REMOVER FOTO
========================================================= */

function removePhoto(id){

    const box =
        document.getElementById("photo" + id);

    if(!box)
        return;


    box.style.backgroundImage = "";

    box.classList.remove("has-photo");


    const tipo =
        id.includes("exaustao")
        ? "EXAUSTÃO"
        : "ADMISSÃO";


    const numero =
        id.split("_")[1];


    box.innerHTML = `

        📷<br>
        TOQUE PARA<br>
        ADICIONAR FOTO

        <div class="photo-label">
            ${tipo} ${numero}
        </div>

        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function atualizarCilindro(){

    for(let i=1;i<=6;i++){

        const el =
            document.getElementById(
                "cilindro-" + i
            );

        if(el){

            el.style.display =
                i === cilindroAtual
                ? "block"
                : "none";

        }

    }


    document.getElementById(
        "indicadorCilindro"
    ).textContent =
        `CILINDRO ${cilindroAtual} / 6`;


    document.getElementById(
        "btnAnterior"
    ).disabled =
        cilindroAtual === 1;


    document.getElementById(
        "btnProximo"
    ).disabled =
        cilindroAtual === 6;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function proximoCilindro(){

    if(cilindroAtual < 6){

        cilindroAtual++;

        atualizarCilindro();

    }

}


function cilindroAnterior(){

    if(cilindroAtual > 1){

        cilindroAtual--;

        atualizarCilindro();

    }

}


/* =========================================================
   DESTAQUE DA MEDIÇÃO
========================================================= */

document.addEventListener(
    "input",
    function(event){

        if(
            !event.target.matches(
                ".measurement input"
            )
        )
            return;


        const valor =
            parseFloat(
                event.target.value
                .replace(",",".")
            );


        if(
            !isNaN(valor) &&
            valor >= LIMITE
        ){

            event.target.classList.add(
                "alerta"
            );

        }
        else{

            event.target.classList.remove(
                "alerta"
            );

        }

    }
);


/* =========================================================
   RETÂNGULO ARREDONDADO
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();

    if(fill)
        ctx.fill();

    if(stroke)
        ctx.stroke();

}


/* =========================================================
   GERAR JPG
========================================================= */

async function gerarJpgCilindro(i){

    const W = 1280;

    const H = 1900;


    const canvas =
        document.createElement("canvas");


    canvas.width = W;

    canvas.height = H;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];


    const legendas = [

        "EXAUSTÃO 2",
        "ADMISSÃO 2",
        "EXAUSTÃO 1",
        "ADMISSÃO 1"

    ];


    const pos = [

        [0,120],
        [W/2,120],
        [0,H/2],
        [W/2,H/2]

    ];


    /* =====================================================
       TÍTULO DISCRETO E CENTRALIZADO
    ===================================================== */

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    ctx.font = "bold 38px Arial";

    ctx.fillStyle = "#257500";

    ctx.fillText(
        `CILINDRO ${i}`,
        W/2,
        55
    );


    for(let j=0;j<4;j++){

        const box =
            document.getElementById(
                fotos[j]
            );


        if(
            !box ||
            !box.style.backgroundImage
        )
            continue;


        const id =
            fotos[j].replace(
                "photo",
                ""
            );


        const input =
            document.getElementById(id);


        const valor =
            input
            ? parseFloat(
                input.value.replace(",",".")
            )
            : NaN;


        let src =
            box.style.backgroundImage
            .replace(/^url\(["']?/,"")
            .replace(/["']?\)$/,"");


        const img =
            new Image();


        img.src = src;


        await new Promise(resolve => {

            img.onload = resolve;

        });


        const x =
            pos[j][0];

        const y =
            pos[j][1];


        const cw =
            W/2;

        const ch =
            H/2 - 120;


        ctx.drawImage(
            img,
            x,
            y,
            cw,
            ch
        );


        /* legenda */

        ctx.fillStyle =
            "rgba(0,0,0,.70)";


        ctx.fillRect(
            x,
            y + ch - 55,
            cw,
            55
        );


        ctx.fillStyle =
            "white";


        ctx.font =
            "bold 28px Arial";


        ctx.textAlign =
            "center";


        ctx.fillText(
            legendas[j],
            x + cw/2,
            y + ch - 27
        );


        /* valor crítico */

        if(
            !isNaN(valor) &&
            valor >= LIMITE
        ){

            ctx.fillStyle =
                "rgba(255,255,255,.92)";


            ctx.fillRect(
                x + 20,
                y + 20,
                300,
                55
            );


            ctx.fillStyle =
                "#d00000";


            ctx.font =
                "bold 26px Arial";


            ctx.fillText(
                `AFUNDAMENTO: ${valor
                    .toFixed(2)
                    .replace(".",",")} mm`,
                x + 170,
                y + 48
            );

        }

    }


    canvas.toBlob(
        function(blob){

            if(!blob){

                alert(
                    "Não foi possível gerar a imagem."
                );

                return;

            }


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;

            link.download =
                `CILINDRO_${i}.jpg`;


            document.body.appendChild(link);

            link.click();

            link.remove();


            setTimeout(
                () =>
                URL.revokeObjectURL(url),
                3000
            );


            mostrarMensagemDownload(
                `CILINDRO ${i}.jpg`
            );

        },
        "image/jpeg",
        .95
    );

}

    );

document
.getElementById("generatePdf")
.addEventListener(
    "click",

        try{

                new jsPDF({
                    unit:"mm",

                }
            );


            const canvas =
                document.createElement("canvas");


            canvas.width =
                img.width;

            canvas.height =
                img.height;


            const ctx =
                canvas.getContext("2d");


            ctx.drawImage(
                img,
                0,
                0
            );


            ctx.fillStyle =
                "black";


            ctx.font =
                "bold 18px Arial";


            function texto(id,x,y){

                ctx.fillText(
                    document
                    .getElementById(id)
                    ?.value || "",
                    x,
                    y
                );

            }


            texto("mecanico",208,176);

            texto("usina",165,204);

            texto("serie",165,231);

            texto(
                "ugd",
                590,
                262
            );

            texto(
                "os",
                292,
                262
            );

            texto(
                "horimetro",
                798,
                231
            );


            const data =
                document.getElementById(
                    "data"
                ).value;


            if(data){

                const partes =
                    data.split("-");


                ctx.fillText(
                    `${partes[2]}/${partes[1]}/${partes[0]}`,
                    888,
                    204
                );

            }


            /* MEDIÇÕES */

            const campos = [

                ["exaustao1_1",105,616],
                ["exaustao1_2",105,576],
                ["admissao1_1",345,628],
                ["admissao1_2",345,589],

                ["exaustao2_1",450,1064],
                ["exaustao2_2",450,1024],
                ["admissao2_1",689,1075],
                ["admissao2_2",689,1038],

                ["exaustao3_1",792,617],
                ["exaustao3_2",792,576],
                ["admissao3_1",1032,628],
                ["admissao3_2",1032,589],

                ["exaustao4_1",793,1064],
                ["exaustao4_2",793,1024],
                ["admissao4_1",1033,1075],
                ["admissao4_2",1033,1038],

                ["exaustao5_1",450,617],
                ["exaustao5_2",450,576],
                ["admissao5_1",689,628],
                ["admissao5_2",689,589],

                ["exaustao6_1",105,1064],
                ["exaustao6_2",105,1024],
                ["admissao6_1",345,1075],
                ["admissao6_2",345,1038]

            ];


            campos.forEach(
                ([id,x,y])=>{

                    const raw =
                        document
                        .getElementById(id)
                        ?.value || "";


                    const valor =
                        parseFloat(
                            raw.replace(",",".")
                        );


                    ctx.font =
                        "18px Arial";


                    ctx.fillStyle =
                        !isNaN(valor) &&
                        valor >= LIMITE
                        ? "red"
                        : "black";


                    if(
                        !isNaN(valor) &&
                        valor >= LIMITE
                    ){

                        ctx.font =
                            "bold 18px Arial";

                    }


                    ctx.fillText(
                        raw,
                        x,
                        y
                    );

                }
            );


            /* OBSERVAÇÕES */

            const obs =
                document
                .getElementById(
                    "observacoes"
                )
                .value;


            ctx.fillStyle =
                "black";


            ctx.font =
                "18px Arial";


            const palavras =
                obs.split(/\s+/);


            let linha = "";

            let y = 1237;

            const largura = 950;


            palavras.forEach(
                palavra=>{

                    const teste =
                        linha +
                        palavra +
                        " ";


                    if(
                        ctx.measureText(teste)
                        .width > largura
                    ){

                        ctx.fillText(
                            linha,
                            183,
                            y
                        );

                        linha =
                            palavra + " ";

                        y += 26;

                    }
                    else{

                        linha =
                            teste;

                    }

                }
            );


            ctx.fillText(
                linha,
                183,
                y
            );


            /* ASSINATURA */

            ctx.font =
                '40px "Brush Script MT", cursive';


            ctx.fillStyle =
                "#257500";


            ctx.fillText(
                document
                .getElementById(
                    "assinatura"
                )
                .value || "",
                760,
                1538
            );


            const imgData =
                canvas.toDataURL(
                    "image/jpeg",
                    1
                );


            pdf.addImage(
                imgData,
                "JPEG",
                0,
                0,
                pdf.internal.pageSize.getWidth(),
                pdf.internal.pageSize.getHeight()
            );


            pdf.save(
                "MEDICAO_VALVULAS.pdf"
            );

        }
        catch(error){

            console.error(error);

            alert(
                "Não foi possível gerar o PDF."
            );

        }

    }
);
