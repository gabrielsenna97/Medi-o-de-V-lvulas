<style>

/* =========================================================
   CONFIGURAÇÃO GERAL

/* =========================================================

.limite{

/* =========================================================

.navegacao{

}


.nav-btn{

        0 3px 0 #0d3b00,

}


.nav-btn:active{

    transform:

}


.nav-btn:disabled{

.indicador{

        2px solid

    padding:9px 11px;

}


/* =========================================================

========================================================= */

.valve-section{

        0 5px 13px

}


.cilindro-label{

}


/* =========================================================

}

.valvula-bloco{

}


.valvula-titulo{

        );

    color:white;

    padding:7px 3px;

    border-radius:7px;

        0 2px 0 #0d3b00;

}


/* =========================================================
   FOTO
========================================================= */

.photo-box{

    width:100%;

    aspect-ratio:1 / 1;

        2px dashed

========================================================= */

}

</style>

<body>


<!-- ======================================================
     CABEÇALHO
====================================================== -->

<div class="header">

    <h1>
        MEDIÇÃO DAS VÁLVULAS
    </h1>

        SCANIA 550 • FORMULÁRIO DE INSPEÇÃO
    </span>

</div>

====================================================== -->

<div class="info-card">

        <div class="campo">

            <label>
                Mecânico
            </label>

            <input
                type="text"

        <div class="campo">

            >

        <div class="campo">

        <div class="campo">

            </label>

</div>


<!-- ======================================================

====================================================== -->

<div class="limite">

    <strong>
        FAIXA ACEITÁVEL:
    </strong>

    64,00 mm a 67,50 mm

    <br>

    <span class="critico">

        ≥ 67,50 mm → CONSIDERAR SUBSTITUIÇÃO

    </span>

</div>


<!-- ======================================================
     NAVEGAÇÃO
====================================================== -->

<div class="navegacao">


    <button
        class="nav-btn"
        id="btnAnterior"
        onclick="cilindroAnterior()"
    >

        ← ANTERIOR

    </button>


    <div
        class="indicador"
        id="indicadorCilindro"
    >

        CILINDRO 1 / 6

    </div>


    <button
        class="nav-btn"
        id="btnProximo"
        onclick="proximoCilindro()"
    >

        PRÓXIMO →

    </button>


</div>


<!-- ======================================================
     CILINDROS
====================================================== -->

<div id="valveContainer"></div>


<!-- ======================================================
     OBSERVAÇÕES
====================================================== -->

<div class="obs-card">

        OBSERVAÇÕES

    ></textarea>

</div>

     ASSINATURA
====================================================== -->

        ASSINATURA DO MECÂNICO
    </label>

        type="text"
        id="assinatura"
        placeholder="Digite o nome"
    >

</div>


<!-- ======================================================
     AÇÕES
====================================================== -->

<div class="acoes">


    <button
        class="btn-principal"
        id="generatePdf"
    >

        📄 GERAR PDF

    </button>


    <button
        class="btn-principal btn-limpar"
        id="clearBtn"
    >

        LIMPAR

    </button>


</div>


<div
    class="download-mensagem"
    id="downloadMensagem"
>
</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const { jsPDF } =
    window.jspdf;

const LIMITE =
    67.50;

let cilindroAtual =
    1;


/* =========================================================
   CRIAR CILINDROS
========================================================= */

const container =
    document.getElementById(
        "valveContainer"
    );


for(
    let i = 1;
    i <= 6;
    i++
){

    const section =
        document.createElement(
            "div"
        );


    section.className =
        "valve-section";


    section.id =
        "cilindro-" + i;


    section.style.display =
        i === 1
        ? "block"
        : "none";


    section.innerHTML = `

        <div class="cilindro-label">

            CILINDRO ${i}

        </div>

        <div class="layout-cilindro">

            ${criarValvula(
                "EXAUSTÃO",
                2,
                i
            )}

            ${criarValvula(
                "ADMISSÃO",
                2,
                i
            )}

            ${criarValvula(
                "EXAUSTÃO",
                1,
                i
            )}

            ${criarValvula(
                "ADMISSÃO",
                1,
                i
            )}

        </div>

        <button
            class="btn-jpg"
            onclick="gerarJpgCilindro(${i})"
        >

            📷 GERAR FOTO DO CILINDRO ${i}

        </button>

    `;


    container.appendChild(
        section
    );

}


/* =========================================================
   CRIAR VÁLVULA
========================================================= */

function criarValvula(
    tipo,
    j,
    i
){

    const tipoId =
        tipo === "EXAUSTÃO"
        ? "exaustao"
        : "admissao";


    const id =
        tipoId +
        i +
        "_" +
        j;


    const photo =
        "photo" +
        id;


    return `

        <div class="valvula-bloco">

            <div class="valvula-titulo">

                ${tipo} ${j}

            </div>


            <div
                class="photo-box"
                id="${photo}"
            >

                📷<br>

                TOQUE PARA<br>

                ADICIONAR FOTO


                <div class="photo-label">

                    ${tipo} ${j}

                </div>


                <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="loadPhoto(
                        event,
                        '${id}'
                    )"
                >

            </div>


            <div class="measurement">

                <input
                    type="text"
                    inputmode="decimal"
                    id="${id}"
                    placeholder="mm"
                >

            </div>


            <button
                class="remove-photo"
                onclick="removePhoto(
                    '${id}'
                )"
            >

                REMOVER FOTO

            </button>

        </div>

    `;

}


/* =========================================================
   CARREGAR FOTO
========================================================= */

function loadPhoto(
    event,
    id
){

    const box =
        document.getElementById(
            "photo" + id
        );


    const file =
        event.target.files[0];


    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            box.style.backgroundImage =
                `url("${e.target.result}")`;


            box.classList.add(
                "has-photo"
            );


            box.innerHTML = `

                <div class="photo-label">

                    ${
                        id.includes("exaustao")
                        ? "EXAUSTÃO"
                        : "ADMISSÃO"
                    }

                </div>


                <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="loadPhoto(
                        event,
                        '${id}'
                    )"
                >

            `;

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   REMOVER FOTO
========================================================= */

function removePhoto(
    id
){

    const box =
        document.getElementById(
            "photo" + id
        );


    if(!box)
        return;


    box.style.backgroundImage =
        "";


    box.classList.remove(
        "has-photo"
    );


    const tipo =
        id.includes("exaustao")
        ? "EXAUSTÃO"
        : "ADMISSÃO";


    const numero =
        id.split("_")[1];


    box.innerHTML = `

        📷<br>

        TOQUE PARA<br>

        ADICIONAR FOTO


        <div class="photo-label">

            ${tipo} ${numero}

        </div>


        <input
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(
                event,
                '${id}'
            )"
        >

    `;

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function atualizarCilindro(){

    for(
        let i = 1;
        i <= 6;
        i++
    ){

        const el =
            document.getElementById(
                "cilindro-" + i
            );


        if(el){

            el.style.display =
                i === cilindroAtual
                ? "block"
                : "none";

        }

    }


    document.getElementById(
        "indicadorCilindro"
    ).textContent =
        `CILINDRO ${cilindroAtual} / 6`;


    document.getElementById(
        "btnAnterior"
    ).disabled =
        cilindroAtual === 1;


    document.getElementById(
        "btnProximo"
    ).disabled =
        cilindroAtual === 6;


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


function proximoCilindro(){

    if(
        cilindroAtual < 6
    ){

        cilindroAtual++;

        atualizarCilindro();

    }

}


function cilindroAnterior(){

    if(
        cilindroAtual > 1
    ){

        cilindroAtual--;

        atualizarCilindro();

    }

}


/* =========================================================
   DESTAQUE DA MEDIÇÃO
========================================================= */

document.addEventListener(
    "input",
    function(event){

        if(
            !event.target.matches(
                ".measurement input"
            )
        )
            return;


        const valor =
            parseFloat(
                event.target.value
                .replace(",", ".")
            );


        if(
            !isNaN(valor) &&
            valor >= LIMITE
        ){

            event.target.classList.add(
                "alerta"
            );

        }
        else{

            event.target.classList.remove(
                "alerta"
            );

        }

    }
);


/* =========================================================
   RETÂNGULO ARREDONDADO
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    ctx.beginPath();


    ctx.moveTo(
        x + radius,
        y
    );


    ctx.lineTo(
        x + width - radius,
        y
    );


    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );


    ctx.lineTo(
        x + width,
        y + height - radius
    );


    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );


    ctx.lineTo(
        x + radius,
        y + height
    );


    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );


    ctx.lineTo(
        x,
        y + radius
    );


    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );


    ctx.closePath();


    if(fill)
        ctx.fill();


    if(stroke)
        ctx.stroke();

}


/* =========================================================
   GERAR JPG DO CILINDRO
   ORGANIZAÇÃO 2 x 2
========================================================= */

async function gerarJpgCilindro(i){

    const W =
        1280;

    const H =
        1900;


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        W;

    canvas.height =
        H;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /* =====================================================
       FUNDO
    ===================================================== */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* =====================================================
       TÍTULO DISCRETO
    ===================================================== */

    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.font =
        "bold 42px Arial";


    ctx.fillStyle =
        "#257500";


    ctx.fillText(
        `CILINDRO ${i}`,
        W / 2,
        45
    );


    /* linha */

    ctx.strokeStyle =
        "#d8d8d8";


    ctx.lineWidth =
        2;


    ctx.beginPath();


    ctx.moveTo(
        80,
        82
    );


    ctx.lineTo(
        W - 80,
        82
    );


    ctx.stroke();


    /* =====================================================
       DIMENSÕES DAS FOTOS
    ===================================================== */

    const margem =
        25;


    const espacamento =
        15;


    const topo =
        105;


    const larguraFoto =
        (
            W -
            margem * 2 -
            espacamento
        ) / 2;


    const alturaFoto =
        (
            H -
            topo -
            margem -
            espacamento
        ) / 2;


    /* =====================================================
       POSIÇÕES
    ===================================================== */

    const fotos = [

        {

            id:
                `photoexaustao${i}_2`,

            nome:
                "EXAUSTÃO 2",

            x:
                margem,

            y:
                topo

        },


        {

            id:
                `photoadmissao${i}_2`,

            nome:
                "ADMISSÃO 2",

            x:
                margem +
                larguraFoto +
                espacamento,

            y:
                topo

        },


        {

            id:
                `photoexaustao${i}_1`,

            nome:
                "EXAUSTÃO 1",

            x:
                margem,

            y:
                topo +
                alturaFoto +
                espacamento

        },


        {

            id:
                `photoadmissao${i}_1`,

            nome:
                "ADMISSÃO 1",

            x:
                margem +
                larguraFoto +
                espacamento,

            y:
                topo +
                alturaFoto +
                espacamento

        }

    ];


    /* =====================================================
       PROCESSAR FOTOS
    ===================================================== */

    for(
        let j = 0;
        j < fotos.length;
        j++
    ){

        const item =
            fotos[j];


        const box =
            document.getElementById(
                item.id
            );


        /* =================================================
           SEM FOTO
        ================================================= */

        if(
            !box ||
            !box.style.backgroundImage
        ){

            ctx.fillStyle =
                "#f3f3f3";


            ctx.fillRect(
                item.x,
                item.y,
                larguraFoto,
                alturaFoto
            );


            ctx.strokeStyle =
                "#cccccc";


            ctx.lineWidth =
                2;


            ctx.strokeRect(
                item.x,
                item.y,
                larguraFoto,
                alturaFoto
            );


            ctx.fillStyle =
                "#999999";


            ctx.font =
                "bold 24px Arial";


            ctx.textAlign =
                "center";


            ctx.fillText(
                item.nome,
                item.x +
                    larguraFoto / 2,
                item.y +
                    alturaFoto / 2
            );


            continue;

        }


        /* =================================================
           PEGAR MEDIÇÃO
        ================================================= */

        const inputId =
            item.id.replace(
                "photo",
                ""
            );


        const input =
            document.getElementById(
                inputId
            );


        const valor =
            input
            ? parseFloat(
                input.value
                    .replace(",", ".")
            )
            : NaN;


        /* =================================================
           PEGAR IMAGEM
        ================================================= */

        let src =
            box.style.backgroundImage
            .replace(
                /^url\(["']?/,
                ""
            )
            .replace(
                /["']?\)$/,
                ""
            );


        const img =
            new Image();


        img.src =
            src;


        await new Promise(
            resolve => {

                img.onload =
                    resolve;

            }
        );


        /* =================================================
           AJUSTAR FOTO SEM DISTORCER
        ================================================= */

        const proporcaoImg =
            img.width /
            img.height;


        const proporcaoBox =
            larguraFoto /
            alturaFoto;


        let drawW;

        let drawH;

        let drawX;

        let drawY;


        if(
            proporcaoImg >
            proporcaoBox
        ){

            drawH =
                alturaFoto;


            drawW =
                alturaFoto *
                proporcaoImg;


            drawX =
                item.x +
                (
                    larguraFoto -
                    drawW
                ) / 2;


            drawY =
                item.y;

        }
        else{

            drawW =
                larguraFoto;


            drawH =
                larguraFoto /
                proporcaoImg;


            drawX =
                item.x;


            drawY =
                item.y +
                (
                    alturaFoto -
                    drawH
                ) / 2;

        }


        /* fundo */

        ctx.fillStyle =
            "#eeeeee";


        ctx.fillRect(
            item.x,
            item.y,
            larguraFoto,
            alturaFoto
        );


        /* =================================================
           RECORTE DA FOTO
        ================================================= */

        ctx.save();


        ctx.beginPath();


        ctx.rect(
            item.x,
            item.y,
            larguraFoto,
            alturaFoto
        );


        ctx.clip();


        ctx.drawImage(
            img,
            drawX,
            drawY,
            drawW,
            drawH
        );


        ctx.restore();


        /* =================================================
           BORDA
        ================================================= */

        ctx.strokeStyle =
            "#cccccc";


        ctx.lineWidth =
            2;


        ctx.strokeRect(
            item.x,
            item.y,
            larguraFoto,
            alturaFoto
        );


        /* =================================================
           NOME DA VÁLVULA
        ================================================= */

        const faixaH =
            58;


        ctx.fillStyle =
            "rgba(0,0,0,.68)";


        ctx.fillRect(

            item.x,

            item.y +
                alturaFoto -
                faixaH,

            larguraFoto,

            faixaH

        );


        ctx.fillStyle =
            "#ffffff";


        ctx.font =
            "bold 29px Arial";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.fillText(

            item.nome,

            item.x +
                larguraFoto / 2,

            item.y +
                alturaFoto -
                faixaH / 2

        );


        /* =================================================
           MEDIÇÃO
        ================================================= */

        if(
            !isNaN(valor)
        ){

            const valorTexto =
                valor
                .toFixed(2)
                .replace(
                    ".",
                    ","
                );


            const caixaW =
                190;


            const caixaH =
                54;


            const caixaX =
                item.x +
                15;


            const caixaY =
                item.y +
                15;


            ctx.fillStyle =
                "rgba(255,255,255,.94)";


            ctx.strokeStyle =
                valor >= LIMITE
                ? "#d00000"
                : "#257500";


            ctx.lineWidth =
                3;


            roundRect(

                ctx,

                caixaX,
                caixaY,

                caixaW,
                caixaH,

                10,

                true,
                true

            );


            ctx.fillStyle =
                valor >= LIMITE
                ? "#d00000"
                : "#257500";


            ctx.font =
                "bold 27px Arial";


            ctx.textAlign =
                "center";


            ctx.textBaseline =
                "middle";


            ctx.fillText(

                `${valorTexto} mm`,

                caixaX +
                    caixaW / 2,

                caixaY +
                    caixaH / 2

            );


            /* =================================================
               ALERTA
            ================================================= */

            if(
                valor >= LIMITE
            ){

                const alertaW =
                    290;


                const alertaH =
                    48;


                const alertaX =
                    item.x +
                    larguraFoto -
                    alertaW -
                    15;


                const alertaY =
                    item.y +
                    18;


                ctx.fillStyle =
                    "rgba(255,255,255,.95)";


                ctx.strokeStyle =
                    "#d00000";


                ctx.lineWidth =
                    3;


                roundRect(

                    ctx,

                    alertaX,
                    alertaY,

                    alertaW,
                    alertaH,

                    9,

                    true,
                    true

                );


                ctx.fillStyle =
                    "#d00000";


                ctx.font =
                    "bold 23px Arial";


                ctx.fillText(

                    "SUBSTITUIÇÃO",

                    alertaX +
                        alertaW / 2,

                    alertaY +
                        alertaH / 2

                );

            }

        }

    }


    /* =====================================================
       RODAPÉ
    ===================================================== */

    ctx.strokeStyle =
        "#dddddd";


    ctx.lineWidth =
        1;


    ctx.beginPath();


    ctx.moveTo(
        80,
        H - 35
    );


    ctx.lineTo(
        W - 80,
        H - 35
    );


    ctx.stroke();


    ctx.fillStyle =
        "#777777";


    ctx.font =
        "16px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(

        "Medição das válvulas • Scania 550",

        W / 2,

        H - 15

    );


    /* =====================================================
       DOWNLOAD
    ===================================================== */

    canvas.toBlob(

        function(blob){

            if(!blob){

                alert(
                    "Não foi possível gerar o JPG."
                );

                return;

            }


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                `CILINDRO_${i}.jpg`;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            setTimeout(
                function(){

                    URL.revokeObjectURL(
                        url
                    );

                },
                3000
            );


            mostrarMensagemDownload(
                `CILINDRO ${i}.jpg`
            );

        },

        "image/jpeg",

        0.95

    );

}

    );

}
