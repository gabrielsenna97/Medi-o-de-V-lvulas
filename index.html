<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inspeção de Válvulas | Scania 550</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

:root{
    --verde:#087a3d;
    --verde-dark:#045b2c;
    --verde-light:#0ca957;
    --verde-soft:#eaf7ef;

    --laranja:#f28c00;
    --laranja-light:#fff3df;

    --vermelho:#d71920;
    --vermelho-light:#fff0f0;

    --cinza-900:#17201b;
    --cinza-800:#27312c;
    --cinza-700:#3e4843;
    --cinza-500:#77817b;
    --cinza-300:#d9dfdc;
    --cinza-200:#e9edeb;
    --cinza-100:#f5f7f6;

    --branco:#ffffff;

    --sombra:
        0 18px 40px rgba(0,0,0,.12),
        0 4px 12px rgba(0,0,0,.06);

    --sombra-card:
        0 10px 25px rgba(0,0,0,.10),
        inset 0 1px 0 rgba(255,255,255,.8);
}


/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #ffffff 0%,
            #f3f6f4 45%,
            #e8eeeb 100%
        );

    color:var(--cinza-900);

    min-height:100vh;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.header{

    background:
        linear-gradient(
            145deg,
            var(--verde-dark),
            var(--verde),
            #0b8e48
        );

    color:white;

    padding:22px 25px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.22);

    position:relative;

    overflow:hidden;
}

.header::before{

    content:"";

    position:absolute;

    width:280px;
    height:280px;

    right:-80px;
    top:-150px;

    border-radius:50%;

    background:
        rgba(255,255,255,.08);
}

.header::after{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    left:-100px;
    bottom:-120px;

    border-radius:50%;

    background:
        rgba(255,255,255,.05);
}

.header-content{

    max-width:1200px;

    margin:auto;

    position:relative;

    z-index:2;
}

.header-top{

    display:flex;

    align-items:center;

    gap:15px;
}

.logo{

    width:54px;
    height:54px;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #dce8e1
        );

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--verde-dark);

    font-size:27px;

    font-weight:900;

    box-shadow:
        0 7px 18px rgba(0,0,0,.25);
}

.header h1{

    margin:0;

    font-size:26px;

    letter-spacing:.5px;
}

.header p{

    margin:4px 0 0;

    opacity:.85;

    font-size:13px;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{

    width:min(1200px, calc(100% - 30px));

    margin:25px auto 50px;
}


/* =========================================================
   TÍTULOS DE SEÇÃO
========================================================= */

.section-title{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:14px;

    font-size:18px;

    font-weight:800;

    color:var(--cinza-800);
}

.section-number{

    width:32px;
    height:32px;

    border-radius:10px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            var(--verde),
            var(--verde-dark)
        );

    color:white;

    box-shadow:
        0 5px 12px rgba(0,110,55,.25);
}


/* =========================================================
   CARD
========================================================= */

.card{

    background:rgba(255,255,255,.94);

    border:1px solid rgba(255,255,255,.8);

    border-radius:18px;

    padding:22px;

    margin-bottom:24px;

    box-shadow:var(--sombra-card);

    backdrop-filter:blur(10px);
}


/* =========================================================
   IDENTIFICAÇÃO
========================================================= */

.info-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;
}

.field{

    display:flex;

    flex-direction:column;

    gap:6px;
}

.field label{

    font-size:12px;

    font-weight:800;

    color:var(--cinza-500);

    text-transform:uppercase;

    letter-spacing:.5px;
}

.field input{

    width:100%;

    height:46px;

    border:1.5px solid var(--cinza-300);

    border-radius:10px;

    padding:0 13px;

    font-size:15px;

    color:var(--cinza-900);

    background:#fbfcfb;

    outline:none;

    transition:.2s;
}

.field input:focus{

    border-color:var(--verde);

    background:white;

    box-shadow:
        0 0 0 4px rgba(8,122,61,.10);
}


/* =========================================================
   LIMITE
========================================================= */

.limite{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    background:
        linear-gradient(
            135deg,
            #f0f8f3,
            #ffffff
        );

    border:1px solid #cfe5d8;

    border-radius:14px;

    padding:15px 18px;

    margin-bottom:24px;
}

.limite strong{

    color:var(--verde-dark);
}

.limite-alerta{

    color:var(--vermelho);

    font-weight:900;
}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

.navigation{

    display:grid;

    grid-template-columns:1fr auto 1fr;

    align-items:center;

    gap:12px;

    margin-bottom:18px;
}

.nav-button{

    border:none;

    min-height:48px;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            var(--verde),
            var(--verde-dark)
        );

    color:white;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 6px 15px rgba(0,90,45,.22);

    transition:.2s;
}

.nav-button:hover{

    transform:translateY(-2px);

    box-shadow:
        0 9px 20px rgba(0,90,45,.28);
}

.nav-button:disabled{

    opacity:.35;

    cursor:not-allowed;

    transform:none;

    box-shadow:none;
}

.cylinder-indicator{

    min-width:150px;

    height:48px;

    padding:0 18px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #26332c,
            #17201b
        );

    color:white;

    font-size:14px;

    font-weight:900;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1),
        0 6px 15px rgba(0,0,0,.2);
}


/* =========================================================
   CILINDRO
========================================================= */

.cylinder{

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f4f7f5
        );

    border-radius:20px;

    border:1px solid #dce3df;

    padding:20px;

    box-shadow:
        0 14px 30px rgba(0,0,0,.10),
        inset 0 1px 0 white;
}

.cylinder-title{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

    padding-bottom:15px;

    border-bottom:1px solid var(--cinza-200);
}

.cylinder-title h2{

    margin:0;

    font-size:23px;

    color:var(--verde-dark);
}

.engine-badge{

    padding:7px 12px;

    border-radius:8px;

    background:var(--verde-soft);

    color:var(--verde-dark);

    font-size:11px;

    font-weight:900;

    letter-spacing:.5px;
}


/* =========================================================
   VÁLVULAS
========================================================= */

.valves-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:16px;
}

.valve{

    background:white;

    border:1px solid #dfe5e1;

    border-radius:16px;

    padding:14px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.07);

    transition:.25s;
}

.valve:hover{

    transform:translateY(-3px);

    box-shadow:
        0 13px 25px rgba(0,0,0,.11);
}

.valve-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:10px 12px;

    margin-bottom:12px;

    border-radius:10px;

    background:
        linear-gradient(
            145deg,
            var(--verde),
            var(--verde-dark)
        );

    color:white;
}

.valve-name{

    font-size:13px;

    font-weight:900;

    letter-spacing:.4px;
}

.valve-number{

    width:26px;
    height:26px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(255,255,255,.18);

    font-size:12px;

    font-weight:900;
}


/* =========================================================
   FOTO
========================================================= */

.photo-box{

    width:100%;

    aspect-ratio:16/10;

    border:2px dashed #c9d3cd;

    border-radius:12px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #f6f8f7,
            #edf1ef
        );

    color:#77817b;

    font-size:12px;

    font-weight:700;

    cursor:pointer;

    background-size:cover;

    background-position:center;

    transition:.2s;
}

.photo-box:hover{

    border-color:var(--verde);

    background-color:#f4faf6;
}

.photo-icon{

    font-size:30px;

    margin-bottom:5px;

    display:block;
}

.photo-input{

    position:absolute;

    inset:0;

    opacity:0;

    cursor:pointer;
}

.photo-label{

    position:absolute;

    bottom:0;
    left:0;
    right:0;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.75)
        );

    color:white;

    padding:20px 8px 8px;

    font-size:11px;

    font-weight:800;

    text-align:center;
}

.remove-photo{

    margin-top:8px;

    width:100%;

    height:32px;

    border:none;

    border-radius:8px;

    background:#f4f5f4;

    color:#777;

    font-size:10px;

    font-weight:800;

    cursor:pointer;
}

.remove-photo:hover{

    background:var(--vermelho);

    color:white;
}


/* =========================================================
   MEDIÇÃO
========================================================= */

.measurement-area{

    margin-top:12px;
}

.measurement-label{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:6px;

    font-size:11px;

    font-weight:900;

    color:var(--cinza-500);

    text-transform:uppercase;
}

.status{

    font-size:10px;

    font-weight:900;

    padding:4px 7px;

    border-radius:6px;

    background:#eaf7ef;

    color:var(--verde-dark);
}

.measurement-input{

    width:100%;

    height:52px;

    border:2px solid var(--laranja);

    border-radius:11px;

    background:
        linear-gradient(
            145deg,
            #fffaf0,
            #ffffff
        );

    text-align:center;

    font-size:22px;

    font-weight:900;

    color:var(--cinza-900);

    outline:none;

    transition:.2s;
}

.measurement-input:focus{

    box-shadow:
        0 0 0 4px rgba(242,140,0,.13);
}

.measurement-input.normal{

    border-color:var(--verde);

    background:#f1faf4;

    color:var(--verde-dark);
}

.measurement-input.warning{

    border-color:var(--laranja);

    background:#fff8eb;

    color:#b86500;
}

.measurement-input.danger{

    border-color:var(--vermelho);

    background:var(--vermelho-light);

    color:var(--vermelho);

    box-shadow:
        0 0 0 4px rgba(215,25,32,.08);
}

.status.danger{

    background:#ffe5e5;

    color:var(--vermelho);
}

.status.warning{

    background:#fff0d7;

    color:#a95d00;
}


/* =========================================================
   JPG
========================================================= */

.generate-cylinder{

    width:100%;

    margin-top:18px;

    height:48px;

    border:none;

    border-radius:11px;

    background:
        linear-gradient(
            145deg,
            #27342d,
            #17201b
        );

    color:white;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 15px rgba(0,0,0,.18);

    transition:.2s;
}

.generate-cylinder:hover{

    transform:translateY(-2px);

    background:
        linear-gradient(
            145deg,
            #34443b,
            #202b25
        );
}


/* =========================================================
   OBSERVAÇÕES
========================================================= */

textarea{

    width:100%;

    min-height:130px;

    resize:vertical;

    padding:14px;

    border:1.5px solid var(--cinza-300);

    border-radius:12px;

    font-family:Arial,sans-serif;

    font-size:15px;

    outline:none;
}

textarea:focus{

    border-color:var(--verde);

    box-shadow:
        0 0 0 4px rgba(8,122,61,.10);
}


/* =========================================================
   ASSINATURA
========================================================= */

.signature-box{

    margin-top:20px;
}

.signature-input{

    width:100%;

    height:58px;

    border:1.5px solid var(--cinza-300);

    border-radius:12px;

    padding:0 15px;

    font-family:
        "Brush Script MT",
        cursive;

    font-size:28px;

    color:var(--verde-dark);

    outline:none;
}


/* =========================================================
   AÇÕES
========================================================= */

.actions{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

    margin-top:25px;
}

.action-button{

    min-height:58px;

    border:none;

    border-radius:14px;

    color:white;

    font-size:15px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;

    box-shadow:
        0 8px 18px rgba(0,0,0,.15);
}

.action-button:hover{

    transform:translateY(-2px);
}

.pdf-button{

    background:
        linear-gradient(
            145deg,
            var(--verde),
            var(--verde-dark)
        );
}

.clear-button{

    background:
        linear-gradient(
            145deg,
            #e33333,
            #b70e14
        );
}


/* =========================================================
   MENSAGEM
========================================================= */

.download-mensagem{

    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translateX(-50%)
        translateY(100px);

    background:
        linear-gradient(
            145deg,
            var(--verde),
            var(--verde-dark)
        );

    color:white;

    padding:14px 22px;

    border-radius:12px;

    font-weight:900;

    z-index:9999;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);

    opacity:0;

    transition:.3s;

    text-align:center;
}

.download-mensagem.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   RODAPÉ
========================================================= */

.footer{

    text-align:center;

    color:#7b8580;

    font-size:11px;

    padding:10px;

    margin-top:25px;
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:850px){

    .info-grid{

        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:600px){

    .container{

        width:
            calc(100% - 16px);

        margin-top:15px;
    }

    .header{

        padding:17px 14px;
    }

    .header h1{

        font-size:19px;
    }

    .header p{

        font-size:11px;
    }

    .logo{

        width:45px;
        height:45px;

        font-size:22px;
    }

    .card{

        padding:13px;

        border-radius:14px;
    }

    .info-grid{

        grid-template-columns:1fr 1fr;

        gap:9px;
    }

    .field input{

        height:43px;

        font-size:14px;
    }

    .limite{

        flex-direction:column;

        align-items:flex-start;

        font-size:12px;
    }

    .navigation{

        grid-template-columns:
            1fr auto 1fr;

        gap:6px;
    }

    .nav-button{

        font-size:10px;

        padding:0 5px;

        min-height:44px;
    }

    .cylinder-indicator{

        min-width:auto;

        height:44px;

        padding:0 8px;

        font-size:11px;
    }

    .cylinder{

        padding:10px;

        border-radius:15px;
    }

    .cylinder-title h2{

        font-size:18px;
    }

    .valves-grid{

        gap:7px;
    }

    .valve{

        padding:7px;

        border-radius:11px;
    }

    .valve-header{

        padding:7px;

        margin-bottom:7px;
    }

    .valve-name{

        font-size:10px;
    }

    .valve-number{

        width:21px;
        height:21px;

        font-size:9px;
    }

    .photo-box{

        aspect-ratio:1/1;

        font-size:9px;
    }

    .photo-icon{

        font-size:22px;
    }

    .photo-label{

        font-size:8px;
    }

    .remove-photo{

        font-size:8px;

        height:27px;
    }

    .measurement-label{

        font-size:8px;
    }

    .status{

        font-size:7px;

        padding:3px 4px;
    }

    .measurement-input{

        height:45px;

        font-size:18px;
    }

    .generate-cylinder{

        height:43px;

        font-size:11px;

        margin-top:12px;
    }

    .actions{

        grid-template-columns:1fr;

        gap:9px;
    }

}

</style>

</head>

<body>

<!-- ======================================================
     CABEÇALHO
====================================================== -->

<header class="header">

<div class="header-content">

<div class="header-top">

<div class="logo">
⚙
</div>

<div>

<h1>
INSPEÇÃO DE VÁLVULAS
</h1>

<p>
SCANIA 550 • FORMULÁRIO DIGITAL DE MANUTENÇÃO
</p>

</div>

</div>

</div>

</header>

<main class="container">

<!-- ======================================================
     ETAPA 1
====================================================== -->

<div class="section-title">

<div class="section-number">
1
</div>

IDENTIFICAÇÃO DO EQUIPAMENTO

</div>

<div class="card">

<div class="info-grid">

<div class="field">

<label>Mecânico</label>

<input
type="text"
id="mecanico"
placeholder="Nome do mecânico"

>

</div>

<div class="field">

<label>Data</label>

<input
type="date"
id="data"

>

</div>

<div class="field">

<label>Usina</label>

<input
type="text"
id="usina"
placeholder="Nome da usina"

>

</div>

<div class="field">

<label>UGD</label>

<input
type="text"
id="ugd"
placeholder="Ex.: 25"

>

</div>

<div class="field">

<label>Série</label>

<input
type="text"
id="serie"
placeholder="Número de série"

>

</div>

<div class="field">

<label>Horímetro</label>

<input
type="text"
id="horimetro"
placeholder="Horímetro"

>

</div>

<div class="field">

<label>OS</label>

<input
type="text"
id="os"
placeholder="Número da OS"

>

</div>

</div>

</div>

<!-- ======================================================
     LIMITE
====================================================== -->

<div class="limite">

<div>

<strong>📏 LIMITE DE MEDIÇÃO</strong>

<br>

64,00 mm a <strong>67,50 mm</strong>

</div>

<div class="limite-alerta">

⚠ ACIMA DE 67,50 mm = SUBSTITUIÇÃO

</div>

</div>

<!-- ======================================================
     ETAPA 2
====================================================== -->

<div class="section-title">

<div class="section-number">
2
</div>

INSPEÇÃO DOS CILINDROS

</div>

<!-- NAVEGAÇÃO -->

<div class="navigation">

<button
class="nav-button"
id="btnAnterior"
onclick="cilindroAnterior()"

>

← CILINDRO ANTERIOR

</button>

<div
class="cylinder-indicator"
id="indicadorCilindro"
>

CILINDRO 1 / 6

</div>

<button
class="nav-button"
id="btnProximo"
onclick="proximoCilindro()"

>

PRÓXIMO CILINDRO →

</button>

</div>

<!-- ======================================================
     CILINDROS
====================================================== -->

<div id="containerCilindros"></div>

<!-- ======================================================
     ETAPA 3
====================================================== -->

<div class="section-title">

<div class="section-number">
3
</div>

OBSERVAÇÕES DA INSPEÇÃO

</div>

<div class="card">

<textarea
id="observacoes"
placeholder="Digite aqui as observações encontradas durante a inspeção..."
></textarea>

<div class="signature-box">

<div class="field">

<label>Assinatura do mecânico</label>

<input
type="text"
id="assinatura"
class="signature-input"
placeholder="Digite o nome do mecânico"

>

</div>

</div>

</div>

<!-- ======================================================
     ETAPA 4
====================================================== -->

<div class="section-title">

<div class="section-number">
4
</div>

FINALIZAÇÃO

</div>

<div class="actions">

<button
class="action-button pdf-button"
id="generatePdf"

>

📄 GERAR RELATÓRIO PDF

</button>

<button
class="action-button clear-button"
id="clearBtn"

>

🗑 LIMPAR FORMULÁRIO

</button>

</div>

<div class="footer">

Sistema Digital de Inspeção • Scania 550

</div>

</main>

<div
class="download-mensagem"
id="downloadMensagem"
>
</div>

<script>

const { jsPDF } = window.jspdf;


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

let cilindroAtual = 1;

const limiteMaximo = 67.50;

const container =
document.getElementById(
    'containerCilindros'
);


/* =========================================================
   CRIAR CILINDROS
========================================================= */

for(let i=1;i<=6;i++){

    const cylinder =
    document.createElement('div');

    cylinder.className =
    'cylinder';

    cylinder.id =
    'cilindro-' + i;

    cylinder.style.display =
    i === 1 ? 'block' : 'none';


    cylinder.innerHTML = `

        <div class="cylinder-title">

            <h2>
                CILINDRO ${i}
            </h2>

            <div class="engine-badge">
                SCANIA DC13
            </div>

        </div>

        <div class="valves-grid">

            ${criarValvula(
                'exaustao',
                i,
                2,
                'EXAUSTÃO'
            )}

            ${criarValvula(
                'admissao',
                i,
                2,
                'ADMISSÃO'
            )}

            ${criarValvula(
                'exaustao',
                i,
                1,
                'EXAUSTÃO'
            )}

            ${criarValvula(
                'admissao',
                i,
                1,
                'ADMISSÃO'
            )}

        </div>

        <button
            class="generate-cylinder"
            onclick="gerarJpgCilindro(${i})"
        >

            📷 GERAR IMAGEM DO CILINDRO ${i}

        </button>

    `;

    container.appendChild(cylinder);

}


/* =========================================================
   CRIAR VÁLVULA
========================================================= */

function criarValvula(
    tipo,
    cilindro,
    numero,
    nome
){

    const id =
        tipo +
        cilindro +
        '_' +
        numero;

    const photoId =
        'photo' +
        id;

    return `

    <div class="valve">

        <div class="valve-header">

            <div class="valve-name">
                ${nome} ${numero}
            </div>

            <div class="valve-number">
                ${numero}
            </div>

        </div>


        <div
            class="photo-box"
            id="${photoId}"
        >

            <div>

                <span class="photo-icon">
                    📷
                </span>

                ADICIONAR FOTO

            </div>

            <div class="photo-label">
                ${nome} ${numero}
            </div>

            <input
                class="photo-input"
                type="file"
                accept="image/*"
                capture="environment"
                onchange="loadPhoto(event,'${id}')"
            >

        </div>


        <button
            class="remove-photo"
            onclick="removePhoto('${id}')"
        >

            REMOVER FOTO

        </button>


        <div class="measurement-area">

            <div class="measurement-label">

                <span>
                    MEDIÇÃO (mm)
                </span>

                <span
                    class="status"
                    id="status-${id}"
                >
                    AGUARDANDO
                </span>

            </div>


            <input
                class="measurement-input"
                type="text"
                id="${id}"
                inputmode="decimal"
                placeholder="00,00"
                oninput="atualizarDestaque(this)"
            >

        </div>

    </div>

    `;

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function atualizarCilindro(){

    for(let i=1;i<=6;i++){

        const cilindro =
        document.getElementById(
            'cilindro-' + i
        );

        if(cilindro){

            cilindro.style.display =
                i === cilindroAtual
                ? 'block'
                : 'none';

        }

    }


    document.getElementById(
        'indicadorCilindro'
    ).textContent =
        `CILINDRO ${cilindroAtual} / 6`;


    document.getElementById(
        'btnAnterior'
    ).disabled =
        cilindroAtual === 1;


    document.getElementById(
        'btnProximo'
    ).disabled =
        cilindroAtual === 6;


    window.scrollTo({

        top:0,

        behavior:'smooth'

    });

}


function proximoCilindro(){

    if(cilindroAtual < 6){

        cilindroAtual++;

        atualizarCilindro();

    }

}


function cilindroAnterior(){

    if(cilindroAtual > 1){

        cilindroAtual--;

        atualizarCilindro();

    }

}


/* =========================================================
   FOTO
========================================================= */

function loadPhoto(event,id){

    const box =
    document.getElementById(
        'photo' + id
    );

    const file =
    event.target.files[0];

    if(!file) return;


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        box.style.backgroundImage =
            `url("${e.target.result}")`;

        box.innerHTML += '';

    };


    reader.readAsDataURL(file);

}


/* =========================================================
   REMOVER FOTO
========================================================= */

function removePhoto(id){

    const box =
    document.getElementById(
        'photo' + id
    );

    const tipo =
    id.includes('exaustao')
    ? 'EXAUSTÃO'
    : 'ADMISSÃO';


    const numero =
    id.split('_')[1];


    box.style.backgroundImage = '';


    box.innerHTML = `

        <div>

            <span class="photo-icon">
                📷
            </span>

            ADICIONAR FOTO

        </div>

        <div class="photo-label">

            ${tipo} ${numero}

        </div>

        <input
            class="photo-input"
            type="file"
            accept="image/*"
            capture="environment"
            onchange="loadPhoto(event,'${id}')"
        >

    `;

}


/* =========================================================
   DESTAQUE DA MEDIÇÃO
========================================================= */

function atualizarDestaque(input){

    let valor =
        parseFloat(
            input.value
                .replace(',','.')
        );


    const id =
        input.id;


    const status =
        document.getElementById(
            'status-' + id
        );


    input.classList.remove(
        'normal',
        'warning',
        'danger'
    );


    status.classList.remove(
        'warning',
        'danger'
    );


    if(isNaN(valor)){

        status.textContent =
            'AGUARDANDO';

        return;

    }


    if(valor >= limiteMaximo){

        input.classList.add(
            'danger'
        );

        status.classList.add(
            'danger'
        );

        status.textContent =
            'SUBSTITUIR';

    }

    else if(valor < 64){

        input.classList.add(
            'warning'
        );

        status.classList.add(
            'warning'
        );

        status.textContent =
            'VERIFICAR';

    }

    else{

        input.classList.add(
            'normal'
        );

        status.textContent =
            'NORMAL';

    }

}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke
){

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();

    if(fill) ctx.fill();

    if(stroke) ctx.stroke();

}


/* =========================================================
   GERAR JPG
========================================================= */

async function gerarJpgCilindro(i){

    const imgSize = 1280;

    const imgHeight = 1900;


    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        imgSize;

    canvas.height =
        imgHeight;


    const ctx =
        canvas.getContext('2d');


    ctx.fillStyle = '#fff';

    ctx.fillRect(
        0,
        0,
        imgSize,
        imgHeight
    );


    const fotos = [

        `photoexaustao${i}_2`,
        `photoadmissao${i}_2`,
        `photoexaustao${i}_1`,
        `photoadmissao${i}_1`

    ];


    const legendas = [

        'EXAUSTÃO 2',
        'ADMISSÃO 2',
        'EXAUSTÃO 1',
        'ADMISSÃO 1'

    ];


    const pos = [

        [0,0],
        [imgSize/2,0],
        [0,imgHeight/2],
        [imgSize/2,imgHeight/2]

    ];


    for(
        let j=0;
        j<4;
        j++
    ){

        const box =
            document.getElementById(
                fotos[j]
            );


        if(
            !box ||
            !box.style.backgroundImage
        ){

            continue;

        }


        const inputId =
            fotos[j].replace(
                'photo',
                ''
            );


        const input =
            document.getElementById(
                inputId
            );


        const valor =
            input
            ? parseFloat(
                input.value.replace(',','.')
            )
            : null;


        let url =
            box.style.backgroundImage
            .replace(
                /^url\(["']?/,
                ''
            )
            .replace(
                /["']?\)$/,
                ''
            );


        const img =
            new Image();


        img.src = url;


        await new Promise(
            resolve => {

                img.onload =
                    resolve;

                img.onerror =
                    resolve;

            }
        );


        ctx.drawImage(

            img,

            pos[j][0],
            pos[j][1],

            imgSize/2,
            imgHeight/2

        );


        ctx.fillStyle =
            'rgba(0,0,0,.70)';


        ctx.fillRect(

            pos[j][0],

            pos[j][1] +
            imgHeight/2 - 65,

            imgSize/2,

            65

        );


        ctx.fillStyle =
            'white';

        ctx.font =
            'bold 30px Arial';

        ctx.textAlign =
            'center';

        ctx.textBaseline =
            'middle';


        ctx.fillText(

            legendas[j],

            pos[j][0] +
            imgSize/4,

            pos[j][1] +
            imgHeight/2 -
            35

        );


        if(
            !isNaN(valor) &&
            valor >= limiteMaximo
        ){

            const texto =
                `SUBSTITUIR • ${valor
                    .toFixed(2)
                    .replace('.',',')} mm`;


            ctx.font =
                'bold 25px Arial';


            const largura =
                ctx.measureText(texto).width +
                30;


            const x =
                pos[j][0] +
                imgSize/4 -
                largura/2;


            const y =
                pos[j][1] +
                imgHeight/2 -
                125;


            ctx.fillStyle =
                '#ffffff';


            ctx.strokeStyle =
                '#d71920';


            ctx.lineWidth = 3;


            roundRect(

                ctx,
                x,
                y,
                largura,
                50,
                10,
                true,
                true

            );


            ctx.fillStyle =
                '#d71920';


            ctx.fillText(

                texto,

                pos[j][0] +
                imgSize/4,

                y + 25

            );

        }

    }


    /* TÍTULO */

    ctx.font =
        'bold 48px Arial';

    ctx.textAlign =
        'center';


    const titulo =
        `CILINDRO ${i}`;


    ctx.fillStyle =
        '#087a3d';


    ctx.fillRect(
        0,
        0,
        imgSize,
        85
    );


    ctx.fillStyle =
        '#ffffff';


    ctx.fillText(
        titulo,
        imgSize/2,
        57
    );


    canvas.toBlob(

        blob => {

            if(!blob){

                alert(
                    'Não foi possível gerar a imagem.'
                );

                return;

            }


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement('a');


            link.href =
                url;


            link.download =
                `CILINDRO_${i}.jpg`;


            document.body.appendChild(link);


            link.click();


            document.body.removeChild(link);


            setTimeout(
                () =>
                URL.revokeObjectURL(url),
                3000
            );


            mostrarMensagemDownload(
                `📷 CILINDRO ${i}.jpg<br>Download iniciado`
            );

        },

        'image/jpeg',

        .95

    );

}


/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagemDownload(texto){

    const msg =
        document.getElementById(
            'downloadMensagem'
        );


    msg.innerHTML =
        texto;


    msg.classList.add('show');


    setTimeout(
        () =>
        msg.classList.remove('show'),
        3000
    );

}


/* =========================================================
   GERAR PDF
========================================================= */

document
.getElementById('generatePdf')
.addEventListener(
    'click',
    async function(){

        try{

            const pdf =
                new jsPDF({
                    unit:'mm',
                    format:'a4'
                });


            const img =
                new Image();


            img.crossOrigin =
                'anonymous';


            img.src =
                'https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg';


            await new Promise(
                (resolve,reject) => {

                    img.onload =
                        resolve;

                    img.onerror =
                        reject;

                }
            );


            const canvas =
                document.createElement('canvas');


            canvas.width =
                img.width;

            canvas.height =
                img.height;


            const ctx =
                canvas.getContext('2d');


            ctx.drawImage(
                img,
                0,
                0
            );


            ctx.font =
                'bold 18px Arial';

            ctx.fillStyle =
                'black';


            const get =
                id =>
                document.getElementById(id)?.value || '';


            ctx.fillText(
                get('mecanico'),
                208,
                176
            );


            ctx.fillText(
                get('usina'),
                165,
                204
            );


            ctx.fillText(
                get('serie'),
                165,
                231
            );


            ctx.fillText(
                'UGD- ' + get('ugd'),
                590,
                262
            );


            ctx.fillText(
                get('os'),
                292,
                262
            );


            const data =
                get('data');


            if(data){

                const partes =
                    data.split('-');


                ctx.fillText(
                    `${partes[2]}/${partes[1]}/${partes[0]}`,
                    888,
                    204
                );

            }


            ctx.fillText(
                get('horimetro'),
                798,
                231
            );


            const campos = [

                ['exaustao1_1',105,616],
                ['exaustao1_2',105,576],
                ['admissao1_1',345,628],
                ['admissao1_2',345,589],

                ['exaustao2_1',450,1064],
                ['exaustao2_2',450,1024],
                ['admissao2_1',689,1075],
                ['admissao2_2',689,1038],

                ['exaustao3_1',792,617],
                ['exaustao3_2',792,576],
                ['admissao3_1',1032,628],
                ['admissao3_2',1032,589],

                ['exaustao4_1',793,1064],
                ['exaustao4_2',793,1024],
                ['admissao4_1',1033,1075],
                ['admissao4_2',1033,1038],

                ['exaustao5_1',450,617],
                ['exaustao5_2',450,576],
                ['admissao5_1',689,628],
                ['admissao5_2',689,589],

                ['exaustao6_1',105,1064],
                ['exaustao6_2',105,1024],
                ['admissao6_1',345,1075],
                ['admissao6_2',345,1038]

            ];


            campos.forEach(
                ([id,x,y]) => {

                    const raw =
                        get(id);


                    const valor =
                        parseFloat(
                            raw.replace(',','.')
                        );


                    const critico =
                        !isNaN(valor) &&
                        valor >= limiteMaximo;


                    ctx.fillStyle =
                        critico
                        ? 'red'
                        : 'black';


                    ctx.font =
                        critico
                        ? 'bold 18px Arial'
                        : '18px Arial';


                    ctx.fillText(
                        raw,
                        x,
                        y
                    );

                }
            );


            /* OBSERVAÇÕES */

            const obs =
                get('observacoes');


            ctx.fillStyle =
                'black';

            ctx.font =
                '18px Arial';


            const maxWidth =
                950;

            const lineHeight =
                26;


            let linha = '';

            let y = 1237;


            obs
            .split(/\s+/)
            .forEach(
                palavra => {

                    const teste =
                        linha +
                        palavra +
                        ' ';


                    if(
                        ctx.measureText(teste).width >
                        maxWidth
                    ){

                        ctx.fillText(
                            linha,
                            183,
                            y
                        );


                        linha =
                            palavra + ' ';

                        y +=
                            lineHeight;

                    }
                    else{

                        linha =
                            teste;

                    }

                }
            );


            ctx.fillText(
                linha,
                183,
                y
            );


            /* ASSINATURA */

            ctx.font =
                '40px "Brush Script MT", cursive';


            ctx.fillText(
                get('assinatura'),
                760,
                1538
            );


            const imgData =
                canvas.toDataURL(
                    'image/jpeg',
                    1
                );


            pdf.addImage(

                imgData,
                'JPEG',
                0,
                0,

                pdf.internal.pageSize.getWidth(),
                pdf.internal.pageSize.getHeight()

            );


            pdf.save(
                'MEDICAO_VALVULAS.pdf'
            );


            mostrarMensagemDownload(
                '📄 Relatório PDF gerado com sucesso'
            );

        }
        catch(error){

            console.error(error);

            alert(
                '❌ Não foi possível gerar o PDF. Verifique sua conexão com a internet.'
            );

        }

    }
);


/* =========================================================
   LIMPAR
========================================================= */

document
.getElementById('clearBtn')
.addEventListener(
    'click',
    function(){

        if(
            !confirm(
                'Deseja realmente limpar toda a inspeção?'
            )
        ){

            return;

        }


        document
        .querySelectorAll(
            'input[type="text"], input[type="date"], textarea'
        )
        .forEach(
            input =>
            input.value = ''
        );


        document
        .querySelectorAll(
            '.measurement-input'
        )
        .forEach(
            input => {

                input.classList.remove(
                    'normal',
                    'warning',
                    'danger'
                );

            }
        );


        document
        .querySelectorAll(
            '.status'
        )
        .forEach(
            status => {

                status.classList.remove(
                    'warning',
                    'danger'
                );

                status.textContent =
                    'AGUARDANDO';

            }
        );


        document
        .querySelectorAll(
            '.photo-box'
        )
        .forEach(
            box => {

                const id =
                    box.id.replace(
                        'photo',
                        ''
                    );


                removePhoto(id);

            }
        );


        cilindroAtual =
            1;


        atualizarCilindro();

    }
);


/* =========================================================
   INICIAR
========================================================= */

document
.getElementById('data')
.value =
new Date()
.toISOString()
.split('T')[0];


atualizarCilindro();

</script>

</body>

</html>
